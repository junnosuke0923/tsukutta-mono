<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>ATELIER — スマホ版プロトタイプ</title>
<style>
  :root{ --page:#efe7f2; --pageInk:#3a2b3d; --pageSub:#7d6d84; }
  @media (prefers-color-scheme: dark){
    :root{ --page:#191320; --pageInk:#efe6f2; --pageSub:#9c8ea6; }
  }
  :root[data-theme="dark"]{ --page:#191320; --pageInk:#efe6f2; --pageSub:#9c8ea6; }
  :root[data-theme="light"]{ --page:#efe7f2; --pageInk:#3a2b3d; --pageSub:#7d6d84; }

  html,body{ background:var(--page); }
  body{ margin:0; color:var(--pageInk); line-height:1.6;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;
    -webkit-font-smoothing:antialiased; }

  .stage{ display:flex; flex-direction:column; align-items:center; padding:22px 12px 40px; }
  .stage .cap{ max-width:30em; text-align:center; font-size:12.5px; color:var(--pageSub); margin:18px 0 0; }
  .stage .cap b{ color:var(--pageInk); }
  .fit{ transform-origin:top center; }

  /* ===== 端末 ===== */
  .phone{ width:390px; height:844px; border-radius:52px; padding:11px;
    background:linear-gradient(160deg,#4a3f52,#2a222f 55%,#443a4c);
    box-shadow:0 26px 60px rgba(30,15,40,.42), 0 2px 0 rgba(255,255,255,.16) inset; }
  .screen{ width:100%; height:100%; border-radius:42px; overflow:hidden; position:relative;
    background:#fff6ee; color:#3f2c3d; display:flex; flex-direction:column;
    --pink:#ff85ac; --gold:#f5b53c; --mint:#3fc9ae; --lav:#9b86f0; --rose:#e05f86;
    --ink:#3f2c3d; --sub:#8b7488; --card:#ffffff; --soft:#f6ebf3;

    /* ---- 文字の組み方。大きさは8段、ここ以外に数字を書かない ----
       となりの段とのひらきは約1.15倍。日本語の本文は行間を広く、
       小さな見出し（英字・かな混じりのラベル）は字間を空けて詰まらないようにする。 */
    --fs-micro:8.5px;   /* ラベル・バッジ・図鑑のます目 */
    --fs-note:9.5px;    /* 補足、値段の下の一行 */
    --fs-cap:10.5px;    /* 小見出し、できごと、注記 */
    --fs-body:12px;     /* 本文、品名、人の名前 */
    --fs-lead:13.5px;   /* 引き、テーマ名、会話 */
    --fs-sub:16px;      /* 大きめの見出し */
    --fs-head:19px;     /* 職業カードの題 */
    --fs-hero:34px;     /* 扉絵 */
    --ls-wide:.12em;    /* ラベル。すきまを空けて読ませる */
    --ls-mid:.06em;
    --lh-tight:1.35;    /* 見出し・一行もの */
    --lh-body:1.8;      /* 日本語の本文 */
  }
  .screen{ letter-spacing:.01em; }
  /* 絵は文字と同じ色を拾い、行の中で少し下げて字面の中心にそろえる */
  .ico{ vertical-align:-2px; flex:none; }

  .sbar{ height:22px; flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; font-size:var(--fs-cap); font-weight:700; color:#6d5a6c; }
  .notch{ position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:24px; background:#2a222f; border-radius:0 0 14px 14px; z-index:9; }

  .hud{ flex:none; display:flex; gap:5px; padding:2px 11px 8px; }
  .hud .k{ flex:1; background:var(--card); border-radius:13px; padding:5px 8px;
    box-shadow:0 2px 0 rgba(180,140,170,.18); min-width:0; }
  .hud .k .lab{ font-size:var(--fs-micro); letter-spacing:var(--ls-wide); color:var(--sub); font-weight:700;
    white-space:nowrap; overflow:hidden; }
  .hud .k .val{ font-size:var(--fs-lead); font-weight:800; line-height:var(--lh-tight); white-space:nowrap;
    font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; }
  .hud .k .val small{ font-size:var(--fs-micro); font-weight:600; color:var(--sub); }

  #room{ flex:none; width:390px; height:400px; position:relative; background:#f6e6d4; }
  #cv{ display:block; width:100%; height:100%; }

  /* 什器を選んだときのカード */
  .selbox{ position:absolute; left:10px; right:10px; bottom:22px; z-index:5;
    background:rgba(255,255,255,.96); border-radius:14px; padding:8px 11px;
    box-shadow:0 6px 18px rgba(120,70,110,.28); display:none; }
  .selbox.on{ display:block; }
  .selbox .n{ font-size:var(--fs-body); font-weight:800; }
  .selbox .d{ font-size:var(--fs-note); color:var(--sub); margin-bottom:6px; }
  .selbox .row{ display:flex; gap:6px; }

  /* 上に発表会の帯が 14px かぶさる。その下から文字が始まるよう、上の余白を足す */
  .jobbar{ flex:none; margin:-14px 12px 0; background:var(--card); border-radius:16px;
    padding:16px 12px 10px; box-shadow:0 4px 14px rgba(150,100,140,.16); position:relative; z-index:3; }
  .jobbar .r1{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .jobbar .t{ font-size:var(--fs-body); font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .jobbar .due{ font-size:var(--fs-note); font-weight:700; color:var(--sub); flex:none; font-variant-numeric:tabular-nums; }
  .jobbar .due.hot{ color:var(--rose); }
  .jobbar .c{ font-size:var(--fs-note); color:var(--sub); margin-top:-1px; }
  .bar{ height:7px; border-radius:4px; background:#f2e3ec; overflow:hidden; margin-top:6px; }
  .bar i{ display:block; height:100%; border-radius:4px;
    background:linear-gradient(90deg,var(--pink),var(--gold)); transition:width .2s linear; }

  .pane{ flex:1; overflow-y:auto; padding:10px 12px 14px; -webkit-overflow-scrolling:touch; }
  .pane::-webkit-scrollbar{ width:0; }
  .h{ font-size:var(--fs-note); font-weight:800; letter-spacing:var(--ls-wide); color:var(--sub);
    margin:2px 0 7px; display:flex; justify-content:space-between; align-items:center; }

  .seg{ display:flex; gap:4px; background:var(--soft); border-radius:11px; padding:3px; margin-bottom:9px; }
  .seg button{ flex:1; border:0; background:none; cursor:pointer; font-family:inherit;
    font-size:var(--fs-note); font-weight:800; color:var(--sub); border-radius:8px; padding:5px 0; }
  .seg button.on{ background:var(--card); color:var(--rose); box-shadow:0 1px 3px rgba(150,100,140,.2); }

  .st{ display:grid; grid-template-columns:30px 1fr auto; gap:9px; align-items:center;
    background:var(--card); border-radius:13px; padding:7px 10px; margin-bottom:6px;
    box-shadow:0 2px 0 rgba(180,140,170,.14); }
  .st .av{ width:30px; height:30px; border-radius:10px; display:flex; align-items:center;
    justify-content:center; font-size:var(--fs-body); font-weight:800; color:#fff; }
  .st .nm{ font-size:var(--fs-body); font-weight:800; line-height:var(--lh-tight); }
  .st .rl{ font-size:var(--fs-note); color:var(--sub); }
  .st .mo{ width:44px; }
  .st .mo .g{ height:5px; border-radius:3px; background:#f0e2ec; overflow:hidden; }
  .st .mo .g i{ display:block; height:100%; }
  .st .mo .lab{ font-size:var(--fs-micro); color:var(--sub); text-align:right; margin-top:1px; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .item{ text-align:left; border:0; cursor:pointer; background:var(--card); color:var(--ink);
    border-radius:13px; padding:8px 9px; font-family:inherit;
    box-shadow:0 2px 0 rgba(180,140,170,.16); position:relative; }
  .item:disabled{ opacity:.42; cursor:default; }
  .item .n{ font-size:var(--fs-body); font-weight:800; }
  .item .p{ font-size:var(--fs-note); font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums; }
  .item .d{ font-size:var(--fs-micro); color:var(--sub); line-height:var(--lh-tight); }
  .item .e{ font-size:var(--fs-micro); font-weight:800; margin-top:1px; }
  .item .own{ position:absolute; top:6px; right:7px; font-size:var(--fs-micro); font-weight:800;
    color:#fff; background:var(--mint); border-radius:7px; padding:0 5px; }

  /* ===== アトリエの図鑑（game/dex.js）。ます目は3列 ===== */
  .dxLead{ font-size:var(--fs-cap); color:var(--sub); line-height:var(--lh-body); margin:2px 2px 8px; }
  .dxg{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .dxi{ border:0; cursor:pointer; background:var(--card); color:var(--ink); font-family:inherit;
    border-radius:13px; padding:6px 4px 7px; display:flex; flex-direction:column; align-items:center; gap:2px;
    box-shadow:0 2px 0 rgba(180,140,170,.16); }
  .dxi canvas{ width:52px; height:62px; }
  .dxi .n{ font-size:var(--fs-micro); font-weight:800; line-height:var(--lh-tight); text-align:center; }
  .dxi .s{ font-size:var(--fs-micro); color:var(--sub); }
  .dxi.lk, .item.lk{ opacity:.46; }

  .swatch{ text-align:left; border:2px solid transparent; cursor:pointer; background:var(--card);
    border-radius:13px; padding:7px 8px; font-family:inherit; box-shadow:0 2px 0 rgba(180,140,170,.16); }
  .swatch.on{ border-color:var(--rose); }
  .swatch:disabled{ opacity:.45; cursor:default; }
  .swatch .sw{ height:26px; border-radius:8px; margin-bottom:5px; }
  .swatch .n{ font-size:var(--fs-cap); font-weight:800; }
  .swatch .p{ font-size:var(--fs-note); font-weight:800; color:var(--gold); }


  /* ---- 学校の4年（game/school.js）。札・能力の帯・人物をつくる画面 ---- */
  .school #tabs, .school #viewBtn, .school #otBtn, .school #craftBtn{ display:none !important; }
  .scBars{ display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; margin:0 0 8px; }
  .scBar{ display:grid; grid-template-columns:38px 1fr 22px; gap:6px; align-items:center;
    font-size:var(--fs-micro); font-weight:800; color:var(--sub); }
  .scBar .g{ height:6px; border-radius:3px; background:#f0e2ec; overflow:hidden; }
  .scBar .g i{ display:block; height:100%; border-radius:3px; }
  .scBar .v{ text-align:right; color:var(--ink); font-variant-numeric:tabular-nums; }
  .scCard{ background:var(--card); border-radius:15px; padding:10px 12px; margin-bottom:8px;
    box-shadow:0 3px 0 rgba(180,140,170,.16); }
  .scBadge{ display:inline-block; font-size:var(--fs-micro); font-weight:800; padding:1px 8px;
    border-radius:8px; color:#fff; background:var(--rose); margin-bottom:4px; }
  .scCard.k2 .scBadge{ background:var(--gold); } .scCard.k3 .scBadge{ background:var(--mint); }
  .scTitle{ font-size:var(--fs-lead); font-weight:800; line-height:var(--lh-tight); }
  .scWho{ font-size:var(--fs-note); color:var(--sub); font-weight:700; margin:2px 0 4px; }
  .scText{ font-size:var(--fs-body); line-height:1.55; margin:4px 0 6px; white-space:normal; }
  .scNote{ font-size:var(--fs-note); color:var(--sub); background:var(--soft); border-radius:9px; padding:5px 8px; margin:4px 0 6px; }
  .scOpts{ display:flex; flex-direction:column; gap:5px; margin-top:6px; }
  .scOpt{ display:flex; justify-content:space-between; align-items:center; gap:8px; text-align:left;
    border:0; cursor:pointer; border-radius:11px; padding:8px 11px; font-family:inherit;
    font-size:var(--fs-body); font-weight:800; background:#f4e7f0; color:var(--ink); }
  .scOpt.p{ background:var(--pink); color:#fff; box-shadow:0 3px 0 #d9648e; }
  .scOpt:disabled{ opacity:.42; cursor:default; box-shadow:none; }
  .scOpt .fx{ font-size:var(--fs-micro); font-weight:700; opacity:.85; text-align:right; flex:none; max-width:52%; white-space:normal; }
  .scRow{ display:flex; gap:6px; margin:2px 0 8px; }
  .scRow input{ flex:1; font-family:inherit; font-size:var(--fs-body); font-weight:800; border:1px solid #e3d5e3;
    border-radius:10px; padding:6px 10px; color:var(--ink); background:#fff; min-width:0; }
  .scRow .btn{ flex:none; padding:6px 12px; }
  .scNav{ display:flex; gap:4px; overflow-x:auto; padding:0 0 8px; margin:0 -2px 6px; -webkit-overflow-scrolling:touch; }
  .scNav::-webkit-scrollbar{ height:0; }
  .scNavB{ flex:none; border:0; cursor:pointer; border-radius:9px; padding:4px 9px; font-family:inherit;
    font-size:var(--fs-micro); font-weight:800; background:var(--soft); color:var(--sub); white-space:nowrap; }
  .scNavB.on{ background:var(--rose); color:#fff; }
  .scNavB.town{ background:#e6eef7; color:#4a6a8a; } .scNavB.town.on{ background:#5f8fd0; color:#fff; }
  .scMemoG{ margin:6px 0 10px; } .scMemoG b{ display:block; font-size:var(--fs-note); color:var(--sub); margin-bottom:4px; letter-spacing:var(--ls-mid); }
  .scMemo{ background:var(--soft); border-radius:9px; padding:5px 8px; margin-bottom:4px; font-size:var(--fs-note); color:var(--sub); }
  .scMemo.got{ background:var(--card); color:var(--ink); box-shadow:0 2px 0 rgba(180,140,170,.16); }
  .scMemo .t{ font-weight:800; display:block; } .scMemo .k{ display:block; margin-top:1px; color:var(--sub); }
  .scFoot{ display:flex; gap:6px; margin-top:4px; }
  .scLine{ font-size:var(--fs-micro); color:var(--sub); margin:8px 2px 0; line-height:1.5; }
  table.board{ width:100%; border-collapse:collapse; font-size:var(--fs-note); margin:4px 0; }
  table.board th, table.board td{ text-align:left; padding:3px 6px; border-bottom:1px solid #f0e2ec; }
  table.board tr.me td{ font-weight:800; color:var(--rose); }
  table.board .grade{ font-weight:800; }
  .scCard .line{ font-size:var(--fs-note); color:var(--sub); margin:4px 0; }
  .offer{ background:var(--card); border-radius:15px; padding:10px 12px; margin-bottom:8px;
    box-shadow:0 3px 0 rgba(180,140,170,.16); }
  .offer .cl{ font-size:var(--fs-note); color:var(--sub); font-weight:700; letter-spacing:var(--ls-mid); }
  .offer .th{ font-size:var(--fs-lead); font-weight:800; margin:1px 0 3px; }
  .offer .mt{ display:flex; gap:10px; font-size:var(--fs-note); color:var(--sub); margin-bottom:7px; }
  .offer .mt b{ color:var(--ink); font-variant-numeric:tabular-nums; }
  .offer .need{ display:inline-block; font-size:var(--fs-note); font-weight:800; padding:1px 7px;
    border-radius:8px; color:#fff; }
  .offer .row{ display:flex; gap:6px; }
  .btn{ flex:1; border:0; cursor:pointer; border-radius:11px; padding:7px 0; font-family:inherit;
    font-size:var(--fs-body); font-weight:800; background:#f4e7f0; color:var(--ink); }
  .btn.p{ background:var(--pink); color:#fff; box-shadow:0 3px 0 #d9648e; }
  .btn:disabled{ opacity:.4; cursor:default; box-shadow:none; }

  .wk{ display:grid; grid-template-columns:34px 1fr auto; gap:9px; align-items:center;
    background:var(--card); border-radius:13px; padding:7px 10px; margin-bottom:6px;
    box-shadow:0 2px 0 rgba(180,140,170,.14); }
  .wk > div{ min-width:0; }
  .wk .sw{ width:34px; height:34px; border-radius:10px; }
  .wk .n{ font-size:var(--fs-body); font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wk .s{ font-size:var(--fs-note); color:var(--sub); font-variant-numeric:tabular-nums; }
  .wk .r{ font-size:var(--fs-cap); font-weight:800; color:var(--gold); }

  .rank{ background:linear-gradient(120deg,#ffd9e6,#ffeccf); border-radius:14px;
    padding:9px 12px; margin-bottom:9px; }
  .rank .n{ font-size:var(--fs-lead); font-weight:800; }
  .rank .s{ font-size:var(--fs-note); color:#8a6b7d; }
  .rank .g{ height:6px; border-radius:3px; background:rgba(255,255,255,.65); margin-top:5px; overflow:hidden; }
  .rank .g i{ display:block; height:100%; background:var(--rose); }

  .rule{ background:linear-gradient(120deg,#ffe3ec,#fff0d8); border-radius:14px;
    padding:9px 12px; font-size:var(--fs-cap); color:#7a5f70; line-height:var(--lh-body); }
  .rule b{ display:block; font-size:var(--fs-body); color:var(--ink); }
  .rule i{ font-style:normal; font-weight:800; color:#b84f77; }
  .legend{ margin-top:7px; display:grid; gap:4px; }
  .legend div{ display:grid; grid-template-columns:8px 60px 1fr; gap:7px; align-items:center;
    background:var(--card); border-radius:10px; padding:5px 9px; font-size:var(--fs-note);
    box-shadow:0 2px 0 rgba(180,140,170,.13); }
  .legend i{ width:8px; height:8px; border-radius:3px; }
  .legend b{ font-size:var(--fs-cap); font-weight:800; }
  .legend span{ color:var(--sub); }

  .showbar{ flex:none; margin:-9px 12px 0; position:relative; z-index:4;
    background:linear-gradient(100deg,#5b4468,#7d5480); color:#ffeef6; border-radius:12px;
    padding:5px 12px; display:flex; justify-content:space-between; align-items:center;
    font-size:var(--fs-note); font-weight:800; box-shadow:0 3px 10px rgba(110,60,100,.28); }
  .showbar .r{ font-variant-numeric:tabular-nums; opacity:.85; font-weight:700; }
  .showbar.hot{ background:linear-gradient(100deg,#a8386a,#d95a72); }
  .showbar.done{ background:linear-gradient(100deg,#3f7a68,#57a184); }

  .dexhead{ background:linear-gradient(120deg,#ffe3ec,#fff0d8); border-radius:14px;
    padding:9px 12px; font-size:var(--fs-cap); color:#7a5f70; line-height:var(--lh-body); margin-bottom:9px; }
  .dexhead b{ display:block; font-size:var(--fs-body); color:var(--ink); }
  .dexhead .c{ font-size:var(--fs-note); font-weight:800; color:var(--rose); }
  .dexrow{ background:var(--card); border-radius:13px; padding:6px 8px 7px; margin-bottom:6px;
    box-shadow:0 2px 0 rgba(180,140,170,.14); }
  .dexrow .t{ font-size:var(--fs-cap); font-weight:800; margin:0 0 4px 2px; }
  .dexcells{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
  .dexcell{ border:0; padding:3px 0 4px; border-radius:9px; background:var(--soft);
    cursor:pointer; font-family:inherit; display:flex; flex-direction:column;
    align-items:center; gap:1px; }
  .dexcell.pick{ outline:2px solid var(--rose); outline-offset:-2px; }
  .dexcell.got{ background:#fff; box-shadow:0 1px 0 rgba(180,140,170,.22) inset,
    0 0 0 1.5px rgba(224,95,134,.28); }
  .dexcell canvas{ display:block; }
  .dexcell .l{ font-size:var(--fs-micro); font-weight:800; color:var(--sub); letter-spacing:var(--ls-mid); }
  .dexcell.got .l{ color:var(--ink); }
  .dexcell .r{ font-size:var(--fs-micro); font-weight:800; color:var(--gold); height:9px; }

  .logline{ font-size:var(--fs-cap); color:var(--sub); padding:3px 2px; border-bottom:1px solid #f2e6ee; }
  .logline b{ font-weight:700; font-variant-numeric:tabular-nums; }
  .logline.bad{ color:var(--rose); }
  .empty{ font-size:var(--fs-cap); color:var(--sub); text-align:center; padding:22px 0; }

  .tabs{ flex:none; height:58px; display:flex; background:var(--card);
    box-shadow:0 -3px 14px rgba(150,100,140,.12); padding-bottom:6px; }
  .tab{ flex:1; border:0; background:none; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    color:#b9a4b6; position:relative; padding:0; }
  .tab .ic{ height:19px; display:flex; align-items:center; }
  .tab .tl{ font-size:var(--fs-micro); font-weight:800; }
  .tab.on{ color:var(--rose); }
  .tab .bdg{ position:absolute; top:6px; right:calc(50% - 20px); min-width:15px; height:15px;
    border-radius:8px; background:var(--rose); color:#fff; font-size:var(--fs-micro); font-weight:800;
    display:none; align-items:center; justify-content:center; padding:0 4px; }
  .tab .bdg.on{ display:flex; }

  .viewbtn.spd{ left:auto; right:10px; }
  .viewbtn.ot{ left:auto; right:75px; }   /* 速さボタンとのすき間をとる */
  .viewbtn.ot.on{ background:#e0764f; color:#fff; }
  .viewbtn.ot.hot{ background:#c23a5e; color:#fff; }
  .viewbtn{ position:absolute; top:9px; left:10px; z-index:6; border:0; cursor:pointer;
    background:rgba(255,255,255,.94); color:var(--ink); border-radius:12px;
    padding:5px 11px; font-family:inherit; font-size:var(--fs-cap); font-weight:800;
    box-shadow:0 3px 10px rgba(120,70,110,.24); }
  .pchip{ display:inline-block; font-size:var(--fs-note); font-weight:700; background:var(--soft);
    color:var(--sub); border-radius:8px; padding:2px 9px; margin:0 4px 4px 0; }

  /* 職業カード */
  .sheet{ position:absolute; inset:0; z-index:30; display:none;
    background:rgba(40,26,42,.52); }
  .sheet.on{ display:block; }
  .sheetIn{ position:absolute; left:0; right:0; bottom:0; max-height:88%;
    background:var(--card); border-radius:22px 22px 0 0; overflow-y:auto;
    padding:16px 18px 26px; box-shadow:0 -10px 34px rgba(90,50,90,.34);
    animation:rise .22s cubic-bezier(.2,.9,.3,1); }
  @keyframes rise{ from{ transform:translateY(26px); opacity:.4 } to{ transform:none; opacity:1 } }

let GW = 8, GD = 6;                  // アトリエの床（広げられる）
const GW_MAX = 11, GD_MAX = 9;
const TGW = 10, TGD = 10;            // 街の地面（手前1マスは並木の歩道。05）
const WALLH = 150;
const SLAB = 22;
let OX = 0, OY = 0;
let view = "room";                   // "room" か "town"
function useRoomScale(){ TW = R_TW; TH = R_TH; ZS = TH/42; fitOrigin(); }
function useTownScale(){ TW = T_TW; TH = T_TH; ZS = T_ZS;
  OX = VW/2 - (TGW-TGD)*(TW/2)/2; OY = 156; }

/* いま描いている什器の枠。回して置いた什器のあいだだけ入る。
   {x, y, w, d} は回す前の場所と大きさ */
let FRAME = null;
function iso(gx, gy, gz){
  if(FRAME){
    const u = gx - FRAME.x, v = gy - FRAME.y;
    gx = FRAME.x + FRAME.d - v;
    gy = FRAME.y + u;
  }
  if(TRACE && (gz||0) <= ZFLOOR) traceMark(gx, gy);     /* 接地の範囲を測っているとき（room/shadow.js） */
  return { x: OX + (gx-gy)*(TW/2), y: OY + (gx+gy)*(TH/2) - (gz||0)*ZS };
}
/* 画面の座標を床のマス目に戻す（什器を動かすときに使う） */
function unIso(px, py){
  const sx = px-OX, sy = py-OY;
  return { gx:(sx/(TW/2) + sy/(TH/2))/2, gy:(sy/(TH/2) - sx/(TW/2))/2 };
}
/* #rrggbb でも rgb(...) でも受ける。
   shade() の結果をそのまま box() や bolt() に渡しても壊れないようにするため。 */
function shade(col, f){
  let r, g, b;
  if(col.charAt(0) === "#"){
    const n = parseInt(col.slice(1),16);
    r = (n>>16)&255; g = (n>>8)&255; b = n&255;
  } else {
    const m = col.match(/\d+/g);
    r = +m[0]; g = +m[1]; b = +m[2];
  }
  const c = v => Math.min(255, Math.round(v*f));
  return "rgb("+c(r)+","+c(g)+","+c(b)+")";
}
function poly(pts, fill){
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function box(gx, gy, w, d, h, color, base){
  const z = base||0;
  /* 90度まわすと、手前に来る面が入れかわる。
     光の向きは変わらないので、陰の濃さも入れかえる。
     面そのものも入れかえること。まわすと「y=gy+d」は左へ回り込んで見えなくなり、
     代わりに「y=gy」が右面として出てくる。ここを直さないと右面が一枚欠ける */
  const s1 = FRAME ? .54 : .70, s2 = FRAME ? .70 : .54;
  const yf = FRAME ? gy : gy+d;
  poly([iso(gx,yf,z+h), iso(gx+w,yf,z+h), iso(gx+w,yf,z), iso(gx,yf,z)], shade(color,s1));
  poly([iso(gx+w,gy,z+h), iso(gx+w,gy+d,z+h), iso(gx+w,gy+d,z), iso(gx+w,gy,z)], shade(color,s2));
  poly([iso(gx,gy,z+h), iso(gx+w,gy,z+h), iso(gx+w,gy+d,z+h), iso(gx,gy+d,z+h)], shade(color,1));
}
function cyl(gx, gy, r, h, color, base){
  const z = base||0;
  if(TRACE && z <= ZFLOOR){ traceMark(gx-r, gy-r); traceMark(gx+r, gy+r); }   /* 八角柱は中心しか iso に渡さない */
  const c0 = iso(gx,gy,z), c1 = iso(gx,gy,z+h);
  const rx = r*TW/2, ry = r*TH/2;
  ctx.fillStyle = shade(color,.60);
  ctx.beginPath();
  ctx.moveTo(c0.x-rx, c0.y); ctx.lineTo(c1.x-rx, c1.y);
  ctx.ellipse(c1.x, c1.y, rx, ry, 0, Math.PI, 0, true);
  ctx.lineTo(c0.x+rx, c0.y);
  ctx.ellipse(c0.x, c0.y, rx, ry, 0, 0, Math.PI, false);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = shade(color,1);
  ctx.beginPath(); ctx.ellipse(c1.x, c1.y, rx, ry, 0, 0, 6.2832); ctx.fill();
}
/* 反物・ロール。2点のあいだを太い線で結び、両端に断面をつける */
function bolt(gx1, gy1, gx2, gy2, z, r, col){
  const a = iso(gx1,gy1,z), b = iso(gx2,gy2,z);
  ctx.strokeStyle = shade(col,.92); ctx.lineWidth = r*2; ctx.lineCap = "butt";
  ctx.beginPath(); ctx.moveTo(a.x, a.y-r); ctx.lineTo(b.x, b.y-r); ctx.stroke();
  ctx.strokeStyle = shade(col,1.12); ctx.lineWidth = r*0.7;
  ctx.beginPath(); ctx.moveTo(a.x, a.y-r*1.5); ctx.lineTo(b.x, b.y-r*1.5); ctx.stroke();
  ctx.fillStyle = shade(col,1.2);
  ctx.beginPath(); ctx.ellipse(a.x, a.y-r, r*0.5, r, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = shade(col,.72);
  ctx.beginPath(); ctx.ellipse(b.x, b.y-r, r*0.5, r, 0, 0, 6.2832); ctx.fill();
}
/* 画面上の円（はずみ車やノブ） */
function disc(gx, gy, z, r, col){
  const p = iso(gx,gy,z);
  ctx.fillStyle = shade(col,.7);
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832); ctx.fill();
  ctx.fillStyle = shade(col,1.1);
  ctx.beginPath(); ctx.arc(p.x, p.y, r*0.55, 0, 6.2832); ctx.fill();
}
/* 傾いた天板の、奥から手前への高さを求める */
function tiltZ(f, v, zBack, zFront){ return zBack + (zFront-zBack)*(v-f.y)/FURN[f.type].d; }

/* トルソー（ボディ）の輪郭。肩→バスト→ウエスト→ヒップの断面をたどる */
const TORSO_PROFILE = [
  [0.00,0.80],[0.10,0.87],[0.22,0.85],[0.33,0.70],[0.44,0.53],[0.54,0.63],
  [0.65,0.86],[0.74,0.90],[0.82,0.79],[0.88,0.60],[0.93,0.33],[0.97,0.19],[1.00,0.17]
];
function torsoShape(px, py, H, W){
  ctx.beginPath();
  ctx.moveTo(px - W*TORSO_PROFILE[0][1], py);
  for(let i=1;i<TORSO_PROFILE.length;i++)
    ctx.lineTo(px - W*TORSO_PROFILE[i][1], py - H*TORSO_PROFILE[i][0]);
  for(let i=TORSO_PROFILE.length-1;i>=0;i--)
    ctx.lineTo(px + W*TORSO_PROFILE[i][1], py - H*TORSO_PROFILE[i][0]);
  ctx.closePath();
}

/* 壁に貼るもの。back = 奥の広い壁、left = 左の壁 */
function wallQuad(f, w, h, color, du, dz){
  const u = f.u + (du||0), z = f.z - (dz||0);
  if(f.wall==="back") poly([iso(u,0,z), iso(u+w,0,z), iso(u+w,0,z-h), iso(u,0,z-h)], color);
  else                poly([iso(0,u,z), iso(0,u+w,z), iso(0,u+w,z-h), iso(0,u,z-h)], color);
}
/* 壁の面の上の1点。(du, dz) — dz は下向き。ネオンやカーテンの曲線に使う */
function wallPt(f, du, dz){
  const u = f.u + du, z = f.z - dz;
  return f.wall==="back" ? iso(u,0,z) : iso(0,u,z);
}

/* ==================================================================
   1b. 什器の接地の影 C2 と、素材色への畳み込み
   （06 内装 proposals/06-atelier/inside_c.html を本体に。2026-08-17 先生「C2 でいきましょう」）

   決めた値
     影の形   ： 足もとにぴったり沿う 1 枚だけ。落ち影は伸ばさない
     影の大きさ： 実際に床へ触れている所（枠ではない）。外へ 0.05 マス
     影の色   ： multiply rgba(58,47,63,.20)。色は 1 色だけ
     夜       ： 真夜中で 0.6 倍
     壁もの   ： 姿をそのまま影の色に染めて、右下へ 1.6px ずらして敷く（.20）
     色       ： 什器の色を 素材 17 × 4 段（1.00／.70／.54＋淡）に吸着。床・壁・幅木は畳まない

   接地の大きさは、什器の描き方を読まずに測る。
   iso() を通る呼び出しのうち高さがほぼ 0 のものだけ拾えば、脚が床のどこを占めるかが分かる。
   什器を足したときも自動で付いてくる。測るときは何も描かない（空のクリップの中で描く）。
   ================================================================== */
const SH_COL = "58,47,63";
const SH_MARGIN = 0.05, SH_ALPHA = 0.20, SH_WALL = [1.6, 1.6, 0.20];
function shAlpha(a){ return a * (1 - 0.40*nightAmount()); }

/* 足もとにぴったり沿う 1 枚 */
function shadowFoot(gx, gy, w, d, m, a){
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  poly([iso(gx-m,gy-m), iso(gx+w+m,gy-m), iso(gx+w+m,gy+d+m), iso(gx-m,gy+d+m)],
       "rgba("+SH_COL+","+shAlpha(a).toFixed(3)+")");
  ctx.restore();
}

/* ---- 接地している範囲を、絵そのものから測る ---- */
const ZFLOOR = 4.0;              /* 短い脚で持ち上がった箱もの（ミニ冷蔵庫）は胴も拾う */
let TRACE = null;                /* iso.js / cyl が見る。null なら測っていない */
function traceMark(gx, gy){
  if(gx < TRACE.x0) TRACE.x0 = gx; if(gx > TRACE.x1) TRACE.x1 = gx;
  if(gy < TRACE.y0) TRACE.y0 = gy; if(gy > TRACE.y1) TRACE.y1 = gy;
}
const FOOT = {};                 /* "F:type" / "P:type" -> {x,y,w,d}（枠のなかの、実際に接地している所） */
function measureFoot(key, w, d, drawFn){
  if(FOOT[key]) return FOOT[key];
  let out = { x:0, y:0, w, d };
  const fr = FRAME, sn = SNAP; FRAME = null; SNAP = null;
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,0,0); ctx.clip();       /* 何も描かない */
  TRACE = { x0:1e9, x1:-1e9, y0:1e9, y1:-1e9 };
  try{ drawFn(); }catch(e){}
  const t = TRACE; TRACE = null;
  ctx.restore();
  FRAME = fr; SNAP = sn;
  if(t.x1 > t.x0 && t.y1 > t.y0){
    const x0 = Math.max(0, Math.min(t.x0, w)), x1 = Math.min(w, Math.max(t.x1, 0));
    const y0 = Math.max(0, Math.min(t.y0, d)), y1 = Math.min(d, Math.max(t.y1, 0));
    const ww = x1-x0, dd = y1-y0;
    if(ww > w*0.06 && dd > d*0.06){
      const mw = Math.max(ww, 0.16), md = Math.max(dd, 0.16);   /* 細すぎる影は見えない */
      out = { x:x0 - (mw-ww)/2, y:y0 - (md-dd)/2, w:mw, d:md };
    }
  }
  return (FOOT[key] = out);
}

/* アトリエの什器（FURN。x,y はマス目、rot で向きが変わる） */
function furnFoot(f){
  const F = FURN[f.type];
  const probe = Object.assign({}, f, { x:0, y:0, rot:0 });
  return measureFoot("F:"+f.type, F.w, F.d, () => F.draw(probe));
}
function drawFootShadow(f){
  const F = FURN[f.type];
  if(F.cat === "wall") return;
  const ft = furnFoot(f);
  FRAME = f.rot ? { x:f.x, y:f.y, w:F.w, d:F.d } : null;
  shadowFoot(f.x+ft.x, f.y+ft.y, ft.w, ft.d, SH_MARGIN, SH_ALPHA);
  FRAME = null;
}
/* 拠点の什器（PFX。"F:type" でアトリエの什器を借りることもある） */
function fxFoot(f){
  const k = f.t.slice(0,2), n = f.t.slice(2);
  if(k === "F:"){
    const F = FURN[n];
    if(!F || F.cat === "wall") return null;
    const probe = Object.assign({type:n, hung:0, u:f.x, z:f.y, v:0, wall:"back"}, f, {x:0, y:0, r:0});
    return measureFoot("F:"+n, F.w, F.d, () => F.draw(probe));
  }
  const S = k === "S:" ? SFX[n] : k === "P:" ? PFX[n] : PFX[f.t];
  if(!S) return null;
  const probe = Object.assign({ u:0, z:0, v:1, on:true, ph:0, n:5, lv:2, busyT:1, hung:0, ink:.72 }, f, { x:0, y:0, r:0 });
  return measureFoot((k === "S:" ? "S:" : "P:")+(k === "S:" || k === "P:" ? n : f.t), S.w, S.d, () => S.draw(probe));
}
function drawFxShadow(f){
  const ft = fxFoot(f); if(!ft) return;
  const S = fxDef(f);
  FRAME = (f.r && S) ? { x:f.x, y:f.y, w:S.w, d:S.d } : null;
  shadowFoot(f.x+ft.x, f.y+ft.y, ft.w, ft.d, SH_MARGIN, SH_ALPHA);
  FRAME = null;
}
/* 壁もの：姿を影の色に染めて右下へずらして敷き、そのあと本物を描く */
let SHADOW_INK = false;
function drawWallShadowed(drawFn){
  const [dx, dy, a] = SH_WALL;
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.globalAlpha = shAlpha(a);
  ctx.translate(dx, dy); SHADOW_INK = true;
  try{ drawFn(); } finally { SHADOW_INK = false; ctx.restore(); }
  drawFn();
}

/* ==================================================================
   色の畳み込み ── 什器の色を素材色 × 段に吸着させる。
   fillStyle / strokeStyle に色が入った瞬間（screen.js の夜の色と同じ場所）で行うので、
   什器の描き方は 1 行も触らない。SNAP が null のあいだは何もしない（床・壁・人物・UI）。
   ================================================================== */
const FAM17 = [
  ["wood",   [198,154,104]], ["wood2",  [169,120, 76]], ["cream",  [240,232,218]],
  ["paper",  [250,246,236]], ["metal",  [195,202,212]], ["metalD", [127,135,148]],
  ["ink",    [ 47, 42, 54]], ["glass",  [207,224,234]], ["plum",   [124, 90,112]],
  ["rose",   [216,137,159]], ["coral",  [224,143,140]], ["sage",   [127,174,102]],
  ["gold",   [242,193, 78]], ["lilac",  [183,154,218]], ["blue",   [111,159,216]],
  ["teal",   [ 95,176,160]], ["terra",  [224,150,111]],
];
const TONE4 = [0.54, 0.70, 1.00, "pale"];    /* 「淡い段」は 06 の推しどおり入れてある（先生の返事待ち） */
const PALEBASE = [250,246,236];
function buildPalette(fams, tones){
  const out = [];
  for(const [k, c] of fams) for(const t of tones){
    const rgb = t === "pale" ? c.map((v,i) => Math.round(v*0.42 + PALEBASE[i]*0.58))
                             : c.map(v => Math.min(248, Math.round(v*t)));
    out.push({ key:k+"@"+t, rgb });
  }
  return out;
}
const PAL_FURN = buildPalette(FAM17, TONE4);
const ALPHA_STEPS = [0.10, 0.14, 0.18, 0.22, 0.30, 0.45, 0.62, 0.85];
function colLum(c){ return 0.299*c[0] + 0.587*c[1] + 0.114*c[2]; }
function colDist(a, b){          /* 色みを 3 倍重く見る（木の暗い所が冷たい灰に飛ばないように） */
  const la = colLum(a), lb = colLum(b);
  const dc = (a[0]-la-b[0]+lb)**2 + (a[1]-la-b[1]+lb)**2 + (a[2]-la-b[2]+lb)**2;
  return 3*dc + (la-lb)*(la-lb);
}
function parseCol(v){
  let m;
  if((m = /^#([0-9a-fA-F]{3,8})$/.exec(v))){
    let h = m[1];
    if(h.length === 3 || h.length === 4) h = h.split("").map(c=>c+c).join("");
    return { r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16),
             a: h.length === 8 ? parseInt(h.slice(6,8),16)/255 : 1 };
  }
  if((m = /^rgba?\(([^)]+)\)$/i.exec(v))){
    const p = m[1].split(",").map(Number);
    return { r:p[0], g:p[1], b:p[2], a: p.length > 3 ? p[3] : 1 };
  }
  return null;
}
function nearestCol(pal, r, g, b){
  let best = pal[0], bd = Infinity;
  for(const p of pal){ const d = colDist([r,g,b], p.rgb); if(d < bd){ bd = d; best = p; } }
  return best;
}
function snapAlpha(a){
  let best = ALPHA_STEPS[0];
  for(const s of ALPHA_STEPS) if(Math.abs(s-a) < Math.abs(best-a)) best = s;
  return best;
}
let SNAP = null;                 /* いま使うパレット。什器を描くあいだだけ PAL_FURN */
const _snapCache = new Map();
function snapColor(v){
  if(SHADOW_INK){               /* 壁ものの影：どんな色も影の色に */
    if(typeof v !== "string") return "rgb("+SH_COL+")";
    const c = parseCol(v); return "rgba("+SH_COL+","+(c ? c.a : 1)+")";
  }
  if(!SNAP || typeof v !== "string") return v;
  const hit = _snapCache.get(v); if(hit !== undefined) return hit;
  const c = parseCol(v);
  let out = v;
  if(c){
    const p = nearestCol(SNAP, c.r, c.g, c.b);
    out = c.a >= 1 ? "rgb("+p.rgb[0]+","+p.rgb[1]+","+p.rgb[2]+")"
                   : "rgba("+p.rgb[0]+","+p.rgb[1]+","+p.rgb[2]+","+snapAlpha(c.a)+")";
  }
  if(_snapCache.size > 4000) _snapCache.clear();
  _snapCache.set(v, out);
  return out;
}
/* 什器の中のグラデーションは面にする（ART.md 6章）。止め色をならして 1 色に。
   まわりへ消えていく丸い光は、平らにすると白いべたの円になるので描かない
   （光だまりは什器ではなく部屋のほうが面 2 段で置く）。SNAP が null のとき（空・UI）は本物のまま */
(function(){
  const lin = ctx.createLinearGradient.bind(ctx), rad = ctx.createRadialGradient.bind(ctx);
  function fake(radial){ const stops = []; return { __flat:true, __radial:!!radial, stops,
    addColorStop(o,c){ stops.push([o,c]); } }; }
  ctx.createLinearGradient = function(...a){ return SNAP ? fake(false) : lin(...a); };
  ctx.createRadialGradient = function(...a){ return SNAP ? fake(true)  : rad(...a); };
})();
function flatOf(stops){
  if(!stops.length) return "#c69a68";
  let r=0, g=0, b=0, a=0, wsum=0;
  for(const [, c] of stops){
    const p = parseCol(c); if(!p) continue;
    const w = Math.max(p.a, 0.001);
    r += p.r*w; g += p.g*w; b += p.b*w; a += p.a; wsum += w;
  }
  if(!wsum) return stops[0][1];
  a /= stops.length;
  return "rgba(" + Math.round(r/wsum) + "," + Math.round(g/wsum) + "," + Math.round(b/wsum) + "," + a.toFixed(3) + ")";
}
/* screen.js の色の口が呼ぶ。グラデーションの偽物なら 1 色にしてから */
function furnColor(v){
  if(v && v.__flat) return v.__radial ? "rgba(0,0,0,0)" : snapColor(flatOf(v.stops));
  return snapColor(v);
}

  draft: { name:"製図台", price:9000, cat:"work", w:2.0, d:1.1, role:"patterner", max:3, h:18,
    eff:{form:2}, tag:"パタンナーの持ち場",
    draw(f){ const zB = 24, zF = 15;
             box(f.x+.12,f.y+.86,.14,.16,15,WOOD2,0);
             box(f.x+1.74,f.y+.86,.14,.16,15,WOOD2,0);
             box(f.x+.12,f.y+.08,.14,.16,24,WOOD2,0);
             box(f.x+1.74,f.y+.08,.14,.16,24,WOOD2,0);
             box(f.x+.2,f.y+.44,1.6,.08,2,WOOD2,8);
             poly([iso(f.x,f.y,zB),iso(f.x+2,f.y,zB),               /* 傾いた天板 */
                   iso(f.x+2,f.y+1.1,zF),iso(f.x,f.y+1.1,zF)],"#efe9dc");
             poly([iso(f.x,f.y+1.1,zF),iso(f.x+2,f.y+1.1,zF),
                   iso(f.x+2,f.y+1.1,zF-2.5),iso(f.x,f.y+1.1,zF-2.5)],"#cfc7b6");
             const tz = v => zB + (zF-zB)*(v-f.y)/1.1;
             poly([iso(f.x+.22,f.y+.12,tz(f.y+.12)+.6),iso(f.x+1.6,f.y+.12,tz(f.y+.12)+.6),
                   iso(f.x+1.6,f.y+.95,tz(f.y+.95)+.6),iso(f.x+.22,f.y+.95,tz(f.y+.95)+.6)],"#fdfaf2");
             /* 線は、人がそこにいるあいだに少しずつ引かれる。
                誰もいなければ引きかけのまま止まる */
             { const k = Math.max(0.06, Math.min(1, f.ink || 0));
               ctx.strokeStyle="rgba(80,70,90,.45)"; ctx.lineWidth=.9;
               const a=iso(f.x+.4,f.y+.25,tz(f.y+.25)+1), b=iso(f.x+1.3,f.y+.85,tz(f.y+.85)+1),
                     c=iso(f.x+1.35,f.y+.25,tz(f.y+.25)+1);
               const cp = {x:a.x+16, y:a.y+12};
               ctx.beginPath(); ctx.moveTo(a.x,a.y);
               for(let q=1;q<=16;q++){                       /* 曲線を途中まで */
                 const t2 = k*q/16, w2 = 1-t2;
                 ctx.lineTo(w2*w2*a.x + 2*w2*t2*cp.x + t2*t2*b.x,
                            w2*w2*a.y + 2*w2*t2*cp.y + t2*t2*b.y);
               }
               ctx.stroke();
               const k2 = Math.max(0, Math.min(1, (k-0.35)/0.65));
               if(k2 > 0){
                 ctx.beginPath(); ctx.moveTo(a.x,a.y);
                 ctx.lineTo(a.x+(c.x-a.x)*k2, a.y+(c.y-a.y)*k2); ctx.stroke();
               }
               /* 引いている人の手もとに、鉛筆の先の光 */
               if(busy(f) && k < 1){
                 const t2=k, w2=1-t2;
                 const px = w2*w2*a.x + 2*w2*t2*cp.x + t2*t2*b.x;
                 const py = w2*w2*a.y + 2*w2*t2*cp.y + t2*t2*b.y;
                 ctx.fillStyle="rgba(255,240,200,.9)";
                 ctx.beginPath(); ctx.arc(px, py, 1.4, 0, 6.2832); ctx.fill();
               } }
             { const q=iso(f.x+1.62,f.y+.62,tz(f.y+.62)+1);         /* 雲形定規 */
               ctx.fillStyle="rgba(150,205,230,.78)";
               ctx.beginPath(); ctx.moveTo(q.x-9,q.y+2);
               ctx.bezierCurveTo(q.x-4,q.y-7,q.x+6,q.y-6,q.x+10,q.y+1);
               ctx.bezierCurveTo(q.x+5,q.y+1,q.x-2,q.y+5,q.x-9,q.y+2);
               ctx.closePath(); ctx.fill(); }
             poly([iso(f.x+.3,f.y+1.0,tz(f.y+1.0)+.8),iso(f.x+1.5,f.y+1.0,tz(f.y+1.0)+.8),
                   iso(f.x+1.5,f.y+1.07,tz(f.y+1.07)+.8),iso(f.x+.3,f.y+1.07,tz(f.y+1.07)+.8)],
                  "rgba(205,222,240,.92)");
             { const q=iso(f.x+.75,f.y+.9,tz(f.y+.9)+1.4);          /* 鉛筆 */
               ctx.strokeStyle="#e8a52c"; ctx.lineWidth=1.8; ctx.lineCap="round";
               ctx.beginPath(); ctx.moveTo(q.x-6,q.y-2); ctx.lineTo(q.x+6,q.y+1); ctx.stroke(); } } },

  sewing:{ name:"ミシン", price:12000, cat:"work", w:1.3, d:0.9, role:"sewer", max:4, h:50,
    eff:{tech:2}, tag:"縫製の持ち場",
    draw(f){ const on = busy(f), sp = on ? anim*9 : 1.15;   /* 人がいないときは止める */
             /* ---- ミシン台 ---- */
             box(f.x+.10, f.y+.12,.12,.66,13,WOOD2,0);
             box(f.x+1.08,f.y+.12,.12,.66,13,WOOD2,0);
             box(f.x+.14, f.y+.40,.94,.06,7,shade(WOOD2,.9),4);   /* 貫 */
             box(f.x,f.y,1.3,.9,2.5,WOOD,13);
             /* フットコントローラとコード */
             box(f.x+.40,f.y+.66,.32,.18,1.8,"#43404c",0);
             { const a=iso(f.x+.72,f.y+.75,1.4), b=iso(f.x+1.06,f.y+.52,4);
               ctx.strokeStyle="#3a3742"; ctx.lineWidth=1.1; ctx.lineCap="round";
               ctx.beginPath(); ctx.moveTo(a.x,a.y);
               ctx.quadraticCurveTo(a.x+9,a.y+3,b.x,b.y); ctx.stroke(); }

             /* ---- 本体 ----
                ベッド（土台）／右の支柱／そこから左へ伸びるアーム／左端の頭部。
                アームとベッドのあいだの空きが「ふところ」。ここに布を通す。 */
             const Z = 15.5;
             box(f.x+.14,f.y+.22,1.02,.46, 7,"#dfe9ea",Z);          /* ベッド */
             /* ふところの影。ここが空いていることが、これで分かる */
             poly([iso(f.x+.30,f.y+.26,Z+7.1), iso(f.x+.90,f.y+.26,Z+7.1),
                   iso(f.x+.90,f.y+.62,Z+7.1), iso(f.x+.30,f.y+.62,Z+7.1)],
                  "rgba(84,96,104,.30)");
             box(f.x+.13,f.y+.23, .20,.44,16,"#d3e0e2",Z+17);       /* 頭部 */
             box(f.x+.22,f.y+.26, .66,.38,11,"#e7f1f1",Z+22);       /* アーム */
             box(f.x+.88,f.y+.22, .28,.46,26,"#dbe7e8",Z+7);        /* 支柱 */

             /* 支柱の顔：糸調子ダイヤルと差込口 */
             { const d0=iso(f.x+1.02,f.y+.685,Z+22);
               ctx.fillStyle="#c9ced8";
               ctx.beginPath(); ctx.ellipse(d0.x,d0.y,3.2,2.9,0,0,6.2832); ctx.fill();
               ctx.fillStyle="#7c8492";
               ctx.beginPath(); ctx.ellipse(d0.x,d0.y,1.2,1.1,0,0,6.2832); ctx.fill();
               const d1=iso(f.x+.98,f.y+.685,Z+12);
               ctx.fillStyle="rgba(96,104,118,.5)";
               ctx.beginPath(); ctx.ellipse(d1.x,d1.y,2.0,1.8,0,0,6.2832); ctx.fill(); }
             /* アームの腹に一本ライン＋メーカーの色 */
             { const a=iso(f.x+.26,f.y+.64,Z+26.5), b=iso(f.x+.86,f.y+.64,Z+26.5);
               ctx.strokeStyle="rgba(126,138,158,.5)"; ctx.lineWidth=1;
               ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
               const c=iso(f.x+.60,f.y+.64,Z+30), d=iso(f.x+.84,f.y+.64,Z+30);
               ctx.strokeStyle="#e07a9c"; ctx.lineWidth=1.6;
               ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.stroke(); }

             /* ---- はずみ車。支柱の右の面。人がいるあいだ回る ---- */
             { const gx2=f.x+1.165, cy=f.y+.45, cz=Z+18, R=.072, H=5.2;
               const pt=(a,k)=>iso(gx2, cy+Math.cos(a)*R*k, cz+Math.sin(a)*H*k);
               const ring=(k,col)=>{ ctx.beginPath();
                 for(let q=0;q<=20;q++){ const w=pt(q/20*6.2832,k);
                   if(q) ctx.lineTo(w.x,w.y); else ctx.moveTo(w.x,w.y); }
                 ctx.closePath(); ctx.fillStyle=col; ctx.fill(); };
               ring(1,"#59606d"); ring(.74,"#9aa2ae"); ring(.30,"#6d7684");
               const mk = pt(sp, .55);                       /* 回っているのが分かる印 */
               ctx.fillStyle="#eef1f5";
               ctx.beginPath(); ctx.arc(mk.x,mk.y,1.0,0,6.2832); ctx.fill(); }

             /* ---- 糸立てと糸コマ ---- */
             cyl(f.x+.70,f.y+.31,.018,6,"#9aa1ad",Z+33);
             cyl(f.x+.70,f.y+.31,.050,4,"#e88fa8",Z+34);

             /* ---- 針板・押さえ・針。布は左手前へ流れる ---- */
             const nx = f.x+.235, ny = f.y+.45, nz = Z+7;
             box(f.x+.17,f.y+.36,.14,.20,.7,"#c6ccd7",nz);          /* 針板 */
             /* ふところの布。いま作っている一着の生地が届いていれば、その色で縫っている（A案） */
             const cl = jobFabCol() || "#f6d5e0";
             poly([iso(f.x+.19,f.y+.30,nz+.8), iso(f.x+.58,f.y+.31,nz+.8),
                   iso(f.x+.62,f.y+.66,nz+.8), iso(f.x+.23,f.y+.65,nz+.8)],cl);
             poly([iso(f.x+.19,f.y+.30,nz+.8), iso(f.x+.38,f.y+.305,nz+.8),
                   iso(f.x+.42,f.y+.655,nz+.8), iso(f.x+.23,f.y+.65,nz+.8)],shade(cl,1.10));
             { const n=iso(nx,ny,nz+1.4);
               const dy = on ? (Math.sin(anim*18)+1)*2.0 : 0;
               ctx.fillStyle="#aeb5c1"; ctx.fillRect(n.x-2.8,n.y-2.8,5.6,1.7);   /* 押さえ */
               ctx.strokeStyle="#a2a9b5"; ctx.lineWidth=1.1;
               ctx.beginPath(); ctx.moveTo(n.x+2.2,n.y-3.4); ctx.lineTo(n.x+2.2,n.y-8); ctx.stroke();
               ctx.strokeStyle="#7f8692"; ctx.lineWidth=1.5;                     /* 針棒 */
               ctx.beginPath(); ctx.moveTo(n.x,n.y-10.5+dy); ctx.lineTo(n.x,n.y-2.4+dy); ctx.stroke(); }

             /* ---- 天秤。動いているときだけ上下する ---- */
             { const l0=iso(f.x+.16,f.y+.30,Z+29), a = on ? Math.sin(anim*9)*2.6 : 0;
               ctx.strokeStyle="#b6bdc9"; ctx.lineWidth=1.5; ctx.lineCap="round";
               ctx.beginPath(); ctx.moveTo(l0.x+1.5,l0.y+1); ctx.lineTo(l0.x-3.5,l0.y-1.5+a); ctx.stroke(); }

             /* ---- 糸道：糸コマ → 天秤 → 針 ---- */
             { const a=iso(f.x+.70,f.y+.31,Z+38), b=iso(f.x+.30,f.y+.29,Z+33),
                     c=iso(f.x+.16,f.y+.30,Z+29), n=iso(nx,ny,nz+1.4);
               ctx.strokeStyle="rgba(214,116,150,.5)"; ctx.lineWidth=.55;
               ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
               ctx.lineTo(c.x-3,c.y-1); ctx.lineTo(n.x,n.y-4); ctx.stroke(); } } },

  torso: { name:"ボディ", price:8000, cat:"work", w:0.8, d:0.8, role:"patterner", max:4, h:43,
    eff:{form:3}, tag:"パタンナーの持ち場。立体で形を確かめる",
    draw(f){ /* 鋳鉄の三脚。脚は外へ流れる曲線 */
             for(let i=0;i<3;i++){ const a=i/3*6.2832+0.6;
               const bx=f.x+.4+Math.cos(a)*.22, by=f.y+.4+Math.sin(a)*.22;
               const q0=iso(f.x+.4,f.y+.4,4), q1=iso(bx,by,0.6);
               ctx.strokeStyle="#5f5f68"; ctx.lineWidth=2.4; ctx.lineCap="round";
               ctx.beginPath(); ctx.moveTo(q0.x,q0.y);
               ctx.quadraticCurveTo(q1.x, q0.y+ (q1.y-q0.y)*0.2, q1.x, q1.y); ctx.stroke();
               cyl(bx,by,.05,1.2,"#4a4a52",0); }
             cyl(f.x+.4,f.y+.4,.09,4,"#5f5f68",1);
             /* 支柱：芯を明るく */
             cyl(f.x+.4,f.y+.4,.05,12,"#8e8e98",5);
             { const a=iso(f.x+.39,f.y+.4,5), b=iso(f.x+.39,f.y+.4,17);
               ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=1;
               ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
             const p = iso(f.x+.4,f.y+.4,17), H = 38, W = 12.6;
             /* 落ち影を先に */
             ctx.save(); ctx.globalCompositeOperation="multiply";
             ctx.fillStyle="rgba(90,80,90,.18)";
             ctx.beginPath(); ctx.ellipse(p.x+2,p.y+1,W*0.9,3.2,0,0,6.2832); ctx.fill();
             ctx.restore();
             /* 本体：リネン地 */
             torsoShape(p.x,p.y,H,W);
             { const gl=ctx.createLinearGradient(p.x-W,0,p.x+W,0);
               gl.addColorStop(0,"#eae3d3"); gl.addColorStop(0.35,"#f5efe2");
               gl.addColorStop(0.7,"#e6dfcf"); gl.addColorStop(1,"#c9c1b0");
               ctx.fillStyle=gl; ctx.fill(); }
             ctx.save(); torsoShape(p.x,p.y,H,W); ctx.clip();
             /* 織り目 */
             ctx.strokeStyle="rgba(120,105,90,.10)"; ctx.lineWidth=.6;
             for(let y=-H-4;y<4;y+=2.2){ ctx.beginPath(); ctx.moveTo(p.x-W-2,p.y+y); ctx.lineTo(p.x+W+2,p.y+y+0.6); ctx.stroke(); }
             for(let x=-W-2;x<W+2;x+=2.2){ ctx.beginPath(); ctx.moveTo(p.x+x,p.y-H-4); ctx.lineTo(p.x+x+0.4,p.y+4); ctx.stroke(); }
             /* まるみの陰。右へ沈む */
             ctx.fillStyle="rgba(90,75,70,.16)"; ctx.fillRect(p.x+W*0.55,p.y-H-4,W,H+8);
             ctx.fillStyle="rgba(255,255,255,.4)"; ctx.fillRect(p.x-W*0.75,p.y-H-4,W*0.25,H+8);

               a=P(.06,55.5); c1=P(.20,58.5); ctx.quadraticCurveTo(c1.x,c1.y,a.x,a.y);
               c1=P(.02,50); a=P(.26,37); ctx.quadraticCurveTo(c1.x,c1.y,a.x,a.y);   /* 左をしぼる */
               c1=P(.06,22); a=P(.02,1); ctx.quadraticCurveTo(c1.x,c1.y,a.x,a.y);
               ctx.closePath(); };
             path(); ctx.fillStyle=C; ctx.fill();
             /* たてのドレープ。しぼりに向かって流れる */
             ctx.lineCap="round";
             for(let i=0;i<4;i++){
               const uT=.14+i*.23, uW=.34+(i-1.5)*.11;
               const a=P(uT,3), c1=P(uW,22), b=P(.38+(i-1.5)*.16,52);
               ctx.strokeStyle= i%2 ? "rgba(255,255,255,.34)" : shade(C2,.98);
               ctx.lineWidth= i%2 ? 1.6 : 2.2;
               ctx.beginPath(); ctx.moveTo(a.x,a.y);
               ctx.quadraticCurveTo(c1.x,c1.y,b.x,b.y); ctx.stroke(); }
             /* 上のひだ */
             ctx.fillStyle=C3;
             for(let i=0;i<5;i++){
               const q0=P(.045+i*.19,1), q1=P(.135+i*.19,1), q2=P(.09+i*.19,5.5);
               ctx.beginPath(); ctx.moveTo(q0.x,q0.y); ctx.lineTo(q1.x,q1.y);
               ctx.lineTo(q2.x,q2.y); ctx.closePath(); ctx.fill(); }
             /* タッセル */
             { const a=P(.22,35), b=P(.74,35), c1=P(.48,40.5);
               ctx.strokeStyle="#b98aa4"; ctx.lineWidth=4.2;
               ctx.beginPath(); ctx.moveTo(a.x,a.y);
               ctx.quadraticCurveTo(c1.x,c1.y,b.x,b.y); ctx.stroke();
               const k=P(.48,38.6);
               ctx.fillStyle="#a3768f";
               ctx.beginPath(); ctx.arc(k.x,k.y,2.2,0,6.2832); ctx.fill();
               ctx.strokeStyle="#a3768f"; ctx.lineWidth=1.3;
               ctx.beginPath(); ctx.moveTo(k.x,k.y+2); ctx.lineTo(k.x-1,k.y+6.5);
               ctx.moveTo(k.x+1.2,k.y+2); ctx.lineTo(k.x+2,k.y+6); ctx.stroke(); } } },
};

/* 街の人・猫・車を1こま進める。数は時刻で変わり、人は開いている店を目指して歩く（town/crowd.js）。

let crowdTuneT = 0;
function stepActors(dt){
  const rain = (TOWN_SEASONS[townMonth()] || {}).ev === "ame";
  crowdTuneT -= dt;
  if(crowdTuneT <= 0){ crowdTuneT = 4; tuneCrowd(2, rain); }

/* 街の歩行者。遠くの人なので背を詰めた型を使うが、
   面の割りかたと光の向きはアトリエの人と同じ（src/staff/person.js） */
/* 街の人は、アトリエの中の人よりずっと小さく（0.56倍で確定。細部が潰れてもよい：先生） */
let WALK_U = 0.56;
function drawWalker(a){
  const p = iso(a.gx, a.gy, 0);
  pxWalker(ctx, a, p.x, p.y, WALK_U);
}
function drawTownCat(a){
  const p = iso(a.gx, a.gy, 0), rest = a.rest > 0;
  const y = p.y - (rest ? 0 : Math.abs(Math.sin(a.t*9))*0.5);
  ctx.fillStyle = "rgba(80,70,60,.16)";
  ctx.beginPath(); ctx.ellipse(p.x, p.y, 4.6, 2, 0, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = a.col; ctx.lineWidth = 1.3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(p.x-3.4*a.dir, y-3);
  ctx.quadraticCurveTo(p.x-6.4*a.dir, y-4.6, p.x-5.6*a.dir, y-7.6); ctx.stroke();
  ctx.fillStyle = a.col;
  ctx.beginPath(); ctx.ellipse(p.x, y-3.4, 4.2, rest?2.2:2.7, 0, 0, 6.2832); ctx.fill();
  const hx = p.x+3.4*a.dir, hy = y-(rest?4.4:6);
  ctx.beginPath(); ctx.moveTo(hx-2,hy-1); ctx.lineTo(hx-1,hy-3.6); ctx.lineTo(hx-0.2,hy-1.4);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx+2,hy-1); ctx.lineTo(hx+1,hy-3.6); ctx.lineTo(hx+0.2,hy-1.4);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(hx, hy, 2.6, 0, 6.2832); ctx.fill();
}
function drawCar(a){
  const p = iso(a.gx, a.gy, 0);
  ctx.fillStyle = "rgba(80,70,60,.20)";
  ctx.beginPath(); ctx.ellipse(p.x, p.y, 9, 3.4, 0, 0, 6.2832); ctx.fill();
  box(a.gx-0.30, a.gy-0.14, 0.60, 0.28, 7, a.col, 1.5);
  box(a.gx-0.16, a.gy-0.12, 0.30, 0.24, 6, shade(a.col,1.18), 8.5);
  ctx.fillStyle = "rgba(40,36,44,.7)";
  ctx.beginPath(); ctx.arc(p.x-6, p.y-1, 1.7, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(p.x+6, p.y-1, 1.7, 0, 6.2832); ctx.fill();
  if(nightAmount() > 0.4){
    ctx.fillStyle = "rgba(255,236,180,.5)";
    ctx.beginPath();
    ctx.ellipse(p.x+13*a.dir, p.y-3, 12, 3.4, 0, 0, 6.2832); ctx.fill();
  }
}
function drawSkyLife(){
  const nt = nightAmount();
  /* 鳥 */
  ctx.strokeStyle = nt>0.5 ? "rgba(220,214,240,.5)" : "rgba(110,100,120,.42)";
  ctx.lineWidth = 1.2;
  for(const b of birds){
    const f = Math.sin(b.x*0.08 + b.ph)*2.4;
    ctx.beginPath();
    ctx.moveTo(b.x-3.4, b.y+f); ctx.lineTo(b.x, b.y-1.4); ctx.lineTo(b.x+3.4, b.y+f);
    ctx.stroke();
  }
  /* 飛行機 */
  if(plane){
    ctx.strokeStyle = "rgba(255,255,255,.42)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(plane.x-52, plane.y+1.5); ctx.lineTo(plane.x-6, plane.y+0.5);
    ctx.stroke();
    ctx.fillStyle = nt>0.5 ? "#c9c4dc" : "#f2f0f6";
    ctx.beginPath();
    ctx.moveTo(plane.x+9, plane.y); ctx.lineTo(plane.x-6, plane.y+2.4);
    ctx.lineTo(plane.x-8, plane.y); ctx.lineTo(plane.x-6, plane.y-2.4);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(plane.x-1, plane.y); ctx.lineTo(plane.x-7, plane.y-6);
    ctx.lineTo(plane.x-3, plane.y); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(plane.x-1, plane.y); ctx.lineTo(plane.x-7, plane.y+6);
    ctx.lineTo(plane.x-3, plane.y); ctx.closePath(); ctx.fill();
  }
}

/* 確認しやすいように、いまは全部の拠点を開けてある。
   「街」タブの切り替えで、章と名声による段階解禁に戻せる。
   URLに `?locked` を付けて開いたときだけ（例 `atelier_phone.html?locked#catalog`）、
   段階解禁の見えかた——名札に鍵が付き、建物が灰色になる——を確かめられる。
   ハッシュは `#catalog` の完全一致で見られているので、こちらは検索文字列を使う。
   ゲーム本体は IIFE に包まれていて外から変数を触れないため、この口が要る。 */
const LOCK_DEMO = /(^|[?&])locked($|[&=])/.test(location.search);
let unlockAll = false;   /* 段階解禁。合流のときに false に（GAME.md I-11）。#catalog の裏口で dev.fame などを触れば開く */
function placeOpen(p){
  if(typeof SCH !== "undefined" && SCH && SG) return scPlaceOpen(p.id);   /* 学校の4年のあいだは学年で開く */
  if(unlockAll && !LOCK_DEMO) return true;
  if(!p.need) return true;
  if(p.need.chapter != null) return showIdx >= p.need.chapter - 1;
  if(p.need.fame != null) return fame >= p.need.fame;
  return true;
}
function placeNeedText(p){
  if(unlockAll) return "いまは全部開けてあります";
  if(!p.need) return "";
  if(p.need.chapter != null) return "第"+p.need.chapter+"章から";
  return "名声 "+p.need.fame+" で開きます";
}

/* 色のコーデ8種。主色・2色目・差し色をまとめて決める。
   mode 0 のときだけ主色を null にして、役職の色（opt.col）を通す */
function pxCoord(rnd, mode, second, accent){
  const one = (arr) => arr[Math.floor(rnd()*arr.length)];
  switch(mode){
    case 1: return { col:"#2a2430", c2:"#3a3340", accent:"#4b3d52" };                 /* 全身黒 */
    case 2: return { col:"#f4efe6", c2:"#efe6da", accent:"#e6d8c4" };                 /* 全身白 */
    case 3: return { col:one(["#2a2430","#f4efe6"]),
                     c2:one(["#5c6470","#a9b6c4","#f4efe6","#2a2430"]), accent:"#8c3b3b" };  /* モノトーン */
    case 4: return { col:one(PX_PALE), c2:one(PX_PALE),
                     accent:one(["#e9a7b4","#c9a7e0","#9db8e8"]) };                   /* ペール */
    case 5: { const v = one(PX_VIVID);
              return { col:v, c2:one(PX_VIVID.filter(x => x !== v)), accent:"#f4efe6" }; }   /* ビビッド */
    case 6: { const p = one([["#7c5a70","#7fae66"],["#3d4a63","#e0966f"],
                             ["#8c3b3b","#5fb0a0"],["#c9a15c","#6f9fd8"]]);
              return { col:p[0], c2:p[1], accent:"#f4efe6" }; }                       /* 補色 */
    case 7: return { col:one(PX_EARTH), c2:one(PX_EARTH), accent:"#f4efe6" };         /* アースカラー */
    default: return { col:null, c2:second || one(PX_SECOND), accent:accent || one(PX_ACCENT) };
  }
}

/* 見た目をひとつ抽選する。出現率は ART.md 1-2 の表（ガチャの感覚）。
   rnd は 0〜1 を返す関数。opts で一部を決め打ちできる（一覧ページ用） */
function pxLook(rnd, opts){
  rnd = rnd || Math.random; opts = opts || {};
  const one = (arr) => arr[Math.floor(rnd()*arr.length)];
  const roll   = rnd();
  const odd    = opts.head   != null ? opts.head > 0 : roll < 0.03;   /* ★★超レア 3% */
  const unique = opts.unique != null ? opts.unique   : roll < 0.11;   /* ★個性的  8% */
  const semi   = !unique && roll < 0.23;                              /* 色のコーデだけ違う 12% */
  const mode   = opts.coord != null ? opts.coord
               : ((unique || semi) ? 1 + Math.floor(rnd()*7) : 0);
  const c = pxCoord(rnd, mode, opts.c2, opts.accent);
  const look = {
    body:   opts.body != null ? opts.body : Math.floor(rnd()*3),
    wear:   opts.wear != null ? opts.wear : Math.floor(rnd()*32),
    hair:   opts.hair != null ? opts.hair : Math.floor(rnd()*12),
    hairC:  (unique && rnd() < 0.5) ? one(PX_HAIRODD) : one(PX_HAIRC),
    hairC2: (unique && rnd() < 0.25) ? one(PX_HAIRODD) : null,        /* 2色の髪 */
    skin:   one(PX_SKIN),
    col:    c.col, c2:c.c2, accent:c.accent, coord:mode,
    pattern:opts.pattern != null ? opts.pattern
            : ((unique ? rnd() < 0.6 : rnd() < 0.04) ? 1 + Math.floor(rnd()*5) : 0),
    hat:    (unique && rnd() < 0.35) ? 1 + Math.floor(rnd()*2) : 0,   /* 帽子は個性的な人だけ */
    hatC:   one(PX_HATC),
    glasses:rnd() < 0.25 ? (rnd() < 0.7 ? 1 : 2) : 0,                 /* 1 丸／2 四角 */
    head:   opts.head != null ? opts.head : (odd ? 1 + Math.floor(rnd()*16) : 0),
    unique, semi, tall: 1.94,
  };
  /* 全身黒・全身白のときは、柄を反対がわの色で置く（同化して消えないように） */
  if(mode === 1 && look.pattern){ look.patC = "#5c6470"; look.patC2 = "#4b3d52"; }
  if(mode === 2 && look.pattern){ look.patC = "#c9a982"; look.patC2 = "#a9b6c4"; }
  look.tall = 1.94 + look.body*0.10;             /* 吹き出しの高さに使う（古くからの値） */
  return look;
}

/* 見た目の値をこの絵の流儀に直す。古い形の appearance も受け取れる */
function pxNorm(a){
  a = a || {};
  return {
    body:   Math.min(2, Math.max(0, a.body != null ? a.body|0 : 1)),
    wear:   Math.min(31, Math.max(0, a.wear != null ? a.wear|0 : (a.outfit|0) % 32)),
    hair:   Math.min(11, Math.max(0, (a.hair|0) % 12)),
    hairC:  a.hairC  || "#3b3242",
    hairC2: a.hairC2 || null,
    skin:   a.skin   || "#f1cbab",
    col:    a.col    || null,                 /* null なら役職の色（opt.col）を使う */
    c2:     a.c2     || "#efe6da",
    accent: a.accent || "#f2a2b8",
    tint:   a.tint   || 1,
    pattern:Math.min(5, Math.max(0, a.pattern|0)),
    patC:   a.patC || null, patC2: a.patC2 || null,
    hat:    Math.min(2, Math.max(0, a.hat|0)),
    hatC:   a.hatC || "#4b3d52",
    glasses:a.glasses === true ? 1 : Math.min(2, Math.max(0, a.glasses|0)),
    head:   Math.min(16, Math.max(0, a.head|0)),   /* 0 は人間の頭 */
  };
}
/* 骨組み。肩の高さを決めれば、あとは全部そこからぶら下がる */
function pxRig(n){
  const B = PX_BODY[n.body];
  const sh = -36 - B.up;                      /* 肩の高さ */
  return { B, sh, head: sh - 10, R: 10, H: -(sh - 22) };
}
function pxHeight(a){ return pxRig(pxNorm(a)).H; }
