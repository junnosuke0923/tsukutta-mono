  if(!window.__catalog || !window.__catalog.dev) return;
  Object.assign(window.__catalog.dev, {
    sceneQ(){ return JSON.stringify(sceneQ); },
    sceneNext(){ return sceneOpen(); },
    cast(){ return JSON.stringify(storyFlag.cast || {}); },

    tick(){ onTick(); },

    names(){ return JSON.stringify(staff.map(s => s.name+"/"+s.role)); },
    quit(role){ staff = staff.filter(s => s.role !== role); },

}, 0);

/* ---- move の文から、効きめを決める ---- */
/* 返す：{ stat:{sense,tech,idea,comm}, stam, money, en, dist, chal, fame, size } */
function cEffect(move){
  const m = move || "";
  const big = /大きく/.test(m) ? 2 : 1;
  const e = { s:{}, stam:0, money:0, en:0, dist:0, chal:0, fame:0, size:big };
  if(/センス/.test(m)) e.s.sense = 2*big;
  if(/技術/.test(m)) e.s.tech = 2*big;
  if(/発想/.test(m)) e.s.idea = 2*big;
  if(/コミュ/.test(m)) e.s.comm = 2*big;
  if(/形|素材/.test(m)){ e.s.tech = (e.s.tech||0)+1; e.s.sense = (e.s.sense||0)+1; }
  if(/体力が戻る/.test(m)) e.stam = 8; else if(/体力が大きく減る/.test(m)) e.stam = -14; else if(/体力/.test(m)) e.stam = -4;
  if(/お金/.test(m)) e.money = -2500*big;
  if(/縁/.test(m)) e.en = 1;
  if(/距離|関係|人が増える/.test(m)) e.dist = 1;
  if(/挑戦|性格/.test(m)) e.chal = 1;
  if(/評判|評価/.test(m)) e.fame = 4*big;
  if(/進路/.test(m)) e.chal = 1;
  return e;
}

/* ---- 卒業後：本体の週のできごとに足す ---- */
/* 「現1年」＝働きだしてすぐ、「現2-3年」「現4-6年」＝そのあと。月（週）で from を切る。
   「独立」は独立の道を選んだ人だけ、「業界」「人生」「10年」はいつでも */
(function(){
  if(typeof EVENTS === "undefined") return;
  const FROM = { "現1年":0, "現2-3年":10, "現4-6年":22, "独立":4, "業界":3, "人生":3, "10年":36 };
  let i = 0;
  for(const c of CAT_AFTER){
    const id = "cat_" + (i++);
    const from = FROM[c.g] ?? 3;
    const ef = cEffect(c.move);
    EVENTS.push({ id, cat:"world", w: c.g === "業界" || c.g === "人生" ? 0.8 : 0.6, cool: 60, from,   /* 111件あるので1件は軽く。来客・依頼・季節を押しのけない */
      when(){ return c.g !== "独立" || (typeof alumni !== "undefined" && alumni && alumni.career === "indep"); },
      fire(){
        const opts = (c.opts && c.opts.length ? c.opts : ["そうする","やめておく"]).map((label, k) => ({
          label, pass: k > 0 && /やめ|見送|断|行かない|しない|帰る/.test(label),
          tip: k === 0 ? (c.move && c.move !== "—" ? c.move : "") : "",
          run(){
            if(k === 0){
              if(ef.fame) evFame(ef.fame);
              if(ef.money) money += ef.money * 2;
              if(ef.dist) evMorale(4);
              log("《"+c.title+"》"+label+"。" + (c.teach ? "── " + c.teach : ""));
            } else {
              if(ef.fame) evFame(-Math.round(ef.fame/2));
              log("《"+c.title+"》"+label+"。");
            }
          } }));
        evAsk({ key:id, cat:"world", icon:"", badge:c.g+"　—　"+c.where, who:c.where,
                title:c.title, text:c.lead, note:c.teach || c.know || "", opts });
      } });
  }
})();
/* ==================================================================
   16.8 できごとの進行係

   events.js に並べたできごとを、いつ・どの順で起こすかを決める。
   決めていることは3つ。

   1. 同じできごとが続けて出ない
      直近4件に出たものは選ばない。種別（来客・依頼・事件・季節・発表会）が
      続いたときは重みを落とす。一度出たら cool 週は戻ってこない。

   2. 起きたら、何をすればいいかが画面に残る
      通知だけで流れると、プレイヤーは何をしていいか分からない。
      できごとは必ず「札（evTasks）」を1枚残し、ジョブバーの下に出る。
      札には「何をすればいいか」の一文と、行き先へ飛ぶボタンが付く。
      決めない・行かないまま期限が来ると、その話は流れる（lapse）。

   3. 会話や発表のあいだは起こさない
      重なると、どれに答えているのか分からなくなる。その週は見送り、翌週に回す。

   【なぜ週の処理を包んでいるか】
   このできごと係は週に一度まわす必要があるが、週の処理（onMonth）は
   別の担当のファイルにある。分業のあいだ相手のファイルを触らずに済むよう、
   ここから包んで差し込んでいる。合流のときに1行の呼び出しへ直してよい。
   ================================================================== */

const YEAR_W = 52, SEASON_W = 13;
function seasonIdx(w){ return Math.floor(((((w||month)-1) % YEAR_W) + YEAR_W) % YEAR_W / SEASON_W); }
function seasonNow(){ return SEASONS[seasonIdx(month)]; }
function yearNo(){ return Math.floor((month-1)/YEAR_W) + 1; }

   いま入っているできごと類は中途半端なので、人に見せるあいだは伏せておき、
   「スタッフが働いて資金が貯まる」もとの姿だけを見せる。
   ファイルも仕組みも残してあるので、true に戻せば全部そのまま動く。

/* ---------- 小さな手 ---------- */
function evFame(n){ fame = Math.max(0, fame + n); }
function evMorale(n){ for(const s of staff) s.morale = Math.max(0, Math.min(100, s.morale + n)); }
function evMini(name, win, ok, ng){

function evGoTab(t){
  tab = t;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.t === t));
  closeSheet(); renderPane();
}
function evGoPlace(id){

}

/* ---------- 札 ---------- */
/* あとでやること。行き先へ飛ぶボタンが付く */
function evTodo(t){
  t.kind = "todo";
  if(!t.due) t.due = month + 3;
  evTasks = evTasks.filter(x => x.key !== t.key);
  evTasks.push(t);
  evPaint();
}
/* いま決めること。札から何度でも開き直せる */
function evAsk(a){
  const t = {
    key:a.key, kind:"ask", ask:a,
    title:a.title,
    hint:"返事を待っています。ボタンを押すと、決める画面に戻ります。",
    btn:"決める",
    due: month + (a.due || 3),
    act(){ evOpenAsk(t); },
    lapse(){
      const p = a.opts.find(o => o.pass) || a.opts[a.opts.length-1];
      if(p && p.run) p.run();
      log("「"+a.title+"」に返事をしないまま、話は流れた。", true);
    },
  };
  evTasks = evTasks.filter(x => x.key !== t.key);
  evTasks.push(t);
  log(a.title);
  toast((a.icon || "！") + " " + a.title);
  evOpenAsk(t);
  evPaint();
}
function evOpenAsk(t){
  const a = t.ask;
  const body = document.getElementById("sheetBody");
  body.innerHTML =
    '<span class="jbadge" style="background:'+(a.color || "#c94f79")+'">'+(a.badge || "できごと")+'</span>'+
    (a.who ? '<div class="jname">'+a.who+'</div>' : '')+
    '<div class="jlead">'+a.text+'</div>'+
    (a.note ? '<div class="jsec">これは、実際にはどういうことか</div>'+
              '<div class="jbody">'+a.note+'</div>' : '')+
    '<div class="jsec">どうしますか</div>'+
    a.opts.map((o,i)=>
      '<button class="btn'+(i===0?" p":"")+'" data-evo="'+i+'"'+
      ((o.cost && money < o.cost) ? " disabled" : "")+
      ' style="width:100%;margin-bottom:4px">'+o.label+'</button>'+
      (o.tip ? '<div style="font-size:10px;color:#8a6a80;line-height:1.5;margin:0 2px 9px">'+
               o.tip+'</div>' : '<div style="height:5px"></div>')).join("")+
    '<div class="rule"><b>返事は、あと '+Math.max(0, t.due - month)+' 週まで。</b>'+
      'すぎると、この話は流れます。閉じても、下の札から開き直せます。</div>';
  document.getElementById("sheet").classList.add("on");
  body.querySelectorAll("[data-evo]").forEach(b => b.onclick = ()=>{
    if(evTasks.indexOf(t) < 0) return;          /* もう片づいた話を二度押ししない */
    const o = a.opts[+b.dataset.evo];
    if(o.cost){
      if(money < o.cost){ toast("資金が足りません"); return; }
      money -= o.cost;
    }
    if(o.run && o.run() === false) return;
    evTasks = evTasks.filter(x => x !== t);
    closeSheet(); evPaint(); renderPane(); renderHUD();
  });
}
/* 別注として届くもの。「別注」タブへ連れていく札が付く */
function evOffer(o){
  const off = { id:(++seq), client:o.client, theme:o.theme, need:o.need,
                days:o.days, reward:o.reward, born:dayNo() };
  offers.push(off);
  evTodo({
    key:"offer"+off.id,
    title:"《"+o.theme+"》の別注が届いている",
    hint:"「別注」タブで、受けるか断るかを決めます。報酬 "+yen(o.reward)+
         "／納期 "+o.days+"週／"+STATJP[o.need]+"が要ります。",
    btn:"別注を見る",
    due: month + Math.min(3, o.keep || 3),
    act(){ evGoTab("offer"); },
    done(){ return !offers.some(x => x.id === off.id); },
    lapse(){
      offers = offers.filter(x => x.id !== off.id);
      log("《"+o.theme+"》の話は、返事がないまま流れた。", true);
    },
  });
  return off;
}

'</style>');
const evBarEl = document.createElement("div");
evBarEl.id = "evBar";
document.querySelector(".jobbar").insertAdjacentElement("afterend", evBarEl);

let evSign = "";
function evPaint(){
  const top = evTasks.slice().sort((a,b)=>a.due-b.due)[0];
  const sign = top ? top.key+"|"+top.due+"|"+month+"|"+evTasks.length : "none";
  if(sign === evSign) return;
  evSign = sign;
  if(!top){ evBarEl.className = ""; evBarEl.innerHTML = ""; return; }
  const left = Math.max(0, top.due - month);
  evBarEl.className = "on";
  evBarEl.innerHTML =
    '<div class="evb'+(left <= 1 ? " hot" : "")+'"><div class="evb-r"><div class="evb-x">'+
    '<div class="evb-t">📌 '+top.title+
      '　<span style="color:#c0537c">あと'+left+'週</span></div>'+
    '<div class="evb-d">'+top.hint+'</div></div>'+
    '<button class="evb-b" id="evGo">'+(top.btn || "見る")+'</button></div>'+
    (evTasks.length > 1
      ? '<div class="evb-m">ほかに '+(evTasks.length-1)+' 件、返事を待っています</div>' : '')+
    '</div>';
  document.getElementById("evGo").onclick = ()=> top.act();
}
/* 片づいた札は、週をまたがなくても消す（受けた瞬間に消えてほしいので） */
function evSweep(){
  const n = evTasks.length;
  evTasks = evTasks.filter(t => !(t.done && t.done()));
  if(evTasks.length !== n) evSign = "";
  evPaint();
}

/* ---------- 抽選 ---------- */
/* 会話・発表・針しごと・カプセル・相談が出ているあいだは重ねない */
function evReady(){
  return !party && !sty && !visitor && !mini && !gc && !ev && !pendingEvent;
}
/* 出せる状態にあるか。季節・時期・間合い・状況をまとめて見る */
function evOK(e){
  const w = month;
  if(e.season != null && e.season !== seasonIdx(w)) return false;
  if(w < (e.from || 0)) return false;
  if(evRecent.indexOf(e.id) >= 0) return false;               /* 直近に出たものは選ばない */
  if(evAt[e.id] != null && w - evAt[e.id] < (e.cool || 12)) return false;
  if(e.when && !e.when()) return false;
  return true;
}
/* 逃すと困るもの（発表会の下見など）は、抽選を待たずに出す */
function evMust(){ return EVENTS.find(e => e.must && evOK(e)) || null; }

function evPick(){
  const w = month, list = [];
  for(const e of EVENTS){
    if(!evOK(e)) continue;
    let wt = e.w || 1;
    const c = evCatAt[e.cat];
    /* 同じ種別が続くのを抑え、長く出ていない種別は出やすくする。
       これが無いと、数の多い「事件」ばかりが並び、季節が一年に一度も来ない */
    const d = c == null ? 99 : w - c;
    if(d <= 1) wt *= 0.22;
    else if(d <= 3) wt *= 0.55;
    else if(d >= 10) wt *= 2.4;
    else if(d >= 6) wt *= 1.5;
    if(wt > 0.001) list.push({ e, wt });
  }
  if(!list.length) return null;
  let total = 0; for(const c of list) total += c.wt;
  let r = Math.random()*total;
  for(const c of list){ r -= c.wt; if(r <= 0) return c.e; }
  return list[list.length-1].e;
}
function evFire(e){
  evAt[e.id] = month; evCatAt[e.cat] = month;
  evRecent.unshift(e.id);
  if(evRecent.length > 4) evRecent.pop();
  evHist.push({ w:month, id:e.id, cat:e.cat });
  evNext = month + (e.gap || 2);
  e.fire();
  evPaint();
}

/* ---------- 季節の変わり目 ---------- */
function evSeasonTick(){
  const i = seasonIdx(month);
  if(i === evSeasonSeen) return;
  evSeasonSeen = i;
  const S = SEASONS[i];
  log(S.n+"になった。"+S.note);
  toast(S.icon+" "+S.n+"　—　"+S.short);
}

/* ---------- 週に一度 ---------- */
function evWeek(){
  /* 期限の来た札を始末する */
  const keep = [];
  for(const t of evTasks){
    if(t.done && t.done()) continue;
    if(month >= t.due){ if(t.lapse) t.lapse(); continue; }
    keep.push(t);
  }
  if(keep.length !== evTasks.length) evSign = "";
  evTasks = keep;

  /* スイッチが切れているあいだは、札の始末だけして抽選はしない */
  if(!evEnabled){ evPaint(); return; }

  evSeasonTick();
  if(evReady()){
    const m = evMust();
    if(m) evFire(m);
    else if(month >= evNext){
      const e = evPick();
      if(e) evFire(e);
      else evNext = month + 1;    /* 出せるものが無い週は、翌週にもう一度見る */
    }
  }
  evPaint();
}

/* ---------- 差し込み ---------- */
const evBaseWeek = onMonth, evBaseHUD = renderHUD;
onMonth   = function(){ evBaseWeek(); evWeek(); };

    evTasks(){ return JSON.stringify(evTasks.map(t=>({ key:t.key, kind:t.kind,

    evBar(){ const b = document.getElementById("evBar");
      return JSON.stringify({ on:b.className === "on", text:b.textContent }); },
    /* 何週ぶんかを一気にまわす。発表の演出は待っていられないので飛ばす
       （ふだんの遊びでは、演出が終わるまで週が進まない） */
    evYear(n){
      for(let i = 0; i < (n || YEAR_W); i++){
        month++; onMonth();
        party = null; confetti = [];
      }
      return JSON.stringify(evHist);
    },
    evFireNow(id){ const e = EVENTS.find(x => x.id === id); if(!e) return "ない";
      evFire(e); return "ok"; },
    evSeason(){ return seasonNow().n; },
    evOn(v){ evEnabled = v !== false; return evEnabled ? "on" : "off"; },
  });
});
/* ==================================================================
   16.7 ミニゲーム
   洋裁の手わざを、指1本の遊びにする。
   ストーリーから呼ばれることも、「針しごと」から遊ぶこともある。
   ================================================================== */
let mini = null;
const mnCvEl = document.getElementById("mnCv");
const mnCtx  = mnCvEl.getContext("2d");
(function(){ const d = Math.min(2, window.devicePixelRatio||1);
  mnCvEl.width = OVW*d; mnCvEl.height = OVH*d; mnCtx.setTransform(d,0,0,d,0,0); })();

function miniStart(name, onEnd){
  mini = MINIS[name].init();
  mini.name = name; mini.onEnd = onEnd || null; mini.t = 0; mini.press = false;
  document.getElementById("mnTitle").textContent = MINIS[name].title;
  document.getElementById("mnHint").textContent  = MINIS[name].hint;
  document.getElementById("mini").classList.add("on");
}
function miniEnd(score){
  document.getElementById("mini").classList.remove("on");
  const f = mini && mini.onEnd; mini = null;
  if(f) f(score); else freeMiniReward(score);
}
function freeMiniReward(score){
  if(score > 0){
    const got = score + (score >= 3 ? 1 : 0);
    buttons += got;
    for(const s of staff) s.morale = Math.min(100, s.morale + 2);
    log("針しごとで手を動かした。ボタン +"+got);
    toast("🧵 ボタンを "+got+"つ手に入れた（いま "+buttons+"つ）");
  } else {
    toast("うまくいかなかった…また今度");
  }
  renderPane(); renderHUD();
}
miniTickFn = function(dt){
  if(!mini) return false;
  mini.t += dt;
  MINIS[mini.name].tick(mini, dt);
  if(!mini) return true;                     /* tick の中で終わることがある */
  mnCtx.clearRect(0, 0, OVW, OVH);
  MINIS[mini.name].draw(mini, mnCtx);
  return true;
};
mnCvEl.addEventListener("pointerdown", e => {
  e.preventDefault();
  if(!mini) return;
  mini.press = true;

});
mnCvEl.addEventListener("pointermove", e => {
  if(!mini) return;
  const r = mnCvEl.getBoundingClientRect();
  mini.px = (e.clientX - r.left) / r.width  * OVW;
  mini.py = (e.clientY - r.top)  / r.height * OVH;
});

addEventListener("pointercancel", () => { if(mini) mini.press = false; });
document.getElementById("mnQuit").onclick = () => { if(mini) miniEnd(0); };

/* 布地。どちらのゲームでも下地に使う */
function miniCloth(g, col1, col2, oy){
  const gr = g.createLinearGradient(0, 0, 0, OVH);
  gr.addColorStop(0, col1); gr.addColorStop(1, col2);
  g.fillStyle = gr; g.fillRect(0, 0, OVW, OVH);
  g.strokeStyle = "rgba(255,255,255,.045)"; g.lineWidth = 1;
  for(let i = -1; i < 30; i++){
    const y = ((i*32 + (oy||0)) % (OVH+64)) - 32;
    g.beginPath(); g.moveTo(0, y); g.lineTo(OVW, y + 14); g.stroke();
  }
}

const MINIS = {

/* ---------- 糸通し。針がゆれる。真下に来た瞬間にタップ ---------- */
needle: {
  title:"糸通し",
  hint:"針は左右にゆれる。糸の真上に穴が来た瞬間にタップ！\n細い針ほど、むずかしい。ぜんぶで3本。",
  init(){ return { r:0, hits:0, res:[], ph:"aim", pt:0, eyeX:OVW/2,
                   fly:0, msg:"一本目：ふつうの針", msgT:1.6 }; },
  tol(r){ return [15, 10, 6.5][r]; },
  spd(r){ return [1.25, 1.85, 2.5][r]; },
  tick(m, dt){
    m.pt += dt;
    if(m.msgT > 0) m.msgT -= dt;
    if(m.ph === "aim"){
      const w = this.spd(m.r);
      m.eyeX = OVW/2 + 88*Math.sin(m.pt*w) + 30*Math.sin(m.pt*w*1.63 + 1.3);
    }
    if(m.ph === "fly"){
      m.fly += dt*3.4;
      if(m.fly >= 1){
        const hit = Math.abs(m.hitX - OVW/2) <= this.tol(m.r);
        if(hit) m.hits++;
        m.res.push(hit);
        m.ph = hit ? "hit" : "miss"; m.pt = 0;
      }
    } else if(m.ph === "hit" || m.ph === "miss"){
      if(m.pt > 0.9){
        m.r++;
        if(m.r >= 3){ m.ph = "done"; m.pt = 0; }
        else {
          m.ph = "aim"; m.pt = 0; m.fly = 0;
          m.msg = ["", "二本目：細い針", "三本目：極細！"][m.r]; m.msgT = 1.6;
        }
      }
    } else if(m.ph === "done"){
      if(m.pt > 1.6) miniEnd(m.hits);
    }
  },
  tap(m){ if(m.ph === "aim"){ m.ph = "fly"; m.fly = 0; m.hitX = m.eyeX; } },
  draw(m, g){
    miniCloth(g, "#2c2136", "#4a3550", 0);
    const cx = OVW/2, eyeY = 320, tipY0 = 560;

    /* 進みの玉 */
    for(let i = 0; i < 3; i++){
      g.beginPath(); g.arc(cx - 44 + i*44, 96, 10, 0, 6.2832);
      g.fillStyle = i < m.res.length
        ? (m.res[i] ? "#7ade9a" : "#e06a80") : "rgba(255,255,255,.16)";
      g.fill();
    }

    /* 糸まき。下にどっしり */
    g.fillStyle = "#8a6a4a";
    g.fillRect(cx - 34, 640, 68, 76);
    g.fillStyle = "#a8845c";
    g.beginPath(); g.ellipse(cx, 640, 40, 12, 0, 0, 6.2832); g.fill();
    g.beginPath(); g.ellipse(cx, 716, 40, 12, 0, 0, 6.2832); g.fill();
    g.fillStyle = "#c9485e";
    g.fillRect(cx - 30, 652, 60, 52);
    g.strokeStyle = "rgba(255,255,255,.14)"; g.lineWidth = 2;
    for(let i = 0; i < 5; i++)
      { g.beginPath(); g.moveTo(cx-30, 658+i*10); g.lineTo(cx+30, 660+i*10); g.stroke(); }

    /* 糸。まき から 先端へ */
    const prog = m.ph === "fly" ? Math.min(1, m.fly)
               : (m.ph === "hit" ? 1 : 0);
    const tipY = tipY0 - prog*(tipY0 - eyeY + (m.ph === "hit" ? 44 : 0));
    const sway = (m.ph === "aim") ? Math.sin(m.pt*2.1)*10 : 0;
    g.strokeStyle = "#e8506a"; g.lineWidth = 3.4; g.lineCap = "round";
    g.beginPath();
    g.moveTo(cx, 648);
    g.quadraticCurveTo(cx + 26 + sway, (648+tipY)/2 + 40, cx + sway*0.4, tipY + 26);
    g.lineTo(cx, tipY);
    g.stroke();
    if(m.ph === "miss"){                     /* はじかれて、くたっ */
      g.beginPath();
      g.moveTo(cx, eyeY + 60);
      g.quadraticCurveTo(cx + 30, eyeY + 40, cx + 44, eyeY + 78);
      g.stroke();
    }
    /* 糸先 */
    g.fillStyle = "#e8506a";
    g.beginPath(); g.arc(cx, tipY, 4, 0, 6.2832); g.fill();

    /* 針。ゆれる。穴の位置がすべて */
    const nx = m.eyeX;
    const grad = g.createLinearGradient(nx-8, 0, nx+8, 0);
    grad.addColorStop(0, "#b9c2cc"); grad.addColorStop(0.45, "#eef3f7");
    grad.addColorStop(1, "#98a2ae");
    g.fillStyle = grad;
    g.beginPath();                            /* 上が頭、下がとがった先 */
    g.moveTo(nx - 7, eyeY - 78);
    g.quadraticCurveTo(nx, eyeY - 96, nx + 7, eyeY - 78);
    g.lineTo(nx + 4.2, eyeY + 60);
    g.lineTo(nx, eyeY + 118);
    g.lineTo(nx - 4.2, eyeY + 60);
    g.closePath(); g.fill();
    /* 穴。ここを糸が通る */
    const tol = this.tol(m.r);
    g.fillStyle = "#241b2e";
    g.beginPath(); g.ellipse(nx, eyeY - 40, Math.max(3.4, tol*0.42), 26, 0, 0, 6.2832); g.fill();
    g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 1.4;
    g.beginPath(); g.ellipse(nx, eyeY - 40, Math.max(3.4, tol*0.42), 26, 0, 0, 6.2832); g.stroke();

    /* 通った糸 */
    if(m.ph === "hit"){
      g.strokeStyle = "#e8506a"; g.lineWidth = 3.4;
      g.beginPath();
      g.moveTo(cx, eyeY - 30);
      g.quadraticCurveTo(nx, eyeY - 66, nx + 30, eyeY - 96);
      g.quadraticCurveTo(nx + 52, eyeY - 118, nx + 40, eyeY - 140);
      g.stroke();
      for(let i = 0; i < 5; i++){             /* きらきら */
        const a2 = m.pt*3 + i*1.26, rr = 26 + m.pt*30;
        const sx = nx + Math.cos(a2)*rr, sy2 = eyeY - 44 + Math.sin(a2)*rr*0.7;
        g.fillStyle = "rgba(255,226,130,"+Math.max(0, 0.9-m.pt)+")";
        g.beginPath(); g.arc(sx, sy2, 2.4, 0, 6.2832); g.fill();
      }
    }

    /* ことば */
    g.textAlign = "center";
    if(m.msgT > 0 && (m.ph === "aim" || m.ph === "fly")){
      g.fillStyle = "rgba(253,246,236,"+Math.min(1, m.msgT)+")";
      g.font = "800 21px sans-serif";
      g.fillText(m.msg, cx, 176);
    }
    if(m.ph === "hit"){ g.fillStyle = "#a8e8bc"; g.font = "800 26px sans-serif";
      g.fillText("通った！", cx, 176); }
    if(m.ph === "miss"){ g.fillStyle = "#f0a0b2"; g.font = "800 26px sans-serif";
      g.fillText("はずれた…", cx, 176); }
    if(m.ph === "done"){
      g.fillStyle = "#fdf6ec"; g.font = "800 30px sans-serif";
      g.fillText(m.hits+"本 通った！", cx, 300);
      g.font = "800 40px sans-serif";
      g.fillText("★".repeat(m.hits) + "☆".repeat(3-m.hits), cx, 360);
    }
  },
},

/* ---------- まっすぐ縫い。チャコの線を追いかける ---------- */
seam: {
  title:"まっすぐ縫い",
  hint:"押しているあいだ、針は右へ。はなすと左へ。\nチャコの線の上を縫おう。",
  init(){
    return { time:13, y:0, nx:OVW/2, err:0, n:0, st:[], stAt:0,
             p1:Math.random()*6.28, p2:Math.random()*6.28, done:false, doneT:0,
             warm:1.2 };
  },
  pathX(m, wy){
    return OVW/2 + 62*Math.sin(wy*0.0085 + m.p1) + 34*Math.sin(wy*0.021 + m.p2);
  },
  tick(m, dt){
    const NY = 380;
    if(m.done){
      m.doneT += dt;
      if(m.doneT > 1.8){
        const avg = m.err / Math.max(1, m.n);
        miniEnd(avg <= 11 ? 3 : avg <= 19 ? 2 : avg <= 30 ? 1 : 0);
      }
      return;
    }
    if(m.warm > 0){ m.warm -= dt; return; }   /* かまえる時間 */
    m.time -= dt;
    const v = 165*dt;
    m.nx = Math.max(40, Math.min(OVW-40, m.nx + (m.press ? v : -v)));
    m.y += 130*dt;
    const w = m.y + NY;
    const px = this.pathX(m, w);
    m.err += Math.abs(m.nx - px); m.n++;
    if(w - m.stAt > 13){ m.stAt = w; m.st.push({ w, x:m.nx });
      if(m.st.length > 90) m.st.shift(); }
    if(m.time <= 0){ m.done = true; m.doneT = 0; }
  },
  draw(m, g){
    const NY = 380;
    miniCloth(g, "#39445e", "#526180", m.y*0.35);

    /* チャコの線 */
    g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = 2.6;
    g.setLineDash([9, 8]);
    g.beginPath();
    for(let sy = -10; sy <= OVH+10; sy += 8){
      const x = this.pathX(m, m.y + sy);
      if(sy === -10) g.moveTo(x, sy); else g.lineTo(x, sy);
    }
    g.stroke();
    g.setLineDash([]);

    /* 縫い目。過ぎたところに残る */
    g.strokeStyle = "#e8506a"; g.lineWidth = 3.2; g.lineCap = "round";
    for(const s2 of m.st){
      const sy = s2.w - m.y;
      if(sy < -8 || sy > OVH+8) continue;
      g.beginPath(); g.moveTo(s2.x, sy - 4); g.lineTo(s2.x, sy + 4); g.stroke();
    }

    /* おさえがねと針 */
    g.fillStyle = "rgba(20,14,26,.28)";
    g.beginPath(); g.ellipse(m.nx, NY+16, 26, 8, 0, 0, 6.2832); g.fill();
    const grad = g.createLinearGradient(m.nx-16, 0, m.nx+16, 0);
    grad.addColorStop(0, "#aab4bf"); grad.addColorStop(0.5, "#e8eef4");
    grad.addColorStop(1, "#8c96a2");
    g.fillStyle = grad;
    g.beginPath();                             /* おさえがね（フォークの形） */
    g.moveTo(m.nx - 16, NY - 4); g.lineTo(m.nx + 16, NY - 4);
    g.lineTo(m.nx + 12, NY + 14); g.lineTo(m.nx + 4, NY + 14);
    g.lineTo(m.nx + 4, NY + 2);  g.lineTo(m.nx - 4, NY + 2);
    g.lineTo(m.nx - 4, NY + 14); g.lineTo(m.nx - 12, NY + 14);
    g.closePath(); g.fill();
    g.fillStyle = "#5a636e";                   /* 針棒 */
    g.fillRect(m.nx - 2.4, NY - 58, 4.8, 54);
    g.fillStyle = "#eef3f7";
    g.fillRect(m.nx - 1.2, NY - 12, 2.4, 16);

    /* 残り時間 */
    g.fillStyle = "rgba(255,255,255,.16)";
    g.fillRect(40, 120, OVW-80, 8);
    g.fillStyle = "#ffd98a";
    g.fillRect(40, 120, (OVW-80)*Math.max(0, m.time)/13, 8);

    g.textAlign = "center";
    if(m.warm > 0 && !m.done){
      g.fillStyle = "#fdf6ec"; g.font = "800 24px sans-serif";
      g.fillText("線の上を、まっすぐ", OVW/2, 200);
    }
    if(m.done){
      const avg = m.err / Math.max(1, m.n);
      const sc = avg <= 11 ? 3 : avg <= 19 ? 2 : avg <= 30 ? 1 : 0;
      g.fillStyle = "#fdf6ec"; g.font = "800 30px sans-serif";
      g.fillText(sc >= 3 ? "みごとな縫い目！" : sc >= 2 ? "いい縫い目" :
                 sc >= 1 ? "まずまず" : "線はどこへ…", OVW/2, 290);
      g.font = "800 40px sans-serif";
      g.fillText("★".repeat(sc) + "☆".repeat(3-sc), OVW/2, 348);
      g.font = "700 14px sans-serif"; g.fillStyle = "rgba(253,246,236,.7)";
      g.fillText("線からのずれ　平均 "+avg.toFixed(0)+"px", OVW/2, 390);
    }
  },
},

/* ---------- 裁断。カッティングマットの上、線に沿って指をすべらせる ---------- */

      if(m.doneT > 1.8){
        const avg = m.n > 0 ? m.err / m.n : Infinity;
        miniEnd(m.n < 8 ? 0 : avg <= 15 ? 3 : avg <= 26 ? 2 : avg <= 40 ? 1 : 0);
      }
      return;
    }
    if(m.warm > 0){ m.warm -= dt; return; }
    m.time += dt;
    if(m.press && m.py != null){
      const ty = Math.max(this.TOP, Math.min(this.BOT, m.py));
      let y = m.cutY;
      while(y < ty){
        y = Math.min(ty, y + 6);
        const tx = this.pathX(m, y);
        m.err += Math.abs((m.px != null ? m.px : tx) - tx);
        m.n++;
      }
      m.cutY = ty;
    }
    if(m.cutY >= this.BOT - 18 || m.time > 15){ m.done = true; m.doneT = 0; }
  },
  draw(m, g){
    /* 自己修復マット。緑の下地に方眼、端にオレンジの目盛り */
    g.fillStyle = "#33523f"; g.fillRect(0, 0, OVW, OVH);
    g.strokeStyle = "rgba(255,255,255,.07)"; g.lineWidth = 1;
    for(let x = 0; x <= OVW; x += 26){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, OVH); g.stroke(); }
    for(let y = 0; y <= OVH; y += 26){ g.beginPath(); g.moveTo(0, y); g.lineTo(OVW, y); g.stroke(); }
    g.strokeStyle = "rgba(255,205,110,.5)"; g.lineWidth = 1;
    for(let x = 0; x <= OVW; x += 130){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 10); g.stroke(); }

    /* 裁ちの線。チャコ */
    g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = 2.4;
    g.setLineDash([8, 7]);
    g.beginPath();
    for(let y = this.TOP; y <= this.BOT; y += 6){
      const x = this.pathX(m, y);
      if(y === this.TOP) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke(); g.setLineDash([]);

    /* 切り終えた側。線の左をわずかにどけて、割れた感じ */
    g.save();
    g.beginPath();
    g.rect(0, this.TOP, OVW, Math.max(0, m.cutY - this.TOP));
    g.clip();
    g.fillStyle = "rgba(0,0,0,.16)";
    for(let y = this.TOP; y <= m.cutY; y += 6){
      const x = this.pathX(m, y);
      g.fillRect(x - 14, y, 8, 7);
    }
    g.restore();

    /* ハサミ。指の位置に追従 */
    const hx = m.px != null ? m.px : this.pathX(m, m.cutY), hy = m.py != null ? m.py : m.cutY;
    g.strokeStyle = "#e8eef4"; g.lineWidth = 3.2; g.lineCap = "round";
    g.beginPath(); g.moveTo(hx - 12, hy - 16); g.lineTo(hx + 3, hy + 3); g.stroke();
    g.beginPath(); g.moveTo(hx + 12, hy - 16); g.lineTo(hx - 3, hy + 3); g.stroke();
    g.fillStyle = "#ffd98a";
    g.beginPath(); g.arc(hx - 9, hy - 20, 5, 0, 6.2832); g.fill();
    g.beginPath(); g.arc(hx + 9, hy - 20, 5, 0, 6.2832); g.fill();

    /* 進み具合 */
    g.fillStyle = "rgba(255,255,255,.16)";
    g.fillRect(40, 120, OVW-80, 8);
    g.fillStyle = "#ffd98a";
    g.fillRect(40, 120, (OVW-80)*Math.max(0, m.cutY - this.TOP)/(this.BOT - this.TOP), 8);

    g.textAlign = "center";
    if(m.warm > 0 && !m.done){
      g.fillStyle = "#fdf6ec"; g.font = "800 22px sans-serif";
      g.fillText("線を、指でなぞって", OVW/2, 200);
    }
    if(m.done){
      const avg = m.n > 0 ? m.err / m.n : Infinity;
      const sc = m.n < 8 ? 0 : (avg <= 15 ? 3 : avg <= 26 ? 2 : avg <= 40 ? 1 : 0);
      g.fillStyle = "#fdf6ec"; g.font = "800 30px sans-serif";
      g.fillText(sc >= 3 ? "きれいな裁ち目！" : sc >= 2 ? "いい裁ち目" :
                 sc >= 1 ? "まずまず" : "線からそれた…", OVW/2, 300);
      g.font = "800 40px sans-serif";
      g.fillText("★".repeat(sc) + "☆".repeat(3-sc), OVW/2, 360);
    }
  },
},
};

function updGcHud(){
  document.getElementById("gcBtns").textContent = buttons;
  document.getElementById("gcPull").disabled =
    buttons < 3 || !gc || (gc.ph !== "idle" && gc.ph !== "reveal");
}
function rollRarity(force){
  if(force != null) return force;
  const x = Math.random();
  return x < 0.02 ? 3 : x < 0.11 ? 2 : x < 0.38 ? 1 : 0;
}
function doPull(force){
  if(!gc || (gc.ph !== "idle" && gc.ph !== "reveal")) return null;
  if(buttons < 3){ toast("ボタンが足りません（3ついる）"); return null; }
  buttons -= 3;
  const r = rollRarity(force);
  gc.prize = { rar:r, def:pick(GPOOL[r]) };
  gc.ph = "crank"; gc.t = 0;
  gc.col = r === 3 ? "#f4c84a"
         : pick(["#e88aa0","#8ad0b8","#9db8e8","#f2c569","#c9a7e0"]);
  document.getElementById("gcCard").classList.remove("on");
  updGcHud();
  return gc.prize.def.n;
}
function gcReveal(){
  const p = gc.prize, R = RARS[p.rar];
  const desc = p.def.f();
  charms.unshift({ name:p.def.n, rar:p.rar, week:dayNo(), perm:p.def.perm||null });
  if(charms.length > 40) charms.pop();
  const cd = document.getElementById("gcCard");
  cd.innerHTML =
    '<span class="rr" style="background:'+R.col+'">'+R.k+'　'+R.jp+'</span>'+
    '<div class="nm2">'+p.def.n+'</div><div class="ds">'+desc+'</div>';
  cd.classList.add("on");
  log("カプセルから《"+p.def.n+"》（"+R.k+"）が出た。");
  renderGcList(); updGcHud();
}

      }).join("")
    : '<div style="opacity:.6">まだ何も出ていない。ボタン3つで、ひとまわし。</div>';
}

gachaTickFn = function(dt){
  if(!gc) return false;
  gc.t += dt;
  if(gc.ph === "crank" && gc.t > 0.9){ gc.ph = "drop"; gc.t = 0; gc.capY = 0; gc.capV = 0; }
  else if(gc.ph === "drop"){
    gc.capV += 980*dt; gc.capY += gc.capV*dt;
    const floor2 = 205;
    if(gc.capY >= floor2){
      gc.capY = floor2;
      if(Math.abs(gc.capV) > 150) gc.capV = -gc.capV*0.42;
      else if(gc.t > 1.15){ gc.ph = "burst"; gc.t = 0; }
      else gc.capV = 0;
    }
  }
  else if(gc.ph === "burst" && gc.t > 0.5){ gc.ph = "reveal"; gc.t = 0; gcReveal(); }
  drawGachaOv();
  return true;
};

function drawGachaOv(){
  const g = gcCtx, t = gc.t;
  g.clearRect(0, 0, OVW, OVH);
  const gr = g.createLinearGradient(0, 0, 0, OVH);
  gr.addColorStop(0, "#251a2e"); gr.addColorStop(1, "#3e2b42");
  g.fillStyle = gr; g.fillRect(0, 0, OVW, OVH);

  const mx = OVW/2, my = 330;                 /* マシンの中心まわり */
  const isSSR = gc.prize && gc.prize.rar === 3;

  /* でんせつの光 */
  if(gc.ph === "reveal" && isSSR){
    g.save(); g.translate(mx, 420);
    for(let i = 0; i < 12; i++){
      g.rotate(Math.PI/6);
      const a = 0.16 + 0.08*Math.sin(t*3 + i);
      g.fillStyle = "rgba(244,200,74,"+a+")";
      g.beginPath();
      g.moveTo(0, 0); g.lineTo(-34, -560); g.lineTo(34, -560);
      g.closePath(); g.fill();
    }
    g.restore();
  }

  const shake = gc.ph === "crank" ? Math.sin(t*46)*2.4 : 0;

  /* 台とマシン（正面から） */
  g.fillStyle = "rgba(0,0,0,.3)";
  g.beginPath(); g.ellipse(mx, 596, 130, 20, 0, 0, 6.2832); g.fill();
  g.fillStyle = "#7e3640";
  g.beginPath(); g.roundRect(mx-96+shake, 470, 192, 116, 12); g.fill();
  g.fillStyle = "#d9505e";
  g.beginPath(); g.roundRect(mx-104+shake, my-36, 208, 250, 18); g.fill();
  g.fillStyle = "#b23c4c";
  g.beginPath(); g.roundRect(mx-84+shake, my+64, 168, 118, 10); g.fill();

  /* ドームと中のカプセル */
  g.fillStyle = "#8a3040";
  g.beginPath(); g.ellipse(mx+shake, my-30, 108, 22, 0, 0, 6.2832); g.fill();
  g.fillStyle = "rgba(232,246,255,.17)";
  g.beginPath(); g.arc(mx+shake, my-52, 96, Math.PI, 0); g.lineTo(mx+96+shake, my-30);
  g.arc(mx+shake, my-30, 96, 0, Math.PI, true); g.closePath(); g.fill();
  const CC = ["#e88aa0","#8ad0b8","#9db8e8","#f2c569","#c9a7e0","#e8985a","#98d0e8"];
  for(let i = 0; i < 7; i++){
    const a = i*0.9 + 0.4;
    const px = mx + shake + Math.cos(a)*(26 + (i%3)*22);
    const py = my - 48 - Math.abs(Math.sin(a))*34 + Math.sin(t*2 + i)*2 + (i%2)*16;
    g.fillStyle = CC[i];
    g.beginPath(); g.arc(px, py, 19, 0, 6.2832); g.fill();
    g.fillStyle = "rgba(255,255,255,.5)";
    g.beginPath(); g.arc(px, py, 19, Math.PI, 0); g.closePath(); g.fill();
    g.fillStyle = "rgba(255,255,255,.85)";
    g.beginPath(); g.arc(px-6, py-7, 5, 0, 6.2832); g.fill();
  }
  g.strokeStyle = "rgba(255,255,255,.4)"; g.lineWidth = 3;
  g.beginPath(); g.arc(mx+shake, my-44, 97, Math.PI*1.05, Math.PI*1.6); g.stroke();

  /* ハンドル。まわすとまわる */
  const crank = gc.ph === "crank" ? t*9 : 0;
  g.fillStyle = "#ece5d2";
  g.beginPath(); g.arc(mx+shake, my+122, 30, 0, 6.2832); g.fill();
  g.strokeStyle = "#8a3040"; g.lineWidth = 10; g.lineCap = "round";
  g.save(); g.translate(mx+shake, my+122); g.rotate(crank);
  g.beginPath(); g.moveTo(-20, 0); g.lineTo(20, 0); g.stroke();
  g.restore();
  g.fillStyle = "#8a3040";
  g.beginPath(); g.arc(mx+shake, my+122, 6, 0, 6.2832); g.fill();

  /* 取り出し口 */
  g.fillStyle = "#3a2028";
  g.beginPath(); g.roundRect(mx-40+shake, my+164, 80, 44, 8); g.fill();

  /* 落ちてくるカプセル */
  if(gc.ph === "drop" || gc.ph === "burst"){
    const cy = my + 186 - 205 + Math.min(205, gc.capY);
    const sep = gc.ph === "burst" ? t*140 : 0;
    const rot = gc.ph === "burst" ? t*3 : gc.capY*0.02;
    if(gc.ph === "burst"){                    /* ひらいた瞬間の光 */
      const a = Math.max(0, 0.85 - t*1.7);
      g.fillStyle = "rgba(255,244,214,"+a+")";
      g.fillRect(0, 0, OVW, OVH);
      for(let i = 0; i < 10; i++){
        const a2 = i*0.628 + 0.3, rr = 30 + t*260;
        g.fillStyle = "rgba(255,226,130,"+Math.max(0, 0.9 - t*1.8)+")";
        g.beginPath();
        g.arc(mx + Math.cos(a2)*rr, cy + Math.sin(a2)*rr*0.8, 5, 0, 6.2832);
        g.fill();
      }
    }
    g.save(); g.translate(mx, cy);
    g.save(); g.translate(-sep*0.4, -sep); g.rotate(-rot);
    g.fillStyle = "rgba(255,255,255,.92)";    /* 上半分 */
    g.beginPath(); g.arc(0, 0, 26, Math.PI, 0); g.closePath(); g.fill();
    g.restore();
    g.save(); g.translate(sep*0.4, sep*0.6); g.rotate(rot);
    g.fillStyle = gc.col;                     /* 下半分 */
    g.beginPath(); g.arc(0, 0, 26, 0, Math.PI); g.closePath(); g.fill();
    g.restore();
    g.restore();
  }

  /* ことば */
  g.textAlign = "center";
  if(gc.ph === "idle"){
    g.fillStyle = "rgba(253,246,236,.85)"; g.font = "800 17px sans-serif";
    g.fillText(buttons >= 3 ? "ボタン3つで、なにかが出る" : "ボタンが足りない。服を仕上げて貯めよう",
               mx, 168);
  }
  if(gc.ph === "crank"){
    g.fillStyle = "#fdf6ec"; g.font = "800 21px sans-serif";
    g.fillText("ガリ…ガリ…", mx, 168);
  }
}

    evInfo(){ return ev ? JSON.stringify({ type:ev.type, who:ev.s.name, opts:ev.opts.map(o=>o.label) }) : null; },
    peInfo(){ return pendingEvent ? JSON.stringify({ place:pendingEvent.p.id,
      a:pendingEvent.E.a.label, aCost:pendingEvent.E.a.cost||0, b:pendingEvent.E.b.label }) : null; },
    stId(){ return sty ? sty.id : null; },

    /* ---- 操作（画面のボタンと同じことをする） ---- */
    restart(){ reset(); },
    unlock(v){ unlockAll = !!v; renderPane(); },
    accept(id){ accept(id); }, decline(id){ decline(id); },

    fireS(id){ fire(id); }, raise(id){ raise(id); },
    act(pid, idx){ doAct(pid, idx); },
    toShop(){ toShop(); }, startLot(i, n){ startLot(i, n); },

    tapVisitor(){

let last = performance.now();
function loop(now){
  const raw = Math.min(0.06, (now-last)/1000); last = now;
  /* 会話・針しごと・カプセルのあいだ、アトリエの時間は止まる */
  if(ovTick(raw)){ requestAnimationFrame(loop); return; }
  /* 誰もいない夜は何も起きないので、少し飛ばす */
  /* まだ残っている人・帰り道の人がいるうちは早送りしない */
  const ff = (!party && mp >= M_GONE && !anyoneStillIn()) ? 3.2 : 1;
  const dt = raw * speed * ff;
  stepActors(raw * speed); stepPlace(raw * speed); anim += raw;
  if(visitor) stepVisitor(raw * speed);

  if(!party){
    const before = mp;
    mp += dt / MONTH_SEC;
    /* 月のなかで3回、様子を見る（依頼・成長・相談など） */
    for(const k of [0.22, 0.50, 0.72])
      if(before < k && mp >= k) onTick();
    if(mp >= 1){ mp -= 1; month++; onMonth(); renderPane(); }
    /* 出勤がそろうのを待っていた発表会を、ここで始める */
    if(showWaiting && !party && curShow() && everyoneIn()){ runShow(); }
  }

  /* 帰宅・出勤・休憩 */
  if(!party){
    const work = isWorkTime();
    for(const s of staff){
      if(s.onBreak){
        s.breakLeft -= dt;
        if(s.breakLeft <= 0) endBreak(s);
      }
      const outAt = leaveAt(s), inAt = comeAt(s);
      /* 残業なら終電まで、泊まり込みなら帰らない */
      const M = WORKMODE[workMode];
      const goAt = M.until == null ? outAt : Math.max(outAt, M.until);
      if(mp >= goAt && !s.away) sendHome(s);
      else if(mp < goAt && mp >= inAt && s.away) comeBack(s);
      else if(work && !s.away && !s.onBreak && !s.done
              && Math.random() < dt*0.010*(1 + (100-s.morale)/60)
                                 * temperOf(s).breakRate) startBreak(s);
      /* 定時を過ぎても残っている人は、残業として数える。そのぶん疲れる */
      if(!s.away && !s.onBreak && mp > M_CLOSE){
        s.ot = (s.ot||0) + dt/MONTH_SEC;
        s.morale = Math.max(0, s.morale - dt*0.42*temperOf(s).wear);
      }
    }
  }

  if(!party){
    for(const c of chatQ){ c.t -= dt; if(c.t <= 0 && !c.s.away) say(c.s, c.text); }
    chatQ = chatQ.filter(c => c.t > 0);
    chatT -= dt;
    if(chatT <= 0){ chatT = 20 + Math.random()*26; tryChat(); }
  }
  /* 什器の中で、時間で変わるもの（製図台の線） */
  for(const f of furniture){
    if(f.type === "draft" && busy(f)) f.ink = Math.min(1, (f.ink||0) + dt*0.10);
    if(f.brew > 0) f.brew = Math.max(0, f.brew - dt);
  }
  for(const s of staff){
    s.t += dt;
    if(s.bubbleT>0){ s.bubbleT -= dt; if(s.bubbleT<=0) s.bubble = null; }
    else if(!party && !s.away && Math.random() < dt*0.022)
      say(s, contextLine() || (quirkOf(s) && Math.random() < 0.25 ? quirkOf(s).line : pick(LINES[s.role])));

    if(s.phase==="walk"){
      /* 什器があいだにあれば、よけて通る角を返す（room/walk.js） */
      const wp = aimAt(s);
      const ax = wp ? wp[0] : s.tx, ay = wp ? wp[1] : s.ty;
      const dx = ax-s.gx, dy = ay-s.gy, d = Math.hypot(dx,dy);
      if(!wp && d < 0.05){
        if(s.tz != null) s.gz = s.tz;
        if(s.route && s.route.length){ nextLeg(s); }        /* 次の段へ */
        else if(s.arriving){ s.arriving = false; s.route = null; s.tz = null; assign(s); }
        else {
          /* コーヒーメーカーの前に着いた。ここから淹れはじめる */
          if(s.toCoffee){
            s.toCoffee.brew = 4.0; s.mug = true; s.toCoffee = null;
          }
          /* 帰宅中・休憩中は持ち場に戻さない */
          s.phase = (party || s.away || s.onBreak) ? "idle" : "work";
          s.workT = 11+Math.random()*13;
          s.hurry = 1; s.route = null; s.tz = null;
          if(s.want) s.flip = s.want;
        }
      } else {
        /* 外の踏み台と階段の上では、距離に関係なく落ち着いた速さで */
        const outside = s.gx > GW - 0.3;
        const sp = 0.95*(outside ? 1.95 : (s.hurry||1))*dt;
        s.gx += dx/d*Math.min(sp,d); s.gy += dy/d*Math.min(sp,d);
        s.flip = dx>=0 ? 1 : -1;
        /* 段の高さは、その区間の残りに合わせてなめらかに変える */
        if(s.tz != null && s.legLen)
          s.gz = s.tz + ((s.g0z||0) - s.tz) * Math.min(1, d/s.legLen);
      }
    } else if(s.phase==="work"){
      s.workT -= dt;
      if(s.workT<=0 && !s.away && !s.onBreak) assign(s);
    }
  }

  for(const q of pets){
    const P = PETS[q.kind];
    q.t += dt;
    if(q.bubbleT>0){ q.bubbleT -= dt; if(q.bubbleT<=0) q.bubble = null; }
    else if(!party && Math.random() < dt*0.012){
      q.bubble = pick(P.lines); q.bubbleT = 3; q.bad = false;
    }
    if(q.phase==="walk"){
      const wq = aimAt(q);
      const qax = wq ? wq[0] : q.tx, qay = wq ? wq[1] : q.ty;
      const dx = qax-q.gx, dy = qay-q.gy, d = Math.hypot(dx,dy);
      if(!wq && d < 0.06){
        q.phase = "rest"; q.rest = P.rest[0]+Math.random()*(P.rest[1]-P.rest[0]);
        /* パグは半分くらいの確率で、寝ずに座ってこちらを見る */
        q.sitFront = (q.kind === "pug" && Math.random() < 0.5);
        if(q.sitFront) q.rest = Math.min(q.rest, 3.5 + Math.random()*3);
      }
      else {
        const sp = P.spd*dt;
        q.gx += dx/d*Math.min(sp,d); q.gy += dy/d*Math.min(sp,d);
        q.flip = dx>=0 ? 1 : -1;
      }
    } else if(q.phase === "rest"){
      q.rest -= dt;
      if(q.rest<=0 && !party){
        /* 行き先そのものが什器の上だと、たどり着いた先で埋まってしまう。
           空いている床の上から選ぶ（room/walk.js） */
        const p = freeSpot();
        q.tx = p[0]; q.ty = p[1];
        q.phase = "walk";
      }
    }
  }

  if(party) partyStep(dt);
  else {
    if(!job) selfWork();
    if(job && !job.design) designWait(dt);       /* デザイン待ち（game/design.js） */
    const act = activeStaff().length;
    if(act){
      /* いまの工程の担当が現場にいれば速い。誰もいなければ工程は這うように進む */
      const st = STAGES[stageOf()];
      const own = activeStaff().filter(
        x => x.role === st.role || ROLES[x.role].stat === "all").length;
      const mult = own ? 0.9 + own*0.28 : 0.45;
      const b4 = prog;
      prog += dt * 3.2 * speedFactor() * crowdFactor()
              * (act/Math.max(1,staff.length)) * mult
              * (machineDown ? 0.55 : 1);
      /* デザインが決まるまで「企画・デザイン」は終わらない（先生の指示 2026-09-13、game/design.js） */
      if(job && !job.design) prog = Math.min(prog, DESIGN_HOLD);
      checkStage(b4);
      if(prog >= 100) complete();
    }
  }

  if(toastT>0){ toastT -= dt; if(toastT<=0) document.getElementById("toast").classList.remove("on"); }
  uiT += dt;
  if(uiT > 0.2){ uiT = 0; renderHUD(); }

  draw();
  requestAnimationFrame(loop);
}

function renderHUD(){
  const cb = document.getElementById("craftBtn");
  if(cb) cb.style.display =
    (view === "room" && craftCool <= 0 && isWorkTime() && !moving && !party && !mini)
      ? "" : "none";
  const mEl = document.getElementById("money");
  mEl.textContent = yenHud(money); mEl.title = yen(money);
  document.getElementById("fame").textContent  = fame;
  document.getElementById("week").innerHTML = month+'<small>週目</small>';
  document.getElementById("tod").innerHTML = iconize(TODICON())+' <small>'+partOfDay()+'</small>';

  const jt=document.getElementById("jobT"), jc=document.getElementById("jobC"),
        jd=document.getElementById("jobDue");
  if(party){
    jt.textContent="発表中…"; jc.textContent=""; jd.textContent=""; jd.className="due";
    document.getElementById("jobBar").style.width = "100%";
  } else if(job){
    jt.textContent = "《"+job.theme+"》";
    const stg = STAGES[stageOf()];
    jc.textContent = (job.kind==="order"
      ? job.client+"（"+STATJP[job.need]+"を重視）"
      : job.kind==="cross"
      ? STATJP[job.cross.aK]+"と"+STATJP[job.cross.bK]+"を抜き取る"
      : "コレクション（自主制作）") + " ／ いま：" + stg.name;
    const act = activeStaff().length, rest = presentStaff().length - act;
    if(!isWorkTime() && workMode === 0 && act === 0)
      jc.textContent = "今日はおしまい。みんな帰りました";
    else if(workMode === 2 && nightAmount() > 0.5)
      jc.textContent = "泊まり込み。誰も帰っていません";
    else if(rest > 0) jc.textContent += "　／　" + rest + "人が移動・休憩中";
    /* 一着のデザイン（game/design.js）。決まっていれば名前、まだなら「決めてください」 */
    if(job.design) jc.textContent += "　／　" + pieceName(job.design);
    else jc.innerHTML = esc(jc.textContent) + ' <span class="ask">✎ ' +
      (prog >= DESIGN_HOLD - 0.5 ? "デザインを決めてください（ここをタップ）" : "タップしてデザインを決める") + '</span>';
    if(job.kind==="order"){
      const left = job.due-dayNo();
      jd.textContent = left>=0 ? "納期まで "+left+"週" : (-left)+"週 超過";
      jd.className = "due"+(left<=1 ? " hot" : "");
    } else { jd.textContent=""; jd.className="due"; }
    document.getElementById("jobBar").style.width = Math.min(100,prog).toFixed(1)+"%";
  }
  document.querySelector(".jobbar").classList.toggle("ask",
    !!(job && !job.design && !party && prog >= DESIGN_HOLD - 0.5));
  const b = document.getElementById("bdg");
  b.textContent = offers.length; b.classList.toggle("on", offers.length>0);

  const sb = document.getElementById("showbar");
  if(!curShow()){
    sb.className = "showbar done";
    document.getElementById("showL").textContent = "すべての発表会をやりきった";
    document.getElementById("showR").textContent = "カード "+dexCount()+"／"+DEXSLOTS;
  } else {
    const S = curShow(), left = showDue - dayNo();
    sb.className = "showbar" + (left<=1 ? " hot" : "");
    document.getElementById("showL").innerHTML =
      ico("runway")+" "+esc(S.name)+"　あと "+Math.max(0,left)+" 週";
    document.getElementById("showR").textContent = "目標 "+showNeed(S);
  }
}

const spdBtn = document.getElementById("spdBtn");
/* 三角を、決まった幅の枠のなかで重ねて描く。
   文字（▶▶▶）だと数が増えるほど横に伸びて隣のボタンとぶつかるため。
   奥の三角ほど薄くして、重なって見えるようにしてある。 */
function spdIcon(n){
  const W = 16, H = 10, tw = 6.2, ov = 2.8, step = tw - ov;
  const x0 = (W - (tw + step*(n-1))) / 2;
  let p = "";
  for(let i=0;i<n;i++){
    const x = x0 + i*step;
    p += '<path d="M'+x.toFixed(1)+' 0.8 L'+(x+tw).toFixed(1)+' '+(H/2)+
         ' L'+x.toFixed(1)+' '+(H-0.8)+' Z" fill="currentColor" opacity="'+
         (0.42 + 0.58*(i+1)/n).toFixed(2)+'"/>';
  }
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+
         '" aria-hidden="true" style="vertical-align:-1px;margin-right:2px">'+p+'</svg>';
}
function paintSpd(){ spdBtn.innerHTML = spdIcon(speed) + "×" + speed; }
paintSpd();
spdBtn.onclick = ()=>{
  speed = SPEEDS[(SPEEDS.indexOf(speed)+1) % SPEEDS.length];
  paintSpd();
  toast(speed===1 ? "ふつうの速さ" : "×"+speed+" で早送り");
};
const otBtn = document.getElementById("otBtn");
function paintMode(){
  const M = WORKMODE[workMode];
  otBtn.innerHTML = iconize(M.icon) + " " + M.short;
  otBtn.classList.toggle("on",  workMode === 1);
  otBtn.classList.toggle("hot", workMode === 2);
}
function setWorkMode(v){
  workMode = ((v % WORKMODE.length) + WORKMODE.length) % WORKMODE.length;
  overtime = workMode > 0;
  paintMode();
  const M = WORKMODE[workMode];
  toast(M.say + "　" + M.tip);
  log(M.say);
  /* 重くしたときは、もう帰った人にも戻ってきてもらう */
  if(workMode > 0) for(const s of staff) if(s.away) comeBack(s);
}
otBtn.onclick = ()=> setWorkMode(workMode + 1);

/* ---- 横になぞって部屋を見わたす ---- */
let panFrom = null, panStart = 0, didPan = false;
cv.addEventListener("pointerdown", e=>{
  if(view !== "room") return;
  panFrom = e.clientX; panStart = panX; didPan = false;
});
cv.addEventListener("pointermove", e=>{
  if(panFrom == null) return;
  const r = cv.getBoundingClientRect();
  const d = (e.clientX - panFrom) / r.width * VW / roomZoom();
  if(Math.abs(e.clientX - panFrom) > 8) didPan = true;
  if(didPan){ panX = panStart + d; clampPan(); }
});
const endPan = ()=>{ panFrom = null; };
cv.addEventListener("pointerup", endPan);
cv.addEventListener("pointercancel", endPan);
cv.addEventListener("pointerleave", endPan);

cv.addEventListener("click", e=>{
  if(didPan){ didPan = false; return; }      /* なぞっただけなら、何も選ばない */
  const r = cv.getBoundingClientRect();
  let x = (e.clientX-r.left)/r.width*VW, y = (e.clientY-r.top)/r.height*VH;
  /* 部屋を縮めているぶん、押した場所を戻す */
  if(view === "room"){ const q0 = unZoom(x, y); x = q0.x; y = q0.y; }

  /* 学校の4年のあいだ、街の建物をタップ（game/school.js） */
  if(typeof scTap === "function" && scTap(x, y)) return;
  /* 拠点の中：人をタップすると、その仕事が読める */
  if(view === "place"){
    let hit = null, bd = 30;
    for(const n of pnpc){
      const q = iso(n.gx, n.gy, 0);
      const d2 = Math.hypot(q.x-x, q.y-(y-16));
      if(d2 < bd){ bd = d2; hit = n; }
    }
    if(hit) openNPC(hit);
    return;
  }

  /* 街の画面：建物をタップする */
  if(view === "town"){
    let hit = null, best = -1e9;
    for(const p of PLACES)
      for(const lv of [0, 0.4, 0.8]){
        const q = unIso(x, y + p.h*lv*ZS);
        if(q.gx>=p.x && q.gx<=p.x+p.w && q.gy>=p.y && q.gy<=p.y+p.d){
          const sc = p.x+p.y+p.h*0.002;
          if(sc > best){ best = sc; hit = p; }
          break;
        }
      }
    if(hit) openPlace(hit);
    return;
  }

  const g = unIso(x, y+10);

  /* 移動中：床をタップして置く */
  if(moving){
    const MW = fw(moving), MD = fd(moving);
    const nx = Math.max(0, Math.min(GW-MW, Math.round((g.gx-MW/2)*4)/4));
    const ny = Math.max(0, Math.min(GD-MD, Math.round((g.gy-MD/2)*4)/4));
    if(fits(nx, ny, {w:MW, d:MD}, moving)){
      moving.x = nx; moving.y = ny;
      const nm = FURN[moving.type].name;
      endMove(); sel = null;
      reassignAll(); toast(nm+"を置きました");
    } else { moving.gx0 = nx; moving.gy0 = ny; toast("そこには置けません"); }
    return;
  }

  /* 来客。タップすると話が始まる */
  if(visitor && !visitor.leaving && visitor.phase === "wait"){
    const vp = iso(visitor.gx, visitor.gy, visitor.gz||0);
    if(Math.hypot(vp.x-x, vp.y-(y+18)) < 34){
      storyStart(visitor.storyId); sel = null; hideSel(); return;
    }
  }
  /* 壊れたミシンをタップすると、直しの相談に戻れる */
  if(machineDown){
    const hitM = hitFurniture(x, y);
    if(hitM && hitM.type === "sewing"){ storyStart("fix2"); return; }
  }

  /* スタッフ・猫が近ければ、そちらが優先 */
  let best = null, bd = 26;
  for(const s of staff){
    const p = iso(s.gx, s.gy, 0);
    const d = Math.hypot(p.x-x, p.y-(y+18));
    if(d < bd){ bd = d; best = s; }
  }
  if(best){
    if(ev && ev.s === best){ showEvent(); sel = null; hideSel(); return; }
    say(best, best.morale<30 ? pick(TIRED) : pick(LINES[best.role]), best.morale<30);
    openJob(best.role, best);
    sel = null; hideSel(); return;
  }
  for(const q of pets){
    const p = iso(q.gx, q.gy, 0);
    if(Math.hypot(p.x-x, p.y-(y+8)) < 22){
      q.bubble = pick(PETS[q.kind].lines); q.bubbleT = 3; q.bad = false;
      if(q.phase==="rest" && q.kind!=="turtle"){ q.rest = 0.1; }   // 起こす
      toast(PETS[q.kind].name+"　士気+"+PETS[q.kind].mor+"／週");
      sel = null; hideSel(); return;
    }
  }

  const hit = hitFurniture(x, y);
  if(hit && hit.type === "gacha"){ openGachaOv(); sel = null; hideSel(); return; }
  if(hit){ sel = hit; showSel(hit); }
  else { sel = null; hideSel(); }
});

/* 什器は床より上に描かれるので、高さの何段階かで当たりを見る。
   そうしないと「見えている本体」をタップしても反応しない。 */
function hitFurniture(px, py){
  let hit = null, best = -1e9;
  for(const f of furniture){
    const F = FURN[f.type];
    if(F.cat==="wall") continue;
    for(const lv of [0, 0.35, 0.7, 1]){
      const q = unIso(px, py + (F.h||16)*lv*ZS);
      if(q.gx>=f.x && q.gx<=f.x+fw(f) && q.gy>=f.y && q.gy<=f.y+fd(f)){
        const score = f.x+f.y+(F.h||16)*0.004;
        if(score > best){ best = score; hit = f; }
        break;
      }
    }
  }
  return hit;
}

/* ==================================================================
   10.5 一着のデザインを決める（先生の指示 2026-09-13：アトリエ編を面白く、の A）

   これまで服の出来は「スタッフの数字の合計」だけで決まり、遊ぶ人は何も決めなかった。
   ここで、一着ごとに 3 回だけ遊ぶ人が決める：
       型（テーマから連想した3案＋図鑑から1枚）→ 生地（3案）→ ひとひねり（連想・置き換え・組み合わせ）
   3 つが {a,b,t,f}（game/garment.js の一着）を決め、4 要素の倍率にも効く。
   決めるまで「企画・デザイン」の工程は終わらない（進行が DESIGN_HOLD で止まる）。
   「スタッフにまかせる」を選べば、これまでどおり手を出さずに進む。

   講義（#02 FORM）の要点をそのまま遊びにしてある：
     ・モチーフをそのまま貼らない。要素を抜き取って、服の言葉にする
     ・操作は3つ ── 連想・置き換え・組み合わせ
   ================================================================== */
const DESIGN_HOLD = 19.6;                  /* デザイン未定のとき、進行はここで待つ（企画＝0〜20） */

/* ── テーマ → 連想した型（3つ以上）。モチーフの「要素」を型にしたもの ── */
const THEME_FORMS = {
  "深海":           ["人魚","花のように","細く長く"],
  "廃墟と植物":     ["斜めに落ちる","ケープ","段を積む"],
  "鳥の骨格":       ["肩の建築","ケープ","ねじる"],
  "雨のプラットホーム":["トレンチ","筒","ガウンコート"],
  "祖母の家":       ["カーディガン","Aライン","段を積む"],
  "折り紙":         ["階段","風船","プリーツスカート"],
  "夜行列車":       ["チェスター","筒","ジャンプスーツ"],
  "氷の建築":       ["肩の建築","円をひらく","階段"],
  "苔と鉱物":       ["コクーン","ニット","マキシスカート"],
  "制服の解体":     ["テーラード","シャツ","ねじる"],
  "渡り鳥の地図":   ["ケープ","斜めに落ちる","サロペット"],
  "工事現場の光":   ["MA-1","カーゴ","ワイドパンツ"],
};
/* ── テーマ → 合う生地 ── */
const THEME_FABS = {
  "深海":           ["シルクサテン","オーガンジー","ベルベット"],
  "廃墟と植物":     ["リネン","ツイード","チュール"],
  "鳥の骨格":       ["オーガンジー","タフタ","ナイロン"],
  "雨のプラットホーム":["ナイロン","メルトン","コットン"],
  "祖母の家":       ["ケーブルニット","ギンガム","ツイード"],
  "折り紙":         ["タフタ","オーガンジー","コットン"],
  "夜行列車":       ["メルトン","ベルベット","コーデュロイ"],
  "氷の建築":       ["オーガンジー","タフタ","ラメ"],
  "苔と鉱物":       ["ツイード","ケーブルニット","ラメ"],
  "制服の解体":     ["コットン","デニム","メルトン"],
  "渡り鳥の地図":   ["リネン","ナイロン","ジャージー"],
  "工事現場の光":   ["ナイロン","デニム","ラメ"],
};
/* ── 型が求める生地の性格。hard＝張りが要る／soft＝落ち感が要る。無いものはどちらでも ── */
const FORM_ST = {};
for(const n of ["肩の建築","風船","コクーン","筒","階段","段を積む","テーラード","トレンチ","チェスター",
                "ライダース","MA-1","ダウン","デニムJK","ダッフル","面接の日","ビスチェ","カーゴ",
                "タイトスカート","プリーツスカート"]) FORM_ST[n] = "hard";
for(const n of ["人魚","花のように","斜めに落ちる","ねじる","ケープ","ガウンコート","マキシスカート",
                "フレアスカート","細く長く","円をひらく","Aライン","パフスリーブ","サルエル"]) FORM_ST[n] = "soft";

/* ── ひとひねり。講義の「操作は3つ」 ── */
const TWISTS = [
  { n:"連想",     lead:"連想を一段すすめる",
    d:"テーマから連想した型を、そのまま深く掘る。いちばん手堅い。",
    mul:{ concept:1.04 }, t:0 },
  { n:"置き換え", lead:"一部を別のものに",
    d:"型の一部を、ぜんぜん別の型のものに置き換える。少し縫いにくくなる。",
    mul:{ concept:1.08, form:1.05, tech:0.96 }, t:0.35 },
  { n:"組み合わせ", lead:"二つの型を合わせる",
    d:"テーマから出た二つの型を、半分ずつ合わせる。いちばん新しいが、いちばん難しい。",
    mul:{ concept:1.14, form:1.04, tech:0.92, material:0.98 }, t:0.5 },
];

let ds = null;            /* 開いている選択の途中経過。job が変わると捨てる */
let dsWaitT = 0;

function fabIdx(name){ const i = GFAB.findIndex(x => x.n === name); return i < 0 ? 0 : i; }
function shuffled(a){ const o = a.slice(); for(let i=o.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; } return o; }
function uniq(a){ return a.filter((x,i)=>a.indexOf(x)===i); }

/* いまの仕事のテーマ（かけあわせは2つ） */
function designThemes(){
  if(!job) return [];
  if(THEME_FORMS[job.theme]) return [job.theme];
  if(job.cross) return [job.cross.aT, job.cross.bT].filter(t => THEME_FORMS[t]);
  return [];
}
function fitForms(){
  const ks = designThemes();
  let names = uniq([].concat(...ks.map(k => THEME_FORMS[k])));
  if(names.length < 3) names = uniq(names.concat(G_PICK[(job && job.need) || "concept"]));
  return names;
}
function fitFabs(){
  const ks = designThemes();
  let names = uniq([].concat(...ks.map(k => THEME_FABS[k])));
  if(!names.length) names = ["コットン","リネン","シルクサテン"];
  return names;
}

/* 4要素の倍率。型と生地の相性、テーマとの相性、生地の扱いにくさ、ひとひねり */
function designMuls(sel){
  const m = { concept:1, form:1, material:1, tech:1 };
  const F = GFAB[sel.f], A = GLIB[sel.a];
  if(sel.formFit) m.concept *= 1.08;                       /* テーマから連想した型 */
  const st = FORM_ST[A.n];
  if(st === "hard"){ if(F.drape <= 0.32) m.form *= 1.08; else if(F.drape >= 0.65) m.form *= 0.90; }
  if(st === "soft"){ if(F.drape >= 0.60) m.form *= 1.08; else if(F.drape <= 0.32) m.form *= 0.90; }
  if(sel.fabFit) m.material *= 1.12;                       /* テーマに合う生地 */
  if(F.gloss > 0.4 || F.sheer > 0.3) m.material *= 1.04;   /* 表情のある生地 */
  m.tech *= 1 - (F.hard - 2) * 0.05;                       /* 扱いにくい生地は縫いが苦しい */
  if(sel.twist != null){ const T = TWISTS[sel.twist]; for(const k in T.mul) m[k] *= T.mul[k]; }
  for(const k of STATS) m[k] = +m[k].toFixed(3);
  return m;
}
/* 工程の締め（差し戻し）と完成の数字に効く */
function designMul(k){ return (job && job.design && job.design.mul && job.design.mul[k]) || 1; }

/* 型と生地の相性を、ことばで */
function fabFormNote(a, f){
  const st = FORM_ST[GLIB[a].n], F = GFAB[f];
  if(st === "hard"){ if(F.drape <= 0.32) return "張りがあって形が立つ"; if(F.drape >= 0.65) return "とろけて形がくずれる"; }
  if(st === "soft"){ if(F.drape >= 0.60) return "落ち感が形を助ける"; if(F.drape <= 0.32) return "固くて落ちない"; }
  return "";
}
function fxChips(m){
  return STATS.filter(k => m[k] !== 1).map(k => {
    const p = Math.round((m[k]-1)*100);
    return '<span class="fxc" style="background:'+(p>0 ? GCOL[k] : "#b08fa4")+'">'+STATJP[k]+(p>0?"+":"")+p+'%</span>';
  }).join("") || '<span class="fxc" style="background:#b9a4b6">変わらない</span>';
}

/* ── 仕事が始まったとき。accept / selfWork / doCross から ── */
function designStart(){
  if(!job) return;
  job.design = null; ds = null; dsWaitT = 0;
  if(auto.design) designAuto();
}
/* 候補を作る。型4（連想3＋図鑑または思いつき1）、生地3（合う2＋別の1） */
function designOptions(){
  const forms = shuffled(fitForms()).slice(0, 3).map(n => ({ i:gIdx(n), tag:"テーマから", fit:true }));
  const used = forms.map(o => o.i);
  let extra = null;
  const owned = Object.values(allCards()).filter(c => c.piece && GLIB[c.piece.a] && GLIB[c.piece.a].f);
  if(owned.length){
    const c = pick(owned);
    const i = used.indexOf(c.piece.a) < 0 ? c.piece.a : c.piece.b;
    if(GLIB[i] && GLIB[i].f && used.indexOf(i) < 0) extra = { i, tag:"図鑑から《"+c.name+"》", fit:false };
  }
  if(!extra){
    const A = GLIB[forms[0].i];
    const pool = GLIB.map((x,i)=>i).filter(i => GLIB[i].f && used.indexOf(i) < 0 && GLIB[i].c !== A.c);
    extra = { i:pick(pool), tag:"思いつき", fit:false };
  }
  forms.push(extra);
  const fitF = shuffled(fitFabs()).slice(0, 2).map(n => ({ f:fabIdx(n), fit:true }));
  const others = GFAB.map((x,i)=>i).filter(i => !fitF.some(o => o.f === i));
  const fabs = shuffled(fitF.concat([{ f:pick(others), fit:false }]));
  return { job, step:0, forms, fabs, a:null, formFit:false, f:null, fabFit:false, twists:null };
}
/* ひとひねりの3案。置き換え＝別の系統の型、組み合わせ＝テーマから出たもう一つの型 */
function designTwists(d){
  const A = GLIB[d.a];
  const otherCat = GLIB.map((x,i)=>i).filter(i => GLIB[i].f && GLIB[i].c !== A.c && i !== d.a);
  const mate = d.forms.filter(o => o.fit && o.i !== d.a).map(o => o.i);
  const rep = pick(otherCat), comb = mate.length ? pick(mate) : pick(otherCat);
  return TWISTS.map((T, k) => {
    const b = k === 0 ? d.a : k === 1 ? rep : comb;
    return { k, b, t:T.t, piece:{ a:d.a, b, t:T.t, f:d.f } };
  });
}
function designCommit(d, k, by){
  const tw = d.twists[k];
  const mul = designMuls({ a:d.a, f:d.f, formFit:d.formFit, fabFit:d.fabFit, twist:k });
  job.design = { a:d.a, b:tw.b, t:tw.t, f:d.f, twist:k, mul, by:by||"あなた",
                 formFit:d.formFit, fabFit:d.fabFit };
  ds = null;

/* ── B：部屋のボディに、いまの一着が工程ごとに現れる（先生の指示 2026-09-13） ──

   服の絵はカードの層（ART.md 0章）なので、什器の色の畳み込み（SNAP）を外して描く */
let torsoForce = null;                     /* 確認スクリプトが工程を決め打ちするとき */
function workTorso(){ return furniture.find(o => o.type === "torso") || null; }

/* いま作っている一着の生地の色。裁断台・ミシン・アイロン台・生地棚が、これで染まる。
   （A案。先生の指示 2026-09-13。部屋のどこを見ても「いまこの生地で作っている」が分かる）
   after より手前では null ＝ まだ反物が部屋に出ていない。

function jobFabCol(after){

  if(st < need) return null;

/* ── 着せかたは「片身ごろ」（先生の選択 2026-09-13）──
   立体裁断の実際どおり、右半分だけを組み、前中心にまち針を打つ。左はボディのまま残る。
   前は服を横に1.18倍して肩の位置から丈58で描いていたため、ボディより一回り大きく、
   肩が水平で、丈が床を突き抜けていた。いまは寸法をボディから決める：
   幅はボディの幅から、肩は稜線に沿って斜めに、襟は開けて首と木のノブを見せ、
   裾は床の手前で止める。ボトムスは肩ではなく腰から吊る。 */
const TORSO_SHOULDER = 0.855, TORSO_WAIST = 0.44;   /* H に対する高さの割合 */
function torsoHalfAt(t){                   /* 高さ t（0＝下端、1＝首）でのボディの半幅の割合 */
  const P = TORSO_PROFILE;
  t = Math.max(0, Math.min(1, t));
  for(let i = 1; i < P.length; i++) if(t <= P[i][0]){
    const a = P[i-1], b = P[i];
    return a[1] + (b[1]-a[1])*(t-a[0])/(b[0]-a[0]);
  }
  return P[P.length-1][1];
}
/* 21の形の数字を、このボディに合わせて書き換える */
function torsoFit(form, fab, p, H, W, floorY){
  const f = gFabricFx(form, fab);
  const bottom = f.top < 0.35;             /* 腰から履くもの */
  const refG = bottom ? Math.max(f.ww, 0.12) : Math.max(f.sh, 0.16);
  let h = (W*(bottom ? 0.53 : 0.79)*(bottom ? 1.06 : 1.13))/refG/0.52;
  h = Math.max(H*0.92, Math.min(H*1.8, h));
  const w = h*0.52;
  /* 上ものは肩の稜線のぶん持ち上げて描き、あとで斜めに切る */
  const cy = bottom ? p.y - H*TORSO_WAIST : p.y - H*TORSO_SHOULDER - h*0.070;
  const fh = yg => { const t = (p.y-(cy+yg*h))/H;
    return (t <= 0.01 || t >= 0.99) ? 0 : W*torsoHalfAt(t)/w; };
  const band = (ya, yb) => { let m = 0;    /* 1点だけ見るとバスト・ヒップを跨いで外す */
    for(let i = 0; i <= 12; i++){ const v = fh(ya + (yb-ya)*i/12); if(v > m) m = v; }
    return m; };
  /* 広がりの上限。となりのタイル（64px）まで食い込ませない */
  const lim = W*2.45/w;
  const est = Math.max(f.hw*(1+f.asym),
                       f.kw + Math.max(0, f.hw*(1+f.asym)-f.kw)*f.sweep*1.30);
  if(est > lim){ const k = lim/est;
    f.hw *= k; f.kw *= k; f.hemC *= k; f.sweep *= Math.max(0.45, k); }
  /* ボディのふくらみより細くしない（曲線がへこむぶんの余裕を足す） */
  const mid = (a,b) => (a+b)/2, bodyEnd = (p.y-cy)/h;
  const spike = !bottom && f.sv > 0.04 && f.top > 0.4;   /* 肩が張り出す型 */
  const seg = bottom
    ? [["ww", 0, Math.max(bodyEnd, mid(f.wy,f.ky))],   /* 腰からひざまでは1本の曲線 */
       ["kw", 0, mid(f.ky,f.hy)], ["hw", mid(f.ky,f.hy), f.hy]]
    : [["sh", 0, spike ? mid(0.015,0.055) : mid(0.015,f.ap)],
       ["bw", spike ? mid(0.10,f.ap) : mid(0.015,f.ap), mid(f.ap,f.wy)],
       ["ww", mid(f.ap,f.wy), mid(f.wy,f.ky)], ["kw", mid(f.wy,f.ky), mid(f.ky,f.hy)],
       ["hw", mid(f.ky,f.hy), f.hy]];
  for(const [k, ya, yb] of seg){ const b = band(ya, yb); if(!b) continue;
    f[k] = Math.max(f[k], b*1.05 + 0.020); }
  /* 肩の張り出しは、肩先と袖ぐりのあいだの2点で効く（ここを飛ばすとバストが横から出る） */
  if(spike){
    const n1 = band(mid(0.015,0.055), mid(0.055,0.10));
    const n2 = band(mid(0.055,0.10), mid(0.10,f.ap));
    f.sv = Math.max(f.sv, n1*1.05 + 0.020, (n2*1.05 + 0.020)/0.82);
  }
  /* 裾は床の手前で止める。裾のふくらみも数に入れる */
  const drop = Math.max(f.hy, f.hy+f.asymY) + Math.max(0, f.hemC);
  const stop = floorY - 3.0, hemY = cy + drop*h;
  if(hemY > stop){
    const kneeY = cy + f.ky*h;
    if(stop > kneeY + 3){ const k = (stop-kneeY)/(hemY-kneeY);
      f.hy = f.ky + (f.hy-f.ky)*k; f.asymY *= k; f.hemC *= k; }
    else { const k = Math.max(0.22, (stop-cy)/(hemY-cy));
      f.hy *= k; f.ky = Math.min(f.ky*k, f.hy*0.92); f.asymY *= k; f.hemC *= k; }
  }
  return { f, h, w, cy, bottom };
}
/* 肩の稜線と襟あき。ここより上には服を描かない＝ボディの首と木のノブが出る */
function torsoShoulder(G, p, floorY){
  if(G.bottom) return;
  const w = G.w, h = G.h, cy = G.cy, px = p.x;
  const sw = Math.max(G.f.sh, 0.16)*w, nw = Math.max(0.085, G.f.neck)*w;
  const shY = cy + h*0.070, nkY = cy + h*0.016, frY = cy + h*0.064;
  ctx.beginPath();
  ctx.moveTo(px - w*3, shY + h*0.045);
  ctx.lineTo(px - sw*1.01, shY);
  ctx.quadraticCurveTo(px - nw*1.20, shY - h*0.020, px - nw, nkY);
  ctx.quadraticCurveTo(px, frY, px + nw, nkY);
  ctx.quadraticCurveTo(px + nw*1.20, shY - h*0.020, px + sw*1.01, shY);
  ctx.lineTo(px + w*3, shY + h*0.045);
  ctx.lineTo(px + w*3, floorY + 60);
  ctx.lineTo(px - w*3, floorY + 60);
  ctx.closePath(); ctx.clip();
}
function torsoGarment(f, p, H, W){
  const st = torsoForce != null ? torsoForce : (job && job.design && !party ? stageOf() : 0);
  if(st <= 0) return;

    const A = GLIB[d.a] || GLIB[4], B = GLIB[d.b] || A;
    const det = (d.t < 0.5 ? A.dt : B.dt) || A.dt || B.dt;
    const G = torsoFit(mixForm(A.f || GBASE, B.f || A.f || GBASE, d.t), F, p, H, W, floorY);
    ctx.save();
    torsoShoulder(G, p, floorY);                      /* 肩の稜線と襟あき */
    ctx.beginPath(); ctx.rect(p.x, G.cy-H*0.4, W*4, H*2.4+60); ctx.clip();   /* 右の片身ごろだけ */

    for(let i = 0; i < 5; i++){

      ctx.beginPath(); ctx.moveTo(p.x, y); ctx.lineTo(p.x+3.2, y-2.6); ctx.stroke();

function rushToTorso(s){
  const tf = workTorso(); if(!tf || !s || s.away || s.onBreak) return;
  const q = standPos(tf, 0);
  s.tx = q.x; s.ty = q.y; s.station = tf; s.want = q.flip;
  s.route = null; s.tz = null; s.gz = 0; s.crowded = false;
  s.phase = "walk"; s.hurry = 1.7;
}

    dsDesign(){ return job && job.design ? JSON.stringify(Object.assign({ name:pieceName(job.design) }, job.design)) : null; },
    dsProg(){ return +prog.toFixed(1); },
    dsRedo(){ if(job && job.design && prog < 20){ job.design = null; ds = null; return true; } return false; },
    /* ボディの絵を工程ごとに一体だけ描いて、色の数を返す（B の確認用） */
    torsoStage(n, near){
      torsoForce = n; ctx.clearRect(0,0,VW,VH);
      try{ drawFurniture({ type:"torso", x:3, y:3, hung:0 }); } finally { torsoForce = null; }
      const w = cv.width, h = cv.height, dd = ctx.getImageData(0,0,w,h).data;
      const tg = (near||[]).map(c => { const n2=parseInt(c.slice(1),16); return [(n2>>16)&255,(n2>>8)&255,n2&255]; });
      let ink = 0, hash = 7; const cnt = tg.map(()=>0);
      for(let i=0;i<dd.length;i+=4){ if(dd[i+3] < 8) continue; ink++;
        hash = (hash*31 + dd[i]*3 + dd[i+1]*5 + dd[i+2]*7) | 0;
        tg.forEach((t,k) => { if(Math.hypot(dd[i]-t[0], dd[i+1]-t[1], dd[i+2]-t[2]) < 34) cnt[k]++; }); }
      return JSON.stringify({ ink, hash, cnt });
    },
    torsoPos(){ const f = workTorso(); if(!f) return null; const p = iso(f.x+.4, f.y+.4, 17); return JSON.stringify([p.x, p.y]); },
    /* 什器を一点だけ描いて、画素をまとめた数を返す（A の確認用）。
       いまの一着の生地の色が、ほんとうに絵に届いているかを見る。

    furnPix(type, stage){
      torsoForce = stage; ctx.clearRect(0,0,VW,VH);
      try{ drawFurniture({ type, x:2, y:2, hung:0 }); } finally { torsoForce = null; }
      const d = ctx.getImageData(0,0,cv.width,cv.height).data;
      let ink = 0, hash = 7;
      for(let i=0;i<d.length;i+=4){ if(d[i+3] < 8) continue; ink++;
        hash = (hash*31 + d[i]*3 + d[i+1]*5 + d[i+2]*7) | 0; }
      return JSON.stringify({ ink, hash });
    },
    /* いま誰がどの什器に付いているか（A の確認用）。
       工程ごとに主担当が現場にいるか、手伝いが2人までか、を数字で見る */
    stageWork(){

        stage: stageOf(), prog: +prog.toFixed(1), rush: stageRush(),
        spot: STAGES[stageOf()].spot, fab: jobFabCol(), bolt: jobFabCol(20),
        who: staff.map(s => ({ n:s.name, r:s.role, away:!!s.away, br:!!s.onBreak,
          st: s.station ? s.station.type : null, help:!!s.helping, on:!!s.onspot,
          crowd:!!s.crowded, ph:s.phase })),
      });
    },
    /* 工程0（素のボディ）との差分から、服の占める四角を測る。着せかたの検査用。
       目で見て「だいたい大丈夫」は何度も外しているので、数字で見る */
    torsoBox(n){
      const one = st => { torsoForce = st; ctx.clearRect(0,0,VW,VH);
        try{ drawFurniture({ type:"torso", x:3, y:3, hung:0 }); } finally { torsoForce = null; }
        return ctx.getImageData(0,0,cv.width,cv.height); };
      const A = one(0).data, img = one(n), B = img.data, w = cv.width, s = w/VW;
      const hit = (x,y) => { const i = (y*w+x)*4;
        return Math.abs(A[i]-B[i])+Math.abs(A[i+1]-B[i+1])+Math.abs(A[i+2]-B[i+2]) > 14; };
      let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9, cnt=0;
      for(let y=0;y<img.height;y++) for(let x=0;x<w;x++) if(hit(x,y)){
        cnt++; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
      const p = iso(3.4,3.4,17), floorY = iso(3.4,3.4,0).y, H = 38, W = 12.6;
      const reach = t => { const yy = Math.round((p.y-H*t)*s);
        if(yy < 0 || yy >= img.height) return 0;
        let m = -1; for(let x=Math.round(p.x*s); x<w; x++) if(hit(x,yy)) m = x;
        return m < 0 ? 0 : (m/s - p.x); };
      return JSON.stringify({ n:cnt, x0:x0/s, x1:x1/s, y0:y0/s, y1:y1/s,
        bust:reach(0.74), hip:reach(0.10), px:p.x, py:p.y, H, W, floorY });
    },
  });
}, 0);

/* ── 覚えたかどうか ───────────────────────────────── */
let dex = null;
function dexReset(){ dex = { form:{}, fab:{}, twist:{}, stage:{} }; }
function dexHas(kind, key){ return !!(dex && dex[kind] && dex[kind][key]); }
function dexCount(kind){ return dex && dex[kind] ? Object.keys(dex[kind]).length : 0; }
function dexAdd(kind, key){
  if(!dex) dexReset();
  if(key == null || dex[kind][key]) return false;
  dex[kind][key] = 1; return true;
}
/* 図鑑に載る型は、選べる型だけ（もとの4着は選べないので数えない） */
function dexForms(){ return GLIB.map((x,i)=>i).filter(i => GLIB[i].f && DEX_FORM[GLIB[i].n]); }
function dexTotal(){ return dexForms().length + GFAB.length + DEX_TWIST.length + DEX_STAGE.length; }
function dexKnown(){ return dexCount("form") + dexCount("fab") + dexCount("twist") + dexCount("stage"); }

/* 一着ができたときに呼ぶ（core/time.js の complete）。作った分だけ増える */
function dexLearn(piece, design){
  if(!piece) return;
  let n = 0;
  for(const i of [piece.a, piece.b]) if(GLIB[i] && GLIB[i].f && dexAdd("form", GLIB[i].n)) n++;
  if(GFAB[piece.f] && dexAdd("fab", GFAB[piece.f].n)) n++;
  if(design && design.twist != null && dexAdd("twist", design.twist)) n++;
  if(n){ log("図鑑に "+n+" つ増えた（"+dexKnown()+" / "+dexTotal()+"）");
         toast("図鑑に "+n+" つ増えました"); }
  return n;
}
/* 工程を越えたときに呼ぶ（game/show.js の checkStage、core/time.js の complete） */
function dexStage(i){
  if(i == null || !DEX_STAGE[i]) return;
  if(dexAdd("stage", i)) log("図鑑：工程「"+STAGES[i].name+"」を覚えた（"+dexKnown()+" / "+dexTotal()+"）");
}

  const th = dexThemesOf(G.n, THEME_FORMS);
  return "《"+GCAT_JP[G.c]+"》の型。"+
    (st === "hard" ? "張りのある生地で形が立ち、とろける生地ではくずれます（シルエット +8% ／ −10%）。"
   : st === "soft" ? "落ち感のある生地が形を助け、固い生地では落ちません（シルエット +8% ／ −10%）。"
   : "生地の張りを選びません。どの生地でも形が壊れにくい型です。")+
    (th.length ? "　テーマ《"+th.join("》《")+"》のとき、候補に出ます。"
               : "　テーマからは出ません。思いつきや、図鑑の持ちネタとして出ます。");
}
function dexFabGame(f){
  const F = GFAB[f], w = [];
  w.push(F.drape <= .25 ? "張りが強い" : F.drape <= .45 ? "ほどよい張り"
       : F.drape <= .70 ? "落ち感がある" : "とろけるように落ちる");
  if(F.gloss >= .6) w.push("よく光る"); else if(F.gloss >= .3) w.push("少し光る");
  if(F.sheer >= .5) w.push("よく透ける"); else if(F.sheer >= .05) w.push("わずかに透ける");
  const tech = Math.round((F.hard - 2) * 5);
  const th = dexThemesOf(F.n, THEME_FABS);
  return w.join("・")+"。扱いの難しさ "+F.hard+"／5。生地代 "+yen(fabPrice(f))+"（反物が届いたときに払います）。"+
    (tech > 0 ? "　縫う人の腕が要ります（仕立て −"+tech+"%）。"
     : tech < 0 ? "　誰が縫っても崩れません（仕立て +"+(-tech)+"%）。" : "")+
    ((F.gloss > .4 || F.sheer > .3) ? "　表情のある生地なので 素材感 +4%。" : "")+
    (th.length ? "　テーマ《"+th.join("》《")+"》に合います（素材感 +12%）。" : "");
}
function dexTwistGame(k){
  const T = TWISTS[k], ch = [];
  for(const s of STATS) if(T.mul[s]) ch.push(STATJP[s]+(T.mul[s] > 1 ? "+" : "")+Math.round((T.mul[s]-1)*100)+"%");
  return T.d+"　"+(ch.length ? ch.join("／") : "数字は変わりません")+"。";
}
function dexStageGame(i){
  const S = STAGES[i];
  const furn = S.spot.map(t => (FURN[t] && FURN[t].name) || t);
  /* ROLES[].jp は能力の名前（シルエットなど）なので、ここで使うと
     「主に動くのは シルエット（シルエット）」になる。職名は JOBS の側にある */
  return "進行 "+(i*20)+"〜"+(i*20+20)+"%。主に動くのは "+(JOBS[S.role] ? JOBS[S.role].short : S.role)+
    "で、"+STATJP[S.stat]+"が伸びます。"+
    "この段のあいだ、担当と見習いは "+furn.join("・")+" に集まります。"+
    "締めで差し戻されると、ここまで戻ります。";
}

/* ==================================================================
   10.6 一着の金の流れと、季節の輪（先生の指示 2026-09-13：アトリエ編を面白く、の C）

   これまで服は「作れば報酬が入る」だけで、金が出ていくのは給料と什器だけだった。
   ここで、服飾の仕事で実際に起きる4つを入れる：
     1. 生地代 ── 生地は反物で買う。届いたときに払う（発注 → 納品 → 支払い）。
        高い生地ほど表情があるが、差し戻しで取り直せば、その分がまるごと無駄になる
     2. 前金と残金 ── 別注は受けたときに3割、納めたときに残り。遅れれば残金が消え、
        前金を返すことさえある
     3. 名声の目減り ── 何も出さなければ名前は薄れる。出し続ける人だけが残る
     4. 季節の輪 ── パリのあとは終わりではなく、春夏・秋冬が半年ごとに巡る。
        「ずっと続けられるか」がここから先の話
   あわせて、業界のできごとを一つだけ戻す：生地の廃番（4 の輪の中で、いちばんよく起きること）。
   できごとの抽選（story/engine.js の evEnabled）はまだ止めたまま。
   ================================================================== */

/* ── 1. 生地代（一着ぶん、円）。扱いやすい生地は安く、表情のある生地は高い ── */
const FAB_PRICE = {
  "コットン":4000, "リネン":6000, "デニム":5500, "メルトン":9000, "ツイード":11000,
  "シルクサテン":16000, "シフォン":12000, "チュール":7000, "オーガンジー":10000,
  "ベルベット":15000, "ジャージー":4500, "ケーブルニット":8000, "タフタ":9500,
  "レザー":22000, "ナイロン":6500, "コーデュロイ":7000, "ラメ":14000, "ギンガム":4500,
};
function fabPrice(f){ const F = GFAB[f]; return (F && FAB_PRICE[F.n]) || 6000; }

const DISC_P = 0.10;                /* 生地が届く段で廃番になっている確率 */
let discForce = null;               /* 確認スクリプトが廃番を決め打ちするとき */

/* いまの生地に近いもの。落ち感を最優先に、扱いやすさ・光沢・透けで距離をとる */
function similarFabric(f){
  const F = GFAB[f];
  let best = -1, bd = 1e9;
  GFAB.forEach((G, i) => {
    if(i === f) return;
    const d = Math.abs(G.drape-F.drape)*2 + Math.abs(G.hard-F.hard)*0.15
            + Math.abs(G.gloss-F.gloss) + Math.abs(G.sheer-F.sheer)*1.5;
    if(d < bd){ bd = d; best = i; }
  });
  return best;
}
/* 生地を替える。相性の倍率も引き直す（game/design.js） */
function swapFabric(alt){
  const D = job.design;
  D.f = alt;
  D.fabFit = fitFabs().indexOf(GFAB[alt].n) >= 0;
  D.mul = designMuls({ a:D.a, f:D.f, formFit:D.formFit, fabFit:D.fabFit, twist:D.twist });
}
/* 生地が届く。「生地えらび」の締め（進行 40%）で呼ばれる。差し戻して戻ってくれば、また払う */
function fabricArrive(){
  if(!job || !job.design) return;
  job.fabN = (job.fabN||0) + 1;
  let F = GFAB[job.design.f], pre = "";
  const disc = discForce != null ? discForce : (Math.random() < DISC_P);
  if(disc && !job.disc){
    job.disc = 1;
    const alt = similarFabric(job.design.f);
    const tx = staff.find(s => s.role === "textile" && !s.away);
    pre = "問屋から電話。《"+F.n+"》は廃番になっていた。"+(tx ? tx.name : "テキスタイル")+
          "が似た《"+GFAB[alt].n+"》を探してきた。";
    swapFabric(alt); F = GFAB[alt];
    toast("☎ 《"+GFAB[job.design.f].n+"》に替えて続行");
    if(tx) say(tx, pick(["廃番って…","代わり、探します","落ち感は近いはず"]), true);
    log(pre, true);
  }
  const p = fabPrice(job.design.f);
  money -= p; job.fabCost = (job.fabCost||0) + p;
  log((job.fabN > 1 ? "《"+F.n+"》を取り直した。" : "《"+F.n+"》が届いた。")+"生地代 "+yen(p)+
      (job.fabN > 1 ? "（"+job.fabN+"回目。前の反物は無駄になった）" : ""), job.fabN > 1);
  toast("🧵 生地代 "+yen(p)+(job.fabN > 1 ? "　取り直し" : ""));
  renderHUD();
}

/* ── 2. 前金と残金。別注は受けたときに3割 ── */
const ADVANCE_R = 0.3;
function advanceOf(reward){ return Math.round(reward * ADVANCE_R / 500) * 500; }

/* ── 3. 名声の目減り。ふだんは週に 0.8%、4週なにも出していなければ 2.5% ── */
function fameDecay(){
  if(fame <= 10) return;
  const last = workList.length ? workList[0].week : 0;
  const idle = dayNo() - last;
  const k = idle >= 4 ? 0.025 : 0.008;
  const d = Math.max(1, Math.round(fame * k));
  fame -= d;
  if(idle >= 4 && (idle - 4) % 3 === 0)
    log("しばらく新しい一着が出ていない。名声が薄れていく（−"+d+"）", true);
}

/* ── 4. 季節の輪。パリのあとは、26週ごとに春夏・秋冬のコレクション ──
   春・夏に見せるのは秋冬物、秋・冬に見せるのは春夏物（story/events.js の SEASONS と同じずれ）。
   目標はパリの 320 から少し下げて、輪を重ねるごとに戻す。会場費と賞金はパリより軽い */
const SEASON_GAP = 26;
let seasonShow = null;
function curShow(){ return showIdx < SHOWS.length ? SHOWS[showIdx] : seasonShow; }
function nextSeasonShow(){
  const due = dayNo() + SEASON_GAP;
  const aw = seasonIdx(due) <= 1;
  const cyc = Math.max(0, showIdx - SHOWS.length);
  const yr = Math.floor((due-1)/YEAR_W) + 1;
  seasonShow = { w:due, season:true,
    name: "パリ "+(aw ? "秋冬" : "春夏")+"コレクション",
    place: aw ? "マレの、倉庫を改装した会場" : "セーヌ沿いのギャラリー",
    need: 300 + Math.min(4, cyc)*8, prize: 480000 + cyc*20000, cost: 260000,
    title: yr+"年目の"+(aw ? "秋冬" : "春夏")+"をパリで見せた" };
  showDue = due;
  log("次は"+SEASON_GAP+"週後、《"+seasonShow.name+"》。半年先の服を、いまから作る。");
}

EXTRA_RESETS.push(() => { seasonShow = null; discForce = null; });

/* 確認スクリプトの口 */
setTimeout(() => {

  Object.assign(window.__catalog.dev, {
    fabPrice(f){ return fabPrice(f); },

    curShow(){ const S = curShow(); return S ? JSON.stringify({ name:S.name, need:S.need, w:S.w, cost:S.cost, prize:S.prize, due:showDue, idx:showIdx }) : null; },
    fameDecay(){ const b = fame; fameDecay(); return b - fame; },

/* ==================================================================
   4.5 スタッフの得意・苦手・手癖（先生の指示 2026-09-13：アトリエ編を面白く、の D）

   これまでスタッフは「職種 × レベル × 性格」で、同じ職種なら誰でも同じ働きだった。
   ここで一人ひとりに、
     得意 ── 生地の系統（テキスタイル・縫製・刺繍）、型の系統（パタンナー）、操作（デザイナー）
     苦手 ── 得意の反対側
     手癖 ── 数値には効かない、その人らしい癖。札の一文と、作業中のひとりごと

   一着を決める札（game/design.js）に「誰の得意か・苦手か」が出るので、

   生地の系統（張り／落ち感／透け／光沢／ニット）は、そのまま服飾の基礎の言葉。
   ================================================================== */
const FAB_FAM = [

/* 職種ごとに、何の得意を持つか。ここにない職種は手癖だけ */

const KNACK_FAM  = { twist:TWIST_FAM, form:FORM_FAM, fab:FAB_FAM };

/* 手癖。数値には効かない。札の一文と、作業中のひとりごと */
const QUIRKS = [

function rollKnack(role){
  const kind = KNACK_KIND[role];
  const q = Math.floor(Math.random() * QUIRKS.length);
  if(!kind) return { kind:null, fav:null, weak:null, quirk:q };
  const fam = pick(KNACK_FAM[kind]);
  return { kind, fav:fam.k, weak:fam.vs, quirk:q };
}
function famOf(kind, k){ return KNACK_FAM[kind].find(x => x.k === k) || null; }
function knackFav(s){ return s.knack && s.knack.kind ? famOf(s.knack.kind, s.knack.fav) : null; }
function knackWeak(s){ return s.knack && s.knack.kind && s.knack.weak != null ? famOf(s.knack.kind, s.knack.weak) : null; }
function quirkOf(s){ return s.knack ? QUIRKS[s.knack.quirk] : null; }

/* その人にとって、この選択は 得意(+1)／苦手(−1)／どちらでもない(0)。sel は {a,f,twist} のどれか */
function knackHit(s, sel){
  const K = s.knack; if(!K || !K.kind || !sel) return 0;
  const hit = (fam, v) => fam && fam.test ? fam.test(v) : (fam && fam.k === v);
  let v;
  if(K.kind === "fab"){ if(sel.f == null) return 0; v = GFAB[sel.f]; }
  else if(K.kind === "form"){ if(sel.a == null) return 0; v = sel.a; }
  else { if(sel.twist == null) return 0; v = sel.twist; }
  if(hit(knackFav(s), v)) return 1;
  if(hit(knackWeak(s), v)) return -1;
  return 0;
}
/* 要素 k の倍率。その要素を担う人ぜんいんの得意・苦手をかけ合わせる（完成と差し戻しに効く） */
function staffMul(k, sel){
  sel = sel || (job && job.design);
  if(!sel) return 1;
  let m = 1;
  for(const s of staff){
    if(ROLES[s.role].stat !== k) continue;
    const h = knackHit(s, sel);
    if(h > 0) m *= 1.10; else if(h < 0) m *= 0.94;
  }
  return +m.toFixed(3);
}
/* 一着を決める札に出す、人の名前の付いた札 */
function knackChips(sel){
  return staff.map(s => {
    const h = knackHit(s, sel); if(!h) return "";
    return '<span class="fxc kc" style="background:'+(h > 0 ? ROLES[s.role].color : "#b08fa4")+'">'+
      esc(s.name)+(h > 0 ? " 得意" : " 苦手")+'</span>';
  }).join("");
}
/* 決めた瞬間の反応。得意な人は喜び、苦手な人は正直に言う */
function knackReact(sel){
  for(const s of staff){
    if(s.away || s.onBreak) continue;
    const h = knackHit(s, sel);
    if(h > 0) say(s, pick(["得意なやつだ","これなら任せて","いい選択です","腕が鳴る"]));
    else if(h < 0) say(s, pick(["…苦手なんですよね","がんばります…","少し時間ください","誰か代わって…"]), true);
  }
}
/* 完成のとき、効いた得意・苦手を一言で */
function knackNote(sel){
  const out = [];
  for(const s of staff){
    const h = knackHit(s, sel); if(!h) continue;
    const r = ROLES[s.role], fam = h > 0 ? knackFav(s) : knackWeak(s);
    out.push(r.short+"の"+s.name+"は"+fam.n+"が"+(h > 0 ? "得意。"+r.jp+"が伸びた。" : "苦手。"+r.jp+"が荒れた。"));
  }
  return out;
}
function knackText(s){
  const f = knackFav(s), w = knackWeak(s), q = quirkOf(s);
  const a = [];
  if(f) a.push("得意：<b>"+f.n+"</b>（"+f.ex+"）");
  if(w) a.push("苦手：<b>"+w.n+"</b>");
  if(q) a.push("手癖：<b>"+q.n+"</b>　"+q.d);
  return a.join("<br>");
}
function knackShort(s){ const f = knackFav(s); return f ? "得意 "+f.n : ""; }

function slog(g, t){ g.log.push((g.y)+"年"+SC_MONTHS[g.d-1]+"月 "+t); }
function scGain(g, k, v){
  if(k === "stam"){ g.stam = scClamp(g.stam + v, 0, 100); g.today.stam = (g.today.stam||0)+v; return; }
  if(k === "money"){ g.money += v; g.today.money = (g.today.money||0)+v; return; }
  if(!(k in g.s)) return;
  let m = 1; if(v > 0 && g.s[k] >= 80) m = SN["逓減80"]; else if(v > 0 && g.s[k] >= 60) m = SN["逓減60"];
  g.s[k] = scClamp(g.s[k] + v*m, 0, 100); g.today[k] = (g.today[k]||0) + v*m;
}
function taskNow(g){ return (SC_TASKS[g.y]||[]).find(t => g.d >= t.from && g.d <= t.to) || null; }
function taskProg(g){ const t = taskNow(g); if(!t) return 0; return scClamp((g.d - t.from + 0.5)/(t.to - t.from + 1), 0, 1); }
function scPer(g, k, v){ g.per[k] = scClamp(g.per[k] + v, -8, 8); }

/* ---------- 課題の出来と掲示板 ---------- */
function scOutcome(g, t, hands){
  const st = t.req.map(k => k === "stam" ? g.stam : g.s[k]);
  let v = (st[0]+st[1])/2 * SN["出来:能力の係数"];
  v += Math.min(SN["出来:手数の上限"], hands) * SN["出来:手数×"];
  v += Math.max(0, t.to - t.from + 1 - ((g.collapseIn||{})[t.n]||0)) * SN["出来:授業×"];
  if(t.team && g.team){ const p = g.peers.find(x=>x.id===g.team); v += (p && p[t.req[0]] >= 28) ? 8 : -4; if(g.team==="natsume") v -= 3; }
  if(g.stam < 30) v += SN["出来:体力30未満"];
  return Math.round(v);
}
function peerOutcome(g, p, t){
  const st = t.req.map(k => p[k]);
  let v = (st[0]+st[1])/2 * SN["出来:能力の係数"] + SN["同期の下駄"] + (t.to-t.from+1)*SN["出来:授業×"];
  if(p.id==="natsume") v -= 9; if(p.id==="toki" && t.req.includes("tech")) v += 10;
  if(p.id==="yori" && t.req.includes("sense")) v += 15; if(p.id==="tae") v += 8;
  v += (scRnd()-0.5)*2*SN["同期のゆれ"];
  return Math.round(v);
}
function scGrade(v){ return v >= SN["評価S"] ? "S" : v >= SN["評価A"] ? "A" : v >= SN["評価B"] ? "B" : "C"; }
function closeTask(g, t){
  const hands = g.handsIn[t.n] || 0;
  const mine = scOutcome(g, t, hands);
  const rows = [{ n:g.name, v:mine, me:true }].concat(g.peers.map(p => ({ n:p.n, v:peerOutcome(g, p, t) })));
  rows.sort((a,b)=>b.v-a.v);
  const rank = rows.findIndex(r=>r.me)+1;
  const gr = scGrade(mine);
  g.grades.push({ y:g.y, n:t.n, v:mine, g:gr, rank });
  if(gr==="S"){ g.gradeS++; g.money += SN["奨学金(S)"]; } if(gr==="S"||gr==="A") g.gradeA++;
  g.rack++; g.works.push({ y:g.y, n:t.n, v:mine, g:gr });
  slog(g, "課題「"+t.n+"」出来 "+mine+"（"+gr+"・"+rank+"位）");
  return { rows, mine, gr, rank, hands };
}

function scAdvance(g, i){
  const p = g.pending; if(!p) return;
  if(g.end){ if(typeof scOnEnd === "function") scOnEnd(); return; }
  const o = p.opts[i]; if(!o) return;
  if(o.run && o.run() === false){ toast("お金が足りない"); return; }
  if(p.after) p.after(i);
  scNext(g);
}
function scNext(g){
  g.pending = null;
  while(!g.pending && !g.end) scStep(g);
}
