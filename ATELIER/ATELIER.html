       建物としての大きさを取り戻す。どちらも敷地の中なので位置関係は崩れない（05） */
    box(p.x, p.y+0.05, p.w, p.d-0.10, 4, shade(W,.84), 0);
    for(let wi = 0; wi < 2; wi++){
      const wx = wi ? RX-0.52 : p.x+0.04;
      box(wx, p.y+0.30, 0.48, p.d-0.34, 30, shade(W,.99), 4);
      box(wx-0.05, p.y+0.26, 0.58, p.d-0.26, 3, shade(RF,1.02), 34);
      if(wi) bWindowR(wx+0.483, p.y+0.52, 12, 0.62, 12, lit(30));
      else   bWindow(wx+0.06, p.y+p.d-0.038, 12, 0.34, 12, lit(31));
    }
    cyl(cxv, cyv, r, p.h, W, 0);
    /* 壁の丸みを、明るい帯でひとつ */
    ctx.save();
    for(let k=0;k<5;k++){
      const a0 = 0.55+k*0.16, a1 = a0+0.16, al = [0.05,0.09,0.12,0.09,0.05][k];
      const P0 = [cxv+Math.cos(a0)*r, cyv+Math.sin(a0)*r], P1 = [cxv+Math.cos(a1)*r, cyv+Math.sin(a1)*r];
      poly([iso(P0[0],P0[1],4), iso(P1[0],P1[1],4), iso(P1[0],P1[1],p.h-16), iso(P0[0],P0[1],p.h-16)], "rgba(255,255,255,"+al+")");
    }
    ctx.restore();
    /* 基壇のリング（手前半分だけ） */
    bRing(cxv, cyv, r*1.03, 0, 4, shade(W,.82));
    /* マーキー：明るい帯（手前半分だけ）と電球 */
    bRing(cxv, cyv, r*1.05, p.h-16, p.h-9, "#f4ede0");
    /* マーキーの電球。開演が近づくと、ひとつずつ点いていく */
    { let k = 0;
      for(let a=-0.75; a<2.35; a+=0.19){
        if(a > 0.5 && a < 1.06) continue;
        const q = iso(cxv+Math.cos(a)*r*1.058, cyv+Math.sin(a)*r*1.058, p.h-12.5);
        const on = TL.sign > 0.10 + winSeed("venue", k++)*0.40;

        if(on){ ctx.fillStyle = "rgba(255,226,120,.35)";
          ctx.beginPath(); ctx.arc(q.x, q.y, 2.6, 0, 6.2832); ctx.fill();
 }
      }
    }
    { const q = iso(cxv+0.7071*r*1.062, cyv+0.7071*r*1.062, p.h-12.5);
      ctx.save(); ctx.fillStyle = tMix("#5b4460", "#7a4a3a", TL.sign); ctx.font = "800 5.5px sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("SHOW", q.x, q.y); ctx.restore(); }
    /* ポスター（右前の壁面に） */
    { const a = 0.12, k = -0.5*Math.cos(2*a), c = iso(cxv+Math.cos(a)*r*1.012, cyv+Math.sin(a)*r*1.012, 30);
      const hw = 7.5, hh = 12;
      const pt = (dx,dy) => ({x:c.x+dx, y:c.y+dy+dx*k});
      poly([pt(-hw,-hh), pt(hw,-hh), pt(hw,hh), pt(-hw,hh)], "#f6efe6");
      poly([pt(-hw,-hh), pt(hw,-hh), pt(hw,-hh+3.5), pt(-hw,-hh+3.5)], "#c98ba4");
      ctx.save(); ctx.translate(c.x, c.y-1.5); ctx.transform(1, k, 0, 1, 0, 0);
      bPicto("dress", 5.2, "#5b4460", "#f6efe6");
      ctx.fillStyle = "#8b7d92"; ctx.fillRect(-5, 7.5, 10, 1.1); ctx.restore();
    }
    /* 入口ポーチ：箱・扉・しまのキャノピー・柱・赤いカーペット */
    { const py = cyv + r - 0.34;
      box(cxv-0.45, py, 0.9, 0.40, 22, shade(W,1.02), 0);
      const fy = py + 0.40;
      /* 開演中は、マーキーの明かりが入口の前の地面に落ちる */
      townLampPool(cxv, fy + 0.5, 0.85, TL.sign * TL.shut);
      bDoor(cxv-0.28, fy, 0.56, "#3a3242", {glass:true, awning:false});
      /* 赤いカーペット。開演のときだけ手前へ伸びる。ふだんは巻いて端に置いてある */
      { const e = fy + 0.22 + 0.40*TL.shut;
        poly([iso(cxv-0.2, fy+0.22, 0.3), iso(cxv+0.2, fy+0.22, 0.3), iso(cxv+0.2, e, 0.3), iso(cxv-0.2, e, 0.3)], "#b04a5a");
        poly([iso(cxv-0.2, fy+0.22, 0.31), iso(cxv-0.17, fy+0.22, 0.31), iso(cxv-0.17, e, 0.31), iso(cxv-0.2, e, 0.31)], "#d6a24a");
        poly([iso(cxv+0.17, fy+0.22, 0.31), iso(cxv+0.2, fy+0.22, 0.31), iso(cxv+0.2, e, 0.31), iso(cxv+0.17, e, 0.31)], "#d6a24a");
        if(TL.shut < 0.94) box(cxv-0.2, e, 0.4, 0.07, 3.4, "#8e3c4a", 0); }   /* 巻いた残り */
      for(const u of [-0.47, 0.47]) cyl(cxv+u, fy+0.36, 0.03, 22, "#d8d0c4", 0);
      box(cxv-0.52, fy, 1.04, 0.42, 2.4, "#5a4468", 22);
      const ws = 1.04/6;
      for(let i=0;i<6;i++) poly([iso(cxv-0.52+i*ws, fy, 24.4), iso(cxv-0.52+(i+1)*ws, fy, 24.4),
                                 iso(cxv-0.52+(i+1)*ws, fy+0.42, 24.4), iso(cxv-0.52+i*ws, fy+0.42, 24.4)],
                                i%2 ? "#7b5c8e" : "#ece3f0");

    cyl(cxv, cyv, r*0.82, 7, shade(RF,1.06), p.h+6);
    cyl(cxv, cyv, r*0.56, 7, shade(RF,1.12), p.h+13);
    cyl(cxv, cyv, r*0.26, 8, shade(RF,1.2), p.h+20);
    { const q = iso(cxv, cyv, p.h+30);
      ctx.fillStyle = "#e6c46a"; ctx.beginPath(); ctx.arc(q.x, q.y-2, 2.4, 0, 6.2832); ctx.fill(); }
    return;
  }

  /* ---------------- ショップ：日よけ・ショーウィンドウ（暗いガラス）・BOUTIQUE ---------------- */
  if(p.id === "shop"){
    box(p.x, p.y, p.w, p.d, p.h, W, 0);
    bBaseAO(p);
    /* 腰壁の帯 */
    poly([fq(0,4), fq(p.w,4), fq(p.w,0), fq(0,0)], shade(W,.86));
    for(const u of [0.16, p.w-0.16-0.72]){
      const q = (a,z)=>iso(p.x+u+a, F+0.006, z);
      poly([q(-0.03,p.h-16), q(0.75,p.h-16), q(0.75,3), q(-0.03,3)], "#f4efe6");
      poly([q(0,p.h-17), q(0.72,p.h-17), q(0.72,4), q(0,4)], glow("#5a6470", "#f0cf8a"));
      poly([q(0,p.h-17), q(0.34,p.h-17), q(0.12,4), q(0,4)], "rgba(200,222,240,.38)");
      poly([q(0.5,p.h-17), q(0.72,p.h-17), q(0.72,p.h*0.5), q(0.62,p.h*0.4)], "rgba(200,222,240,.22)");
      ctx.strokeStyle = "#f4efe6"; ctx.lineWidth = 1.1;
      { const a=q(0.36,p.h-17), b=q(0.36,4); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      /* 閉店中はショーウィンドウごとシャッターで塞ぐ */
      bShutter(p.x+u, F, 4, 0.72, p.h-21, TL.shut, "#b6aeb2");
      /* 窓の下の花箱 */
      box(p.x+u, F, 0.72, 0.10, 3, "#8a6a4a", 3);
      for(let k=0;k<4;k++){
        cyl(p.x+u+0.1+k*0.17, F+0.05, 0.06, 3, "#7fae66", 6);
        const d = iso(p.x+u+0.1+k*0.17, F+0.05, 10);
        ctx.fillStyle = k%2 ? "#e07a92" : "#f2c14e"; ctx.beginPath(); ctx.arc(d.x, d.y, 1.1, 0, 6.2832); ctx.fill();
      }
    }
    bDoor(mid-0.2, F, 0.4, "#7a5a70", {glass:true, awning:false});
    /* 日よけは開店してから張り出す。閉めるとほとんど畳まれて壁に沿う */
    bAwning(p.x+0.1, F, p.w-0.2, p.h-15, 0.05 + 0.25*TL.shut, 7, "#c98ba4", "#f2e6ea");

    bFlatRoof(p, RF, 0.08);
    /* 鉢植えと、開店中だけ出すA型看板 */
    cyl(RX-0.16, F+0.16, 0.09, 6, "#b47a5c", 0);
    cyl(RX-0.16, F+0.16, 0.13, 6, "#7fae66", 6);
    if(TL.shut > 0.5){
      box(p.x+0.22, F+0.30, 0.18, 0.10, 8, "#5b4a4e", 0);
      poly([iso(p.x+0.24,F+0.406,7), iso(p.x+0.38,F+0.406,7), iso(p.x+0.38,F+0.406,1.5), iso(p.x+0.24,F+0.406,1.5)], "#f6efe6");
    }
    return;
  }

  /* ---------------- カフェ：木のファサード・しまの日よけ・テラス席とパラソル ---------------- */
  if(p.id === "cafe"){
    box(p.x, p.y, p.w, p.d, p.h, W, 0);
    bBaseAO(p);
    poly([fq(0,p.h-8), fq(p.w,p.h-8), fq(p.w,2), fq(0,2)], "#8a6a4a");
    ctx.strokeStyle = "rgba(0,0,0,.12)"; ctx.lineWidth = 0.9;
    for(let u=0.1; u<p.w; u+=0.14){ const a=fq(u,p.h-8), b=fq(u,2);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    bWindow(p.x+0.12, F+0.007, 8, 0.5, 15, lit(0), {frame:"#f2e6d0"});
    bStorm(p.x+0.12, F+0.012, 8, 0.5, 15, TL.shut, "#7a5a3e");   /* 木の雨戸 */
    bDoor(p.x+0.75, F, 0.4, "#5b4a44", {glass:true, awning:false});
    bAwning(p.x+0.04, F, p.w-0.08, p.h-9, 0.05 + 0.19*TL.shut, 5, "#c96f66", "#f4e7d2");
    bFlatRoof(p, RF, 0.06);
    /* 黒板。閉めているあいだは店の中にしまう */
    if(TL.shut > 0.5){
      box(p.x+0.02, F+0.26, 0.24, 0.10, 12, "#3a3a3a", 0);
      ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 0.8;
      for(let k=0;k<3;k++){ const a=iso(p.x+0.06, F+0.366, 9.5-k*2.6), b=iso(p.x+0.22, F+0.366, 9.5-k*2.6);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    }
    /* 屋上テラス：丸テーブル2つ、いす、パラソル。手前の建物に隠れても、ここは見える */
    { const Z = p.h+3.5, tcx = p.x+0.62, tcy = p.y+0.5;
      /* 屋上の手すり */
      for(const [ax,ay,bx,by] of [[p.x+0.08,F-0.08,RX-0.08,F-0.08],[RX-0.08,p.y+0.08,RX-0.08,F-0.08]]){

        for(let t=0;t<=1.001;t+=0.2){ const q0=iso(ax+(bx-ax)*t, ay+(by-ay)*t, Z), q1=iso(ax+(bx-ax)*t, ay+(by-ay)*t, Z+6);
          ctx.beginPath(); ctx.moveTo(q0.x,q0.y); ctx.lineTo(q1.x,q1.y); ctx.stroke(); }
      }
      for(const [tx,ty] of [[tcx-0.28, tcy+0.22],[tcx+0.3, tcy-0.18]]){
        cyl(tx, ty, 0.03, 8, "#6a615a", Z); cyl(tx, ty, 0.12, 1.5, "#e9e0d2", Z+8);
        for(const dx of [-0.17, 0.17]) box(tx+dx-0.05, ty-0.05, 0.10, 0.10, 5, "#a9784c", Z);
      }
      cyl(tcx, tcy, 0.035, 24, "#8a8078", Z);
      /* パラソル。閉店するとすぼめて、細い束になる */
      const R = 0.09 + 0.37*TL.shut, drop = 24 + 4*(1-TL.shut);
      for(let k=0;k<8;k++){

        poly([iso(tcx,tcy,Z+30), iso(tcx+Math.cos(a0)*R, tcy+Math.sin(a0)*R, Z+drop), iso(tcx+Math.cos(a1)*R, tcy+Math.sin(a1)*R, Z+drop)],
             k%2 ? "#e08f8c" : "#f7ece2");
      }
      const t = iso(tcx, tcy, Z+31); ctx.fillStyle="#8a8078"; ctx.beginPath(); ctx.arc(t.x,t.y,1.4,0,6.2832); ctx.fill();
      /* 屋上の看板：CAFE */
      { const plate = tMix("#f4e7d2", "#fff4d8", TL.sign*0.5), ink = tMix("#6a4a3a", "#c9702a", TL.sign*0.8);
        box(p.x+0.08, F-0.16, 1.15, 0.08, 9, plate, Z);
        bIconF(p.x+0.34, F-0.074, Z+4.5, "cup", 2.7, ink, plate);

 }

  /* ---------------- 学校：寄棟の校舎・時計塔・柱のある玄関・旗・校門 ---------------- */
  if(p.id === "school"){
    box(p.x, p.y, p.w, p.d, p.h, W, 0);
    bBaseAO(p);
    poly([fq(0,7), fq(p.w,7), fq(p.w,0), fq(0,0)], shade(W,.86));
    /* 窓は中央を大きく空ける。1階は玄関、2階は校名の板が入る場所 */
    const SWIN = [0.12, 0.56, null, 1.92, 2.36];
    for(let f=0;f<2;f++) for(let i=0;i<5;i++){
      if(SWIN[i] == null) continue;
      bWindow(p.x+SWIN[i], F+0.006, 10+f*17, 0.34, 11, lit(i+f*5));
    }
    for(let f=0;f<2;f++) for(let i=0;i<2;i++)
      bWindowR(RX+0.006, p.y+0.25+i*0.6, 10+f*17, 0.36, 11, lit(20+f*2+i));
    /* 寄棟屋根 */
    { const L=0.1, r=8;
      const A=[p.x-L,p.y-L,p.h], B=[RX+L,p.y-L,p.h], C=[RX+L,F+L,p.h], D=[p.x-L,F+L,p.h];
      const a=[p.x+0.5,p.y+0.4,p.h+r], b=[RX-0.5,p.y+0.4,p.h+r], c=[RX-0.5,F-0.4,p.h+r], d=[p.x+0.5,F-0.4,p.h+r];
      const P = v => iso(v[0],v[1],v[2]);
      poly([P(A),P(B),P(b),P(a)], shade(RF,.9));      /* 奥 */
      poly([P(A),P(D),P(d),P(a)], shade(RF,.9));      /* 左 */
      poly([P(a),P(b),P(c),P(d)], shade(RF,.96));     /* 天 */

      poly([P(B),P(C),P(c),P(b)], shade(RF,.78));     /* 右 */
      ctx.strokeStyle="rgba(0,0,0,.08)"; ctx.lineWidth=0.8;
      for(let k=1;k<4;k++){ const t=k/4;

    /* 時計塔（手前寄り） */
    { const tx = mid, ty = p.y+0.75;
      box(tx-0.26, ty-0.26, 0.52, 0.52, 28, shade(W,1.04), p.h+8);
      box(tx-0.3, ty-0.3, 0.6, 0.6, 3, RF, p.h+32);

      poly([iso(tx-0.3,ty+0.3,p.h+35), iso(tx+0.3,ty+0.3,p.h+35), iso(tx,ty,p.h+50)], shade(RF,1.1));
      /* 文字盤は終夜あかりが入っている。学校が閉まっても、街の時計は止まらない */
      const q = iso(tx, ty+0.268, p.h+18);
      const dial = ramp(nt, 0.12, 0.45);

      ctx.fillStyle = "#8a7d6a";
      for(let k=0;k<12;k+=3){ const a=k/12*6.2832; ctx.beginPath(); ctx.arc(q.x+Math.sin(a)*4.2, q.y-Math.cos(a)*4.2, 0.55, 0, 6.2832); ctx.fill(); }

      ctx.lineTo(q.x+Math.sin((h/12)*6.2832)*3, q.y-Math.cos((h/12)*6.2832)*3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(q.x,q.y);
      ctx.lineTo(q.x+Math.sin(((h%1)*1)*6.2832)*4.2, q.y-Math.cos(((h%1)*1)*6.2832)*4.2); ctx.stroke(); }
    /* 玄関：扉、2本の柱と厚い庇。上の壁に学帽の紋章 */
    bDoor(mid-0.28, F, 0.56, "#6a5648", {awning:false});
    for(const u of [-0.42, 0.42]) cyl(mid+u, F+0.18, 0.045, 23, "#f2ede4", 0);
    box(mid-0.52, F, 1.04, 0.26, 3, "#e9e4dc", 23);
    bIconF(mid, F+0.266, 24.5, "cap", 2.6, "#4b3d52", "#e9e4dc");   /* 庇の前縁に学帽 */

    bSignF(mid-0.49, F, 27, 0.98, 10, "#f4efe6", SCHOOL_SIGN, 4.4, "#4b3d52", null, 0, TL.sign);
    /* 校門の柱、旗、校庭の木。旗は下校とともに降ろす */
    for(const u of [p.x+0.55, RX-0.55]) box(u-0.06, F+0.36, 0.12, 0.12, 12, "#bdb5a8", 0);
    cyl(p.x+0.28, F+0.32, 0.022, 58, "#d9d4cc", 0);
    { const fz = 6 + 52*TL.shut;
      poly([iso(p.x+0.28,F+0.32,fz), iso(p.x+0.62,F+0.32,fz-2.5), iso(p.x+0.28,F+0.32,fz-5.5)], "#c96f66"); }
    cyl(RX+0.36, F-0.3, 0.06, 12, "#8a6a4a", 0);
    cyl(RX+0.36, F-0.3, 0.30, 12, "#6f9a58", 11);
    cyl(RX+0.36, F-0.3, 0.20, 9, "#86b56e", 22);
    return;
  }

  /* ---------------- 生地問屋：板張りの倉庫・閉じたシャッター・大きな屋号 ---------------- */
  if(p.id === "fabric"){
    box(p.x, p.y, p.w, p.d, p.h, W, 0);
    bBaseAO(p);
    ctx.strokeStyle="rgba(0,0,0,.09)"; ctx.lineWidth=0.9;
    for(let z=6; z<p.h-4; z+=5){ const a=fq(0,z), b=fq(p.w,z);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    /* 右の面の三角（片流れの妻） */
    poly([iso(RX+0.004,p.y,p.h), iso(RX+0.004,p.y,p.h+7.4), iso(RX+0.004,F,p.h)], shade(W,.54));
    /* 片流れ屋根：奥が高く、手前へ下る波板 */
    poly([iso(p.x-0.1,p.y-0.1,p.h+8), iso(RX+0.1,p.y-0.1,p.h+8), iso(RX+0.1,F+0.1,p.h), iso(p.x-0.1,F+0.1,p.h)], RF);
    ctx.strokeStyle="rgba(0,0,0,.10)"; ctx.lineWidth=0.9;
    for(let u=0; u<p.w+0.2; u+=0.14){ const a=iso(p.x-0.1+u,p.y-0.1,p.h+8), b=iso(p.x-0.1+u,F+0.1,p.h);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    bFascia([p.x-0.1,F+0.1,p.h], [RX+0.1,F+0.1,p.h], 2.4, shade(RF,.7));
    bFascia([RX+0.1,p.y-0.1,p.h+8], [RX+0.1,F+0.1,p.h], 2.4, shade(RF,.55));
    /* 荷さばき口のシャッター。問屋は9時に開けて、夕方には下ろす */
    { const gx = p.x+0.3, w = 1.1;
      poly([iso(gx,F+0.006,26), iso(gx+w,F+0.006,26), iso(gx+w,F+0.006,0), iso(gx,F+0.006,0)],
           glow("#2c3038", "#c4a878"));
      bShutter(gx, F, 0, w, 26, TL.shut, "#9aa1a8");
    }
    bWindow(p.x+1.55, F+0.006, 10, 0.46, 12, lit(0), {frame:"#e0d6c6"});
    bSignF(p.x+0.2, F, p.h-14, 1.75, 11, "#f4ede0", "FABRIC", 5.4, "#7a5a3c", "bolt", 3.4, TL.sign);
    bWindowR(RX+0.006, p.y+0.45, 12, 0.5, 12, lit(1));
    /* 屋上の屋号。奥の高い縁に立てるので、手前の建物ごしにも見える */
    { const Z = p.h+5.5, by = p.y+0.16, bw = p.w-0.6;
      const plate = tMix("#f4ede0", "#fff4d8", TL.sign*0.5), ink = tMix("#7a5a3c", "#c98a3a", TL.sign*0.8);
      box(p.x+0.3, by, bw, 0.10, 16, plate, Z);
      const sw = ["#d9737f","#6f9fd8","#e0b354","#77c295","#b98ed4"];
      for(let i=0;i<5;i++) poly([iso(p.x+0.36+i*0.2, by+0.106, Z+15), iso(p.x+0.36+(i+1)*0.2, by+0.106, Z+15),
                                 iso(p.x+0.36+(i+1)*0.2, by+0.106, Z+11.5), iso(p.x+0.36+i*0.2, by+0.106, Z+11.5)], sw[i]);
      bIconF(p.x+0.58, by+0.106, Z+5.5, "bolt", 3.4, ink, plate);

    /* 外に積んだ反物のパレット（右どなり）。閉めるときに中へしまう */

    if(TL.shut > 0.35){
      const cols2 = ["#d9737f","#6f9fd8","#e0b354","#77c295","#b98ed4"];
      for(let i=0;i<5;i++)
        bolt(RX+0.14, p.y+0.33+(i%2)*0.2, RX+0.76, p.y+0.33+(i%2)*0.2, 3+Math.floor(i/2)*7, 3.4, cols2[i]);
    }
    return;
  }

  /* ---------------- 撮影スタジオ：打ち放しの箱・高窓・大きな搬入扉・天窓・STUDIO ---------------- */
  if(p.id === "studio"){
    box(p.x, p.y, p.w, p.d, p.h, W, 0);
    bBaseAO(p);
    ctx.strokeStyle=inkF; ctx.lineWidth=0.9;
    for(let u=0.3; u<p.w; u+=0.6){ const a=fq(u,p.h-2), b=fq(u,2);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    { const q=(u,z)=>fq(u,z);
      poly([q(0.2,p.h-6), q(p.w-0.2,p.h-6), q(p.w-0.2,p.h-18), q(0.2,p.h-18)], "#e9e4dc");
      poly([q(0.24,p.h-7), q(p.w-0.24,p.h-7), q(p.w-0.24,p.h-17), q(0.24,p.h-17)], glow("#c9d8e2", "#fff0c8"));
      ctx.strokeStyle="#e9e4dc"; ctx.lineWidth=1;
      for(let i=1;i<6;i++){ const a=q(0.24+(p.w-0.48)*i/6,p.h-7), b=q(0.24+(p.w-0.48)*i/6,p.h-17);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }

    bDoor(mid-0.4, F, 0.8, "#6a7078", {glass:false, awningCol:"#4b5058"});
    bSignF(mid-0.8, F, p.h-27, 1.6, 8, "#2f3238", "STUDIO", 5.2, "#f4f1ea", "camera", 3.0, TL.sign);
    bFlatRoof(p, RF, 0.08);
    /* 天窓：手前へ下るガラス面 */
    { const sx=p.x+0.4, sy=p.y+0.3, sw=p.w-0.8, sd=p.d-0.6;
      poly([iso(sx+sw,sy,p.h+11), iso(sx+sw,sy+sd,p.h+3.5), iso(sx+sw,sy,p.h+3.5)], shade(W,.7));
      poly([iso(sx,sy,p.h+11), iso(sx+sw,sy,p.h+11), iso(sx+sw,sy+sd,p.h+3.5), iso(sx,sy+sd,p.h+3.5)], glow("#b9cbd6", "#e0cfa0"));
      ctx.strokeStyle="#e9e4dc"; ctx.lineWidth=1;
      for(let i=1;i<5;i++){ const a=iso(sx+sw*i/5,sy,p.h+11), b=iso(sx+sw*i/5,sy+sd,p.h+3.5);

      { const a=iso(sx,sy,p.h+11), b=iso(sx+sw,sy,p.h+11); ctx.strokeStyle=shade(W,.7); ctx.lineWidth=1.4;

    /* 屋上のソフトボックス（スタンドの上の白い箱） */
    { const lx = p.x+0.32, ly = F-0.34, Z = p.h+3.5;
      cyl(lx, ly, 0.03, 16, "#4a4e56", Z);
      for(const [dx,dy] of [[-0.14,0],[0.1,0.1],[0.1,-0.1]]) { const a=iso(lx,ly,Z+2), b=iso(lx+dx,ly+dy,Z); ctx.strokeStyle="#4a4e56"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      /* ソフトボックスは、撮影が始まっているあいだ光っている（昼でも点く） */
      box(lx-0.16, ly-0.16, 0.32, 0.32, 5, "#f4f1ea", Z+16);
      poly([iso(lx-0.16,ly+0.164,Z+21), iso(lx+0.16,ly+0.164,Z+21), iso(lx+0.16,ly+0.164,Z+16), iso(lx-0.16,ly+0.164,Z+16)],
           tMix("#e4e0d8", "#fff6d2", TL.shut));

  /* ---------------- ショールーム：白い箱・上に帯窓・下に大きなロゴ・キャノピー ---------------- */
  if(p.id === "showroom"){
    box(p.x, p.y, p.w, p.d, p.h, W, 0);
    bBaseAO(p);
    { const n=5, sw=(p.w-0.28)/n;
      for(let i=0;i<n;i++){ const u=0.14+i*sw;
        poly([fq(u+0.02,p.h-20), fq(u+sw-0.02,p.h-20), fq(u+sw-0.02,24), fq(u+0.02,24)],

      }
      poly([fq(0.12,p.h-19), fq(p.w-0.12,p.h-19), fq(p.w-0.12,p.h-20), fq(0.12,p.h-20)], "#c9c4bc");
      poly([fq(0.12,24), fq(p.w-0.12,24), fq(p.w-0.12,23), fq(0.12,23)], "#c9c4bc");
    }
    bDoor(mid-0.28, F, 0.56, "#3a3a44", {glass:true, awning:false});
    box(mid-0.55, F, 1.1, 0.34, 1.6, "#4a4a52", 22);
    /* 上の帯に大きなロゴ（手前の建物に隠れにくい高さ） */
    { const plate = tMix(shade(W,.93), "#fff4d8", TL.sign*0.45);
      const ink   = tMix("#5e5a56", "#c98a3a", TL.sign*0.8);
      poly([fq(0,p.h-16), fq(p.w,p.h-16), fq(p.w,p.h-4), fq(0,p.h-4)], plate);
      bIconF(p.x+0.4, F+0.008, p.h-10, "dress", 5.2, tMix("#4b3d52","#c98a3a",TL.sign*0.8), plate);
      bTextF(p.x+p.w*0.6, F+0.008, p.h-10, "SHOWROOM", 5.6, ink);
 }
    bFlatRoof(p, RF, 0.10);
    box(mid-0.4, F+0.2, 0.8, 0.14, 1.2, "#3a3a44", 0);
    for(let i=0;i<3;i++){ const px = p.x+0.4+i*0.5;
      box(px-0.14, F-0.42, 0.28, 0.24, 4, "#8a8078", p.h+3.5);
      cyl(px, F-0.3, 0.1, 5, "#7fae66", p.h+7.5); }

  }

  /* ---------------- アトリエ：切妻（手前が妻面）・ドーマー・丸窓・はさみのATELIER ---------------- */
  box(p.x, p.y, p.w, p.d, p.h, W, 0);
  bBaseAO(p);
  bWindow(p.x+0.30, F+0.006, 12, 0.5, 14, lit(0), {frame:"#f6efe2"});
  bWindow(RX-0.80, F+0.006, 12, 0.5, 14, lit(1), {frame:"#f6efe2"});

  bStorm(RX-0.80, F+0.012, 12, 0.5, 14, TL.shut, "#8a6a4a");
  bDoor(mid-0.24, F, 0.48, "#7a5a44", {glass:true, awningCol:"#c9846f"});
  bWindowR(RX+0.006, p.y+0.45, 14, 0.5, 12, lit(2));
  bWindowR(RX+0.006, p.y+1.15, 14, 0.5, 12, lit(3));
  const L = 0.14, R = 18;
  /* 妻の三角（手前） */
  poly([fq(0,p.h), fq(p.w/2,p.h+R-1.5), fq(p.w,p.h)], shade(W,1.02));
  /* 屋根の2斜面。棟はy方向 */
  poly([iso(p.x-L,p.y-L,p.h-1), iso(mid,p.y-L,p.h+R), iso(mid,F+L,p.h+R), iso(p.x-L,F+L,p.h-1)], shade(RF,1.05));
  poly([iso(mid,p.y-L,p.h+R), iso(RX+L,p.y-L,p.h-1), iso(RX+L,F+L,p.h-1), iso(mid,F+L,p.h+R)], shade(RF,.76));
  ctx.strokeStyle="rgba(0,0,0,.09)"; ctx.lineWidth=0.9;
  for(let k=1;k<6;k++){
    const t=k/6;
    const a=iso(p.x-L+(mid-p.x+L)*t, p.y-L, p.h-1+(R+1)*t), b=iso(p.x-L+(mid-p.x+L)*t, F+L, p.h-1+(R+1)*t);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    const c2=iso(mid+(RX+L-mid)*t, p.y-L, p.h+R-(R+1)*t), d2=iso(mid+(RX+L-mid)*t, F+L, p.h+R-(R+1)*t);
    ctx.beginPath(); ctx.moveTo(c2.x,c2.y); ctx.lineTo(d2.x,d2.y); ctx.stroke();
  }
  { const a=iso(mid,p.y-L,p.h+R+1), b=iso(mid,F+L,p.h+R+1);
    ctx.strokeStyle=shade(RF,.6); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
  /* 軒先の厚み */
  bFascia([p.x-L,F+L,p.h-1], [mid,F+L,p.h+R], 2.4, shade(RF,.7));
  bFascia([mid,F+L,p.h+R], [RX+L,F+L,p.h-1], 2.4, shade(RF,.7));
  bFascia([RX+L,p.y-L,p.h-1], [RX+L,F+L,p.h-1], 2.4, shade(RF,.55));
  /* ドーマー窓（右の斜面、手前寄り） */
  { const dx = mid+0.55, dy = p.y+0.95;
    box(dx-0.2, dy-0.2, 0.4, 0.4, 10, shade(W,1.0), p.h+12);
    poly([iso(dx+0.26,dy-0.26,p.h+22), iso(dx+0.26,dy+0.26,p.h+22), iso(dx,dy+0.26,p.h+28), iso(dx,dy-0.26,p.h+28)], shade(RF,.86));
    poly([iso(dx-0.26,dy-0.26,p.h+22), iso(dx,dy-0.26,p.h+28), iso(dx,dy+0.26,p.h+28), iso(dx-0.26,dy+0.26,p.h+22)], shade(RF,1.12));
    bFascia([dx-0.26,dy+0.26,p.h+22],[dx,dy+0.26,p.h+28],1.6,shade(RF,.7));
    bFascia([dx,dy+0.26,p.h+28],[dx+0.26,dy+0.26,p.h+22],1.6,shade(RF,.7));
    bFascia([dx+0.26,dy-0.26,p.h+22],[dx+0.26,dy+0.26,p.h+22],1.6,shade(RF,.55));
    { const a=iso(dx,dy-0.26,p.h+28.6), b=iso(dx,dy+0.26,p.h+28.6);
      ctx.strokeStyle=shade(RF,.6); ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    poly([iso(dx-0.2,dy+0.206,p.h+22), iso(dx,dy+0.206,p.h+27), iso(dx+0.2,dy+0.206,p.h+22)], shade(W,1.0));
    poly([iso(dx-0.12,dy+0.206,p.h+20), iso(dx+0.12,dy+0.206,p.h+20), iso(dx+0.12,dy+0.206,p.h+14), iso(dx-0.12,dy+0.206,p.h+14)], lit(4) ? "#ffe6a8" : "#3a4250");
  }
  /* 妻の丸窓 */
  { const q = fq(p.w/2, p.h+6.5);
    ctx.fillStyle="#f6efe2"; ctx.beginPath(); ctx.arc(q.x,q.y,3.8,0,6.2832); ctx.fill();
    ctx.fillStyle= lit(5) ? "#ffe6a8" : "#3a4250"; ctx.beginPath(); ctx.arc(q.x,q.y,2.7,0,6.2832); ctx.fill();
    ctx.strokeStyle="#f6efe2"; ctx.lineWidth=0.8; ctx.beginPath(); ctx.moveTo(q.x-2.7,q.y); ctx.lineTo(q.x+2.7,q.y); ctx.moveTo(q.x,q.y-2.7); ctx.lineTo(q.x,q.y+2.7); ctx.stroke(); }
  bSignF(p.x+0.42, F, p.h-11, p.w-0.84, 9, "#fff6ee", "ATELIER", 5.2, "#4b3d52", "scissors", 3.5, TL.sign);
  /* 鉢植えとベンチ */
  cyl(RX-0.28, F+0.18, 0.1, 6, "#b47a5c", 0);
  cyl(RX-0.28, F+0.18, 0.16, 8, "#7fae66", 6);
  box(p.x+0.12, F+0.06, 0.36, 0.12, 4, "#a9784c", 0);
}

/* ==================================================================
   15.6 カードのかけあわせと交換。

   講義の「操作は3つ ―― 連想・置き換え・組み合わせ」の、組み合わせにあたる。
   ふたつのモチーフを混ぜるのではなく、
   **それぞれから別の要素を抜き取って組み合わせる** のが要点。
   だから「同じ要素どうし」はかけ合わせられないようにしてある。
   ================================================================== */

let crossSel = [];      /* かけあわせに選んだカードの key（最大2） */
let crossCards = {};    /* かけあわせから生まれたカード */
let traded = {};        /* 人からもらったカード。48枠とは別の棚 */
const CROSS_COST = 24000;

function allCards(){ return Object.assign({}, cards, traded, crossCards); }
function cardOf(key){ return cards[key] || traded[key] || crossCards[key] || null; }

/* 選んだ2枚が、かけあわせとして成立するか */
function crossCheck(a, b){
  if(!a || !b) return "カードを2枚えらんでください";
  if(a.theme === b.theme) return "同じモチーフからは、かけあわせられません";
  if(a.top === b.top) return "同じ要素どうしは、かけあわせられません（"+STATJP[a.top]+"と"+STATJP[b.top]+"）";
  return null;
}
function toggleCross(key){
  const i = crossSel.indexOf(key);
  if(i >= 0) crossSel.splice(i, 1);
  else {
    if(crossSel.length >= 2) crossSel.shift();
    crossSel.push(key);
  }
  renderPane();
}
/* かけあわせを、次のコレクションのお題にする */
function doCross(){
  const a = cardOf(crossSel[0]), b = cardOf(crossSel[1]);
  const ng = crossCheck(a, b);
  if(ng){ toast(ng); return; }
  if(job && job.kind === "order"){ toast("別注をかかえている間はできません"); return; }
  if(job && job.kind === "cross"){ toast("いま、かけあわせを作っています"); return; }
  if(money < CROSS_COST){ toast("資金が足りません（"+yen(CROSS_COST)+"）"); return; }
  money -= CROSS_COST;
  job = { kind:"cross", client:"かけあわせ",
          theme:a.theme+" × "+b.theme, need:null, reward:0, due:Infinity,
          cross:{ aT:a.theme, aK:a.top, bT:b.theme, bK:b.top } };
  prog = 0;
  designStart();
  crossSel = [];
  log("《"+job.theme+"》に取りかかった。"+
      a.theme+"から"+STATJP[job.cross.aK]+"、"+b.theme+"から"+STATJP[job.cross.bK]+"を抜き取る。");
  toast("かけあわせを始めました");
  for(const s of staff) if(Math.random()<0.5)
    say(s, pick(["そんな組み合わせある？","おもしろそう","一回やってみましょう","むずかしそう…"]));
  renderPane();
  if(!job.design) openDesign();        /* 型・生地・ひとひねりをその場で決める */
}
/* 抜き取った2要素は伸び、残りは要求が上がる。
   ＝いちばん弱いところで見られる、がここで強く効く */
function crossMul(k){
  if(!job || job.kind !== "cross") return 1;
  return (k === job.cross.aK || k === job.cross.bK) ? 1.22 : 0.88;
}
function crossName(rec){
  const c = rec.cross;
  const aj = { concept:"の発想で", form:"の形に", material:"の肌ざわりで", tech:"の手つきで" }[c.aK];
  const bj = { concept:"見た", form:"した", material:"包んだ", tech:"仕立てた" }[c.bK];
  return c.aT + aj + c.bT + "を" + bj + "もの";
}
function mintCross(rec){
  const key = rec.cross.aT+"×"+rec.cross.bT+"|"+rec.cross.aK+rec.cross.bK;
  const prev = crossCards[key];
  if(prev && prev.total >= rec.total) return null;
  const card = { key, theme:rec.title, top:rec.top, rar:rec.rar,
                 v:Object.assign({}, rec.v), total:rec.total, week:rec.week,
                 client:"かけあわせ", cross:rec.cross, name:crossName(rec), piece:rec.piece||null };
  crossCards[key] = card;
  return card;
}

/* ==================================================================
   交換。サーバーがないので、短い文字列にして手で渡す
   ================================================================== */
function cardCode(c){
  const o = { n:c.name, t:c.theme, k:c.top, r:c.rar, v:c.v,
              tt:c.total, c:c.client, w:c.week, x:c.cross || null };
  try { return "AT1." + btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
  catch(e){ return null; }
}
function readCode(txt){
  const s = String(txt||"").trim().replace(/\s+/g, "");
  if(s.slice(0,4) !== "AT1.") return null;
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(s.slice(4)))));
    if(!o || !o.n || !o.k || !STATJP[o.k]) return null;
    return o;
  } catch(e){ return null; }
}
function takeCode(txt){
  const o = readCode(txt);
  if(!o){ toast("コードが読めませんでした"); return; }
  const key = "T|" + o.t + "|" + o.k + "|" + o.n;
  if(traded[key]){ toast("そのカードは、もう持っています"); return; }
  traded[key] = { key, theme:o.t, top:o.k, rar:o.r||1, v:o.v||{},
                  total:o.tt||0, week:o.w||0, client:o.c||"どこかの誰か",
                  name:o.n, cross:o.x || null, gift:true };
  log("カード《"+o.n+"》をもらった。");
  toast("《"+o.n+"》をもらいました");
  renderPane();
}

/* 職業図鑑から本文を引く。名前が一致したものを開く */
function findJobText(name){
  for(const g of FUTURE_JOBS){
    const it = g.items.find(x => x.name === name);
    if(it) return { where:g.where, item:it };
  }
  for(const k in JOBS) if(JOBS[k].name === name) return { key:k };
  return null;
}

/* 拠点の中の什器。接地の影を先に、表面に情報を、記号になる部品をひとつ大きく */
/* 手前＋右の帯は C2 でやめた（2026-08-17）。接地の影は inside_draw.js が什器より先に床へ置く（room/shadow.js）。
   呼び出しは 16 か所そのまま残し、ここで何もしない */
function fxShadow(f, w, d, a){}
/* 木目：天板の上面に */
function grain(x, y, w, d, z, n){
  ctx.strokeStyle = "rgba(80,55,30,.10)"; ctx.lineWidth = .8;
  for(let i=0;i<(n||6);i++){ const v = y + d*(i+0.5)/(n||6);
    const a=iso(x,v,z), b=iso(x+w,v+0.02,z);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo((a.x+b.x)/2,(a.y+b.y)/2+1,b.x,b.y); ctx.stroke(); }
}
/* 手前の面のハイライト線（金属・ガラス） */
function edgeLight(x, y, w, z, a){
  const p0=iso(x,y,z), p1=iso(x+w,y,z);
  ctx.strokeStyle="rgba(255,255,255,"+(a==null?.45:a)+")"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
}
/* 畳んだ服。ふちに折り目の影 */
function foldedShirt(x, y, w, d, z, col){
  box(x, y, w, d, 4, col, z);
  box(x, y, w, d, 3.2, shade(col,1.08), z+4);
  ctx.strokeStyle="rgba(0,0,0,.14)"; ctx.lineWidth=.8;
  const a=iso(x+w*0.5,y,z+7.2), b=iso(x+w*0.5,y+d,z+7.2);
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  const c=iso(x,y+d*0.5,z+7.2), e=iso(x+w,y+d*0.5,z+7.2);
  ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(e.x,e.y); ctx.stroke();
}
/* ハンガーに掛かった服（壁バー用）。肩・襟・袖の形 */
function hungGarment(px, py, col, sw, len){
  ctx.strokeStyle="#9aa0a8"; ctx.lineWidth=1.1; ctx.lineCap="round";
  ctx.beginPath(); ctx.arc(px+1.2, py-1.4, 1.5, Math.PI*.9, Math.PI*2.1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px,py+3); ctx.stroke();
  ctx.strokeStyle="#c9a06c"; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(px-6,py+6.4); ctx.quadraticCurveTo(px,py+2.4,px+6,py+6.4); ctx.stroke();
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(px-5.8,py+6.6); ctx.quadraticCurveTo(px-1.4,py+4.8,px,py+5.6);
  ctx.quadraticCurveTo(px+1.4,py+4.8,px+5.8,py+6.6);
  ctx.lineTo(px+7+sw,py+len); ctx.lineTo(px-7+sw,py+len); ctx.closePath(); ctx.fill();
  poly([{x:px-5.8,y:py+6.6},{x:px-2.4,y:py+6},{x:px-3.2,y:py+len},{x:px-7+sw,y:py+len}], shade(col,1.15));
  poly([{x:px+3.4,y:py+6},{x:px+5.8,y:py+6.6},{x:px+7+sw,y:py+len},{x:px+4.2+sw,y:py+len}], shade(col,.84));
  ctx.fillStyle=shade(col,.55);
  ctx.beginPath(); ctx.ellipse(px,py+6.2,2,1,0,0,6.2832); ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,.14)"; ctx.lineWidth=.8;
  ctx.beginPath(); ctx.moveTo(px-5,py+8); ctx.lineTo(px-6+sw*.5,py+len*.55); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px+5,py+8); ctx.lineTo(px+6+sw*.5,py+len*.55); ctx.stroke();
}

/* ==================================================================
   学校の中 ── 道具箱（kit）・学校にしかない什器（SFX）・部屋10室・学内スポット
   （06 内装 `proposals/06-atelier/_src/kit.js` `school.js` を本体に。2026-08-17）
   先生「学生は校内をあちこち駆け巡る」→ 部屋の種類がそのまま行ける場所の数。
   什器は "S:名前" で INSIDE の fx に置く（"P:"＝拠点什器、"F:"＝アトリエ什器）。r:1 で壁と平行に回す。
   ================================================================== */
/* ==================================================================
   素材と形の道具箱
   ------------------------------------------------------------------
   什器をたくさん作るための土台。1点ずつ手で描くと、点数が増えるほど質がばらつく。
   「厚みの出しかた」「脚の作りかた」「素材の表面」をここに1回だけ書いて、
   什器はその組み合わせで作る。
   面の明るさは ART.md 2-5 のとおり（手前 .70 ／ 右 .54 ／ 上 1.00）。輪郭線は使わない。
   ================================================================== */

/* ---- 素材。色は素材色の家族から取る（新しい色みは作らない） ---- */
const MAT = {
  oak:      "#c69a68",   /* 楢。天板・脚 */
  walnut:   "#a9784c",   /* 胡桃。濃い木 */
  ply:      "#e4cfb5",   /* 合板。木口が明るい */
  drift:    "#a08a72",   /* 古材 */
  steelB:   "#2f2a36",   /* 黒いスチール */
  steel:    "#7f8794",   /* 鉄 */
  alu:      "#c3cad4",   /* アルミ */
  brass:    "#f2c14e",   /* 真鍮 */
  concrete: "#a8a299",   /* コンクリ・石 */
  linen:    "#f0e8da",   /* 生成りの布 */
  paperM:   "#faf6ec",   /* 紙・白い面 */
  velvet:   "#7c5a70",   /* ベルベット */
  glassM:   "#cfe0ea",   /* ガラス */
  earth:    "#76543a",   /* 土間 */
  ink:      "#2f2a36",
  rust:     "#e0966f",   /* 錆・テラコッタ */
  rose:     "#d8899f",   /* 桃 */
  plum:     "#7c5a70",   /* モーヴ */
  lilac:    "#b79ada",   /* 藤 */
  leaf:     "#7fae66",
  dye:      "#5fb0a0",   /* 染液 */
  indigo:   "#6f9fd8",
};
const F_FRONT = 0.70, F_RIGHT = 0.54, F_TOP = 1.00, F_DEEP = 0.86;

/* ------------------------------------------------------------------
   1. 厚みのあるもの
   ------------------------------------------------------------------ */
/* 天板。手前と右の下端に一段暗い帯を入れて、板の厚みを出す。
   輪郭ではなく「面をもう1枚」なので、憲法に触れない */
function slab(x, y, w, d, h, col, base, lip){
  const z = base || 0, L = lip == null ? Math.min(h*0.34, 1.6) : lip;
  box(x, y, w, d, h, col, z);
  if(L > 0.2){
    /* 90度まわすと、手前に来る面が入れかわる。box() と同じ入れかえをする */
    const yf = FRAME ? y : y+d;
    const c1 = FRAME ? 0.44 : F_RIGHT, c2 = FRAME ? F_RIGHT : 0.44;
    poly([iso(x,yf,z+L), iso(x+w,yf,z+L), iso(x+w,yf,z), iso(x,yf,z)], shade(col, c1));
    poly([iso(x+w,y,z+L), iso(x+w,y+d,z+L), iso(x+w,y+d,z), iso(x+w,y,z)], shade(col, c2));
  }
}
/* 角柱。t を入れると上ほど細くなる（0.2 で 20% 細い）。脚の造形に効く */
function post(x, y, w, d, h, col, base, t){
  const z = base || 0;
  if(!t || FRAME){ box(x, y, w, d, h, col, z); return; }
  const sx = w*t/2, sy = d*t/2;
  const A = (u,v,zz) => iso(x+u, y+v, zz);
  poly([A(0,d,z+h), A(w,d,z+h), A(w-sx,d-sy,z+h), A(sx,d-sy,z+h)], shade(col,F_FRONT));  /* 手前は台形 */
  poly([A(sx,sy,z+h), A(w-sx,sy,z+h), A(w-sx,d-sy,z+h), A(sx,d-sy,z+h)], shade(col,F_TOP));
  poly([A(0,d,z), A(w,d,z), A(w,d,z+h), A(0,d,z+h)], shade(col,F_FRONT));
  poly([A(w,0,z), A(w,d,z), A(w,d,z+h), A(w,0,z+h)], shade(col,F_RIGHT));
}
/* n 角柱。まるく描かない（ART.md 6章）。見えている面だけ、光の向きで明るさを決める */
function prism(cx, cy, r, h, col, base, n, r2, noTop){
  n = n || 8;
  const z0 = base || 0, z1 = z0 + h, rt = r2 == null ? r : r2;
  const P = (i, z, rr) => {
    const a = i/n*6.2832 + Math.PI/n;
    return iso(cx + Math.cos(a)*rr, cy + Math.sin(a)*rr, z);
  };
  for(let i=0;i<n;i++){
    const a = (i+0.5)/n*6.2832 + Math.PI/n;
    /* 90度まわすと、この面が向く先も90度まわる。光の向きは変わらないので、明るさだけ入れかえる */
    const cx2 = FRAME ? -Math.sin(a) : Math.cos(a), cy2 = FRAME ? Math.cos(a) : Math.sin(a);
    const wx = Math.max(0, cx2), wy = Math.max(0, cy2);
    if(wx + wy < 0.001) continue;
    poly([P(i,z0,r), P(i+1,z0,r), P(i+1,z1,rt), P(i,z1,rt)],
         shade(col, (F_RIGHT*wx + F_FRONT*wy)/(wx+wy)));
  }
  if(noTop) return;
  const top = []; for(let i=0;i<n;i++) top.push(P(i, z1, rt));
  poly(top, shade(col, F_TOP));
}
/* n 角形の板（円卓の天板・台座・鏡） */
function disk(cx, cy, r, z, col, n, f){
  n = n || 8;
  const p = [];
  for(let i=0;i<n;i++){ const a = i/n*6.2832 + Math.PI/n;
    p.push(iso(cx + Math.cos(a)*r, cy + Math.sin(a)*r, z)); }
  poly(p, shade(col, f == null ? F_TOP : f));
}

/* ------------------------------------------------------------------
   2. 素材の表面。面の上に、同じ素材の一段ちがいで置く
   ------------------------------------------------------------------ */
/* 木目。天板の上面に、流れる線 */
function grainTop(x, y, w, d, z, col, n){
  ctx.strokeStyle = shade(col, F_DEEP); ctx.lineWidth = 0.7;
  n = n || 6;
  for(let i=0;i<n;i++){
    const v = y + d*(i+0.6)/(n+0.2);
    const a = iso(x + w*0.04, v, z), b = iso(x + w*0.96, v + d*0.015, z);
    ctx.beginPath(); ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo((a.x+b.x)/2, (a.y+b.y)/2 + (i%2 ? 1.1 : -0.9), b.x, b.y);
    ctx.stroke();
  }
}
/* 合板の木口。手前の面に細い縞を積む */
function plyEdge(x, y, w, d, z, h, col){
  const n = Math.max(2, Math.round(h/1.6));
  for(let i=0;i<n;i++){
    if(i % 2) continue;
    const z0 = z + h*i/n, z1 = z + h*(i+0.5)/n;
    poly([iso(x,y+d,z1), iso(x+w,y+d,z1), iso(x+w,y+d,z0), iso(x,y+d,z0)], shade(col, 0.62));
  }
}
/* 石・コンクリの斑。上面に小さな面をまばらに */
function speck(x, y, w, d, z, col, n, seed){
  let s = (seed || 7) * 9301;
  const rnd = () => { s = (s*9301 + 49297) % 233280; return s/233280; };
  for(let i=0;i<(n||14);i++){
    const u = x + rnd()*w, v = y + rnd()*d, r = 0.012 + rnd()*0.022;
    poly([iso(u,v,z), iso(u+r,v,z), iso(u+r,v+r,z), iso(u,v+r,z)],
         shade(col, rnd() < 0.5 ? F_DEEP : 1.0));
  }
}
/* 金属のヘアライン。面に沿った細い線を数本だけ */
function hairline(p0, p1, col, n){
  ctx.strokeStyle = shade(col, F_DEEP); ctx.lineWidth = 0.6;
  for(let i=0;i<(n||3);i++){
    const t = (i+1)/((n||3)+1);
    ctx.beginPath();
    ctx.moveTo(p0.x + (p1.x-p0.x)*0.06, p0.y + (p1.y-p0.y)*t);
    ctx.lineTo(p0.x + (p1.x-p0.x)*0.94, p1.y + (p0.y-p1.y)*(1-t) - (p1.y-p0.y)*(1-t));
    ctx.stroke();
  }
}
/* 織り目。布の面に、たて・よこの細線 */
function weave(px, py, w, h, col){
  ctx.strokeStyle = shade(col, F_DEEP); ctx.lineWidth = 0.5;
  for(let v=-h; v<0; v+=2.4){
    ctx.beginPath(); ctx.moveTo(px-w, py+v); ctx.lineTo(px+w, py+v+0.6); ctx.stroke();
  }
}

/* ------------------------------------------------------------------
   3. トルソー（ボディ）の胴
   ------------------------------------------------------------------
   系統が変わってもボディは必ず要るので、輪郭をここに1回だけ決める。
   八角の輪を、裾→腰→ウエスト→バスト→肩 とたどって積む。
   ここを系統ごとに手で積むと、かならず「ただの塊」になる。実際になった。
   ------------------------------------------------------------------ */
/* 裾 → 腰 → ウエスト → バスト → 肩。高さに対する半径の比 */
const TORSO_R = [[0,.62],[.10,.76],[.28,.82],[.50,.58],[.72,.82],[.88,.76],[1,.56]];
function torsoPrism(cx, cy, base, h, r, col, n){
  n = n || 8;
  for(let s=0; s<TORSO_R.length-1; s++){
    const a = TORSO_R[s], b = TORSO_R[s+1];
    /* 途中の段は天面を描かない。描くと横の輪が出て、樽や提灯に見える（実際に見えた） */
    prism(cx, cy, r*a[1], (b[0]-a[0])*h, col, base + a[0]*h, n, r*b[1], s < TORSO_R.length-2);
  }
}

/* ------------------------------------------------------------------
   4. 垂れているもの。布・服・反物
   ------------------------------------------------------------------ */
/* 垂れ布。上の1本から下へ、ひだを面で割る。グラデーションは使わない */
function drape(px, py, w, h, col, folds, sway){
  folds = folds || 5;
  const sw = sway == null ? 0.18 : sway;
  for(let i=0;i<folds;i++){
    const x0 = px - w/2 + w*i/folds, x1 = px - w/2 + w*(i+1)/folds;
    const b0 = x0 + w*sw*0.10*(i%2 ? 1 : -1), b1 = x1 + w*sw*0.10*(i%2 ? 1 : -1);
    const dy = h + (i%2 ? h*0.05 : 0);
    poly([{x:x0,y:py},{x:x1,y:py},{x:b1,y:py+dy},{x:b0,y:py+dy}],
         shade(col, i%2 ? F_TOP : F_FRONT));
  }
  /* 裾。ひと山ぶんだけ、一段暗く落とす */
  poly([{x:px-w/2,y:py+h},{x:px+w/2,y:py+h},
        {x:px+w/2+w*sw*0.06,y:py+h+h*0.05},{x:px-w/2,y:py+h+h*0.03}],
       shade(col, F_RIGHT));
}
/* 反物。棒に巻いたもの。両端に断面 */
function kroll(x1, y1, x2, y2, z, r, col){
  const a = iso(x1,y1,z), b = iso(x2,y2,z);
  ctx.strokeStyle = shade(col, F_FRONT); ctx.lineWidth = r*2; ctx.lineCap = "butt";
  ctx.beginPath(); ctx.moveTo(a.x, a.y-r); ctx.lineTo(b.x, b.y-r); ctx.stroke();
  ctx.strokeStyle = shade(col, F_TOP); ctx.lineWidth = r*0.8;
  ctx.beginPath(); ctx.moveTo(a.x, a.y-r*1.45); ctx.lineTo(b.x, b.y-r*1.45); ctx.stroke();
  ctx.fillStyle = shade(col, F_DEEP);
  ctx.beginPath(); ctx.ellipse(a.x, a.y-r, r*0.42, r, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = shade(col, F_RIGHT);
  ctx.beginPath(); ctx.ellipse(b.x, b.y-r, r*0.42, r, 0, 0, 6.2832); ctx.fill();
}

/* ------------------------------------------------------------------
   5. 線でできている物だけ、線で描く（ART.md 3章）
   ------------------------------------------------------------------ */
function wire(pts, col, lw){
  ctx.strokeStyle = shade(col, F_FRONT); ctx.lineWidth = lw || 1.2; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}
/* 単管パイプ。2点をつなぐ丸棒＋継手 */
function pipe(x1, y1, z1, x2, y2, z2, col, r){
  const a = iso(x1,y1,z1), b = iso(x2,y2,z2);
  ctx.strokeStyle = shade(col, F_RIGHT); ctx.lineWidth = (r||1.5)*2; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.strokeStyle = shade(col, F_TOP); ctx.lineWidth = (r||1.5)*0.7;
  ctx.beginPath(); ctx.moveTo(a.x-0.6,a.y-0.6); ctx.lineTo(b.x-0.6,b.y-0.6); ctx.stroke();
}


/* ==================================================================
   学校の中
   ------------------------------------------------------------------
   物語は入学から始まり、学校パートは4年間ある。学生は校内をあちこち駆け巡るので、
   「部屋」の種類がそのまま行ける場所の数になる。
   ここには（1）学校にしかない什器 と（2）部屋そのもの を書く。
   什器は kit.js の道具箱で作り、アトリエの系統べつ什器（pieces.js）と
   拠点什器（fixtures.js の PFX）も、そのまま置ける。
   ================================================================== */

/* ------------------------------------------------------------------
   1. 学校にしかない什器
   ------------------------------------------------------------------ */
const SFX = {

/* ---- 教える・学ぶ ---- */
/* ---- 部屋を部屋にするもの。入口・掲示・水まわり・片づけ ----
   什器そのものより先に、これが無いと「機械が並んだ倉庫」にしか見えない。
   壁ぎわ・隅・通路のきわに置いて、部屋の輪郭を作る。 */
door:{ name:"引き戸", w:1.7, d:0.2, h:80, draw(f){
  const x=f.x, y=f.y;
  /* 枠。上枠と左右の縦枠だけを太く見せる（下は敷居） */
  box(x, y, 1.7, .2, 80, MAT.walnut, 0);
  const P=(u,z)=>iso(x+u, y+.2, z);
  /* 2枚の引き戸。片方が少し開いていて、中の暗がりが見える */
  poly([P(.08,74), P(.86,74), P(.86,3), P(.08,3)], shade(MAT.ply, F_FRONT));
  poly([P(.92,74), P(1.62,74), P(1.62,3), P(.92,3)], shade(MAT.ply, 0.62));
  poly([P(.86,74), P(.92,74), P(.92,3), P(.86,3)], shade(MAT.ink, 0.62));   /* 開いた隙間 */
  /* ガラスは細長い縦の一本。これで窓ではなく戸に見える */
  poly([P(.30,66), P(.62,66), P(.62,26), P(.30,26)], "rgba(207,224,234,.62)");
  poly([P(1.06,66), P(1.38,66), P(1.38,26), P(1.06,26)], "rgba(207,224,234,.62)");
  poly([P(.30,66), P(.38,66), P(.38,26), P(.30,26)], "rgba(250,246,236,.50)");
  /* 下の蹴込み板。ここがあると「床まである戸」だと分かる */
  poly([P(.08,20), P(.86,20), P(.86,3), P(.08,3)], shade(MAT.ply, 0.50));
  poly([P(.92,20), P(1.62,20), P(1.62,3), P(.92,3)], shade(MAT.ply, 0.44));
  /* 引き手。縦長の掘り込み */
  poly([P(.74,44), P(.80,44), P(.80,34), P(.74,34)], shade(MAT.steelB, F_FRONT));
  poly([P(.98,44), P(1.04,44), P(1.04,34), P(.98,34)], shade(MAT.steelB, F_FRONT));
  /* 敷居 */
  poly([P(.04,3), P(1.66,3), P(1.66,0), P(.04,0)], shade(MAT.alu, F_TOP));
  /* 部屋名の札。戸の上、枠の内側 */
  poly([P(1.14,79), P(1.60,79), P(1.60,75.4), P(1.14,75.4)], shade(MAT.paperM, F_TOP));
  poly([P(1.20,77.8), P(1.54,77.8), P(1.54,76.8), P(1.20,76.8)], shade(MAT.ink, F_FRONT));
}},

noticeboard:{ name:"掲示板", w:2.1, d:0.14, h:70, draw(f){

  /* 貼り紙。大きさも角度もばらばらに、重ねて貼る */

                 [1.56,59,.38,13,"leaf"],[.18,40,.36,12,"indigo"],[.60,42,.44,15,"paperM"],

                 [.70,23,.34,12,"dye"],[1.14,21,.46,14,"paperM"],[1.64,24,.30,11,"rust"]];
  for(const q of notes){
    const u=q[0], z=q[1], w2=q[2], h2=q[3], c=MAT[q[4]];

    poly([P(u+.04,z-h2*.45), P(u+w2-.06,z-h2*.45), P(u+w2-.06,z-h2*.52), P(u+.04,z-h2*.52)],
         shade(c, 0.62));

}},

      const t = (i+1)/4;

bikepark:{ name:"自転車置き場", w:2.4, d:1.0, h:34, draw(f){
  const x=f.x, y=f.y;
  /* 前輪を差す U 字のラック */
  for(let i=0;i<5;i++){
    const u = .24 + i*.48;
    const a = iso(x+u, y+.20, 0), b = iso(x+u, y+.20, 16);
    const c = iso(x+u+.18, y+.20, 16), e = iso(x+u+.18, y+.20, 0);
    ctx.strokeStyle = shade(MAT.steel, F_RIGHT); ctx.lineWidth = 2.4; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.lineTo(c.x,c.y); ctx.lineTo(e.x,e.y); ctx.stroke();
  }
  /* 自転車を3台。輪は八角形で（ART.md 6章） */
  const bikes = [[.30,MAT.indigo],[1.26,MAT.rust],[1.74,MAT.leaf]];
  for(const q of bikes){
    const u = q[0], col = q[1];
    const back = iso(x+u+.06, y+.68, 0), front = iso(x+u+.06, y+.16, 0);
    for(const p of [back, front]){
      ctx.strokeStyle = shade(MAT.steelB, F_FRONT); ctx.lineWidth = 1.6;
      ctx.beginPath();
      for(let k=0;k<=8;k++){ const a2 = k/8*6.2832 + Math.PI/8;
        const px = p.x + Math.cos(a2)*4.2, py = p.y - 8 + Math.sin(a2)*8;
        if(k) ctx.lineTo(px,py); else ctx.moveTo(px,py); }
      ctx.closePath(); ctx.stroke();
    }
    ctx.strokeStyle = shade(col, F_TOP); ctx.lineWidth = 2.2; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(back.x, back.y-9); ctx.lineTo(back.x+1, back.y-17);
    ctx.lineTo(front.x-1, front.y-16); ctx.lineTo(front.x, front.y-9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(back.x+1, back.y-17); ctx.lineTo(front.x, front.y-9); ctx.stroke();
    ctx.strokeStyle = shade(MAT.steelB, F_TOP); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(front.x-3, front.y-17); ctx.lineTo(front.x+3, front.y-17); ctx.stroke();
  }
}},

bookwall:{ name:"資料の壁", w:2.4, d:0.4, h:76, draw(f){

  box(x, y, 2.4, .4, 72, MAT.walnut, 0);
  const cols = [MAT.velvet, MAT.indigo, MAT.rust, MAT.leaf, MAT.drift, MAT.brass, MAT.dye, MAT.plum];
  for(let s=0;s<4;s++){
    const z = 6 + s*17;
    poly([iso(x+.05,y+.05,z), iso(x+2.35,y+.05,z), iso(x+2.35,y+.36,z), iso(x+.05,y+.36,z)],
         shade(MAT.walnut, 0.44));
    /* 背表紙。幅と高さを少しずつ変える */
    let u = .10;
    let k = s*7;
    while(u < 2.22){
      const w2 = .035 + ((k*37)%5)*.012, hh = 11 + ((k*17)%4)*1.6;
      if(((k*11)%9) === 0){                    /* たまに横に寝かせて積む */
        poly([iso(x+u,y+.10,z), iso(x+u+.26,y+.10,z), iso(x+u+.26,y+.34,z), iso(x+u,y+.34,z)],
             shade(cols[k%8], F_TOP));
        box(x+u, y+.10, .26, .24, 2.6, cols[k%8], z);
        u += .30;
      } else {
        box(x+u, y+.12, w2, .22, hh, cols[k%8], z);
        u += w2 + .012;
      }
      k++;
    }
  }
  slab(x-.04, y-.03, 2.48, .46, 2.6, MAT.walnut, 72, 1.2);
}},

archiverack:{ name:"過去の作品のラック", w:2.5, d:0.75, h:66, draw(f){
  const x=f.x, y=f.y;
  for(const u of [.16, 2.34]){
    prism(x+u, y+.38, .14, 1.4, MAT.steelB, 0, 8);
    pipe(x+u, y+.38, 1.0, x+u, y+.38, 62, MAT.steel, 1.5);
  }
  pipe(x+.16, y+.38, 62, x+2.34, y+.38, 62, MAT.steel, 1.6);
  pipe(x+.16, y+.38, 8, x+2.34, y+.38, 8, MAT.steel, 1.2);
  /* 不織布のカバーが掛かった服。中身は見えない。ひとつだけ開いている */
  const items = [[.46,0],[.86,0],[1.26,1],[1.66,0],[2.06,0]];
  const under = [MAT.indigo, MAT.velvet, MAT.dye, MAT.rust, MAT.plum];
  for(let i=0;i<items.length;i++){
    const u = items[i][0], open = items[i][1];
    const p = iso(x+u, y+.38, 62);
    ctx.strokeStyle = shade(MAT.alu, F_FRONT); ctx.lineWidth = 1.0;
    ctx.beginPath(); ctx.arc(p.x, p.y+2.6, 1.8, Math.PI*0.95, Math.PI*2.05); ctx.stroke();
    if(!open){
      drape(p.x, p.y+7.0, 13, 26, MAT.paperM, 4, 0.18);
      /* 中身の色が、裾からだけ覗く */
      poly([{x:p.x-6.5,y:p.y+33},{x:p.x+6.5,y:p.y+33},
            {x:p.x+6.8,y:p.y+36},{x:p.x-6.2,y:p.y+36}], shade(under[i], F_DEEP));
    } else {
      ctx.strokeStyle = shade(MAT.alu, F_RIGHT); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(p.x-5.6, p.y+7.4);
      ctx.quadraticCurveTo(p.x, p.y+4.0, p.x+5.6, p.y+7.4); ctx.stroke();
      drape(p.x, p.y+7.2, 12, 25, MAT.velvet, 5, 0.42);
      /* めくったカバーが横に寄せてある */
      drape(p.x+9.5, p.y+7.0, 5, 20, MAT.paperM, 2, 0.1);
    }
  }
  /* 札。年度が書いてある（記号） */
  poly([iso(x+.22,y+.30,52), iso(x+.60,y+.30,52),
        iso(x+.60,y+.30,46), iso(x+.22,y+.30,46)], shade(MAT.paperM, F_TOP));
}},

const P_TW = 58, P_TH = 29;
let placeIn = null;      /* いま入っている拠点 */
let pnpc = [];           /* そこにいる人 */

function usePlaceScale(){
  const I = INSIDE[placeIn.id];
  TW = P_TW; TH = P_TH; ZS = TH/42;
  OX = VW/2 - (I.gw-I.gd)*(TW/2)/2;
  OY = Math.round((VH - (I.wallh*ZS + (I.gw+I.gd)*TH/2 + SLAB*ZS))/2) + I.wallh*ZS;
}

function enterPlace(p){
  if(p.id === "atelier"){ setView("room"); return; }
  const I = INSIDE[p.id];
  if(!I){ toast("ここはまだ中に入れません"); return; }
  placeIn = p;
  pnpc = makeNPCs(I);
  view = "place";
  viewBtn.innerHTML = ico("map") + " 街へ";
  sel = null; endMove(); hideSel();
  tab = "town";
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", x.dataset.t==="town"));
  renderPane();
  maybePlaceEvent(p);
}

function makeNPCs(I){
  return (I.npc || []).map(n => ({
    role:n.role, gx:n.x, gy:n.y,
    t:Math.random()*6, phase:"work",
    station:n.st ? {type:n.st} : null,
    flip:1, appear:makeAppearance(),
    bubble:null, bubbleT:0, bubOff:0, bad:false,
    lines:n.lines || [],
    path:n.walk || null, leg:0, slow:n.slow || 1, wait:Math.random()*5,
  }));
}

function stepPlace(dt){
  if(view !== "place") return;
  for(const n of pnpc){
    n.t += dt;
    if(n.bubbleT > 0){ n.bubbleT -= dt; if(n.bubbleT <= 0) n.bubble = null; }
    else if(n.lines.length && Math.random() < dt*0.05){
      n.bubble = pick(n.lines); n.bubbleT = 3.0 + Math.random()*1.6;
    }
    if(n.path){
      if(n.wait > 0){ n.wait -= dt; n.phase = n.station ? "work" : "idle"; continue; }
      const tgt = n.path[n.leg];
      const dx = tgt[0]-n.gx, dy = tgt[1]-n.gy;
      const d2 = Math.hypot(dx, dy);
      if(d2 < 0.06){
        n.leg = (n.leg+1) % n.path.length;
        n.wait = 2.5 + Math.random()*5;
      } else {
        const sp = 0.85 * n.slow * dt;
        n.gx += dx/d2*Math.min(sp, d2); n.gy += dy/d2*Math.min(sp, d2);
        n.flip = dx >= 0 ? 1 : -1;
        n.phase = "walk";
      }
    }
  }
}

function drawPlaceSlab(I){
  const c = iso(I.gw/2, I.gd/2, -SLAB);
  ctx.save(); ctx.filter = "blur(10px)";
  ctx.fillStyle = "rgba(150,105,120,.26)";
  ctx.beginPath();
  ctx.ellipse(c.x, c.y+13, (I.gw+I.gd)*TW/4*0.84, (I.gw+I.gd)*TH/4*0.84, 0, 0, 6.2832);
  ctx.fill(); ctx.restore();
  poly([iso(0,I.gd), iso(I.gw,I.gd), iso(I.gw,I.gd,-SLAB), iso(0,I.gd,-SLAB)], I.edge[0]);
  poly([iso(I.gw,0), iso(I.gw,I.gd), iso(I.gw,I.gd,-SLAB), iso(I.gw,0,-SLAB)], I.edge[1]);
}

function drawPlaceRoom(I){
  for(let gy=0; gy<I.gd; gy++)
    for(let gx=0; gx<I.gw; gx++)
      poly([iso(gx,gy),iso(gx+1,gy),iso(gx+1,gy+1),iso(gx,gy+1)],
           (gx+gy)%2 ? I.floor[0] : I.floor[1]);
  const H = I.wallh;
  poly([iso(0,0,H), iso(I.gw,0,H), iso(I.gw,0,0), iso(0,0,0)], I.wall);
  poly([iso(0,0,H), iso(0,I.gd,H), iso(0,I.gd,0), iso(0,0,0)], I.wall2);
  poly([iso(0,0,9), iso(I.gw,0,9), iso(I.gw,0,0), iso(0,0,0)], I.skirt[0]);
  poly([iso(0,0,9), iso(0,I.gd,9), iso(0,I.gd,0), iso(0,0,0)], I.skirt[1]);
  if(I.outdoor){
    /* 屋外（中庭）。壁のかわりに低い塀（06） */
    poly([iso(0,0,H), iso(I.gw,0,H), iso(I.gw,-0.14,H), iso(0,-0.14,H)], I.skirt[0]);
    poly([iso(0,0,H), iso(0,I.gd,H), iso(-0.14,I.gd,H), iso(-0.14,0,H)], I.skirt[1]);
    return;
  }
  /* 窓の場所を部屋が持っていれば、そこに（06 の学校の部屋） */
  if(I.win && !I.dark){
    const nt = nightAmount();
    const glass = nt>0.5 ? "#2f3a58" : nt>0.2 ? "#e2b48f" : "#b7dcea";
    for(const [x0,x1] of I.win){
      poly([iso(x0,0,H-22), iso(x1,0,H-22), iso(x1,0,38), iso(x0,0,38)], glass);
      poly([iso(x0,0,H-22), iso(x1,0,H-22), iso(x1,0,H-28), iso(x0,0,H-28)], I.wall);
      poly([iso(x0,0,44), iso(x1,0,44), iso(x1,0,38), iso(x0,0,38)], I.wall);
      const n = Math.max(1, Math.round((x1-x0)/1.5));
      for(let i=1;i<n;i++){ const u = x0 + (x1-x0)*i/n;
        poly([iso(u-.04,0,H-26), iso(u+.04,0,H-26), iso(u+.04,0,42), iso(u-.04,0,42)], I.wall); }
    }
    return;
  }
  /* 窓。暗い会場だけは開けない */
  if(!I.dark){
    const nt = nightAmount();
    const glass = nt>0.5 ? "#2f3a58" : nt>0.2 ? "#e2b48f" : "#b7dcea";
    const x0 = I.gw-2.3, x1 = I.gw-0.4;
    poly([iso(x0,0,H-20), iso(x1,0,H-20), iso(x1,0,40), iso(x0,0,40)], glass);
    poly([iso(x0,0,H-20), iso(x1,0,H-20), iso(x1,0,H-27), iso(x0,0,H-27)], I.wall);
    poly([iso(x0,0,47), iso(x1,0,47), iso(x1,0,40), iso(x0,0,40)], I.wall);
    const mid = (x0+x1)/2;
    poly([iso(mid-.05,0,H-24), iso(mid+.05,0,H-24), iso(mid+.05,0,44), iso(mid-.05,0,44)], I.wall);
  }
}

/* 什器の種類。"F:"＝アトリエの什器、"S:"＝学校にしかない什器（places/school_fx.js）、
   "P:" または接頭辞なし＝拠点の什器 */
function fxDef(f){
  const k = f.t.slice(0,2), n = f.t.slice(2);
  if(k === "F:") return FURN[n];
  if(k === "S:") return SFX[n];
  if(k === "P:") return PFX[n];
  return PFX[f.t];
}
function fxSize(f){
  const S = fxDef(f) || {w:1, d:1};
  return f.r ? {w:S.d, d:S.w} : {w:S.w, d:S.d};   /* まわして置いたものは幅と奥行きが入れかわる */
}
function drawFx(f){
  const S = fxDef(f); if(!S) return;
  SNAP = PAL_FURN;                     /* 什器の色は素材色に畳む（room/shadow.js） */
  if(f.r) FRAME = { x:f.x, y:f.y, w:S.w, d:S.d };
  try{
    if(f.t.slice(0,2) === "F:"){
      const type = f.t.slice(2);
      const g = Object.assign({type, hung:0, u:f.x, z:f.y, v:0, wall:"back", ink:0.72, on:true}, f);
      if(FURN[type].cat === "wall") drawWallShadowed(() => FURN[type].draw(g));
      else FURN[type].draw(g);
    } else if(f.t.slice(0,2) === "S:"){
      S.draw(Object.assign({ u:f.x, z:0, v:1, on:true, ph:f.x, n:5, lv:2, busyT:1, hung:0, ink:.72 }, f));
    } else S.draw(f);
  } finally { SNAP = null; FRAME = null; }
}

/* 空をのぞいた中身だけ。一覧表からも同じものを呼ぶ */
function drawPlaceScene(I){
  drawPlaceSlab(I);
  drawPlaceRoom(I);

  /* 店の棚は、実際の在庫を映す。空なら本当に空になる */
  if(placeIn.id === "shop" && biz){
    const bars = I.fx.filter(f => f.t === "hangbar");
    const tot = Math.min(12, biz.one + biz.mass);
    bars[0].n = Math.min(6, Math.ceil(tot/2));
    bars[1].n = Math.min(6, tot - bars[0].n);
    bars[0].cols = biz.oneCol.slice(0, 6);
  }

  /* 奥から手前へ並べ替えて描く */
  const items = [];
  for(const f of I.fx){
    const s = fxSize(f);
    items.push({ z:f.y + s.d*0.5 + f.x*0.001, k:"f", f });
  }
  for(const n of pnpc) items.push({ z:n.gy+0.02, k:"n", n });
  items.sort((a,b)=>a.z-b.z);
  for(const it of items) if(it.k === "f") drawFxShadow(it.f);   /* 接地の影は什器より先に、床へ（C2） */
  for(const it of items){
    if(it.k === "f") drawFx(it.f);
    else drawPerson(it.n);
  }
}

/* 場面の見出し。学校の4年（game/school.js）が差し替える。null なら拠点の名前 */

}

function startLot(idx, n){
  const w = workList[idx]; if(!w) return;
  if(!facOpen()){ toast("工場はまだ開いていません"); return; }
  if(biz.lots.length >= 2){ toast("工場の枠がいっぱいです"); return; }

  money -= cost;

                  rar:Math.max(1,w.rar-1), cost });
  log("《"+w.title+"》を"+n+"着、量産に出した（"+yen(cost)+"）");
  toast("量産に出しました　2週後にあがります");
  renderPane();

function bizWeek(){
  if(!biz) return;
  let line = [];

  /* ---- ショップ ---- */
  if(shopOpen()){
    const wage = biz.clerks*SHOP_WAGE + (biz.vmd ? VMD_WAGE : 0);
    if(wage){ money -= wage; }
    const pull = 1 + biz.clerks*0.9 + fame/70;
    const vm = biz.vmd ? 1.18 : 1;
    /* 一点もの。高いが数が出ない */
    if(biz.one > 0){
      const n = Math.min(biz.one, Math.random() < 0.55*Math.min(2,pull) ? 1 : 0);
      if(n){
        const got = Math.round((14000 + fame*80) * vm * (0.85+Math.random()*0.4));   /* 担当02：名声の効きを抑えた */
        biz.one -= n; biz.oneCol.splice(0,n);
        money += got; biz.soldOne += n; biz.rev += got;
        line.push("一点もの"+n+"着 "+yen(got));
      }
    }
    /* 量産品。安いが数が出る */
    if(biz.mass > 0){
      let n = Math.round(pull*2.2*(0.6+Math.random()*0.9));
      n = Math.max(0, Math.min(biz.mass, n));
      if(n){
        const got = Math.round((2600 + fame*12) * vm * n * (0.9+Math.random()*0.25));
        biz.mass -= n; money += got; biz.soldMass += n; biz.rev += got;
        line.push("量産品"+n+"着 "+yen(got));
      }
    }
    if(line.length) log("ショップ：" + line.join(" ／ "));
    else if(biz.one+biz.mass === 0 && Math.random()<0.25)
      log("ショップ：棚が空いている。出すものがない。", true);
  }

  /* ---- 工場 ---- */
  for(const L of biz.lots) L.left--;
  const done = biz.lots.filter(L=>L.left<=0);
  biz.lots = biz.lots.filter(L=>L.left>0);
  for(const L of done){
    biz.mass += L.n;
    log("工場から《"+L.theme+"》が"+L.n+"着あがった。★"+L.rar+"の商品として店へ。");
    toast("🏭 "+L.n+"着 入荷");
  }

  /* ---- ショールーム ---- */
  if(srOpen()){
    for(const L of biz.leases) L.left--;
    const back = biz.leases.filter(L=>L.left<=0);
    biz.leases = biz.leases.filter(L=>L.left>0);
    for(const L of back){
      biz.one++; biz.oneCol.push(GCOL[L.top]);
      if(Math.random() < 0.45){
        const f2 = 5 + Math.round(Math.random()*6);
        fame += f2; biz.press++;
        log("《"+L.theme+"》が誌面に載った。名声 +"+f2);
        toast("📖 掲載されました");
      } else log("貸していた《"+L.theme+"》が返ってきた。");
    }
    if(biz.one > 0 && biz.leases.length < 3 && Math.random() < 0.34){
      const c = biz.oneCol.shift() || "#d8899f"; biz.one--;
      const w = workList[0];
      const fee = Math.round(8000 + fame*40);
      biz.leases.push({ theme:w ? w.title : "コレクション", top:w ? w.top : "concept",
                        left:2, fee });
      money += fee;
      log("スタイリストが1着借りていった。リース料 "+yen(fee));
      toast("👗 貸出　"+yen(fee));
    }
  }
}

/* ==================================================================
   15.7 拠点でしかできないこと。

   街を見て回るだけでは意味がないので、
   「そこへ行かないと起きないこと」を拠点ごとに置く。
   出かけられるのは1週に2回まで。だから、どこへ行くかを選ぶことになる。
   ================================================================== */

let visits = 2;                 /* 今週あと何回出かけられるか */
const VISITS_PER_WEEK = 2;
let boost = {};                 /* 次の1着だけに乗る、一時のちから */
let placeFlag = {};             /* 一度きりのものを覚えておく */
let showEase = 0;               /* 次の発表会の目標を下げる割合 */

function addBoost(k, v){ boost[k] = (boost[k]||0) + v; }
function boostEff(k){ return boost[k] || 0; }
function clearBoost(){ boost = {}; }

/* ---- 行動の共通処理 ---- */
function canDo(a){
  if(visits <= 0) return "今週はもう出かけられません";
  if(a.cost && money < a.cost) return "資金が足りません";
  if(a.once && placeFlag[a.id]) return "もう済んでいます";
  if(a.cool && placeFlag[a.id] && dayNo() - placeFlag[a.id] < a.cool)
    return "あと"+(a.cool - (dayNo()-placeFlag[a.id]))+"週あけてください";
  if(a.need){ const ng = a.need(); if(ng) return ng; }
  return null;
}
function doAct(pid, idx){
  const list = PLACE_ACTS[pid] || [];
  const a = list[idx]; if(!a) return;
  const ng = canDo(a);
  if(ng){ toast(ng); return; }
  visits--;
  if(a.cost) money -= a.cost;
  placeFlag[a.id] = a.once ? 1 : dayNo();
  a.run();
  renderPane(); renderHUD();
}

let pendingEvent = null;
function maybePlaceEvent(p){
  const E = PLACE_EVENTS[p.id];
  if(!E || Math.random() > 0.38) return;
  pendingEvent = { p, E };
  setTimeout(()=>{ if(pendingEvent) openPlaceEvent(); }, 900);
}
function openPlaceEvent(){
  const { p, E } = pendingEvent;
  const mk = (key, o) =>
    '<button class="btn'+(key==="a"?" p":"")+'" data-ev="'+key+'"'+
    (o.cost && money < o.cost ? " disabled" : "")+'>'+o.label+'</button>';
  document.getElementById("sheetBody").innerHTML =
    '<span class="jbadge" style="background:#c94f79">'+p.name+'</span>'+
    '<div class="jname">'+E.who+'</div>'+
    '<div class="jlead">'+E.text+'</div>'+
    '<div class="row" style="margin-top:14px">'+mk("a",E.a)+mk("b",E.b)+'</div>';
  sheet.classList.add("on");
  document.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{
    if(!pendingEvent) return;          /* 閉じたあとの押し直しを受け付けない */
    const o = E[b.dataset.ev];
    if(o.cost){ if(money < o.cost){ toast("資金が足りません"); return; } money -= o.cost; }
    o.run(); pendingEvent = null; closeSheet(); renderPane(); renderHUD();
  });
}

/* ==================================================================
   拠点の中にいるときの操作パネル
   ================================================================== */
function placePaneHTML(){
  const p = placeIn, I = INSIDE[p.id];
  const acts = PLACE_ACTS[p.id] || [];
  const dots = "●".repeat(visits) + "○".repeat(Math.max(0, VISITS_PER_WEEK-visits));

  let h = '<div class="dexhead"><b>'+p.name+'</b>'+
    (I && I.note ? I.note : p.lead)+
    '<div class="c">今週あと出かけられる回数　'+dots+'</div></div>';

  h += '<div class="h"><span>ここでしかできないこと</span><span>'+acts.length+'</span></div>';
  if(!acts.length){
    h += '<div class="empty">ここはアトリエです。仕事は部屋の中で進んでいます。</div>';
  } else {
    h += acts.map((a,i)=>{
      const ng = canDo(a);
      return '<div class="offer">'+
        '<div class="cl">'+(a.cost ? yen(a.cost) : "費用なし")+
          (a.once ? "　／　一度きり" : a.cool ? "　／　"+a.cool+"週に1回" : "")+'</div>'+
        '<div class="th">'+a.name+'</div>'+
        '<div style="font-size:11px;color:#8a7690;line-height:1.65;margin-bottom:7px">'+
          a.desc+'</div>'+
        '<div class="row"><button class="btn p" data-act="'+i+'"'+(ng?" disabled":"")+'>'+
          (ng || "やる")+'</button></div></div>';
    }).join("");
  }

  h += '<div class="h" style="margin-top:12px">ここにいる人</div>'+
    '<div>'+ (I && I.npc ? I.npc.map((n,i)=>{
      const R = NPCROLE[n.role] || ROLES[n.role];
      return '<button class="pchip" data-npc="'+i+'" style="border:0;cursor:pointer;'+
             'font-family:inherit">'+R.name+'</button>';
    }).join("") : "") + '</div>';

  h += '<div class="jsoon" style="margin-top:12px">'+p.what+'</div>'+
    '<div class="row" style="margin-top:12px">'+
    '<button class="btn" id="backTown">'+ico("map")+' 街へ戻る</button>'+
    '<button class="btn" id="backRoom">'+ico("home")+' アトリエへ</button></div>';
  return h;
}

/* 絵をひとつ返す。大きさは em ではなく px で決める（行の高さに引きずられないため） */
function ico(name, px){
  const d = ICONS[name]; if(!d) return "";
  const s = px || 13;
  return '<svg class="ico" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" '+
    'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" '+
    'aria-hidden="true"><path d="'+d+'"/></svg>';
}

/* 他の層（できごとの知らせ・働きかたの札など）から流れてくる絵文字を、

   向こうの担当のファイルを触らずに、絵文字を画面から消すための関門。 */
const EMOJI_ICON = {
  "🌅":"dawn", "☀️":"sun", "☀":"sun", "🌇":"dusk", "🌙":"moon", "🌆":"train", "🏮":"lantern",
  "🗺":"map", "🏠":"home", "🪡":"needle", "🧵":"spool", "🔄":"rotate", "🔒":"lock",
  "👥":"people", "🪑":"chair", "✉️":"mail", "✉":"mail", "👗":"dress", "🏙":"city",
  "🎪":"runway", "🤝":"bond", "🛍":"bag", "🏭":"factory", "📖":"book", "🎰":"capsule",
  "🏅":"medal", "🕊":"dove", "🎉":"spark", "💼":"case", "💰":"coin", "🔧":"wrench",
  "⚠":"alert", "⚠️":"alert", "🎓":"cap", "🚃":"train", "📰":"news", "📷":"camera",
  "👤":"person", "☕":"cup", "🔔":"bell",
  "🌸":"bloom", "🌿":"leaf", "🍂":"maple", "❄️":"snow", "❄":"snow",
  "🎒":"pack", "📸":"camera", "⏱️":"clock", "⏱":"clock", "💍":"ring",
  "🏛":"museum", "⚡":"bolt", "📌":"pin",
};
const EMOJI_RE = new RegExp(
  Object.keys(EMOJI_ICON).sort((a,b)=>b.length-a.length)
    .map(e=>e.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"), "g");
function iconize(html){ return html.replace(EMOJI_RE, e => ico(EMOJI_ICON[e])); }

function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* 画面の骨組み（タブ・ボタン）に、data-ico で名指しされた絵を入れる */
for(const el of document.querySelectorAll("[data-ico]"))
  el.insertAdjacentHTML("afterbegin", ico(el.dataset.ico, +el.dataset.px || 13));

/* できごとの知らせ。他の層は絵文字つきの文を投げてくるので、ここで絵に直す */
toast = function(text){
  const el = document.getElementById("toast");
  el.innerHTML = iconize(esc(text));
  el.classList.add("on"); toastT = 2.8;
};

/* ── 夜の色 ──
   試作A（game/art_room_styles.html）の N(色) = mix(色, #2a2440, .58) と同じことを、
   本体では「fillStyle / strokeStyle に色を入れた瞬間」に行う。
   什器の描き方（何千行）を触らずに、すべての面が夜の色になる。
   NIGHT_K が 0 のときは何もしない。人ごとに NIGHT_K を変えれば、
   あかりの下の人だけ明るくできる（先生の希望）。 */
let NIGHT_K = 0;
const _nightCache = new Map();
function nightColor(v){
  if(!NIGHT_K || typeof v !== "string") return v;
  const key = v + "|" + NIGHT_K.toFixed(2);
  const hit = _nightCache.get(key); if(hit) return hit;
  let r, g, b, a = 1, out = v;
  let m;
  if((m = /^#([0-9a-f]{3,8})$/i.exec(v))){
    let h = m[1];
    if(h.length === 3 || h.length === 4) h = h.split("").map(c=>c+c).join("");
    r = parseInt(h.slice(0,2),16); g = parseInt(h.slice(2,4),16); b = parseInt(h.slice(4,6),16);
    if(h.length === 8) a = parseInt(h.slice(6,8),16)/255;
  } else if((m = /^rgba?\(([^)]+)\)$/i.exec(v))){
    const p = m[1].split(",").map(Number);
    r = p[0]; g = p[1]; b = p[2]; if(p.length > 3) a = p[3];
  }
  if(r != null){
    const k = NIGHT_K;
    const R = Math.round(r*(1-k)+42*k), G = Math.round(g*(1-k)+36*k), B = Math.round(b*(1-k)+64*k);
    out = a >= 1 ? "rgb("+R+","+G+","+B+")" : "rgba("+R+","+G+","+B+","+a+")";
  }
  if(_nightCache.size > 4000) _nightCache.clear();
  _nightCache.set(key, out);
  return out;
}
(function(){
  const P = CanvasRenderingContext2D.prototype;
  for(const name of ["fillStyle","strokeStyle"]){
    const d = Object.getOwnPropertyDescriptor(P, name);
    Object.defineProperty(ctx, name, {
      get(){ return d.get.call(this); },
      set(v){ d.set.call(this, nightColor(furnColor(v))); },   /* 什器の色の畳み込み（room/shadow.js）→ 夜の色 */
      configurable: true,
    });
  }
})();
/* あかりの輪の中心にどれだけ近いか（1＝真下、0＝輪の外）。天井灯とスタンド照明の大きい方 */
function litAt(gx, gy){
  const R0 = Math.min(GW,GD)*0.46, d0 = Math.hypot(gx-GW/2, gy-GD/2);
  let lit = d0 < R0*0.52 ? 1 : Math.max(0, 1 - (d0-R0*0.52)/(R0*0.48));
  for(const f of furniture) if(f.type==="lamp"){
    const d = Math.hypot(gx-(f.x+.3), gy-(f.y+.3));
    lit = Math.max(lit, d < 1.1*0.52 ? 1 : Math.max(0, 1 - (d-1.1*0.52)/(1.1*0.48)));
  }
  return lit;
}
function draw(){
  if(view === "place"){ usePlaceScale(); drawPlace(); return; }
  if(view === "town"){ useTownScale(); drawTown(); return; }
  useRoomScale();
  const dm = dayMix();
  ctx.clearRect(0,0,VW,VH);
  const sky = ctx.createLinearGradient(0,0,0,VH);
  sky.addColorStop(0, dm.a); sky.addColorStop(0.55, dm.b); sky.addColorStop(1, dm.b);
  ctx.fillStyle = sky; ctx.fillRect(0,0,VW,VH);
  const vig = ctx.createRadialGradient(VW/2, VH*0.42, VH*0.28, VW/2, VH*0.42, VH*0.78);
  vig.addColorStop(0,"rgba(190,140,150,0)"); vig.addColorStop(1,"rgba(150,100,130,.24)");
  ctx.fillStyle = vig; ctx.fillRect(0,0,VW,VH);

  /* ここから部屋。広い部屋のときだけ、まとめて縮める */
  const ZM = roomZoom();
  clampPan();
  ctx.save();
  ctx.setTransform(DPR*ZM, 0, 0, DPR*ZM,
                   DPR*(VW*(1-ZM)/2 + panX*ZM), DPR*VH*(1-ZM)/2);

  /* ── 夜。試作A（game/art_room_styles.html）と同じ順番・同じ値 ──
     1. 床と壁を夜の色で描く：mix(色, #2a2440, .58)（nightColor が fillStyle に入る色を変える）
     2. その上に光だまりを screen .14×2 で置く（床にだけ）
     3. 什器と人も夜の色で描く。ただし、あかりの下にいる人は近さぶんだけ昼の色に寄せる
     4. 器はいちばん最後、素の色で */
  const nt = nightAmount();
  const NIGHT_BASE = 0.58 * nt;
  NIGHT_K = NIGHT_BASE;
  drawSlab(); drawFloor(); drawEntranceFloor(); drawWalls(); drawSunlight();
  for(const f of furniture) if(f !== moving) drawDropShadow(f);   /* 什器の落ち影 */

  /* 光だまり（試作Aと同じ：夜の色にした床の上に screen .14×2）。光の色は夜の色にしない */
  NIGHT_K = 0;
  drawCeilingLight("floor");
  drawLampGlow();
  NIGHT_K = NIGHT_BASE;

  /* 動かしている什器の置き場所を示す */
  if(moving){
    const MW = fw(moving), MD = fd(moving);
    const ok = fits(moving.gx0, moving.gy0, {w:MW, d:MD}, moving);
    poly([iso(moving.gx0,moving.gy0), iso(moving.gx0+MW,moving.gy0),
          iso(moving.gx0+MW,moving.gy0+MD), iso(moving.gx0,moving.gy0+MD)],
         ok ? "rgba(80,220,180,.42)" : "rgba(240,90,120,.38)");
  }
  /* 持ち上げているものは、置こうとしている場所に浮かせて見せる */
  const held = moving ? Object.assign({}, moving, {x:moving.gx0, y:moving.gy0}) : null;

  const items = [];
  const outside = [];                 /* 階段の上にいる人。踏み台より手前に描く */
  /* 前後関係のために、床に置いた四角も持たせる（x0,y0,x1,y1） */
  for(const f of furniture) if(FURN[f.type].cat!=="wall")
    if(f !== moving) items.push({z:f.y + fd(f)*0.5 + f.x*0.001, k:"f", f,
      x0:f.x, y0:f.y, x1:f.x+fw(f), y1:f.y+fd(f)});
  const RP = 0.24, RQ = 0.2;          /* 人と動物の足もとの広さ */
  if(!party){
    for(const s of staff){
      if(s.away && s.phase !== "walk") continue;
      if(s.gx > GW - 0.15) outside.push(s);
      else items.push({z:s.gy+0.02, k:"s", s,
        x0:s.gx-RP, y0:s.gy-RP, x1:s.gx+RP, y1:s.gy+RP});
    }
    for(const q of pets)  items.push({z:q.gy+0.03, k:"c", q,
      x0:q.gx-RQ, y0:q.gy-RQ, x1:q.gx+RQ, y1:q.gy+RQ});
    if(visitor){
      if(visitor.gx > GW - 0.15) outside.push(visitor);
      else items.push({z:visitor.gy+0.02, k:"s", s:visitor,
        x0:visitor.gx-RP, y0:visitor.gy-RP, x1:visitor.gx+RP, y1:visitor.gy+RP});
    }
  }
  items.sort((a,b)=>a.z-b.z);
  /* 数ひとつ（奥ゆきの真ん中）で前後を決めると、大きな台の右わきに立った人が
     台に塗りつぶされ、角をすり抜けたように見える（先生の指摘 2026-09-14）。
     そこで、奥ゆき順に並べたあと、**となりどうしだけ**を見て入れかえる。
     　・画面の横位置が重なる組だけを見る（離れている物は前後を決めなくてよい）
     　・床の四角が「片方の軸でまるごと奥にある」なら、そちらを先に描く
     全体を組み直すと、画面で離れた物どうしにも前後がついて並びが壊れるので、
     直すのは隣どうしにとどめる（2026-09-14、いちど壊して先生に指摘された） */
  for(const it of items){
    it.sl = (it.x0 - it.y1) * (TW/2) - 10;
    it.sr = (it.x1 - it.y0) * (TW/2) + 10;
  }
  const mustSwap = (a, b) =>                    /* a が先・b が後に並んでいるとき */
    a.sr > b.sl && b.sr > a.sl &&               /* 画面で横に重なる組だけ */
    (b.x1 <= a.x0 + 1e-6 || b.y1 <= a.y0 + 1e-6);   /* b のほうが奥にある */
  for(let pass = 0; pass < 6; pass++){
    let moved = false;
    for(let i = 0; i + 1 < items.length; i++)
      if(mustSwap(items[i], items[i+1])){
        const t = items[i]; items[i] = items[i+1]; items[i+1] = t; moved = true;
      }
    if(!moved) break;
  }
  for(const it of items){
    if(it.k==="f"){
      if(it.f===sel){ ctx.save(); ctx.shadowColor="rgba(255,120,175,.95)"; ctx.shadowBlur=12; }
      drawFurniture(it.f);
      if(it.f===sel) ctx.restore();
    }
    else if(it.k==="s"){
      NIGHT_K = NIGHT_BASE * (1 - litAt(it.s.gx, it.s.gy));   /* あかりの下の人は明るい */
      drawPerson(it.s);
      NIGHT_K = NIGHT_BASE;
    }
    else PETDRAW[it.q.kind](it.q);
  }

  if(held){                 /* 持ち上げているものを、いちばん上に浮かせて */
    ctx.save(); ctx.globalAlpha = 0.82;
    ctx.translate(0, -9);
    drawFurniture(held);
    ctx.restore();
  }
  drawEntranceFront();      /* 手前の辺にあるので、いちばん最後に描く */
  /* 階段の上の人。遠いほど薄くして、歩き去る感じを出す */
  for(const s of outside.sort((a,b)=>a.gx-b.gx)){
    const a = s.gz < -21 ? Math.max(0, (s.gz + 33) / 12) : 1;
    if(a <= 0.02) continue;
    ctx.save(); ctx.globalAlpha = a; drawPerson(s); ctx.restore();
  }
  NIGHT_K = 0;                          /* 吹き出しと印は暗くしない */
  for(const s of [...staff].sort((a,b)=>a.gy-b.gy)) drawBubble(s, 26*s.appear.tall);
  for(const q of pets) drawBubble(q, 18);
  if(visitor && !party) drawBubble(visitor, 26*visitor.appear.tall);
  /* 待っている来客の頭の上に、金の「！」 */
  if(visitor && visitor.phase === "wait" && !party && !visitor.bubble){
    const vp = iso(visitor.gx, visitor.gy, 0);
    const vy = vp.y - 26*visitor.appear.tall - 36 + Math.sin(anim*4.2)*3;
    ctx.save();
    ctx.fillStyle = "#ffd23c";
    ctx.beginPath(); ctx.arc(vp.x, vy, 9, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "rgba(120,70,20,.45)"; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = "#5a3a10"; ctx.font = "800 12px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("！", vp.x, vy+4.2);
    ctx.restore();
  }
  ctx.restore();                       /* 縮小はここまで */

  /* 朝夕の色（橙）だけは、いままでどおり薄くのせる */
  if(dm.amt > 0.005){
    ctx.fillStyle = "rgba("+dm.tint+","+dm.amt+")";
    ctx.fillRect(0,0,VW,VH);
  }
  if(nt >= 0.12){
    /* 天井のあかりの器。点いている物は暗くしないので、いちばん最後に描く */
    ctx.save();
    ctx.setTransform(DPR*ZM, 0, 0, DPR*ZM, DPR*(VW*(1-ZM)/2 + panX*ZM), DPR*VH*(1-ZM)/2);
    drawCeilingLight("fixture");
    ctx.restore();
  }

  NIGHT_K = 0;
  if(party){ if(party.kind==="show") drawShow(); else drawParty(); return; }
}

/* ---------- 背景。場面ごとの空気だけを描く ---------- */
function drawStoryBG(g, kind, t){
  let top = "#4a3a48", bot = "#8a6f80";
  if(kind === "flea"){  top = "#41302c"; bot = "#7d5a45"; }
  if(kind === "stage"){ top = "#12162a"; bot = "#2c3658"; }
  if(kind === "night"){ top = "#1b1930"; bot = "#3c3454"; }
  const gr = g.createLinearGradient(0, 0, 0, OVH);
  gr.addColorStop(0, top); gr.addColorStop(1, bot);
  g.fillStyle = gr; g.fillRect(0, 0, OVW, OVH);

  if(kind === "flea"){                       /* 豆電球のつらなり */
    for(let row = 0; row < 2; row++){
      const y0 = 96 + row*54;
      g.strokeStyle = "rgba(40,26,20,.5)"; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(-8, y0);
      g.quadraticCurveTo(OVW/2, y0+40, OVW+8, y0-6);
      g.stroke();
      for(let i = 0; i <= 7; i++){
        const u = i/7, x = u*OVW;
        const y = (1-u)*(1-u)*y0 + 2*(1-u)*u*(y0+40) + u*u*(y0-6);
        const tw = 0.75 + 0.25*Math.sin(t*3 + i*1.7 + row*2);
        g.fillStyle = "rgba(255,208,120,"+(0.5*tw)+")";
        g.beginPath(); g.arc(x, y, 6.5, 0, 6.2832); g.fill();
        g.fillStyle = "rgba(255,236,190,"+(0.95*tw)+")";
        g.beginPath(); g.arc(x, y, 2.6, 0, 6.2832); g.fill();
      }
    }
  }
  if(kind === "stage"){                      /* 上からのスポットライト */
    g.fillStyle = "rgba(255,240,205,.10)";
    g.beginPath();
    g.moveTo(OVW/2-46, -10); g.lineTo(OVW/2+46, -10);
    g.lineTo(OVW/2+165, 620); g.lineTo(OVW/2-165, 620);
    g.closePath(); g.fill();
    g.fillStyle = "rgba(255,240,205,.07)";
    g.beginPath(); g.ellipse(OVW/2, 600, 175, 34, 0, 0, 6.2832); g.fill();
  }
  if(kind === "atelier"){                    /* 窓のあかり */
    g.fillStyle = "rgba(255,238,214,.10)";
    g.fillRect(268, 90, 108, 190);
    g.fillStyle = "rgba(255,238,214,.06)";
    g.fillRect(14, 120, 78, 150);
    g.strokeStyle = "rgba(90,60,80,.35)"; g.lineWidth = 4;
    g.strokeRect(268, 90, 108, 190);
    g.beginPath(); g.moveTo(322, 90); g.lineTo(322, 280);
    g.moveTo(268, 185); g.lineTo(376, 185); g.stroke();
  }
  if(kind === "night"){                      /* 月と星 */
    g.fillStyle = "rgba(246,240,220,.85)";
    g.beginPath(); g.arc(320, 110, 26, 0, 6.2832); g.fill();
    g.fillStyle = top;
    g.beginPath(); g.arc(310, 102, 22, 0, 6.2832); g.fill();
    for(let i = 0; i < 12; i++){
      const x = (i*97 + 31) % OVW, y = (i*61 + 40) % 260;
      g.fillStyle = "rgba(255,255,255,"+(0.3+0.3*Math.sin(t*2+i))+")";
      g.fillRect(x, y, 2, 2);
    }
  }
  /* 人物のうしろの、まるいあかり */
  const au = g.createRadialGradient(OVW/2, 330, 40, OVW/2, 330, 300);
  au.addColorStop(0, "rgba(255,240,220,.13)"); au.addColorStop(1, "rgba(255,240,220,0)");
  g.fillStyle = au; g.fillRect(0, 0, OVW, OVH);
  /* ちり */
  for(let i = 0; i < 12; i++){
    const x = (i*83 + 17) % OVW;
    const y = (OVH + 40 - ((t*14 + i*67) % (OVH+80)));
    g.fillStyle = "rgba(255,244,224,"+(0.10+0.08*Math.sin(t+i*2))+")";
    g.beginPath(); g.arc(x, y, 1.6+ (i%3)*0.7, 0, 6.2832); g.fill();
  }
}

/* ---------- 大きな一枚絵。人はアトリエの中と同じドット絵で描く。
   ます目の大きさだけを変えるので、小さい姿と会話の顔が同じ手になる
   （描き方の中身は src/staff/person.js の pxBust） ---------- */
const PORT_TOP = 148, PORT_U = 10.4;   /* 頭のてっぺんを置く高さと、大きさ */
function drawPortrait(g, P, mood, t, inT){
  const e = 1 - Math.pow(1 - Math.min(1, inT), 3);        /* 登場のすべり込み */
  const a = pxNorm(P.appear || P);
  /* 上半身だけを切り抜くと、切り口が宙に浮いて見える（09 が入学式で先に気づいた）。
     ここでは全身を描き、脚は下の会話の帯の裏へ逃がす。
     置く高さは背丈から決めるので、体つきが変わっても頭の位置がそろう */
  const fy = PORT_TOP + pxRig(a).H * PORT_U + Math.sin(t*1.65)*2;
  g.save(); g.globalAlpha = e;
  pxPerson(g, a, { col: P.col || P.cloth || "#8a7f9c",
                   phase:"idle", t: t || 0, flip: 1, mood, bust:true },
           OVW/2 + (1-e)*46, fy, PORT_U);
  g.restore();
}

/* ---------- 名前のある6人（docs/WORLD.md 2章）----------
   創業の4人と、あとから入る生産管理・プレスは、話の中で名前を持つ。
   その職種の「最初の一人」の名前を書きかえるだけで、能力も見た目も触らない。
   一度その人になったら、辞めても次の人は引き継がない（人は替えがきかない）。 */
const CANON = { designer:"ナツメ", patterner:"トキ", textile:"ヨリ",
                sewer:"タエ", producer:"カナメ", press:"ルイ" };
function bindCast(){
  storyFlag.cast = storyFlag.cast || {};
  for(const role in CANON){
    if(storyFlag.cast[role]) continue;
    const s = staff.find(x => x.role === role);
    if(!s) continue;
    storyFlag.cast[role] = s.id;
    usedNames.delete(s.name); s.name = CANON[role]; usedNames.add(s.name);
  }
}
/* その役の人。名前を持った人が辞めていれば null（同じ職種の別の人は返さない） */
function castStaff(role){
  const id = storyFlag.cast && storyFlag.cast[role];
  return (id && staff.find(s => s.id === id)) || null;
}
/* 6人のセリフ。その人がもういなければ、この行は飛ばされる（null は runNode が読み飛ばす） */
function LN(role, text, mood){
  return castStaff(role) ? { who:"R:"+role, text, mood } : null;
}
function castOf(who){
  if(who === "S") return storyCtx.s ? castFromStaff(storyCtx.s) : null;
  if(who && who.slice(0,2) === "R:"){
    const s = castStaff(who.slice(2)); return s ? castFromStaff(s) : null;
  }
  return CAST[who];
}

/* ---------- 会話のエンジン ---------- */
function storyStart(id){
  if(sty || party) return;
  const S = STORIES[id]; if(!S) return;
  sty = { id, S, nodes:S.nodes(), i:-1, node:null, chars:0, t:0,
          bg:S.bg || "atelier", port:null, portName:null, portT:1, mood:"normal",
          dim:false, waitOpts:false };
  stOptsEl.classList.remove("on"); stOptsEl.innerHTML = "";
  stNameEl.textContent = ""; stTextEl.textContent = "";
  storyEl.classList.add("on");
  storyAdvance();
}
function findLabel(nm){
  for(let i = 0; i < sty.nodes.length; i++)
    if(sty.nodes[i] && sty.nodes[i].label === nm) return i;
  return sty.nodes.length;
}
function storyAdvance(){ sty.i++; runNode(); }
function runNode(){
  while(sty){
    if(sty.i >= sty.nodes.length){ storyEnd(); return; }
    const n = sty.nodes[sty.i];
    if(!n){ sty.i++; continue; }
    if(n.label !== undefined){ sty.i++; continue; }
    if(n.jump){ sty.i = findLabel(n.jump); continue; }
    if(n.do){ n.do(); sty.i++; continue; }
    if(n.setBg){ sty.bg = n.setBg; sty.i++; continue; }
    if(n.end){ storyEnd(); return; }
    if(n.mini){
      const m = n;
      miniStart(n.mini, res => {
        if(!sty) return;
        sty.i = findLabel(res >= (m.win || 2) ? m.ok : m.ng);
        runNode();
      });
      return;
    }
    if(n.opts){
      const list = n.opts.filter(o => !o.if || o.if());
      stOptsEl.innerHTML = list.map((o,i)=>
        '<button data-so="'+i+'">'+o.t+'</button>').join("");
      stOptsEl.classList.add("on");
      sty.waitOpts = true;
      stNextEl.style.display = "none";
      stOptsEl.querySelectorAll("button").forEach(b => {
        b.onclick = ev2 => {
          ev2.stopPropagation();
          if(!sty) return;
          const o = list[+b.dataset.so];
          stOptsEl.classList.remove("on"); stOptsEl.innerHTML = "";
          sty.waitOpts = false;
          if(o.do) o.do();
          if(o.jump) sty.i = findLabel(o.jump); else sty.i++;
          runNode();
        };
      });
      return;
    }
    /* 会話の行 */
    sty.node = n; sty.chars = 0;
    if(n.who){
      const p = castOf(n.who);
      sty.port = p; sty.mood = n.mood || "normal"; sty.dim = false;
      if(sty.portName !== n.who){ sty.portName = n.who; sty.portT = 0; }
      stNameEl.textContent = p ? p.name + (p.title ? "　—　" + p.title : "") : "";
      stTextEl.classList.remove("nar");
    } else {
      sty.dim = true;
      stNameEl.textContent = "";
      stTextEl.classList.add("nar");
    }
    stTextEl.textContent = "";
    stNextEl.style.display = "none";
    return;
  }
}
function storyEnd(){
  if(!sty) return;
  const S = sty.S, id = sty.id;
  storyEl.classList.remove("on");
  stOptsEl.classList.remove("on"); stOptsEl.innerHTML = "";
  sty = null;
  if(S.after) S.after();
  if(visitor && visitor.storyId === id && !visitor.leaving){
    visitorLeave(false);
    visitor.bubble = "それでは、また"; visitor.bubbleT = 3.2;
  }
  renderPane(); renderHUD();
}
function storyTap(){
  if(!sty || sty.waitOpts) return;
  const n = sty.node;
  if(n && n.text && sty.chars < n.text.length){ sty.chars = n.text.length; return; }
  storyAdvance();
}
storyEl.addEventListener("click", storyTap);

function storyTick(dt){
  if(!sty) return;
  sty.t += dt;
  sty.portT = Math.min(1, sty.portT + dt*2.6);
  const n = sty.node;
  if(n && n.text){
    if(sty.chars < n.text.length){
      sty.chars = Math.min(n.text.length, sty.chars + dt*36);
      stTextEl.textContent = n.text.slice(0, Math.floor(sty.chars));
    } else {
      stTextEl.textContent = n.text;
      if(!sty.waitOpts) stNextEl.style.display = "";
    }
  }
  stCtx.clearRect(0, 0, OVW, OVH);
  drawStoryBG(stCtx, sty.bg, sty.t);
  if(sty.port) drawPortrait(stCtx, sty.port, sty.mood, sty.t, sty.portT);
  if(sty.dim){ stCtx.fillStyle = "rgba(16,12,24,.42)"; stCtx.fillRect(0, 0, OVW, OVH); }
}

/* ---------- 来客。扉から入ってきて、待つ ---------- */
function spawnVisitor(storyId){
  const who = STORIES[storyId].cast, c = CAST[who];
  if(!c) return;
  NPCROLE["v_"+who] = NPCROLE["v_"+who] || { color:c.spriteCol, name:c.title };
  visitor = { role:"v_"+who, who, storyId, name:c.name,
              appear:Object.assign({}, c.sprite),
              gx:GW+2.34, gy:GD/2, gz:-30, tx:0, ty:0, tz:null, t:0, flip:-1,
              phase:"walk", route:inRoute().concat([[GW-1.55, GD/2+0.2, 0]]),
              bubble:null, bubbleT:0, bubOff:0, bad:false, wait:0, leaving:false };
  nextLeg(visitor);
  toast("🔔 来客　—　"+c.name+"（"+c.title+"）");
  log(c.name+"（"+c.title+"）が訪ねてきた。");
}
function visitorLeave(requeue){
  const v = visitor; if(!v || v.leaving) return;
  if(requeue && v.storyId) storyPend.unshift(v.storyId);
  v.leaving = true; v.phase = "walk"; v.bubble = null;
  v.route = outRoute();
  nextLeg(v);
}
function stepVisitor(dt){
  const v = visitor; if(!v) return;
  v.t += dt;
  if(v.bubbleT > 0){ v.bubbleT -= dt; if(v.bubbleT <= 0) v.bubble = null; }
  if(v.phase === "walk"){
    const dx = v.tx-v.gx, dy = v.ty-v.gy, d = Math.hypot(dx, dy);
    if(d < 0.05){
      if(v.tz != null) v.gz = v.tz;
      if(v.route && v.route.length){ nextLeg(v); }
      else if(v.leaving){ visitor = null; }
      else { v.phase = "wait"; v.gz = 0; v.tz = null; v.flip = -1;
             v.bubble = "ごめんください"; v.bubbleT = 3; }
    } else {
      const out2 = v.gx > GW - 0.3;
      const sp = 0.95*(out2 ? 1.95 : 1.3)*dt;
      v.gx += dx/d*Math.min(sp, d); v.gy += dy/d*Math.min(sp, d);
      v.flip = dx >= 0 ? 1 : -1;
      if(v.tz != null && v.legLen)
        v.gz = v.tz + ((v.g0z||0) - v.tz)*Math.min(1, d/v.legLen);
    }
  } else {
    v.wait += dt;
    if(v.bubbleT <= 0 && Math.random() < dt*0.02){
      v.bubble = pick(["ごめんください", "……いい部屋だ", "少しだけ、いいかしら"]);
      v.bubbleT = 3;
    }
    if(mp > M_CLOSE + 0.02) visitorLeave(true);   /* 閉店。日をあらためる */
  }
}


/* ==================================================================
   章の進行係（担当：03 世界と物語）

   来客（storyPend）は週の処理（src/game/week.js）が回している。
   来客のない場面と、章の話の予定はここで見る。
   週の処理のファイルを触らずに済むよう、見回り（onTick）と発表会（runShow）を
   あとから包んで差し込んでいる。合流のとき、onTick の末尾に storySchedule() の
   1行を置いて包みを外してよい（09 の engine.js と同じ形）。
   ================================================================== */
let sceneQ = [];              /* 出番を待っている場面（来客なし） */
EXTRA_RESETS.push(function(){ sceneQ = []; });

/* 裏口（#catalog）で開いているときは場面を自動で開かない。
   25秒の通し確認が場面の上で止まってしまうため。dev.sceneNext() で開ける。
   来客は今までどおり自動で来る */
function sceneAuto(){ return !(typeof DEVTOOL !== "undefined" && DEVTOOL); }
function sceneBusy(){
  return !!(sty || party || visitor
    || (typeof mini !== "undefined" && mini)
    || (typeof gc !== "undefined" && gc));
}
function sceneOpen(){
  if(!sceneQ.length || sceneBusy()) return false;
  const id = sceneQ.shift();
  if(!STORIES[id]) return false;
  storyStart(id); return true;
}

function storySchedule(){
  bindCast();                                       /* 雇った人が「その人」になる */
  /* 序：1週目、最初の見回り */
  if(month === 1 && !storyFlag.ch1_openQ){ storyFlag.ch1_openQ = 1; sceneQ.push("ch1_open"); }
  /* 第1章：モリ先生。2週目に一度だけ来る（学園祭のあとなら短い挨拶になる） */
  if(month === 2 && !storyFlag.ch1_moriQ){
    storyFlag.ch1_moriQ = 1;
    if(storyPend.indexOf("ch1_mori") < 0) storyPend.push("ch1_mori");
  }
  /* 第1章の終わり：学園祭に通った */
  if(showIdx >= 1 && !storyFlag.ch1_passQ){ storyFlag.ch1_passQ = 1; sceneQ.push("ch1_pass"); }

  if(sceneAuto() && isWorkTime()) sceneOpen();
}

/* 見回りを包む。週3回 */
const stBaseTick = onTick;
onTick = function(){ stBaseTick(); storySchedule(); };

/* 発表会を包む。第1章（学園祭）に届かなかったときだけ、その夜の場面を足す */
const stBaseShow = runShow;
runShow = function(){
  const idx = showIdx;
  stBaseShow();
  if(idx === 0 && party && party.kind === "show" && !party.pass && !storyFlag.ch1_failQ){
    storyFlag.ch1_failQ = 1; sceneQ.push("ch1_fail");
  }
};

/* 確認スクリプト用の口。boot.js が window.__catalog を作ったあとに足す */
