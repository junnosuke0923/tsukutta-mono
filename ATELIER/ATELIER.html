/* ── 一着を描く（showart.js の garment() と同じ順番） ── */
function drawGarment(g,form,fab,cx,cy,h,opt){
  opt=opt||{};
  const w=h*0.52, base=fab.col, raw=opt.raw;
  /* opt.prefx ＝ 生地の変形をもう済ませてある（ボディに着せるとき、寸法を先に決めるため） */
  const f=raw?null:(opt.prefx?form:gFabricFx(form,fab));
  const path=()=>{ g.beginPath(); if(raw) raw(g,cx,cy,w,h); else shapePath(g,cx,cy,w,h,f); g.closePath(); };

  if(opt.silhouette){                              /* 影絵：形だけを見る */
    g.fillStyle=opt.silhouette===true?"#2a2430":opt.silhouette; path(); g.fill(); return;
  }
  if(opt.toile){                                   /* 仮縫い。"paper"＝紙の型紙、"muslin"＝シーチングのトワル */
    const paper=opt.toile==="paper", F0=f||GBASE;
    g.fillStyle=paper?"#f9f5ec":"#efe6d2"; path(); g.fill();
    g.save(); g.clip();
    g.fillStyle=gK(paper?.05:.08); g.fillRect(cx+w*0.28,cy-10,w*2,h*1.2);       /* 右へ沈む */
    if(paper){ g.strokeStyle="rgba(0,0,0,.07)"; g.lineWidth=1;                  /* 紙の折れ */
      g.beginPath(); g.moveTo(cx-w*.6,cy+h*.2); g.lineTo(cx-w*.1,cy+h*.9); g.stroke(); }
    else { g.strokeStyle=gK(.06); g.lineWidth=.6;                               /* 織り目 */
      for(let y=0;y<h;y+=3){ g.beginPath(); g.moveTo(cx-w*1.3,cy+y); g.lineTo(cx+w*1.3,cy+y); g.stroke(); } }
    /* 縫い線：中心・ウエスト・脇 */
    g.strokeStyle=paper?"rgba(90,80,110,.6)":"rgba(110,90,80,.55)"; g.lineWidth=.8; g.setLineDash([2,2]);
    g.beginPath(); g.moveTo(cx,cy+h*.03); g.lineTo(cx,cy+h*Math.min(1,F0.hy)); g.stroke();
    g.beginPath(); g.moveTo(cx-w*1.3,cy+h*F0.wy); g.lineTo(cx+w*1.3,cy+h*F0.wy); g.stroke();
    if(F0.top>0.35) for(const s of [-1,1]){ g.beginPath(); g.moveTo(cx+s*w*F0.sh*.7,cy+h*.06);
      g.quadraticCurveTo(cx+s*w*F0.ww*.85,cy+h*F0.wy,cx+s*w*F0.hw*.6,cy+h*F0.hy); g.stroke(); }
    g.setLineDash([]); g.restore();
    g.strokeStyle=paper?"rgba(90,80,110,.5)":"rgba(120,100,90,.55)"; g.lineWidth=.9; path(); g.stroke();
    /* まち針 */
    const pins=paper?[[-.22,.10],[.20,.16],[-.10,.40]]:[[-.24,.12],[.22,.30],[.05,.55],[-.16,.62]];
    for(const [px,py] of pins){ const x=cx+px*w, y=cy+py*h;
      g.strokeStyle="#c94f79"; g.lineWidth=1; g.beginPath(); g.moveTo(x,y); g.lineTo(x+3,y-2.5); g.stroke();
      g.fillStyle="#3a3a46"; g.beginPath(); g.arc(x,y,.9,0,6.2832); g.fill(); }
    return;
  }
  if(!opt.bare){                                   /* 床の影とハンガー。ボディに着せるときは無し */
    g.fillStyle="rgba(0,0,0,"+(0.30*(1-fab.sheer*0.7))+")";
    g.beginPath(); g.ellipse(cx,cy+(raw?1:Math.max(f.hy,f.hy+f.asymY))*h+5,
      w*0.56,h*0.042,0,0,6.2832); g.fill();
    g.strokeStyle="rgba(255,255,255,.42)"; g.lineWidth=1.6;
    g.beginPath(); g.moveTo(cx,cy-16); g.lineTo(cx,cy-6); g.stroke();
    g.beginPath(); g.arc(cx,cy-19,3.4,0,6.2832); g.stroke();
  }

  g.save();
  if(fab.sheer) g.globalAlpha=1-fab.sheer*0.55;
  const gl=fab.gloss;
  const gr=g.createLinearGradient(cx-w*0.7,cy,cx+w*0.7,cy+h);
  gr.addColorStop(0,shade(base,1.20+gl*0.30));
  gr.addColorStop(0.55,base);
  gr.addColorStop(1,shade(base,0.62-gl*0.18));
  g.fillStyle=gr; path(); g.fill();

  g.save(); g.clip();
  gSurface(g,fab,cx,cy,w,h);
  if(f&&f.tier>0.4) for(let i=1;i<=Math.round(f.tier);i++){
    g.fillStyle=i%2?gW(.18):gK(.11);
    g.fillRect(cx-w*1.3,cy+h*(f.wy+(f.hy-f.wy)*i/(Math.round(f.tier)+1)),w*2.6,h*.030); }
  if(opt.det&&GDET[opt.det]) GDET[opt.det](g,f||GBASE,cx,cy,w,h);
  if(gl>0.4){ const hi=g.createLinearGradient(cx-w*0.5,cy,cx+w*0.1,cy+h);
    hi.addColorStop(0,gW(0)); hi.addColorStop(.5,gW(0.10+gl*0.26)); hi.addColorStop(1,gW(0));
    g.fillStyle=hi; g.fillRect(cx-w*1.3,cy,w*2.6,h); }
  if(fab.sheer>0.3){ const hy=f?Math.max(.3,f.hy):1; g.fillStyle=gK(.10);
    g.beginPath(); g.ellipse(cx,cy+h*hy*.74,w*.34,h*hy*.26,0,0,6.2832); g.fill(); }
  /* 右下からの照り返し。暗い舞台では丸く浮くので外せる（norim）。
     opt.rimin なら服の形の中だけに出す。外に出したままだと布のまわりが光って、
     実際より一回り大きく見える（ボディに着せたときに目立つ） */
  const rim=()=>{
    g.save(); g.globalCompositeOperation="lighter";
    const r=g.createLinearGradient(cx+w*0.2,cy,cx+w*1.0,cy+h);
    r.addColorStop(0,"rgba(255,240,210,0)");
    r.addColorStop(1,"rgba(255,240,210,"+(0.16+gl*0.16)+")");
    g.fillStyle=r;
    g.beginPath(); g.ellipse(cx+w*0.35,cy+h*0.5,w*0.55,h*0.5,0,0,6.2832); g.fill();
    g.restore();
  };
  if(!opt.norim&&opt.rimin) rim();
  g.restore();
  if(!opt.norim&&!opt.rimin) rim();
  g.restore();

  if(opt.noneck) return;                           /* 襟は着せる側が作る（ボディの片身ごろ） */
  /* 襟あきと肩の線／ボトムスはクリップのハンガー */
  if(f&&f.top<0.35){
    g.strokeStyle="rgba(255,255,255,.42)"; g.lineWidth=1.6;
    g.beginPath(); g.moveTo(cx-w*f.ww*.9,cy-3); g.lineTo(cx+w*f.ww*.9,cy-3); g.stroke();
    g.fillStyle=shade(base,0.42);
    for(const s of[-1,1]){ g.beginPath(); g.roundRect(cx+s*w*f.ww*.62-3.4,cy-5.5,6.8,9,1.6); g.fill(); }
  } else {
    const nw=f?Math.max(0.09,f.neck):0.155, sh=f?Math.max(0.18,(f.sh*f.top+f.ww*(1-f.top))*0.9):0.28;
    g.fillStyle=shade(base,0.40);
    g.beginPath(); g.ellipse(cx,cy+h*0.015,w*nw,h*0.036,0,0,6.2832); g.fill();
    g.fillStyle=shade(base,1.32);
    g.beginPath(); g.ellipse(cx,cy+h*0.005,w*nw,h*0.030,0,0,6.2832); g.fill();
    g.strokeStyle="rgba(0,0,0,.22)"; g.lineWidth=1;
    g.beginPath();
    g.moveTo(cx-w*nw*.84,cy+h*.03); g.lineTo(cx-w*sh,cy+h*.03);
    g.moveTo(cx+w*nw*.84,cy+h*.03); g.lineTo(cx+w*sh,cy+h*.03);
    g.stroke();
  }
}
/* ── 掛け合わせ。数字を混ぜるだけ ── */
function mixForm(a,b,t,pick){
  const o={};
  for(const k of GKEYS) o[k]= pick ? (pick[k]?b[k]:a[k]) : a[k]+(b[k]-a[k])*t;
  return o;
}

/* ---- 本体とのつなぎ ---- */
/* 主役だった要素（top）から、それらしい型と生地を引いて一着にする。乱数はここだけ */
const G_PICK = {
  concept: ["斜めに落ちる","ねじる","花のように","風船","ケープ","段を積む","サロペット","パフスリーブ"],
  form:    ["肩の建築","コクーン","風船","円をひらく","人魚","階段","筒","ジャンプスーツ","ビスチェ","フレアスカート"],
  material:["円をひらく","Aライン","ガウンコート","ニット","ダウン","マキシスカート","プリーツスカート","細く長く","タートル"],
  tech:    ["テーラード","トレンチ","チェスター","シャツ","ライダース","デニムJK","タイトスカート","カーゴ","ワイドパンツ","ベスト"],
};
function gIdx(name){ const i = GLIB.findIndex(x => x.n === name && x.f); return i < 0 ? 4 : i; }
function makePiece(top, rnd){
  const R = rnd || Math.random;
  const names = G_PICK[top] || G_PICK.concept;
  const a = gIdx(names[Math.floor(R()*names.length)]);
  const pool = GLIB.map((x,i)=>i).filter(i => GLIB[i].f && GLIB[i].c === GLIB[a].c);
  const b = R() < 0.6 ? pool[Math.floor(R()*pool.length)] : 4 + Math.floor(R()*(GLIB.length-4));
  const t = 0.15 + R()*0.7;
  let f = Math.floor(R()*GFAB.length);
  if(top === "material" && R() < 0.7){                 /* 素材が主役なら、表情のある生地を */
    const rich = GFAB.map((x,i)=>i).filter(i => GFAB[i].gloss > 0.4 || GFAB[i].sheer > 0.3 || GFAB[i].hard >= 3);
    f = rich[Math.floor(R()*rich.length)];
  }
  return { a, b, t:+t.toFixed(2), f };
}
/* 一着を描く。{a,b,t,f} から */
function drawPiece(g, p, cx, cy, h, opt){
  const A = GLIB[p.a] || GLIB[4], B = GLIB[p.b] || A;
  const form = mixForm(A.f || GBASE, B.f || A.f || GBASE, p.t);
  const det = (p.t < 0.5 ? A.dt : B.dt) || A.dt || B.dt;
  drawGarment(g, form, GFAB[p.f] || GFAB[0], cx, cy, h, Object.assign({det}, opt||{}));
}
/* 作品や札から描く。piece を持っていれば新しい仕組み、なければもとの 4 着 */
function garmentRec(g, rec, cx, cy, h){
  if(rec && rec.piece) drawPiece(g, rec.piece, cx, cy, h);
  else garment(g, (rec && rec.top) || "concept", cx, cy, h);
}
function pieceName(p){
  const A = GLIB[p.a], B = GLIB[p.b], F = GFAB[p.f];
  if(!A || !B || !F) return "";
  return F.n + "の" + (p.a === p.b || p.t < 0.25 ? A.n : p.t > 0.75 ? B.n : A.n + "×" + B.n);
}
/* ==================================================================
   15. 発表の絵
   ================================================================== */
function garment(ctx, kind, cx, cy, h){
  const base = GCOL[kind], w = h*0.52;
  ctx.fillStyle = "rgba(0,0,0,.30)";
  ctx.beginPath(); ctx.ellipse(cx, cy+h+5, w*0.60, h*0.045, 0, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.42)"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(cx, cy-16); ctx.lineTo(cx, cy-6); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy-19, 3.4, 0, 6.2832); ctx.stroke();

  const g = ctx.createLinearGradient(cx-w*0.7, cy, cx+w*0.7, cy+h);
  g.addColorStop(0, shade(base,1.20)); g.addColorStop(0.55, base); g.addColorStop(1, shade(base,0.62));
  ctx.fillStyle = g;
  ctx.beginPath();
  if(kind==="concept"){
    ctx.moveTo(cx-w*0.42, cy);
    ctx.lineTo(cx-w*0.26, cy+h*0.20);
    ctx.quadraticCurveTo(cx-w*0.20, cy+h*0.32, cx-w*0.24, cy+h*0.40);
    ctx.bezierCurveTo(cx-w*0.66, cy+h*0.62, cx-w*0.98, cy+h*0.84, cx-w*0.86, cy+h);
    ctx.bezierCurveTo(cx-w*0.36, cy+h*1.05, cx+w*0.14, cy+h*1.02, cx+w*0.48, cy+h*0.88);
    ctx.bezierCurveTo(cx+w*0.44, cy+h*0.62, cx+w*0.34, cy+h*0.48, cx+w*0.30, cy+h*0.38);
    ctx.quadraticCurveTo(cx+w*0.26, cy+h*0.26, cx+w*0.30, cy+h*0.18);
    ctx.lineTo(cx+w*0.42, cy);
  } else if(kind==="form"){
    ctx.moveTo(cx-w*0.30, cy);
    ctx.lineTo(cx-w*0.20, cy+h*0.30);
    ctx.bezierCurveTo(cx-w*0.62, cy+h*0.58, cx-w*0.94, cy+h*0.86, cx-w*1.02, cy+h);
    ctx.bezierCurveTo(cx-w*0.40, cy+h*1.07, cx+w*0.40, cy+h*1.07, cx+w*1.02, cy+h);
    ctx.bezierCurveTo(cx+w*0.94, cy+h*0.86, cx+w*0.62, cy+h*0.58, cx+w*0.20, cy+h*0.30);
    ctx.lineTo(cx+w*0.30, cy);
    ctx.bezierCurveTo(cx+w*0.12, cy-h*0.05, cx-w*0.12, cy-h*0.05, cx-w*0.30, cy);
  } else if(kind==="material"){
    ctx.moveTo(cx-w*0.30, cy);
    ctx.lineTo(cx-w*0.22, cy+h*0.26);
    ctx.lineTo(cx-w*0.80, cy+h);
    ctx.bezierCurveTo(cx-w*0.30, cy+h*1.05, cx+w*0.30, cy+h*1.05, cx+w*0.80, cy+h);
    ctx.lineTo(cx+w*0.22, cy+h*0.26);
    ctx.lineTo(cx+w*0.30, cy);
    ctx.bezierCurveTo(cx+w*0.12, cy-h*0.05, cx-w*0.12, cy-h*0.05, cx-w*0.30, cy);
  } else {
    ctx.moveTo(cx-w*0.66, cy-h*0.02);
    ctx.lineTo(cx-w*0.52, cy+h*0.06); ctx.lineTo(cx-w*0.40, cy+h*0.34);
    ctx.lineTo(cx-w*0.34, cy+h*0.46); ctx.lineTo(cx-w*0.44, cy+h);
    ctx.lineTo(cx+w*0.44, cy+h);      ctx.lineTo(cx+w*0.34, cy+h*0.46);
    ctx.lineTo(cx+w*0.40, cy+h*0.34); ctx.lineTo(cx+w*0.52, cy+h*0.06);
    ctx.lineTo(cx+w*0.66, cy-h*0.02); ctx.lineTo(cx+w*0.30, cy-h*0.06);
    ctx.lineTo(cx-w*0.30, cy-h*0.06);
  }
  ctx.closePath(); ctx.fill();

  ctx.save(); ctx.clip();
  if(kind==="concept"){
    ctx.fillStyle = "rgba(255,255,255,.22)";
    ctx.beginPath();
    ctx.moveTo(cx-w*0.34, cy-2);
    ctx.bezierCurveTo(cx-w*0.52, cy+h*0.26, cx-w*0.44, cy+h*0.56, cx-w*0.10, cy+h*0.74);
    ctx.bezierCurveTo(cx+w*0.24, cy+h*0.50, cx+w*0.30, cy+h*0.22, cx+w*0.24, cy+h*0.04);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.16)"; ctx.lineWidth = 1.1;
    for(let i=0;i<4;i++){
      ctx.beginPath(); ctx.moveTo(cx-w*0.30+i*w*0.05, cy+h*0.10);
      ctx.quadraticCurveTo(cx-w*(0.52-i*0.10), cy+h*0.56, cx-w*(0.60-i*0.16), cy+h*0.98);
      ctx.stroke();
    }
  } else if(kind==="form"){
    ctx.strokeStyle = "rgba(255,255,255,.36)"; ctx.lineWidth = 1.5;
    for(let i=-2;i<=2;i++){ if(!i) continue;
      ctx.beginPath(); ctx.moveTo(cx+i*w*0.055, cy+h*0.32);
      ctx.quadraticCurveTo(cx+i*w*0.22, cy+h*0.70, cx+i*w*0.40, cy+h*1.0); ctx.stroke(); }
    ctx.fillStyle = "rgba(0,0,0,.13)";
    ctx.beginPath(); ctx.moveTo(cx-w*0.20, cy+h*0.30);
    ctx.bezierCurveTo(cx-w*0.62, cy+h*0.58, cx-w*0.94, cy+h*0.86, cx-w*1.02, cy+h);
    ctx.lineTo(cx-w*0.52, cy+h*1.02); ctx.closePath(); ctx.fill();
  } else if(kind==="material"){
    for(let i=0;i<4;i++){
      const y = cy+h*(0.34+i*0.17), r = w*(0.30+i*0.16);
      ctx.fillStyle = i%2 ? "rgba(255,255,255,.26)" : "rgba(0,0,0,.13)";
      ctx.beginPath(); ctx.moveTo(cx-r, y);
      for(let k=0;k<=16;k++){
        const px = cx-r+(r*2)*(k/16);
        ctx.lineTo(px, y+Math.abs(Math.sin(k/16*Math.PI*5))*4.5);
      }
      ctx.lineTo(cx+r, y-1); ctx.lineTo(cx-r, y-1); ctx.closePath(); ctx.fill();
    }
  } else {
    ctx.fillStyle = "rgba(255,255,255,.30)";
    ctx.beginPath(); ctx.moveTo(cx-w*0.44, cy-h*0.04); ctx.lineTo(cx, cy+h*0.34);
    ctx.lineTo(cx+w*0.44, cy-h*0.04); ctx.lineTo(cx, cy+h*0.06); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.22)"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(cx, cy+h*0.34); ctx.lineTo(cx, cy+h); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.55)";
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(cx-w*0.07, cy+h*(0.44+i*0.14), 1.8, 0, 6.2832); ctx.fill(); }
  }
  ctx.restore();

  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const rim = ctx.createLinearGradient(cx+w*0.2, cy, cx+w*1.0, cy+h);
  rim.addColorStop(0,"rgba(255,240,210,0)"); rim.addColorStop(1,"rgba(255,240,210,.16)");
  ctx.fillStyle = rim;
  ctx.beginPath(); ctx.ellipse(cx+w*0.35, cy+h*0.5, w*0.55, h*0.5, 0, 0, 6.2832); ctx.fill();
  ctx.restore();

  ctx.fillStyle = shade(base, 0.40);
  ctx.beginPath(); ctx.ellipse(cx, cy+h*0.015, w*0.155, h*0.036, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = shade(base, 1.32);
  ctx.beginPath(); ctx.ellipse(cx, cy+h*0.005, w*0.155, h*0.030, 0, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.22)"; ctx.lineWidth = 1;
  const sh = kind==="tech" ? 0.60 : kind==="concept" ? 0.38 : 0.28;
  ctx.beginPath();
  ctx.moveTo(cx-w*0.13, cy+h*0.03); ctx.lineTo(cx-w*sh, cy+h*0.03);
  ctx.moveTo(cx+w*0.13, cy+h*0.03); ctx.lineTo(cx+w*sh, cy+h*0.03);
  ctx.stroke();
}

function drawParty(){
  const t = party.t, rec = party.rec;
  ctx.fillStyle = "rgba(30,18,34,"+(Math.min(1,Math.max(0,(t-P_DIM)/0.7))*0.90)+")";
  ctx.fillRect(0,0,VW,VH);

  if(t > P_DIM+0.3){
    const k = Math.min(1,(t-P_DIM-0.3)/0.6);
    const gr = ctx.createRadialGradient(VW/2, GOWN_Y+70, 8, VW/2, GOWN_Y+70, 190);
    gr.addColorStop(0, "rgba(255,238,200,"+(0.26*k)+")");
    gr.addColorStop(0.55, "rgba(255,238,200,"+(0.07*k)+")");
    gr.addColorStop(1, "rgba(255,238,200,0)");
    ctx.fillStyle = gr; ctx.fillRect(0,0,VW,VH);
    ctx.save(); ctx.globalAlpha = 0.10*k;
    poly([{x:VW/2-16,y:0},{x:VW/2+16,y:0},
          {x:VW/2+96,y:GOWN_Y+GOWN_H+10},{x:VW/2-96,y:GOWN_Y+GOWN_H+10}], "#ffeec8");
    ctx.restore();
  }
  if(t > P_GOWN){
    const k = Math.min(1,(t-P_GOWN)/0.5), e = 1-Math.pow(1-k,3);
    ctx.save(); ctx.translate(VW/2, GOWN_Y); ctx.scale(0.62+0.38*e, 0.62+0.38*e);
    ctx.globalAlpha = e; garmentRec(ctx, rec, 0, 0, GOWN_H);
    ctx.restore(); ctx.globalAlpha = 1;
  }

  ctx.textAlign = "center";
  const SLOT = [[52,146],[52,200],[338,146],[338,200]];
  for(let i=0;i<Math.min(4,party.shown);i++){
    const k = STATS[i], x = SLOT[i][0], y = SLOT[i][1];
    const age = Math.max(0, t-P_STAT-i*P_GAP);
    const pop = age<0.2 ? 1.55-0.55*(age/0.2) : 1;
    ctx.save(); ctx.translate(x,y); ctx.scale(pop,pop);
    ctx.fillStyle = "rgba(255,246,238,.70)";
    ctx.font = "700 9px 'Hiragino Kaku Gothic ProN',sans-serif";
    ctx.fillText(STATJP[k], 0, -17);
    ctx.fillStyle = GCOL[k];
    ctx.font = "800 26px Consolas,'SF Mono',monospace";
    ctx.fillText(rec.v[k], 0, 4);
    ctx.restore();
    if(rec.v[k]===rec.weak){
      ctx.fillStyle = "rgba(255,146,168,.95)";
      ctx.font = "700 8px 'Hiragino Kaku Gothic ProN',sans-serif";
      ctx.fillText("足を引っぱった", x, y+18);
    }
  }

  drawCrowd();

  if(party.shown >= 5){
    const age = t-P_STAR, pop = age<0.28 ? 1.6-0.6*(age/0.28) : 1;
    ctx.save(); ctx.translate(VW/2, 252); ctx.scale(pop,pop);
    ctx.textAlign = "center"; ctx.fillStyle = "#f5b53c";
    ctx.font = "800 23px 'Hiragino Kaku Gothic ProN',sans-serif";
    ctx.fillText("★".repeat(rec.rar)+"☆".repeat(5-rec.rar), 0, 0);
    ctx.restore();
    if(t > P_PRICE){
      ctx.globalAlpha = Math.min(1,(t-P_PRICE)/0.35);
      ctx.fillStyle = "#fff6ee";
      ctx.font = "800 19px Consolas,'SF Mono',monospace";
      ctx.fillText(yen(rec.price), VW/2, 278);
      ctx.globalAlpha = 1;
    }
  }

  for(const c of confetti){
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r);
    ctx.globalAlpha = Math.min(1, c.life);
    ctx.fillStyle = c.c; ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  if(t > P_TITLE){
    ctx.globalAlpha = Math.min(1,(t-P_TITLE)/0.35);
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(30,18,34,.55)"; ctx.fillRect(0, 16, VW, 48);
    ctx.fillStyle = "rgba(255,246,238,.62)";
    ctx.font = "800 9px 'Hiragino Kaku Gothic ProN',sans-serif";
    ctx.fillText(rec.client, VW/2, 34);
    ctx.fillStyle = "#fff6ee";
    ctx.font = "800 19px 'Hiragino Kaku Gothic ProN',sans-serif";
    ctx.fillText("《"+rec.title+"》", VW/2, 57);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = "start";
  drawCrowdBubbles();
}

/* スタッフと動物を、画面の下に「観客」として並べる */
function drawCrowd(){
  ctx.save(); ctx.translate(0, CROWD_Y);
  const all = [];
  for(const s of staff) all.push({z:s.gy, k:"s", s});
  for(const q of pets)  all.push({z:q.gy+0.02, k:"p", q});
  all.sort((a,b)=>a.z-b.z);
  for(const it of all){
    if(it.k === "s") drawPerson(it.s);
    else {
      const b = it.q.phase==="cheer" ? Math.abs(Math.sin(it.q.t*6.5))*7 : 0;
      ctx.save(); ctx.translate(0,-b); PETDRAW[it.q.kind](it.q); ctx.restore();
    }
  }
  ctx.restore();
}
function drawCrowdBubbles(){
  ctx.save(); ctx.translate(0, CROWD_Y);
  for(const s of [...staff].sort((a,b)=>a.gy-b.gy)) drawBubble(s, 26*s.appear.tall);
  for(const q of pets) drawBubble(q, 20);
  ctx.restore();
}

/* ---------- 発表会の画面（E：ランウェイ。先生の指示 2026-09-13） ----------
   今期つくった服が一着ずつ奥から歩いてきて、舞台の前に並ぶ。いちばんの一着は最後に真ん中へ。
   そのあと点数 → 合否 → 見出しの帯が「講評」に変わる。時刻の区切りは core/time.js の showTimes */

/* 並ぶ場所。0 が真ん中（いちばんの一着）、あとは左右へ交互に */
const RW_FAR = { x:VW/2, y:92, s:0.30 };                 /* 奥。ここから歩きだす */
const RW_SLOT = [
  { x:VW/2,     y:104, s:1.00 },
  { x:VW/2-98,  y:150, s:0.62 }, { x:VW/2+98,  y:150, s:0.62 },
  { x:VW/2-158, y:136, s:0.50 }, { x:VW/2+158, y:136, s:0.50 },
];
const RW_H = 112;                                          /* 真ん中の一着の丈 */

/* 見出しの小さな行。4つの章のあとは季節の輪なので「第0章」にしない */
function showHeading(S){
  const i = SHOWS.indexOf(S);
  return i >= 0 ? "第"+(i+1)+"章　発表会" : "シーズンの発表会";
}

/* 講評する人と、その一言。runShow が party.critic に入れる */
function showCritic(S, best, score, pass, n){
  const i = SHOWS.indexOf(S);
  const who = i === 0 ? "審査の先生" : i === 1 ? "見に来たバイヤー" : i === 2 ? "MODE TOKYO 編集部"
            : (S.name && S.name.indexOf("秋冬") >= 0) ? "BRUME PARIS" : "GRAM magazine";
  if(!best) return { who, text:"見せる服がなければ、語ることもない。次は一着でも、舞台に。" };
  const TOP = { concept:"発想が主役の一着。", form:"かたちが主役の一着。", material:"素材が主役の一着。", tech:"仕立てが主役の一着。" };
  let v = designVerdict(best.design) || TOP[best.top] || "手堅い一着。";
  if(pass) v += n >= 3 ? " 揃えて見せたぶん、この人の世界が見えた。" : n === 2 ? " 次は、もう少し着数を。" : " 一着で押し切った。";
  else     v += " ただ、この会場にはまだ早い。あと " + Math.max(1, showNeed(S) - score) + " 点。";
  return { who, text:v };
}

/* 一着がいまどこにいるか。歩きだす前は null */
function rwPlace(i, n, t){
  const t0 = S_GOWN + i*S_GAP;
  if(t < t0) return null;
  const k = Math.min(1, (t-t0)/S_WALK), e = 1-Math.pow(1-k, 2.2);
  /* 最後の一着（フィナーレ）は 0 番＝真ん中。ほかは歩いた順に 1,2,3,4 */
  const slot = RW_SLOT[i === n-1 ? 0 : Math.min(i+1, RW_SLOT.length-1)];
  const walking = k < 1;
  return {
    x: RW_FAR.x + (slot.x - RW_FAR.x)*e + (walking ? Math.sin(k*Math.PI*4)*2.5*(1-k) : 0),
    y: RW_FAR.y + (slot.y - RW_FAR.y)*e - (walking ? Math.abs(Math.sin(k*Math.PI*6))*2.2 : 0),
    s: RW_FAR.s + (slot.s - RW_FAR.s)*e, a: Math.min(1, k*4), walking,
  };
}

/* 文を、幅に収まるように折る */
function wrapText(s, maxW){
  const out = []; let cur = "";
  for(const ch of s){ if(ctx.measureText(cur+ch).width > maxW && cur){ out.push(cur); cur = ch; } else cur += ch; }
  if(cur) out.push(cur);
  return out;
}

function drawShow(){
  const t = party.t, S = party.show, rec = party.rec, T = showTimes(party);
  const pool = party.pool || (rec ? [rec] : []);
  ctx.fillStyle = "rgba(24,14,30,"+(Math.min(1,t/0.7)*0.93)+")";
  ctx.fillRect(0,0,VW,VH);

  /* ランウェイ。奥が細く手前が広い一本の光の道。両脇に客席の小さな明かり */
  const k = Math.min(1, t/1.2);
  ctx.save(); ctx.globalAlpha = k;
  const rw = ctx.createLinearGradient(0, 84, 0, 262);
  rw.addColorStop(0, "rgba(255,236,206,.34)"); rw.addColorStop(1, "rgba(255,236,206,.06)");
  poly([{x:VW/2-26,y:84},{x:VW/2+26,y:84},{x:VW/2+180,y:262},{x:VW/2-180,y:262}], rw);
  ctx.strokeStyle = "rgba(255,236,206,.18)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(VW/2-26,84); ctx.lineTo(VW/2-180,262); ctx.moveTo(VW/2+26,84); ctx.lineTo(VW/2+180,262); ctx.stroke();
  for(let i=0;i<7;i++){                                     /* 脇の席の明かり（携帯の光） */
    const yy = 100 + i*24, dx = 44 + i*20, tw = 0.35 + 0.3*Math.abs(Math.sin(t*2.1 + i*1.7));
    ctx.fillStyle = "rgba(200,220,255,"+(tw*0.5)+")";
    ctx.fillRect(VW/2-dx-3, yy, 2.4, 3.2); ctx.fillRect(VW/2+dx, yy+6, 2.4, 3.2);
  }
  ctx.restore();
  /* 奥の光。歩きだす口 */
  const gr = ctx.createRadialGradient(VW/2, 92, 4, VW/2, 92, 150);
  gr.addColorStop(0, "rgba(255,226,180,"+(0.30*k)+")");
  gr.addColorStop(1, "rgba(255,226,180,0)");
  ctx.fillStyle = gr; ctx.fillRect(0,0,VW,VH);

  ctx.textAlign = "center";

  /* 一着ずつ歩いてくる。奥にいるものから描く */
  if(pool.length){
    const placed = pool.map((w,i)=>({ w, p:rwPlace(i, pool.length, t), i })).filter(o=>o.p);
    placed.sort((a,b)=>a.p.y - b.p.y);
    for(const o of placed){
      const p = o.p, h = RW_H*p.s;
      /* 足もとの光だまり。歩いているあいだも付いてくる */
      ctx.fillStyle = "rgba(255,240,210,"+(0.16*p.a)+")";
      ctx.beginPath(); ctx.ellipse(p.x, p.y+h+4, 30*p.s+8, 6*p.s+2.4, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,"+(0.28*p.a)+")";
      ctx.beginPath(); ctx.ellipse(p.x, p.y+h+4, 26*p.s, 4.2*p.s, 0, 0, 6.2832); ctx.fill();
      /* 真上からのスポット。一着の後ろに、やわらかい光の柱 */
      const sp = ctx.createRadialGradient(p.x, p.y+h*0.45, 2, p.x, p.y+h*0.45, h*0.62);
      sp.addColorStop(0, "rgba(255,238,206,"+(0.13*p.a)+")"); sp.addColorStop(1, "rgba(255,238,206,0)");
      ctx.fillStyle = sp; ctx.fillRect(p.x-h*0.7, p.y-h*0.2, h*1.4, h*1.4);
      ctx.save(); ctx.globalAlpha = p.a;
      if(o.w.piece) drawPiece(ctx, o.w.piece, p.x, p.y, h, { bare:true, norim:true });
      else garment(ctx, o.w.top || "concept", p.x, p.y, h);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    /* 全員が並んだら、いちばんの一着の名前 */
    const lastIn = S_GOWN + (pool.length-1)*S_GAP + S_WALK;
    if(t > lastIn && rec){
      ctx.globalAlpha = Math.min(1, (t-lastIn)/0.4);
      ctx.fillStyle = "rgba(255,246,238,.72)";
      ctx.font = "700 10px 'Hiragino Kaku Gothic ProN',sans-serif";
      ctx.fillText("出品作《"+rec.title+"》"+(pool.length > 1 ? "　ほか "+(pool.length-1)+" 着" : ""), VW/2, 234);
      ctx.globalAlpha = 1;
    }
  } else if(t > S_GOWN){
    ctx.globalAlpha = Math.min(1, (t-S_GOWN)/0.4);
    ctx.fillStyle = "rgba(255,150,170,.9)";
    ctx.font = "700 12px 'Hiragino Kaku Gothic ProN',sans-serif";
    ctx.fillText("出品できる作品がありませんでした", VW/2, 160);
    ctx.fillStyle = "rgba(255,246,238,.6)";
    ctx.font = "700 9.5px 'Hiragino Kaku Gothic ProN',sans-serif";
    ctx.fillText("空のランウェイに、客が席を立っていく", VW/2, 178);
    ctx.globalAlpha = 1;
  }

  /* 点数が目標に向かって伸びる */
  if(t > T.score){
    const p = Math.min(1, (t-T.score)/1.5);
    const shown = Math.round(party.score * p);
    const w = 250, x0 = (VW-w)/2, y0 = 264;
    ctx.fillStyle = "rgba(255,255,255,.14)";
    ctx.beginPath(); ctx.roundRect(x0, y0, w, 9, 5); ctx.fill();
    const ratio = Math.min(1.15, shown / showNeed(S));
    ctx.fillStyle = ratio >= 1 ? "#5fd8a0" : "#f5b53c";
    ctx.beginPath(); ctx.roundRect(x0, y0, Math.min(w, w*ratio), 9, 5); ctx.fill();
    /* 目標の位置に線 */
    ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x0+w, y0-4); ctx.lineTo(x0+w, y0+13); ctx.stroke();
    ctx.fillStyle = "rgba(255,246,238,.7)";
    ctx.font = "700 9px 'Hiragino Kaku Gothic ProN',sans-serif";
    ctx.fillText("目標 "+showNeed(S), x0+w, y0-9);
    ctx.fillStyle = "#fff6ee";
    ctx.font = "800 24px Consolas,'SF Mono',monospace";
    ctx.fillText(shown, VW/2, y0-10);
  }

  drawCrowd();
  for(const c of confetti){
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r);
    ctx.globalAlpha = Math.min(1, c.life);
    ctx.fillStyle = c.c; ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  drawCrowdBubbles();

  /* 見出しは紙吹雪より前に。下敷きを敷いて必ず読めるようにする。
     合否のあとは、同じ帯が「講評」に変わる */
  ctx.textAlign = "center";
  if(t > S_TITLE){
    const toCritic = party.critic ? Math.min(1, Math.max(0, (t - T.critic)/0.5)) : 0;
    ctx.globalAlpha = Math.min(1,(t-S_TITLE)/0.4);
    ctx.fillStyle = "rgba(24,14,30,.62)"; ctx.fillRect(0, 14, VW, 70);
    if(toCritic < 1){
      ctx.globalAlpha = Math.min(1,(t-S_TITLE)/0.4) * (1-toCritic);
      ctx.fillStyle = "#f5b53c";
      ctx.font = "800 9px 'Hiragino Kaku Gothic ProN',sans-serif";
      ctx.fillText(showHeading(S), VW/2, 32);
      ctx.fillStyle = "#fff6ee";
      ctx.font = "800 26px 'Hiragino Kaku Gothic ProN',sans-serif";
      ctx.fillText(S.name, VW/2, 60);
      ctx.fillStyle = "rgba(255,246,238,.55)";
      ctx.font = "700 9.5px 'Hiragino Kaku Gothic ProN',sans-serif";
      ctx.fillText(S.place, VW/2, 76);
    }
    if(toCritic > 0){
      ctx.globalAlpha = toCritic;
      ctx.fillStyle = "#f5b53c";
      ctx.font = "800 9px 'Hiragino Kaku Gothic ProN',sans-serif";
      /* 上の行は両端のボタンに挟まれるので短く。誰の言葉かは右下に */
      ctx.fillText("講　評", VW/2, 30);
      ctx.fillStyle = "#fff6ee";
      ctx.font = "700 10.5px 'Hiragino Kaku Gothic ProN',sans-serif";
      const lines = wrapText(party.critic.text, VW-36).slice(0,3);
      const y0 = lines.length >= 3 ? 44 : lines.length === 2 ? 50 : 58, lh = lines.length >= 3 ? 12.5 : 14;
      lines.forEach((l,i) => ctx.fillText(l, VW/2, y0 + i*lh));
      ctx.textAlign = "right";
      ctx.fillStyle = "rgba(255,246,238,.62)";
      ctx.font = "700 8.5px 'Hiragino Kaku Gothic ProN',sans-serif";
      ctx.fillText("── "+party.critic.who, VW-14, 81);
      ctx.textAlign = "center";
    }
    ctx.globalAlpha = 1;
  }

  /* 合否は最前面。観客の頭より上に出す */
  if(t > T.verdict){
    const age = t - T.verdict;
    const pop = age<0.3 ? 1.7-0.7*(age/0.3) : 1;
    const col = party.pass ? "#5fd8a0" : "#ef6d8c";
    ctx.fillStyle = "rgba(24,14,30,.72)";
    ctx.beginPath(); ctx.roundRect(52, 288, VW-104, 56, 16); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(52, 288, VW-104, 56, 16); ctx.stroke();
    ctx.save(); ctx.translate(VW/2, 315); ctx.scale(pop,pop);
    ctx.fillStyle = col;
    ctx.font = "800 26px 'Hiragino Kaku Gothic ProN',sans-serif";
    ctx.fillText(party.pass ? "合 格" : "力およばず", 0, 0);
    ctx.restore();
    if(age > 0.5){
      ctx.globalAlpha = Math.min(1,(age-0.5)/0.4);
      ctx.fillStyle = "rgba(255,246,238,.92)";
      ctx.font = "700 10.5px 'Hiragino Kaku Gothic ProN',sans-serif";
      ctx.fillText(party.pass ? "「"+S.title+"」　"+yen(S.prize)
                              : "5週後に、もう一度", VW/2, 336);
      ctx.globalAlpha = 1;
    }
  }
  ctx.textAlign = "start";
}


/* ==================================================================
   拠点の一日。街の建物だけが使う。

   街の10棟は、開く時刻も閉まる時刻も違う。工場は朝いちばんに動きだし、
   ブティックは昼まで開かない。編集部は締切で夜中まで灯りが消えない。
   **その時刻の差が、名札を読まなくても業種を伝える。**
   絵の記号（看板・ピクトグラム）が「何屋か」を言うのに対して、
   ここは「どういう働き方の店か」を言う。

   時刻は core/state.js の hourOf() に合わせ、朝8時から数えた 8〜32 で書く。
   26 と書けば翌2時のこと。日をまたぐ店（編集部・カフェ・ショー会場）が
   あるので、0〜24 に折り返さないほうが読みやすい。
   ================================================================== */

/* いまが「その日の何時か」。深夜は 24 を足して、朝8時から一本の線にする */
function townHour(){ const h = hourOf(); return h < 8 ? h + 24 : h; }

/* なめらかに 0→1。a で 0、b で 1 */
function ramp(v, a, b){
  const t = (v - a) / (b - a);
  return t <= 0 ? 0 : t >= 1 ? 1 : t*t*(3 - 2*t);
}
/* a 時に開いて b 時に閉じる帯。境目は fade 時間かけて上げ下げする */
function band(h, a, b, fade){
  return Math.min(ramp(h, a - fade, a), 1 - ramp(h, b, b + fade));
}
/* 2色を混ぜる。#rrggbb でも rgb(...) でも受ける */
function tMix(a, b, k){
  const rd = c => c.charAt(0) === "#"
    ? [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]
    : c.match(/\d+/g).map(Number);
  const P = rd(a), Q = rd(b), t = Math.max(0, Math.min(1, k));
  return "rgb(" + P.map((v,i)=>Math.round(v*(1-t) + Q[i]*t)).join(",") + ")";
}

/* ------------------------------------------------------------------
   拠点ごとの一日。時刻は 8〜32（8=朝8時、26=翌2時）。
     open/close … 雨戸・シャッターが上がっている時間
     sign/signOff … 看板に灯が入っている時間
     night … 閉めたあとも残る明かり（0で真っ暗）。夜勤と締切
   ------------------------------------------------------------------ */
const TOWN_HOURS = {
  /* 工場。朝がいちばん早く、夜勤が残る */
  factory:  { open: 8.0, close:19.0, sign:15.5, signOff:20.0, night:0.50 },
  /* カフェ。朝から夜まで開けている街の台所 */
  cafe:     { open: 8.0, close:23.0, sign:15.5, signOff:23.5, night:0.10 },
  /* 学校。定時できっちり終わる。時計塔だけは終夜まわる */
  school:   { open: 8.0, close:17.0, sign:16.5, signOff:21.0, night:0.06 },
  /* 自分のアトリエ。夜まで人が残っている */
  atelier:  { open: 8.5, close:21.0, sign:16.5, signOff:22.5, night:0.22 },
  /* 生地問屋。問屋は早じまい。夕方には反物をしまう */
  fabric:   { open: 9.0, close:17.0, sign:15.5, signOff:18.5, night:0.00 },
  /* 編集部。締切があるので、深夜まで階が灯っている */
  press:    { open:10.0, close:26.0, sign:16.0, signOff:26.5, night:0.62 },
  /* ショールーム。アポイント制できっちり閉まる */
  showroom: { open:10.0, close:18.0, sign:16.0, signOff:19.0, night:0.04 },
  /* ブティック。昼まで開かず、夜は遅い */
  shop:     { open:11.0, close:20.0, sign:16.0, signOff:21.5, night:0.08 },
  /* 撮影スタジオ。昼から夜が本番 */
  studio:   { open:12.0, close:23.0, sign:16.0, signOff:23.5, night:0.14 },
  /* ショー会場。夕方に開いて、終演は夜中 */
  venue:    { open:17.0, close:25.0, sign:15.5, signOff:25.5, night:0.05 },
};

/* いまのこの拠点の明かり。建物を描くまえに一度だけ呼ぶ。
     shut … 雨戸・シャッターの上がり具合（0=閉めきり 1=開ききり）
     sign … 看板の灯り（0〜1）
     win  … 窓の中の明かり（0〜1）。外が明るいうちは見えない */
function townLight(p, open){
  const H = TOWN_HOURS[p.id] || TOWN_HOURS.atelier;
  const h = townHour(), nt = nightAmount();
  const shut = band(h, H.open, H.close, 0.7);
  /* 中の明かりは、外が暗くなってはじめて見える */
  const dark = ramp(nt, 0.10, 0.40);
  const on   = Math.max(shut, H.night);
  return open
    ? { shut, sign: band(h, H.sign, H.signOff, 0.5), win: on * dark, nt }
    : { shut, sign: 0, win: 0, nt };            /* まだ入れない拠点は暗いまま */
}

/* 窓ごとのばらつき。同じ建物の同じ窓なら、いつも同じ値になる */
function winSeed(id, i){
  let s = (i + 1) * 2654435761;
  for(let k = 0; k < id.length; k++) s = (Math.imul(s, 31) + id.charCodeAt(k)) >>> 0;
  return ((s >>> 9) % 997) / 997;
}
/* この窓に灯が入っているか。窓ごとに点く時刻を少しずらす */
function litW(L, id, i){ return L.win > 0.20 + winSeed(id, i) * 0.52; }

/* 灯りの見せかた（docs/ART.md 4章・6章）
     ・放射グラデーションは使わない。光も面で置く
     ・**光をかけてよいのは地面だけ。** 建物の壁にかぶせない
   したがって「看板が灯る」は、板と文字の色が転ぶことだけで見せる。
   まわりへのにじみは描かない。地面に落ちる光だまりだけが例外。 */

/* まだ開いていない拠点の名札に付ける、小さな南京錠。
   OS絵文字は画面に出さない方針（docs/ART.md 6章）なので、線と面で描く。
   鍵穴は描かない（情報量の上限。この大きさでは点にしかならない） */
function townLock(cx, cy, col){
  ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(cx, cy-1.5, 1.9, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.roundRect(cx-2.8, cy-1.3, 5.6, 4.6, 1.1); ctx.fill();
}

/* 地面に落ちる光だまり。十二角形を2段。街灯や入口の足もとに置く。
   建物より先に置くので、手前の建物がふつうに上書きする */
function townLampPool(gx, gy, r, amt, col){
  if(amt < 0.03) return;
  const c = col || "255,226,150";
  ctx.save(); ctx.globalCompositeOperation = "screen";
  for(const [rr, al] of [[r, 0.13*amt], [r*0.55, 0.16*amt]]){
    ctx.fillStyle = "rgba(" + c + "," + al + ")";
    ctx.beginPath();
    for(let i = 0; i < 12; i++){
      const t = i/12*6.2832, q = iso(gx + Math.cos(t)*rr, gy + Math.sin(t)*rr, 0.4);
      i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* 街路樹。幹はどの季節も同じ。上に載る「かさ」だけが月で変わる。
   かさは**3段で上へすぼめる**。1段だと、大きくしたときに円柱にしか見えない。
   裸の月は枝を3本出す。線でできている物なので 1.0〜1.4px（docs/ART.md 3章） */
const TREE_COL = {
  sakura: ["#dfa8bd","#e8b8ca","#f0c8d8"],
  fresh:  ["#71a857","#7fb262","#8dbd6e"],
  deep:   ["#4e8a49","#578f4f","#5f9856"],
  early:  ["#7a9b52","#85a459","#90ad60"],
  autumn: ["#b47a44","#bf8a4e","#c99958"],
  fall:   ["#ac5940","#b8674a","#c37554"],
  bud:    ["#8f8478","#9d8d86","#ab9793"],
};
function drawTreeS(x, y, kind, sc){
  const k = sc || 1;
  cyl(x, y, 0.055*k, 15*k, "#8a6a4a", 0);
  if(kind === "bare" || kind === "snow"){
    ctx.strokeStyle = "#7a5c40"; ctx.lineWidth = 1.3*k; ctx.lineCap = "round";
    for(const [dx, dz] of [[-0.22, 24], [0.22, 26], [0.02, 31]]){
      const a = iso(x, y, 13*k), b = iso(x + dx*k, y, dz*k);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    if(kind === "snow"){                      /* 枝に積もった雪 */
      ctx.strokeStyle = "#f0f2f6"; ctx.lineWidth = 1.7*k;
      for(const [dx, dz] of [[-0.22, 24], [0.22, 26], [0.02, 31]]){
        const a = iso(x, y, 16*k), b = iso(x + dx*0.9*k, y, dz*k);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    return;
  }
  /* 3段。段の間を詰めて重ねる。離すと輪切りが見えて、団子を積んだように見える */
  const C = TREE_COL[kind] || TREE_COL.deep;
  cyl(x, y, 0.34*k, 10*k, C[0], 12*k);
  cyl(x, y, 0.26*k,  9*k, C[1], 19*k);
  cyl(x, y, 0.16*k,  8*k, C[2], 25*k);
}

/* 地面に散らすもの。落ち葉（秋）・花びら（春）。面で置く小さな菱形 */

  let s = 20250417;
  const rnd = () => ((s = (s*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);

  for(let i = 0; i < 90; i++){

}

const SCHOOL = { x:0.3, y:0.3, w:2.8, d:1.5, h:44 };

/* ------------------------------------------------------------------
   3. 名札 ── 街を覆わずに「どこが何か」を伝える

   いまは10枚の名札を屋根の上に出しているので、街の半分が隠れている。
   いちばん効くのは**枚数を減らすこと**なので、そこを軸に4案。

   docs/WORLD.md：**就職先に選べるのは5つだけ**（アトリエ・学校・生地問屋・
   出版社・工場）。ショップ・スタジオ・ショールーム・会場・カフェは
   バイト先と見学先で、4年目に「あそこは選べないんだ」と分かる。
   docs/GAME.md：インターン先は「縁が2以上の場所」からしか選べない
   ------------------------------------------------------------------ */
const CAREER = ["atelier", "school", "fabric", "press", "factory"];   /* 就職先になれる5つ */
/* 縁（その拠点と、どれだけ縁ができたか。0〜3）。学校の4年（game/school.js）が書き込む。
   まだ書き込まれていなければ 0 ＝ 点はぜんぶ空 */
let TOWN_EN = {};
/* 建物の看板と同じ英字。名札を英字にする案で使う */
const SIGN_TEXT = { atelier:"ATELIER", school:"CULTURA", fabric:"FABRIC", press:"PRESS",
                    shop:"BOUTIQUE", showroom:"SHOWROOM", studio:"STUDIO",
                    factory:"FACTORY", venue:"SHOW", cafe:"CAFE" };

/* 名札の高さ。建物ごとに、屋根や煙突を避ける位置 */
const LABEL_TOP = { school:58, fabric:68, cafe:84, press:70, shop:8, atelier:22,
                    showroom:8, studio:14, venue:18, factory:18 };

/* 点だけの印。名前のかわりに置く。菱形ひとつ＋足もとの影。
   まだ行けない場所は、小さく灰色にする（白で抜くと明るい空に消える） */
function labelDot(x, y, open){
  const r = open ? 5.8 : 4.2, h = r*0.57;
  poly([{x, y:y+1.6}, {x:x+r, y:y+h+1.6}, {x, y:y+h*2+1.6}, {x:x-r, y:y+h+1.6}], "rgba(70,50,70,.20)");
  poly([{x, y}, {x:x+r, y:y+h}, {x, y:y+h*2}, {x:x-r, y:y+h}], open ? "#7c5a70" : "#a09aa8");
  if(open) poly([{x, y:y+h*0.55}, {x:x+r*0.42, y:y+h}, {x, y:y+h*1.45}, {x:x-r*0.42, y:y+h}],
                "rgba(255,255,255,.42)");
}

/* まだ行けない場所が「行けるようになりたい」に変わるための、開く条件。
   学年（章）と名声のどちらかで開く。docs/GAME.md では1年＝1章にあたる */
function needShort(p){
  if(typeof SCH !== "undefined" && SCH && SG) return scPlaceNeed(p.id);
  if(!p.need) return "";
  if(p.need.chapter != null) return p.need.chapter + "年から";
  return "名声 " + p.need.fame + " で開く";
}

/* 名札。plate は名札の出しかた、access は縁の見せかた。
     plate "all"     … ぜんぶ出す（先生の判断で確定）
           "need"    … ぜんぶ出し、まだの場所には**開く条件**を小さく添える
           "soft"    … ぜんぶ出す。まだの場所も暗くせず、鍵だけ付ける
           "both"    … need と soft の両方
           "dot"     … ぜんぶ点。タップすると名前が出る
           "open"    … いま行ける場所だけ名札。まだの場所は点だけ
           "small"   … ぜんぶ名札。ただし小さく、建物の看板と同じ英字で
     access "now" … 開く／開かないだけ  "b" … 見学先に目の印  "c" … 縁の点 */
function drawLabels(plate, access){
  ctx.textAlign = "center";
  /* **名札が重なったら、奥のほうを上へずらす。**
     奥の列（生地問屋・カフェ・出版社）は、アイソメで画面の同じあたりに集まるので、
     そのまま置くと文字が重なる。手前から順に置いて、ぶつかった名札だけを持ち上げる
     （奥は空が広いので、上へ逃がすのがいちばん自然） */
  const placed = [];
  for(const p of PLACES.slice().sort((a2,b2)=>(b2.y+b2.d*0.5)-(a2.y+a2.d*0.5))){
    const open = placeOpen(p);
    const c = iso(p.x+p.w/2, p.y+p.d/2, p.h + (LABEL_TOP[p.id] || 22));

    if(plate === "dot" || (plate === "open" && !open)){ labelDot(c.x, c.y-6, open); continue; }

    const en = plate === "small";
    const name = en ? (SIGN_TEXT[p.id] || p.id.toUpperCase()) : p.name;
    const nameFont = en ? "800 7.5px sans-serif"
                        : "800 9px 'Hiragino Kaku Gothic ProN',sans-serif";
    const needFont = "700 7.5px 'Hiragino Kaku Gothic ProN',sans-serif";
    const need = (!open && (plate === "need" || plate === "both")) ? needShort(p) : "";
    ctx.font = nameFont;
    const nameW = ctx.measureText(name).width;
    let needW = 0;
    if(need){ ctx.font = needFont; needW = ctx.measureText(need).width + 6; }

    const pad = en ? 8 : 11, hh = en ? 12 : 15;
    const lk = open ? 0 : (en ? 9 : 11);
    const tail2 = access === "b" ? (open && !CAREER.includes(p.id) ? 12 : 0)
                : access === "c" ? 17 : 0;
    const w = nameW + needW + pad + lk + tail2;
    const x = Math.max(4, Math.min(VW-w-4, c.x-w/2));

    /* 重なりを避けて、置ける高さを探す */
    let ly = c.y;
    for(let k = 0; k < 6; k++){
      const hit = placed.some(r => x < r.x1 + 2 && x + w > r.x0 - 2
                                && ly-hh+4 < r.y1 + 1 && ly+4 > r.y0 - 1);
      if(!hit) break;
      ly -= hh + 3;
    }
    placed.push({ x0:x, x1:x+w, y0:ly-hh+4, y1:ly+4 });
    const cy = ly - hh*0.5 + 4;

    /* まだの場所の札。soft は明るいまま（「行けない」ではなく「まだ」に見せる） */
    const soft = (plate === "soft" || plate === "both");
    const back = open ? "rgba(255,255,255,.95)"
               : soft ? "rgba(241,234,241,.93)" : "rgba(74,64,74,.86)";
    const ink  = open ? "#3f2c3d" : soft ? "#6d5f72" : "#efe6ef";
    ctx.fillStyle = "rgba(70,50,70,.22)";
    ctx.beginPath(); ctx.roundRect(x, ly-hh+5.4, w, hh, hh/2); ctx.fill();
    ctx.fillStyle = back;
    ctx.beginPath(); ctx.roundRect(x, ly-hh+4, w, hh, hh/2); ctx.fill();
    if(!open) townLock(x + (en ? 9 : 10.5), cy, ink);

    ctx.textAlign = "left";
    ctx.fillStyle = ink; ctx.font = nameFont;
    ctx.fillText(name, x + lk + pad*0.5, cy + 3.4);
    if(need){
      ctx.fillStyle = soft ? "#9a7f95" : "#c9a8bc"; ctx.font = needFont;
      ctx.fillText(need, x + lk + pad*0.5 + nameW + 6, cy + 3.2);
    }
    ctx.textAlign = "center";

    if(access === "b" && tail2){
      const ex = x + w - 7.5, ey = cy;
      ctx.strokeStyle = "#9b8ea0"; ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.ellipse(ex, ey, 4.0, 2.4, 0, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = "#9b8ea0";
      ctx.beginPath(); ctx.arc(ex, ey, 1.3, 0, 6.2832); ctx.fill();
    }
    if(access === "c" && tail2){
      const n = TOWN_EN[p.id] || 0;
      for(let k = 0; k < 3; k++){
        const dx = x + w - 14 + k*4.6;
        ctx.fillStyle = k < n ? (CAREER.includes(p.id) ? "#7c5a70" : "#9b8ea0")
                              : (open ? "rgba(0,0,0,.14)" : "rgba(255,255,255,.22)");
        ctx.beginPath(); ctx.arc(dx, cy, 1.7, 0, 6.2832); ctx.fill();
      }
    }
  }
  ctx.textAlign = "start";
}

/* ------------------------------------------------------------------
   3-b. 街を歩く人 ── 時間帯とタイミングで変わる

   いまの歩行者は、道を左右に流れているだけ。夜中でも同じ数の人が同じ速さで歩き、
   閉まっている店の前にも人がいる。ここを直す。

   **手前にもう1本、並木の歩道（y=8.3）を足す。** これが要になる。
   いまの道は2本（y=2.5 と 5.5）だが、いちばん手前の列（スタジオ・ショー会場・工場）は
   奥の面が道5.5に接しているので、道にいる人は建物の裏に回ってしまい、
   「店の前に人がいる」を作れなかった。手前に歩道を通すと、
   前列の拠点の前に立てるようになり、街のいちばん手前にも賑わいが出る。
   ------------------------------------------------------------------ */
const ROADY3 = [2.5, 5.5, 9.0];
/* 縦の通路。建物と建物のあいだの抜け。3本の歩道をここでつなぐ。
   「人は建物と建物の間を歩いていく」（先生）を、この2本で作る。
   x=3.25 と 6.55 は、どの列の建物にも当たらないことを確かめて選んでいる */
const AISLE = [3.05, 6.55];
/* 通路の幅（中心からの左右）。どの列の建物にも当たらない範囲を測って決めた。
   細いと、行き先の違う人がすれ違うときに重なる */
const AISLE_W = 0.20;
/* 歩道の幅（中心からの奥行き）。ここも測って決めた。
   人が奥行き方向にばらけると、画面で重なっても前後に描かれて自然に見える */
const BAND_W = 0.17;

/* 街の歩行者の大きさ。**アトリエの中の人より、ずっと小さく描く。**
   建物1棟が2〜3マスの街で、人がそれに迫る大きさだと、
   路地を歩いているように見えない（2026-08-17 先生の指摘）。
   細部が潰れてもよい、という許しをもらっている */

/* 建物が実際に場所を取っている範囲。PLACES の四角だけでは足りない。
   どの建物も入口の階段が手前へ出ていて、学校は門柱、ショー会場は入口ポーチと柱が出ている。
   ここを見ないと「人や車が建物の張り出しに乗る」（先生の指摘）が起きる。
   front／back は四角からの張り出し（マス） */
const EXTRA = {
  school:   { back:0.10, front:0.55 },   /* 門柱と旗のポール */
  venue:    { back:0.10, front:0.62 },   /* 入口ポーチ・柱・しまのキャノピー */
  factory:  { back:0.10, front:0.34 },   /* 搬入口の車止め */
  cafe:     { back:0.10, front:0.42 },   /* 黒板 */
  shop:     { back:0.10, front:0.46 },   /* A型看板と鉢植え */
  fabric:   { back:0.10, front:0.30 },
};
const DEF_EXTRA = { back:0.10, front:0.32 };   /* 入口の階段ぶん */
function bounds(p){
  const e = EXTRA[p.id] || DEF_EXTRA;
  return { x0:p.x-0.06, x1:p.x+p.w+0.06,
           y0:p.y-e.back-0.04, y1:p.y+p.d+e.front+0.04 };
}
/* そこは建物（と、その張り出し）の中か。**すり抜けないための最後の関門。** */
function inBuilding(gx, gy){
  for(const p of PLACES){
    const b = bounds(p);
    if(gx > b.x0 && gx < b.x1 && gy > b.y0 && gy < b.y1) return true;
  }
  return false;
}
/* x と y を別々に近づける。建物に入る向きだけを止めるので、壁に沿って回れる */
function walkStep(a, tx, ty, sp){
  const dx = tx - a.gx, dy = ty - a.gy;
  let blocked = false;
  if(Math.abs(dx) > 0.004){
    const nx = a.gx + Math.max(-sp, Math.min(sp, dx));
    if(!inBuilding(nx, a.gy)) a.gx = nx; else blocked = true;
    a.dir = dx > 0 ? 1 : -1;
  }
  if(Math.abs(dy) > 0.004){
    const ny = a.gy + Math.max(-sp*0.9, Math.min(sp*0.9, dy));
    if(!inBuilding(a.gx, ny)) a.gy = ny;
  }
  /* 横がふさがれていたら、手前か奥へ半歩よけて角を回りこむ。
     これが無いと、道に少し食い込んだ張り出し（カフェの黒板など）のすぐ横で足が止まる */
  if(blocked){
    const step = (dx > 0 ? 1 : -1) * sp;
    for(const d of [0.05, -0.05, 0.10, -0.10]){
      if(!inBuilding(a.gx, a.gy + d) && !inBuilding(a.gx + step, a.gy + d)){
        a.gy += d; break;
      }
    }
  }
}
/* 万一 建物の中に入ってしまったら、いちばん近い歩道へ押し出す。
   bounds を変えたときや、押し合いで入り込んだときのための安全網。
   これが無いと、閉じ込められた人がその場で動けなくなる */
function pushOut(a){
  if(!inBuilding(a.gx, a.gy)) return;
  for(const r of ROADY3) if(!inBuilding(a.gx, r)){ a.gy = r; return; }
  for(let k = 0; k < 24; k++){
    const gx = Math.random()*TGW, gy = pick(ROADY3);
    if(!inBuilding(gx, gy)){ a.gx = gx; a.gy = gy; a.goal = null; a.leg = null; return; }
  }
}
/* その x で、歩道の上を通れる y。建物の張り出し（カフェの黒板や学校の門柱）が
   道に少し食い込んでいる所では、手前へずれて通る。実際の歩行者と同じ振る舞いで、
   ここが無いと「道が塞がれて進めない人」が出る */
function laneY(gx, road, lane){
  let y = road + (lane || 0);
  for(let k = 0; k < 12 && inBuilding(gx, y); k++) y += 0.06;
  return y;
}
const nearestBand = gy => ROADY3.reduce((b,r)=> Math.abs(r-gy) < Math.abs(b-gy) ? r : b, ROADY3[0]);
const nearestAisle = gx => AISLE.reduce((b,x)=> Math.abs(x-gx) < Math.abs(b-gx) ? x : b, AISLE[0]);

/* 目的地まで歩く。歩道（横3本）と通路（縦2本）のつながりだけを通るので、
   建物の上を横切ることがない。着いたら true を返す */
/* 目的地まで歩く。歩道（横3本）と通路（縦2本）のつながりだけを通る。

   **道すじを「いまどの脚を歩いているか」で持つ。** 前は毎こま
   「いちばん近い歩道はどこか」から考え直していて、通路を縦断している途中に
   「まず歩道へ戻れ」と判断が入り、**行っては戻りをくり返して突っかかっていた**
   （縦の通路の真ん中で足踏みして見えるのは、これが原因だった）。

     toBand  … 歩道から離れているとき、まず歩道へ戻る
     toAisle … いまの歩道の上を、通路の入口（x）まで歩く
     cross   … 通路を縦断する。**x は動かさない**
     toGoalX … 目的の歩道の上を、店の前（x）まで歩く
     arrive  … 建物のほうへ半歩寄る                                    */
function walkToGoal(a, sp){
  const g = a.goal;
  if(!a.leg){
    a.band = nearestBand(a.gy);
    a.ax = nearestAisle(a.gx) + a.laneA;
    a.leg = Math.abs(a.band - g.road) < 0.01 ? "toGoalX" : "toAisle";
    if(Math.abs(a.gy - a.band) > 0.45) a.leg = "toBand";
  }
  if(a.leg === "toBand"){
    a.axis = "y";
    const before = a.gy;
    walkStep(a, a.gx, laneY(a.gx, a.band, a.laneB), sp);
    if(Math.abs(a.gy - before) < 1e-4) walkStep(a, a.gx + a.dir*0.4, a.gy, sp);
    if(Math.abs(a.gy - a.band) < 0.24) a.leg = null;
    return false;
  }
  if(a.leg === "toAisle"){
    a.axis = "x";
    walkStep(a, a.ax, laneY(a.ax, a.band, a.laneB), sp);
    if(Math.abs(a.gx - a.ax) < 0.06) a.leg = "cross";
    return false;
  }
  if(a.leg === "cross"){
    /* 通路を縦断する。ここでは x を動かさない。横へ振られると建物に当たる */
    a.axis = "y";
    /* 目的の歩道に着く y も、その x で通れる値を使う。
       生のまま（歩道＋自分のずれ）を狙うと、カフェの黒板のように
       歩道へ少し食い込んだ張り出しに頭を押さえられて進めなくなる */
    const ty = laneY(a.ax, g.road, a.laneB);
    walkStep(a, a.ax, ty, sp);
    if(Math.abs(a.gy - ty) < 0.10){ a.leg = "toGoalX"; a.band = g.road; }
    return false;
  }
  if(a.leg === "toGoalX"){
    a.axis = "x";
    walkStep(a, g.gx, laneY(a.gx + a.dir*0.22, g.road, a.laneB), sp);
    if(Math.abs(a.gx - g.gx) < 0.06) a.leg = "arrive";
    return false;
  }
  a.axis = "y";
  walkStep(a, g.gx, g.gy, sp);
  return Math.abs(a.gy - g.gy) < 0.05;
}

/* 時刻（8〜32）から、街にいる人の数。
   8時＝登校、15〜19時＝下校と買い物でいちばん多い、深夜はほとんどいない */
const CROWD = [[8,10],[9,6],[11,5],[12,7],[14,6],[16,10],[17,11],[19,8],
               [20,5],[22,3],[24,2],[27,1],[31,1],[32,4]];
function crowdAt(h){
  if(h <= CROWD[0][0]) return CROWD[0][1];
  for(let i = 0; i < CROWD.length-1; i++){
    const [h0,n0] = CROWD[i], [h1,n1] = CROWD[i+1];
    if(h <= h1) return n0 + (n1-n0)*(h-h0)/(h1-h0);
  }
  return CROWD[CROWD.length-1][1];
}

/* 拠点の前の立ち位置。いちばん近い歩道から、建物のほうへ少し寄る。
   前列は手前の歩道から寄るので、建物に隠れない */
function standSpot(p){
  const F = p.y + p.d;
  let road = ROADY3[0], best = 1e9;
  for(const r of ROADY3){ const d = Math.min(Math.abs(r-F), Math.abs(r-p.y));
    if(d < best){ best = d; road = r; } }
  /* 建物のほうへ寄る。ただし**張り出しの外**まで。
     入口の階段や門柱に人が重ならないように、bounds を見て決める */
  const b = bounds(p), toward = road > F ? -1 : 1;
  const wall = toward < 0 ? b.y1 : b.y0;
  const off = Math.max(0.02, Math.min(0.26, Math.abs(road - wall) - 0.04));
  const gx = p.x + p.w*0.5 + (Math.random()-0.5)*p.w*0.55;
  /* 立ち位置が張り出しの中に入っていたら、外へ出るまで下げる */
  let gy = road + toward*off;
  for(let k = 0; k < 10 && inBuilding(gx, gy); k++) gy -= toward*0.05;
  return { gx, gy, road, id:p.id };
}

/* いま人が向かいたい拠点。開いている場所だけ。時刻で行き先の重みが変わる。
   朝は学校へ吸われ、夕方は学校から吐き出されて店へ散る */
function pickGoal(h, taken){
  const open = PLACES.filter(p => placeOpen(p) && !(taken && taken.has(p.id)));
  if(!open.length) return null;
  const wt = p => {
    let w = 1;
    if(p.id === "school") w *= (h >= 8 && h < 10) ? 7 : (h >= 15 && h < 19) ? 3 : (h < 17 ? 2 : 0.3);
    if(p.id === "cafe")   w *= (h >= 15 && h < 23) ? 3 : 1;
    if(p.id === "shop")   w *= (h >= 15 && h < 20) ? 3 : 1;
    if(p.id === "press")  w *= (h >= 20) ? 3 : 1;
    if(p.id === "factory") w *= (h >= 8 && h < 10) ? 3 : 1;
    return w;
  };
  let sum = 0; for(const p of open) sum += wt(p);
  let r = Math.random()*sum;
  for(const p of open){ r -= wt(p); if(r <= 0) return p; }
  return open[open.length-1];
}

/* 人をひとり作る。見た目は src/staff/person.js のまま */
function makeWalker2(h){
  const w = { kind:"walk", dir: Math.random()<0.5 ? 1 : -1,
              /* 歩く速さの幅を広めに取る。速さが近いと、ふたりが長く並んで歩いて
                 いつまでも重なる。差があれば追い越して離れていく */
              spd: 0.17+Math.random()*0.30, t: Math.random()*9,
              col: pick(WCOL), hair: pick(["#3b3242","#5b3a2e","#8a5a3c","#2f3a4a","#a34f5e"]),
              skin: pick(["#f8ddc6","#f1cbab","#e2b48f","#cf9a72"]), long: Math.random()<0.45,
              tall: 0.9+Math.random()*0.25,
              phase:"walk", stand:0, goal:null, gy0:0,
              /* **一人ひとりが持つ、道の中のずれ。** これが重なりを防ぐ本体。
                 laneA は縦の通路の中の左右、laneB は歩道の中の奥行き。
                 ずっと同じ値を守って歩くので、同じ線の上を2人が並ぶことがない */
              laneA: (Math.random()-0.5)*2*AISLE_W,
              laneB: (Math.random()-0.5)*2*BAND_W, axis:"x",
              leg:null, ax:0, band:2.5 };
  for(let i = 0; i < 40; i++){
    w.gy = pick(ROADY3) + (Math.random()-.5)*0.24;
    w.gx = Math.random()*TGW;
    if(!inBuilding(w.gx, w.gy)) break;
  }
  w.gy0 = w.gy;
  return w;
}

/* 街の人と猫を、いまの時刻に合わせて入れ替える。
   lv 0=数だけ 1=＋店の前で立ち止まる 2=＋登下校の流れと雨の急ぎ足 */
function tuneCrowd(lv, rain){
  const h = townHour();
  const want = Math.max(1, Math.round(crowdAt(h) * (lv >= 1 ? 1 : 1)));
  const walkers = actors.filter(a => a.kind === "walk");
  for(let i = walkers.length; i < want; i++) actors.push(makeWalker2(h));
  if(walkers.length > want){
    let over = walkers.length - want;
    actors = actors.filter(a => !(a.kind === "walk" && over-- > 0));
  }
  /* 猫は夜のほうが多い。街が静かなことの記号 */
  const wantCat = nightAmount() > 0.5 ? 4 : 1;
  const cats = actors.filter(a => a.kind === "cat");
  for(let i = cats.length; i < wantCat; i++)
    actors.push({ kind:"cat", gx:Math.random()*TGW, gy:pick(ROADY3)+(Math.random()-.5)*0.6,
                  dir: Math.random()<0.5?1:-1, spd:0.14, t:0, rest:0,
                  col: pick(["#f4ebdb","#3b3641","#d8a86c"]) });
  if(cats.length > wantCat){
    let over = cats.length - wantCat;
    actors = actors.filter(a => !(a.kind === "cat" && over-- > 0));
  }
  /* 車も夜は減る */
  const wantCar = nightAmount() > 0.6 ? 1 : 2;
  const cars = actors.filter(a => a.kind === "car");
  for(let i = cars.length; i < wantCar; i++)
    actors.push({ kind:"car", gx:Math.random()*TGW, gy:pick([2.5,5.5]),
                  dir: Math.random()<0.5?1:-1, spd:0.9+Math.random()*0.5, t:0,
                  col: pick(["#e0655f","#5f8fd0","#f0f0f0","#4b4453","#e8c46a"]) });
  if(cars.length > wantCar){
    let over = cars.length - wantCar;
    actors = actors.filter(a => !(a.kind === "car" && over-- > 0));
  }
}

/* 1こま進める。lv 0 のときは、いまと同じ「流れるだけ」。
   どの段階でも、**建物の中には入らない**（inBuilding が最後の関門） */
function stepCrowd(dt, lv, rain){
  const h = townHour();
  const hurry = (lv >= 2 && rain) ? 1.4 : 1;
  const slow  = nightAmount() > 0.6 ? 0.82 : 1;     /* 夜はゆっくり歩く */
  for(const a of actors){
    a.t += dt;
    if(a.kind === "walk") pushOut(a);
    if(a.kind === "cat"){
      if(a.rest > 0){ a.rest -= dt; continue; }
      const nx = a.gx + a.dir * a.spd * dt;
      if(!inBuilding(nx, a.gy)) a.gx = nx; else a.dir *= -1;
      if(Math.random() < dt*0.08) a.rest = 2+Math.random()*4;
    } else if(a.kind === "car"){
      a.gx += a.dir * a.spd * dt;                   /* 車は道の上だけなので当たらない */
    } else if(a.phase === "stand"){
      a.stand -= dt;
      /* 立ち止まっているあいだも a.goal は持ったまま。
         ここで外すと、別の人が同じ立ち位置に来て重なる */
      if(a.stand <= 0){ a.phase = "walk"; a.goal = null; a.leg = null; }
      continue;
    } else if(lv === 0){
      const sp = a.spd * dt * slow;
      const nx = a.gx + a.dir * sp;
      if(!inBuilding(nx, a.gy)) a.gx = nx;
      else { walkStep(a, a.gx, nearestBand(a.gy), sp); }
    } else {
      if(!a.goal){
        /* **同じ拠点をふたり同時に目指させない。** 同じ立ち位置に重なって
           ガタガタする原因になる（先生の指摘） */
        const taken = new Set();
        for(const o of actors) if(o !== a && o.goal) taken.add(o.goal.id);
        const free = PLACES.filter(p => placeOpen(p) && !taken.has(p.id));
        const g = lv >= 2 ? pickGoal(h, taken) : (free.length ? pick(free) : null);
        if(g){ a.goal = standSpot(g); a.walkT = 0; a.leg = null; }
      }
      const sp = a.spd * dt * hurry * slow;
      if(a.goal){
        a.walkT = (a.walkT || 0) + dt;
        if(walkToGoal(a, sp)){ a.phase = "stand"; a.stand = 1.8 + Math.random()*5; }
        /* たどり着けないときは諦めて次へ。**遠い店へ夜のゆっくりした足で向かうと 14 秒では足りず**、
           諦めて歩道へ戻り、また同じ店を目指す、をくり返して「詰まった人」に見えた（本体で実際に起きた）。
           歩く距離ぶんの猶予を足す */
        else if(a.walkT > 14 + Math.abs(a.gy - a.goal.gy)*12 + Math.abs(a.gx - a.goal.gx)*4){ a.goal = null; a.leg = null; }
      } else {
        /* 行き先が取れないとき（拠点が全部ほかの人の目的地か、まだ開いている店が少ない）は、
           歩道の上をただ歩く。**縦の通路の途中にいたら、まず歩道へ戻る**──
           通路の中で横へ歩くと、両側の建物のあいだで行き戻りして「詰まった人」になる
           （開いている拠点が少ない序盤に、実際に起きた） */
        const band = nearestBand(a.gy);
        if(Math.abs(a.gy - band) > 0.24){
          a.axis = "y"; walkStep(a, a.gx, laneY(a.gx, band, a.laneB), sp);
        } else {
          a.axis = "x";
          const nx = a.gx + a.dir * sp;
          if(!inBuilding(nx, a.gy)) a.gx = nx; else a.dir *= -1;
        }
      }
    }
    /* 端まで行ったら反対側から入り直す。**種類ごとに戻る道が違う** ──
       人は3本の歩道のどれか＋自分のずれ、車は車道2本のどちらか、猫は歩道のどこか。
       ここを人の式ひとつで済ませていたとき、車の gy が NaN になって
       （車には laneB が無い）画面から消え、描く順の計算まで狂わせていた */
    if(a.gx < -1.2 || a.gx > TGW+1.2){
      a.gx = a.gx < 0 ? TGW+1.0 : -1.0;
      a.goal = null; a.leg = null;
      a.gy = a.kind === "walk" ? pick(ROADY3) + a.laneB
           : a.kind === "car"  ? pick([2.5, 5.5])
           : pick(ROADY3) + (Math.random()-.5)*0.5;
    }
  }
  /* **人同士は当たり判定を持たない。すり抜けてすれ違う。**（2026-08-17 先生の許可）
     押し離す処理を入れたら、進行方向に押し返して足が止まり、直すと釣り合って止まり、
     直すと小刻みに揺れて「ぶつかり合って」見えた。物理的に当たることは誰も求めていない。
     求められているのは「不自然な動きが見えないこと」。
     そのかわり、下の lane（一人ひとりの奥行き・左右のずれ）で重なりにくくしている。
     奥行きが違えば、画面で重なっても前後に描かれるので自然に見える。
     **建物との当たり判定は捨てない**（inBuilding）。捨てるのは人と人だけ。 */
  for(const b of birds){ b.x += b.sp*dt; if(b.x > VW+30) b.x = -30; }
  if(plane){ plane.x += plane.sp*dt; if(plane.x > VW+80) plane = null; }
  else { planeT -= dt;
    if(planeT <= 0){ planeT = 26 + Math.random()*34;
      plane = { x:-80, y: 22+Math.random()*26, sp: 44+Math.random()*22 }; } }
}

/* ------------------------------------------------------------------
   3-c. 描く順（奥から手前）── 建物と人の前後関係

   いままでは「奥行きの値ひとつ」（建物は中心の y、人は自分の y）で並べていた。
   これは横に流れる人には効くが、**縦の通路を歩く人ではまるで当たらない**。
   人が建物の左どなりにいるとき、y が建物の中心より手前なら建物の上に描かれ、
   奥なら建物に埋もれる ── 先生が見ていた「上に行く／中に埋もれる」はこれ。

   アイソメで正しいのは、ふたつの物 A・B について
     **A が B の左（A.x1 ≤ B.x0）か、奥（A.y1 ≤ B.y0）にあれば、A を先に描く**
   という組ごとの決めかた。人は点、建物は敷地の四角、車は小さな四角。
   組ごとの「先／後」を集めて、矛盾しないように一列に並べる（位相ソート）。
   建物は格子に並んでいて重ならないので、まず矛盾は起きない。
   起きたときは、残ったものを x+y の小さい順で足す。
   ------------------------------------------------------------------ */
const PROPS = [
  {t:"tree", x:0.5, y:2.4}, {t:"tree", x:4.8, y:2.4},
  {t:"bench",x:6.9, y:2.5}, {t:"tree", x:9.2, y:2.4}, {t:"lamp", x:6.0, y:2.5},
  {t:"tree", x:1.2, y:5.4}, {t:"lamp", x:3.4, y:5.5}, {t:"tree", x:5.6, y:5.4},
  {t:"bench",x:7.6, y:5.5}, {t:"tree", x:9.4, y:5.4},
];
/* 描くものを集めて、それぞれの「地面の上の四角」を付ける */
function drawList(lv){
  const items = [];
  for(const p of PLACES)
    items.push({ k:"b", p, fp:{ x0:p.x, x1:p.x+p.w, y0:p.y, y1:p.y+p.d } });
  const props = lv >= 1 ? PROPS.concat(FRONT_TREES) : PROPS;
  for(const q of props){
    const r = q.t === "tree" ? 0.12 : q.t === "bench" ? 0.24 : 0.05;
    items.push({ k:"p", q, fp:{ x0:q.x-r, x1:q.x+r, y0:q.y-r*0.6, y1:q.y+r*0.6 } });
  }
  for(const a of actors){
    const rx = a.kind === "car" ? 0.30 : 0.02, ry = a.kind === "car" ? 0.14 : 0.02;
    items.push({ k:"a", a, fp:{ x0:a.gx-rx, x1:a.gx+rx, y0:a.gy-ry, y1:a.gy+ry } });
  }
  for(const it of items) it.key = (it.fp.x0+it.fp.x1+it.fp.y0+it.fp.y1)*0.5;
  return depthOrder(items);
}
/* A は B より先に描くべきか（A が B の左か奥にある） */
function isBehind(A, B){
  const e = 1e-6;
  return A.fp.x1 <= B.fp.x0 + e || A.fp.y1 <= B.fp.y0 + e;
}
function depthOrder(items){
  const n = items.length;
  const after = Array.from({ length:n }, () => []);   /* i を描いたあとで描けるもの */
  const indeg = new Array(n).fill(0);
  for(let i = 0; i < n; i++) for(let j = i+1; j < n; j++){
    const ab = isBehind(items[i], items[j]), ba = isBehind(items[j], items[i]);
    if(ab && !ba){ after[i].push(j); indeg[j]++; }
    else if(ba && !ab){ after[j].push(i); indeg[i]++; }
    else if(!ab && !ba){
      /* 四角が重なっている（人が建物の中にいるなど、本来は起きない）。x+y で決める */
      if(items[i].key <= items[j].key){ after[i].push(j); indeg[j]++; }
      else { after[j].push(i); indeg[i]++; }
    } else {
      /* 両方とも「奥」＝斜めの位置関係。ふつうは画面で重ならないが、
         建物の手前の角にちょうど人が立つと、数ピクセルだけ触れる。
         そのときは y（手前か奥か）を優先する ── 手前の角にいる人は建物の後に描く */
      const e = 1e-6, A = items[i].fp, B = items[j].fp;
      if(A.y1 <= B.y0 + e){ after[i].push(j); indeg[j]++; }
      else if(B.y1 <= A.y0 + e){ after[j].push(i); indeg[i]++; }
    }
  }
  const out = [], done = new Array(n).fill(false);
  for(let k = 0; k < n; k++){
    let best = -1;
    for(let i = 0; i < n; i++)
      if(!done[i] && indeg[i] === 0 && (best < 0 || items[i].key < items[best].key)) best = i;
    if(best < 0){
      /* 矛盾が残った。残りを x+y の順で足す（起きたら check.mjs が数える） */
      const rest = [];
      for(let i = 0; i < n; i++) if(!done[i]) rest.push(i);
      rest.sort((a,b) => items[a].key - items[b].key);
      for(const i of rest){ out.push(items[i]); done[i] = true; }
      break;
    }
    done[best] = true; out.push(items[best]);
    for(const j of after[best]) indeg[j]--;
  }
  return out;
}
/* 並び順の確認。人と建物の組で、画面が重なるのに前後が逆なものを数える。
   check.mjs から呼ぶ。0 でなければ直っていない */
function orderViolations(lv){
  const list = drawList(lv == null ? 2 : lv);
  const idx = new Map(); list.forEach((it, i) => idx.set(it, i));
  let bad = 0; const where = [];
  for(const P of list){
    if(P.k !== "a" || P.a.kind !== "walk") continue;
    const u = P.a.gx - P.a.gy;
    for(const B of list){
      if(B.k !== "b") continue;
      const f = B.fp;
      /* 画面で重なるか。人の足もとの列 u が、建物の左端〜右端の列にあるか（人の幅ぶん 0.15 を足す） */
      if(u + 0.15 < f.x0 - f.y1 || u - 0.15 > f.x1 - f.y0) continue;
      const inFront = P.a.gx >= f.x1 - 1e-6 || P.a.gy >= f.y1 - 1e-6;
      const later = idx.get(P) > idx.get(B);
      if(inFront !== later){
        bad++;
        if(where.length < 6) where.push({ gx:+P.a.gx.toFixed(2), gy:+P.a.gy.toFixed(2),
                                          b:B.p.id, inFront, later });
      }
    }
  }
  /* 建物どうしも見る。片方だけが「奥」なら、その順に描かれていなければならない */
  const bs = list.filter(it => it.k === "b");
  for(let i = 0; i < bs.length; i++) for(let j = i+1; j < bs.length; j++){
    const A = bs[i], B = bs[j];
    const ab = isBehind(A, B), ba = isBehind(B, A);
    if(ab === ba) continue;
    const okOrder = ab ? idx.get(A) < idx.get(B) : idx.get(B) < idx.get(A);
    if(!okOrder){ bad++; if(where.length < 6) where.push({ b:A.p.id, b2:B.p.id, ab, ba }); }
  }
  return { bad, where };
}

/* ==================================================================
   街の描画
   ================================================================== */
function drawTown(){
  const dm = dayMix(), nt = dm.night;
  const S = TOWN_SEASONS[townMonth()] || TOWN_SEASONS[7];   /* 月ごとの街（05・案C） */
  const sky = ctx.createLinearGradient(0,0,0,VH);
  sky.addColorStop(0, dm.a); sky.addColorStop(0.6, dm.b); sky.addColorStop(1, dm.b);
  ctx.fillStyle = sky; ctx.fillRect(0,0,VW,VH);

  /* 遠くの街のシルエット。ここが空だと、街ぜんぶが小さく見える。色は月で変わる */
  const SKYLINE = [46,74,28,96,58,38,84,50,68,32,78,54,40,88,60];
  let sx = -14;
  for(let i=0;i<SKYLINE.length;i++){
    const w = 20 + (i*11)%22, h = SKYLINE[i];
    ctx.fillStyle = nt>0.4 ? "rgba(84,78,118,.62)" : "rgba("+S.far+",.26)";
    ctx.fillRect(sx, OY-26-h, w, h+30);
    if(nt > 0.4){
      ctx.fillStyle = "rgba(255,226,150,.30)";
      for(let r=0;r<Math.floor(h/22);r++) for(let c=0;c<2;c++)
        ctx.fillRect(sx+5+c*(w-13), OY-20-h+r*20, 5, 6);
    }
    sx += w + 5;
  }
  drawSkyLife();

  /* 地面。草と道の色が月で変わる。手前の2列は並木の歩道 */
  for(let gy=0; gy<TGD; gy++) for(let gx=0; gx<TGW; gx++){
    const road = (gy===2 || gy===5 || gy===8 || gy===9);
    poly([iso(gx,gy),iso(gx+1,gy),iso(gx+1,gy+1),iso(gx,gy+1)],
         road ? ((gx%2) ? S.road[0] : S.road[1]) : ((gx+gy)%2 ? S.grass[0] : S.grass[1]));
  }
  /* 道の白線 */
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1.4;
  ctx.setLineDash([5,6]);
  for(const gy of ROADY3){
    const a2 = iso(0,gy), b2 = iso(TGW,gy);
    ctx.beginPath(); ctx.moveTo(a2.x,a2.y); ctx.lineTo(b2.x,b2.y); ctx.stroke();
  }
  ctx.setLineDash([]);
  /* 地面の厚み */
  poly([iso(0,TGD), iso(TGW,TGD), iso(TGW,TGD,-14), iso(0,TGD,-14)], "#8e8471");
  poly([iso(TGW,0), iso(TGW,TGD), iso(TGW,TGD,-14), iso(TGW,0,-14)], "#7a7160");
  const mo = townMonth();
  if(mo === 4)  groundLitter("petal");
  if(mo === 11) groundLitter("leaf");

  /* 建物・木・人・車を、アイソメで正しい前後（組ごとの左／奥）で並べて描く（town/crowd.js） */
  for(const it of drawList(2)){
    if(it.k === "b"){
      drawBuilding(it.p, placeOpen(it.p));
    } else if(it.k === "a"){
      const a = it.a;
      if(a.kind === "walk") drawWalker(a);
      else if(a.kind === "cat") drawTownCat(a);
      else drawCar(a);
    } else {
      const q = it.q;
      if(q.t === "tree"){
        drawTreeS(q.x, q.y, S.tree);
      } else if(q.t === "bench"){
        box(q.x-0.22, q.y-0.08, .44, .16, 5, "#8a6440", 0);
        box(q.x-0.24, q.y-0.10, .48, .20, 3, "#a9784c", 5);
      } else {
        /* 街灯。暗くなると灯る。街の時計と同じで、店が閉まっても消えない。
           光は足もとの地面にだけ落とす（壁にはかけない） */
        const on = ramp(nt, 0.10, 0.40);
        townLampPool(q.x, q.y, 0.62, on);
        cyl(q.x, q.y, .05, 26, "#7d8794", 0);
        cyl(q.x, q.y, .16, 7, tMix("#d8d2c4", "#ffe6a8", on), 26);
      }
    }
  }
  drawEvent(S.ev);                       /* 月ごとの行事の記号。1か月にひとつだけ */
  if(mo === 1) drawSnowfall();

  /* 名札は10枚ぜんぶ（先生の判断）。まだの場所は暗くせず、開く条件を添え、縁の点を付ける */
  drawLabels("both", "c");

  if(dm.amt > 0.005){
    ctx.fillStyle = "rgba("+dm.tint+","+dm.amt+")"; ctx.fillRect(0,0,VW,VH);
  }
  /* 季節の一枚。朝夕の色（DAY 表）の上に薄くかぶせるだけ。「朝の11月」も「夜の4月」も出る */
  ctx.fillStyle = "rgba("+S.sky+","+S.skyA+")";
  ctx.fillRect(0,0,VW,VH);
}
/* ==================================================================
   建物。方針（2026-08-16 先生の指示）：
     ・透けさせない。窓は不透明（暗いガラス／夜は明かり）、中身は描かない
     ・壁で塞いだ「建物」として見せ、外側の記号で業種を伝える
       （看板＋ピクトグラム・日よけ・煙突・時計塔・マーキー…）
   見えている面は 手前＝ y = p.y+p.d、右＝ x = p.x+p.w の2面。
   ファサードは必ずこの2面に描く（裏の面に描くと屋根の上に浮いて見える）。
   ================================================================== */

/* 接地の影。建物の足もとをやわらかく落とす */
function bShadow(p, extra){
  const e = extra || 0.30;
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  poly([iso(p.x-e*0.4, p.y+p.d), iso(p.x+p.w+e, p.y+p.d),
        iso(p.x+p.w+e, p.y+p.d+e*0.9), iso(p.x-e*0.4, p.y+p.d+e*0.9)], "rgba(70,60,66,.40)");
  poly([iso(p.x+p.w, p.y-e*0.2), iso(p.x+p.w+e, p.y-e*0.2),
        iso(p.x+p.w+e, p.y+p.d+e*0.9), iso(p.x+p.w, p.y+p.d)], "rgba(70,60,66,.30)");
  ctx.restore();
}
/* 壁の根元の暗み（AO）。箱を描いたあとに呼ぶ */
function bBaseAO(p){
  const F = p.y+p.d, RX = p.x+p.w;
  ctx.save(); ctx.globalCompositeOperation = "multiply";
  poly([iso(p.x,F+0.004,3.5), iso(RX,F+0.004,3.5), iso(RX,F+0.004,0), iso(p.x,F+0.004,0)], "rgba(60,50,60,.22)");
  poly([iso(RX+0.004,p.y,3.5), iso(RX+0.004,F,3.5), iso(RX+0.004,F,0), iso(RX+0.004,p.y,0)], "rgba(60,50,60,.22)");
  ctx.restore();
}
/* 円筒の「手前半分だけ」の帯。丸い建物に巻くと、上の楕円が壁の上に漏れない */
function bRing(gx, gy, r, z0, z1, col){
  const c0 = iso(gx,gy,z0), c1 = iso(gx,gy,z1);
  const rx = r*TW/2, ry = r*TH/2;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(c1.x, c1.y, rx, ry, 0, 0, Math.PI, false);
  ctx.ellipse(c0.x, c0.y, rx, ry, 0, Math.PI, 0, true);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = shade(col,1.12); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(c1.x, c1.y, rx, ry, 0, 0, Math.PI, false); ctx.stroke();
}
/* 手前の面の窓（面 y=gy）。枠 → 不透明な暗いガラス → 反射 → 桟 → 窓台 */
function bWindow(gx, gy, gz, w, h, lit, opt){
  opt = opt || {};
  const q = (u, z) => iso(gx+u, gy, z);
  const frame = opt.frame || "#e9e4dc";
  poly([q(-0.02,gz+h+1.6), q(w+0.02,gz+h+1.6), q(w+0.02,gz-1), q(-0.02,gz-1)], frame);
  poly([q(0,gz+h), q(w,gz+h), q(w,gz), q(0,gz)], lit ? "#ffe6a8" : (opt.dark || "#3a4250"));
  if(!lit){
    poly([q(0,gz+h), q(w*0.5,gz+h), q(w*0.16,gz), q(0,gz)], "rgba(190,215,235,.42)");
    poly([q(w*0.62,gz+h), q(w,gz+h), q(w,gz+h*0.5), q(w*0.8,gz+h*0.2)], "rgba(190,215,235,.24)");
  } else {
    poly([q(0,gz+h), q(w*0.5,gz+h), q(w*0.16,gz), q(0,gz)], "rgba(255,255,255,.18)");
  }
  if(opt.bars !== false){
    ctx.strokeStyle = frame; ctx.lineWidth = 0.9;
    const a = q(w*0.5,gz+h), b = q(w*0.5,gz);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    if(h > 12){
      const c2 = q(0,gz+h*0.5), d2 = q(w,gz+h*0.5);
      ctx.beginPath(); ctx.moveTo(c2.x,c2.y); ctx.lineTo(d2.x,d2.y); ctx.stroke();
    }
  }
  poly([q(-0.03,gz-1), q(w+0.03,gz-1), q(w+0.03,gz-2.4), q(-0.03,gz-2.4)], shade(frame,.8));
}
/* 右の面の窓（面 x=gx） */
function bWindowR(gx, gy, gz, w, h, lit){
  const q = (v, z) => iso(gx, gy+v, z);
  poly([q(-0.02,gz+h+1.6), q(w+0.02,gz+h+1.6), q(w+0.02,gz-1), q(-0.02,gz-1)], "#d9d4cc");
  poly([q(0,gz+h), q(w,gz+h), q(w,gz), q(0,gz)], lit ? "#f5d890" : "#2f3743");
  if(!lit) poly([q(0,gz+h), q(w*0.45,gz+h), q(w*0.12,gz), q(0,gz)], "rgba(190,215,235,.32)");
  poly([q(-0.03,gz-1), q(w+0.03,gz-1), q(w+0.03,gz-2.2), q(-0.03,gz-2.2)], "#b9b4ac");
}
/* 手前の面の金属シャッター（面 y=gy）。amt=1 で上がりきり、0 で下ろしきり。
   窓や搬入口と同じ矩形を渡す。巻き取りの箱は昼でも見えている */
function bShutter(gx, gy, gz, w, h, amt, col){
  const q = (u,z) => iso(gx+u, gy+0.005, z);
  const c = col || "#9aa1a8";
  const top = gz + h, a = Math.max(0, Math.min(1, amt));
  const bot = gz + h*a;                     /* 下端。上がるほど高くなる */
  if(h*(1-a) > 1.2){
    poly([q(0,top), q(w,top), q(w,bot), q(0,bot)], c);
    ctx.strokeStyle = "rgba(0,0,0,.17)"; ctx.lineWidth = 0.9;
    for(let z = bot+2.0; z < top-0.8; z += 2.2){
      const s = q(0,z), e = q(w,z);
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(e.x,e.y); ctx.stroke();
    }
    poly([q(0,bot+1.2), q(w,bot+1.2), q(w,bot), q(0,bot)], shade(c,.66));   /* 下端の重い桟 */
    if(a < 0.06){                                                          /* 閉めきりの鍵穴 */
      poly([q(w*0.5-0.06,gz+2.6), q(w*0.5+0.06,gz+2.6), q(w*0.5+0.06,gz+1.4), q(w*0.5-0.06,gz+1.4)], shade(c,.48));
    }
  }
  poly([q(-0.03,top+3.2), q(w+0.03,top+3.2), q(w+0.03,top), q(-0.03,top)], shade(c,.60));
}
/* 手前の面の木の雨戸（よろい戸）。amt=1 で開ききり、0 で閉めきり。
   開くと壁に畳まれて細くなり、閉じると左右から窓をふさぐ */
function bStorm(gx, gy, gz, w, h, amt, col){
  const a = Math.max(0, Math.min(1, amt));
  const c = col || "#8a6a4a";
  const pw = (w*0.09)*a + (w*0.5)*(1-a);          /* 片側の板の幅 */
  if(pw < 0.012) return;
  for(const [u, sh] of [[gx, 1.06], [gx+w-pw, 0.88]]){
    const q = (t,z) => iso(u+t, gy+0.007, z);
    poly([q(0,gz+h+0.8), q(pw,gz+h+0.8), q(pw,gz-0.8), q(0,gz-0.8)], shade(c, sh));
    ctx.strokeStyle = "rgba(0,0,0,.20)"; ctx.lineWidth = 0.8;   /* よろいの羽 */
    for(let z = gz+1.6; z < gz+h-0.4; z += 2.0){
      const s = q(pw*0.12,z), e = q(pw*0.88,z);
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(e.x,e.y); ctx.stroke();
    }
  }
}
/* 厚みのある陸屋根。パラペットの縁 */
function bFlatRoof(p, RF, lip){
  const L = lip == null ? 0.08 : lip;
  box(p.x-L, p.y-L, p.w+L*2, p.d+L*2, 3.5, RF, p.h);
  poly([iso(p.x-L,p.y-L,p.h+3.5), iso(p.x+p.w+L,p.y-L,p.h+3.5),
        iso(p.x+p.w+L,p.y+p.d+L,p.h+3.5), iso(p.x-L,p.y+p.d+L,p.h+3.5)], "rgba(0,0,0,.05)");
  poly([iso(p.x+0.06,p.y+0.06,p.h+3.5), iso(p.x+p.w-0.06,p.y+0.06,p.h+3.5),
        iso(p.x+p.w-0.06,p.y+p.d-0.06,p.h+3.5), iso(p.x+0.06,p.y+p.d-0.06,p.h+3.5)], shade(RF,.94));
}
/* 入口。手前の面 y=gy に扉、手前へ階段2段、上に小さな庇 */
function bDoor(gx, gy, w, col, opt){
  opt = opt || {};
  const q = (u,z) => iso(gx+u, gy+0.008, z);
  box(gx-0.06, gy, w+0.12, 0.20, 2.5, "#c9c2b6", 0);
  box(gx-0.03, gy, w+0.06, 0.11, 2.5, "#d6cfc3", 2.5);
  poly([q(0,20), q(w,20), q(w,5), q(0,5)], "#3c3a40");
  poly([q(0.03,19), q(w-0.03,19), q(w-0.03,5), q(0.03,5)], col || "#5b4a44");
  if(opt.glass){
    poly([q(0.06,18), q(w-0.06,18), q(w-0.06,8), q(0.06,8)], "#8fb0c4");
    poly([q(0.06,18), q(w*0.5,18), q(0.2,8), q(0.06,8)], "rgba(255,255,255,.35)");
  }
  const kn = q(w-0.08, 12);
  ctx.fillStyle = "#e6c46a"; ctx.beginPath(); ctx.arc(kn.x, kn.y, 0.9, 0, 6.2832); ctx.fill();
  if(opt.awning !== false) box(gx-0.08, gy, w+0.16, 0.16, 1.6, opt.awningCol || "#6f6a72", 21);
}
/* 屋上の設備。室外機・貯水タンク */
function bRoofStuff(p, kind){
  if(kind === "ac"){
    box(p.x+p.w-0.5, p.y+0.2, 0.34, 0.26, 7, "#c9cdd2", p.h+3.5);
    const f = iso(p.x+p.w-0.33, p.y+0.2, p.h+7.5);
    ctx.fillStyle="#7d858e"; ctx.beginPath(); ctx.arc(f.x, f.y, 2.6, 0, 6.2832); ctx.fill();
  }
  if(kind === "tank"){
    cyl(p.x+0.4, p.y+0.4, 0.16, 12, "#b8bec6", p.h+3.5);
    cyl(p.x+0.4, p.y+0.4, 0.18, 2, "#98a0aa", p.h+15.5);
  }
}
/* 手前の面に沿った文字（面 y=gy）。x方向へ進む文字は画面で右下がり */
function bTextF(gx, gy, gz, text, size, col){
  const q = iso(gx, gy, gz);
  ctx.save(); ctx.fillStyle = col; ctx.font = "800 "+size+"px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.translate(q.x, q.y); ctx.transform(1, 0.5, 0, 1, 0, 0); ctx.fillText(text, 0, 0); ctx.restore();
}
/* 右の面に沿った文字（面 x=gx）。y方向へ進む文字は画面で右上がり */
function bTextR(gx, gy, gz, text, size, col){
  const q = iso(gx, gy, gz);
  ctx.save(); ctx.fillStyle = col; ctx.font = "800 "+size+"px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.translate(q.x, q.y); ctx.transform(1, -0.5, 0, 1, 0, 0); ctx.fillText(text, 0, 0); ctx.restore();
}
/* 業種のピクトグラム。看板の上に置く。原点中心、s は半径ぐらいの大きさ(px)。
   bg は看板の色（穴を抜くかわりに塗り戻す） */
function bPicto(kind, s, col, bg){
  const P = Math.PI;
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = "round"; ctx.lineJoin = "round";
  if(kind === "scissors"){
    ctx.lineWidth = s*0.30;
    ctx.beginPath(); ctx.moveTo(-s*0.55, -s*0.95); ctx.lineTo(s*0.34, s*0.28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.55, -s*0.95); ctx.lineTo(-s*0.34, s*0.28); ctx.stroke();
    ctx.lineWidth = s*0.24;
    ctx.beginPath(); ctx.arc(-s*0.48, s*0.62, s*0.34, 0, 6.2832); ctx.stroke();
    ctx.beginPath(); ctx.arc( s*0.48, s*0.62, s*0.34, 0, 6.2832); ctx.stroke();
  } else if(kind === "hanger"){
    ctx.lineWidth = s*0.26;
    ctx.beginPath(); ctx.arc(0, -s*0.7, s*0.24, P*0.55, P*1.95); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -s*0.46); ctx.lineTo(0, -s*0.28);
    ctx.lineTo(s*0.98, s*0.44); ctx.lineTo(-s*0.98, s*0.44); ctx.closePath(); ctx.stroke();
  } else if(kind === "cup"){
    ctx.beginPath(); ctx.roundRect(-s*0.72, -s*0.22, s*1.15, s*0.9, [0,0,s*.32,s*.32]); ctx.fill();
    ctx.lineWidth = s*0.2; ctx.beginPath(); ctx.arc(s*0.5, s*0.18, s*0.32, -P*0.5, P*0.5); ctx.stroke();
    ctx.lineWidth = s*0.15;
    for(const dx of [-s*0.4, -s*0.1, s*0.2]){
      ctx.beginPath(); ctx.moveTo(dx, -s*0.42); ctx.quadraticCurveTo(dx+s*0.16, -s*0.62, dx, -s*0.86); ctx.stroke(); }
    ctx.fillRect(-s*0.9, s*0.74, s*1.55, s*0.16);
  } else if(kind === "camera"){
    ctx.beginPath(); ctx.roundRect(-s, -s*0.5, s*2, s*1.25, s*0.18); ctx.fill();
    ctx.fillRect(-s*0.5, -s*0.76, s*0.62, s*0.32);
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(s*0.12, s*0.12, s*0.42, 0, 6.2832); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(s*0.12, s*0.12, s*0.24, 0, 6.2832); ctx.fill();
    ctx.fillRect(s*0.6, -s*0.36, s*0.22, s*0.16);
  } else if(kind === "bolt"){
    ctx.fillRect(-s*1.05, -s*0.42, s*1.6, s*0.84);
    ctx.beginPath(); ctx.arc(s*0.55, 0, s*0.42, 0, 6.2832); ctx.fill();
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(s*0.55, 0, s*0.22, 0, 6.2832); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(s*0.55, 0, s*0.08, 0, 6.2832); ctx.fill();
  } else if(kind === "gear"){
    for(let i=0;i<8;i++){ ctx.save(); ctx.rotate(i*P/4); ctx.fillRect(-s*0.18, -s*0.98, s*0.36, s*0.42); ctx.restore(); }
    ctx.beginPath(); ctx.arc(0,0,s*0.68,0,6.2832); ctx.fill();
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0,0,s*0.28,0,6.2832); ctx.fill();
  } else if(kind === "mag"){
    ctx.beginPath(); ctx.roundRect(-s*0.7, -s*0.95, s*1.4, s*1.9, s*0.1); ctx.fill();
    ctx.fillStyle = bg; ctx.fillRect(-s*0.5, -s*0.75, s*1.0, s*0.36);
    for(let k=0;k<3;k++) ctx.fillRect(-s*0.5, -s*0.18+k*s*0.32, s*1.0, s*0.14);
  } else if(kind === "star"){
    ctx.beginPath();
    for(let i=0;i<10;i++){ const a=-P/2+i*P/5, rr = i%2 ? s*0.42 : s;
      const x=Math.cos(a)*rr, y=Math.sin(a)*rr; i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
    ctx.closePath(); ctx.fill();
  } else if(kind === "cap"){
    ctx.beginPath(); ctx.moveTo(0,-s*0.72); ctx.lineTo(s,-s*0.22); ctx.lineTo(0,s*0.28); ctx.lineTo(-s,-s*0.22); ctx.closePath(); ctx.fill();
    ctx.fillRect(-s*0.45, s*0.02, s*0.9, s*0.46);
    ctx.lineWidth = s*0.12; ctx.beginPath(); ctx.moveTo(s*0.86,-s*0.16); ctx.lineTo(s*0.86, s*0.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.86, s*0.6, s*0.14, 0, 6.2832); ctx.fill();
  } else if(kind === "sewing"){
    ctx.fillRect(-s*1.0, s*0.45, s*2.0, s*0.4);
    ctx.beginPath(); ctx.roundRect(-s*0.95, -s*0.5, s*0.6, s*1.0, s*0.1); ctx.fill();
    ctx.fillRect(-s*0.95, -s*0.85, s*1.75, s*0.5);
    ctx.fillRect(s*0.5, -s*0.85, s*0.3, s*0.9);
    ctx.lineWidth = s*0.12; ctx.beginPath(); ctx.moveTo(s*0.65, s*0.05); ctx.lineTo(s*0.65, s*0.42); ctx.stroke();
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(-s*0.65, 0, s*0.14, 0, 6.2832); ctx.fill();
    ctx.fillStyle = col;
  } else if(kind === "dress"){
    ctx.beginPath(); ctx.moveTo(-s*0.36,-s*0.95); ctx.lineTo(s*0.36,-s*0.95); ctx.lineTo(s*0.28,-s*0.3);
    ctx.lineTo(s*0.86,s*0.92); ctx.lineTo(-s*0.86,s*0.92); ctx.lineTo(-s*0.28,-s*0.3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(-s*0.22,-s*0.95); ctx.quadraticCurveTo(0,-s*0.5,s*0.22,-s*0.95); ctx.fill();
  }
}
function bIconF(gx, gy, gz, kind, s, col, bg){
  const q = iso(gx, gy, gz);
  ctx.save(); ctx.translate(q.x, q.y); ctx.transform(1, 0.5, 0, 1, 0, 0); bPicto(kind, s, col, bg); ctx.restore();
}
/* 手前の面に貼った看板（少しだけ壁から出る板）。文字とピクトグラムをのせる。
   lit（0〜1）を渡すと灯が入り、板が明るく、文字が電球色に転ぶ。
   まわりへのにじみは描かない（docs/ART.md 4章。壁に光をかぶせない） */
function bSignF(gx, gy, gz, w, h, bg, text, size, col, icon, iconS, lit){
  const L = lit || 0;
  /* にじみを描かないので、灯りは板と文字の色だけで見せる。
     板を明るくしすぎると文字が沈むので、動かすのは主に文字のほう */
  const plate = L > 0.02 ? tMix(bg,  "#fff2cc", L*0.30) : bg;
  const ink   = L > 0.02 ? tMix(col, "#e8a02c", L*0.95) : col;
  box(gx, gy, w, 0.05, h, plate, gz);
  const fy = gy + 0.056;
  /* 文字とピクトグラムをひとかたまりにして、板の幅の中央にそろえる。
     板からはみ出すと、となりの窓枠や壁に文字が乗って読めなくなる。
     x方向の1マスは画面で TW/2 ピクセル。そこで px をマスに直して測る */
  const u1 = TW/2;
  let sz = size;
  ctx.font = "800 " + sz + "px sans-serif";
  let tw = ctx.measureText(text).width / u1;
  const iw = icon ? (iconS || 3.5)*2.0 / u1 : 0, gap = icon ? 4/u1 : 0;
  const room = w - 0.06;
  if(iw + gap + tw > room){          /* 入らないときは縮める。はみ出すより読める */
    sz = Math.max(3, sz * (room - iw - gap) / tw);
    ctx.font = "800 " + sz + "px sans-serif";
    tw = ctx.measureText(text).width / u1;
  }
  let u = gx + Math.max(0.02, (w - (iw + gap + tw))*0.5);
  if(icon){ bIconF(u + iw*0.5, fy, gz+h*0.5, icon, iconS || 3.5, ink, plate); u += iw + gap; }
  bTextF(u + tw*0.5, fy, gz+h*0.5, text, sz, ink);
}
/* 手前へ傾いたしま模様の日よけ。z は壁につく側の高さ、outは張り出し */
function bAwning(gx, gy, w, z, out, n, colA, colB){
  const sw = w/n;
  for(let i=0;i<n;i++){
    const u = gx + i*sw, col = i%2 ? colB : colA;
    poly([iso(u,gy,z+3), iso(u+sw,gy,z+3), iso(u+sw,gy+out,z), iso(u,gy+out,z)], col);
    poly([iso(u,gy+out,z), iso(u+sw,gy+out,z), iso(u+sw,gy+out,z-2.2), iso(u,gy+out,z-2.2)], shade(col,.86));
  }
  ctx.fillStyle = shade(colA,.86);
  for(let i=0;i<n*2;i++){ const q = iso(gx+w*(i+0.5)/(n*2), gy+out, z-2.2);
    ctx.beginPath(); ctx.arc(q.x, q.y, 1.6, 0, Math.PI); ctx.fill(); }
}
/* 屋根の縁の厚み（軒先の板）。a→b の稜線の下に h だけ垂らす */
function bFascia(a, b, h, col){
  poly([iso(a[0],a[1],a[2]), iso(b[0],b[1],b[2]), iso(b[0],b[1],b[2]-h), iso(a[0],a[1],a[2]-h)], col);
}

function drawBuilding(p, open){
  const W = open ? p.wall : "#cac4be", RF = open ? p.roof : "#a8a29b";
  /* きょうのこの店の一日。雨戸の上がり具合・看板の灯り・窓の明かり */
  const TL = townLight(p, open);
  const nt = TL.nt;
  const lit = i => litW(TL, p.id, i);       /* i 番の窓に灯が入っているか */
  const glow = (a, b) => tMix(a, b, TL.win);/* 暗い窓から電球色へ、なめらかに */
  const F = p.y + p.d, RX = p.x + p.w, mid = p.x + p.w/2;   /* 手前の面・右の面・中央 */
  const fq = (u,z) => iso(p.x+u, F+0.006, z);                /* 手前の面の上の点 */
  const inkF = "rgba(0,0,0,.08)";

  bShadow(p);

  /* ---------------- 編集部：カーテンウォールの塔・屋上のPRESS ---------------- */
  if(p.id === "press"){
    box(p.x, p.y, p.w, p.d, p.h, W, 0);
    bBaseAO(p);
    for(let f=0; f<5; f++){
      const z = 8 + f*17;
      poly([fq(0.08,z+11), fq(p.w-0.08,z+11), fq(p.w-0.08,z), fq(0.08,z)],
           lit(f) ? "#ffe6a8" : "#39434f");
      poly([fq(0.08,z+11), fq(0.6,z+11), fq(0.28,z), fq(0.08,z)], "rgba(190,215,235,.30)");
      ctx.strokeStyle = "#e6e9ee"; ctx.lineWidth = 0.9;
      for(let i=1;i<4;i++){
        const a = iso(p.x+0.08+(p.w-0.16)*i/4, F+0.007, z+11), b = iso(p.x+0.08+(p.w-0.16)*i/4, F+0.007, z);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
    }
    for(let f=0; f<5; f++) for(let i=0;i<2;i++)
      bWindowR(RX+0.006, p.y+0.2+i*0.6, 12+f*17, 0.4, 9, lit(20+f*2+i));
    bFlatRoof(p, RF, 0.06);
    bRoofStuff(p, "ac"); bRoofStuff(p, "tank");
    /* 屋上のサインボード（手前の縁）。締切のあいだ夜通し灯っている */
    box(p.x+0.2, F-0.22, 1.5, 0.10, 20, "#2e3540", p.h+3.5);
    { const ink = tMix("#f4f1ea", "#ffd070", TL.sign);
      bIconF(p.x+0.55, F-0.114, p.h+13.5, "mag", 5.2, ink, "#2e3540");
      bTextF(p.x+1.2, F-0.114, p.h+13.5, "PRESS", 6, ink);
 }
    bDoor(p.x+0.55, F, 0.7, "#2f3743", {glass:true, awningCol:"#48505c"});
    return;
  }

  /* ---------------- 工場：のこぎり屋根・煙突・搬入シャッター ---------------- */
  if(p.id === "factory"){
    box(p.x, p.y, p.w, p.d, p.h, W, 0);
    bBaseAO(p);
    ctx.strokeStyle = inkF; ctx.lineWidth = 1;
    for(let u=0.08; u<p.w; u+=0.16){
      const a = fq(u, p.h-1), b = fq(u, 3);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    /* のこぎり屋根：手前の面に妻の三角、その上に斜面とすりガラスの立面 */
    const n = 4, sw = p.w/n;
    for(let i=0;i<n;i++){
      const u = p.x + i*sw;
      poly([iso(u,F+0.006,p.h), iso(u+sw*0.55,F+0.006,p.h+14), iso(u+sw,F+0.006,p.h)], shade(W,.98));
    }
    for(let i=0;i<n;i++){
      const u = p.x + i*sw;
      poly([iso(u,p.y,p.h), iso(u+sw*0.55,p.y,p.h+14), iso(u+sw*0.55,F,p.h+14), iso(u,F,p.h)], shade(RF,1.06));
      ctx.strokeStyle = "rgba(0,0,0,.08)"; ctx.lineWidth = 0.8;
      for(let k=1;k<5;k++){
        const a = iso(u+sw*0.55*k/5, p.y, p.h+14*k/5), b = iso(u+sw*0.55*k/5, F, p.h+14*k/5);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
      poly([iso(u+sw*0.55,p.y,p.h+14), iso(u+sw,p.y,p.h), iso(u+sw,F,p.h), iso(u+sw*0.55,F,p.h+14)],
           glow("#c3ccd4", "#e6cf9c"));
      ctx.strokeStyle = "#e6e9ee"; ctx.lineWidth = 0.9;
      for(let k=1;k<4;k++){
        const a = iso(u+sw*(0.55+0.45*k/4), p.y, p.h+14*(1-k/4)), b = iso(u+sw*(0.55+0.45*k/4), F, p.h+14*(1-k/4));
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
      /* 妻の縁 */
      ctx.strokeStyle = shade(RF,.62); ctx.lineWidth = 1.2;
      const e0 = iso(u,F+0.01,p.h), e1 = iso(u+sw*0.55,F+0.01,p.h+14), e2 = iso(u+sw,F+0.01,p.h);
      ctx.beginPath(); ctx.moveTo(e0.x,e0.y); ctx.lineTo(e1.x,e1.y); ctx.lineTo(e2.x,e2.y); ctx.stroke();
    }
    /* 煙突。段のあるレンガと、うすい煙。本ラインが動いているあいだだけ煙が出る */
    cyl(RX-0.32, p.y+0.34, 0.17, 30, "#a8776a", p.h);
    cyl(RX-0.32, p.y+0.34, 0.20, 3, "#8c5f54", p.h+30);
    for(let k=0;k<2;k++){ const q = iso(RX-0.32, p.y+0.34, p.h+34+k*8);
      ctx.fillStyle = "rgba(255,255,255,"+((0.24-k*0.1)*TL.shut)+")";
      ctx.beginPath(); ctx.ellipse(q.x+k*3, q.y-2, 4+k*1.5, 2.6+k*0.6, 0, 0, 6.2832); ctx.fill(); }
    /* 搬入口のシャッター。朝いちばんに上がり、定時に下りる。車止めは出しっぱなし */
    { const gx = p.x+0.35, w = 0.9;
      poly([iso(gx,F+0.006,26), iso(gx+w,F+0.006,26), iso(gx+w,F+0.006,0), iso(gx,F+0.006,0)],
           glow("#2b3038", "#c8a86a"));                    /* 開いた奥は暗い土間 */
      bShutter(gx, F, 0, w, 26, TL.shut, "#5f666f");
      for(const u of [gx-0.02, gx+w-0.04]){
        box(u, F+0.03, 0.06, 0.12, 4.5, "#e2b23c", 0);
        poly([iso(u,F+0.156,3), iso(u+0.06,F+0.156,3), iso(u+0.06,F+0.156,1.8), iso(u,F+0.156,1.8)], "#2f2f33");
      }
    }
    for(let i=0;i<2;i++) bWindow(p.x+1.55+i*0.62, F+0.006, 12, 0.46, 12, lit(i));

  }

  /* ---------------- ショー会場：丸いホール・マーキー・入口ポーチと赤いカーペット ---------------- */
  if(p.id === "venue"){
    const cxv = mid, cyv = p.y+p.d/2, r = Math.min(p.w, p.d)*0.5;
    /* 円いホールを敷地に収めたぶん（前後に 0.4 マスはみ出して人や車と前後が崩れていた）、
