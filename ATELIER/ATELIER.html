/* 昇格。全員が一瞬手を止めて拍手する */
function promote(s){
  log(s.name+" が "+roleTitle(s)+" になった。");
  toast("🎉 "+s.name+" が "+roleTitle(s)+" に");
  say(s, pick(["がんばります","うれしい…","ここまで長かった"]));
  s.phase = "cheer"; s.t = 0;
  for(const o of staff) if(o !== s && Math.random()<0.6) say(o, pick(["おめでとう","やったね","当然だよ"]));
  for(let i=0;i<26;i++){
    const c = spawnConfetti();
    const p = iso(s.gx, s.gy, 0);
    c.x = p.x + (Math.random()-.5)*40; c.y = p.y - 40;
    confetti.push(c);
  }
}

/* ==================================================================
   10. 完成 → 発表
   ================================================================== */
function complete(){
  /* かけあわせのときは、抜き取った2要素が伸び、残りの2つが落ちる。
     選んだ型・生地・ひとひねり（job.design、game/design.js）の相性もここで効く */
  const v = {}; for(const k of STATS) v[k] = Math.round(teamStat(k) * crossMul(k) * designMul(k) * staffMul(k));
  const total = STATS.reduce((a,k)=>a+v[k], 0);
  const weak  = Math.min.apply(null, STATS.map(k=>v[k]));
  const rar   = Math.max(1, Math.min(5, Math.round(1 + weak/14)));
  const top   = STATS.reduce((a,k)=> v[k]>v[a] ? k : a, "concept");

  let price, note = "";
  if(job.kind === "order"){
    /* 出来ばえ。いちばん弱い要素で決まる。0.6〜1.4倍（弱点24で1.2、32で1.4） */
    const qual = Math.max(0.6, Math.min(1.4, 0.6 + weak/40));
    const late = dayNo() > job.due;
    const short = v[job.need] < total/4*0.8;      /* 求められた要素が弱い */
    price = Math.round(job.reward * qual * (late ? 0.45 : 1) * (short ? 0.85 : 1) * priceMul());
    if(late) note = "納期に遅れ、報酬が減額。";
    else if(short) note = "求められた"+STATJP[job.need]+"が足りず、渋い顔をされた。";
    fame += Math.round((rar + total/50) * fameMul()) - (late?4:0);
  } else {
    const cx = job.kind === "cross" ? 1.4 : 1;     /* かけあわせは実入りが良い */
    price = Math.round((total*165 + weak*430) * priceMul() * cx);
    fame += Math.round(rar*0.7 * fameMul() * cx);
  }
  fameCap();
  /* 別注は前金を受け取り済み。残金がマイナスなら、前金の一部を返す（game/economy.js） */
  const adv = job.advance || 0, rest = price - adv;
  money += rest; works++;

  /* 遊ぶ人が決めた一着（game/design.js）。決めていなければ主役の要素から引く */
  const piece = job.design ? { a:job.design.a, b:job.design.b, t:job.design.t, f:job.design.f }
                           : makePiece(top);
  /* ラックには、その生地の色で掛かる。ボディで作っていた服がそのまま移る */
  const rack = furniture.filter(o=>o.type==="rack").find(o=>o.hung<6);
  if(rack){ rack.colors = rack.colors||[]; rack.colors[rack.hung] = (GFAB[piece.f]||GFAB[0]).col; rack.hung++; }

  workList.unshift({ no:works, title:job.theme,
                     client:job.kind==="order" ? job.client
                          : job.kind==="cross" ? "かけあわせ" : "コレクション",
                     cross:job.cross || null,
                     v, total, weak, rar, price, top, week:dayNo(), date:dateText(),
                     piece, design: job.design || null, fab: job.fabCost || 0 });
  log("《"+job.theme+"》完成。★"+rar+"／"+yen(price)+
      (job.design ? "　"+pieceName(job.design) : ""));
  /* 使った型・生地・操作が図鑑に増える。最後の工程もここで覚える（game/dex.js。B）*/
  dexStage(4); dexLearn(piece, job.design);
  if(adv){
    if(rest >= 0) log("残金 "+yen(rest)+" を受け取った（前金 "+yen(adv)+" と合わせて "+yen(price)+"）"+
                      (job.fabCost ? "。生地代は "+yen(job.fabCost) : ""));
    else log("報酬が前金を下回り、"+yen(-rest)+" を返した。", true);
  } else if(job.fabCost) log("生地代 "+yen(job.fabCost)+" を引くと、手もとには "+yen(price - job.fabCost)+"。");
  /* 見た人が、選んだ型と生地について一言。理由が分かると次に活きる */
  if(job.design){
    const who = job.kind === "order" ? job.client : hasRole("press") ? "プレス" : "見に来た人";
    const vd = designVerdict(job.design);
    log(who+"「"+vd+"」");
    note = note ? note+"　"+vd : vd;
    for(const t of knackNote(job.design)) log(t);   /* 誰の得意・苦手が効いたか（staff/knack.js） */
  }
  if(rar >= 3){
    const nb = rar >= 5 ? 3 : rar >= 4 ? 2 : 1;
    buttons += nb;
    log("いい仕事の余り布から、ボタンを"+nb+"つ取っておいた。");
  }
  if(job.quest && quest && !quest.done){
    quest.done = true; quest.rec = workList[0] || null;
    storyPend.unshift("rei2");
    log("約束の一着が仕上がった。アマミヤ レイに知らせが行く。");
  }
  if(note) log(note, true);
  if(weak===v.form     && v.form     < v.concept*0.55) log("パタンナーが弱く、形が破綻した。", true);
  if(weak===v.material && v.material < v.concept*0.55) log("テキスタイルが弱く、生地の表情が出ない。", true);

  const got = rar >= 3
    ? (job.kind === "cross" ? mintCross(workList[0]) : mintCard(workList[0]))
    : null;
  if(got) log("カード《"+got.name+"》を手に入れた。");

  clearBoost();                 /* 仕入れた生地は、この一着で使い切る */
  for(const f of furniture) if(f.type === "draft") f.ink = 0;   /* 次の型を引きはじめる */
  if(view !== "room") setView("room");
  party = { t:0, kind:"work", rec:workList[0], shown:0, note, card:got };
  confetti = [];
  gatherEveryone();
  job = null; prog = 0;
}

/* 発表のとき、スタッフと動物を画面のまんなかに並べる。
   gx を足して gy を引くと、画面の上では真横に広がる。 */
function gatherEveryone(){
  const cy = GD-1.4, cx = cy + (GW-GD)/2;
  const cl = (v,m) => Math.max(0.6, Math.min(m-0.5, v));
  const n = staff.length;
  staff.forEach((s,i)=>{
    const o = (i-(n-1)/2)*0.62;
    s.tx = cl(cx+o,GW); s.ty = cl(cy-o,GD);
    s.route = null; s.tz = null; s.gz = 0;
    s.phase = "walk"; s.station = null; s.bubble = null; s.bubOff = 0;
  });
  const m = pets.length;
  pets.forEach((q,i)=>{
    const o = (i-(m-1)/2)*0.72;
    q.tx = cl(cx+o+0.55,GW); q.ty = cl(cy-o+0.55,GD);
    q.phase = "walk"; q.rest = 0; q.bubble = null;
  });
}

/* 良い作品はカードになる。テーマ × 主役だった要素 で1枠。
   同じ枠はより良いものに置きかわる。 */
function mintCard(rec){
  /* 12テーマのどれかでないと、図鑑の枠に収まらない */
  if(!THEMES.some(t => t.n === rec.title)) return null;
  const key = rec.title+"|"+rec.top;
  const prev = cards[key];
  if(prev && prev.total >= rec.total) return null;
  const card = { key, theme:rec.title, top:rec.top, rar:rec.rar,
                 v:Object.assign({}, rec.v), total:rec.total, week:rec.week,
                 client:rec.client, name:rec.title+pick(CARDSUFFIX[rec.top]), piece:rec.piece||null };
  cards[key] = card;
  return card;
}
function dexCount(){ return Object.keys(cards).length; }

const P_DIM=0.9, P_GOWN=1.5, P_TITLE=2.0, P_STAT=2.6, P_GAP=0.28;
const P_STAR=P_STAT+4*P_GAP, P_PRICE=P_STAR+0.45, P_END=7.0;
const GOWN_Y=92, GOWN_H=132, CROWD_Y=86;

function celebrate(){
  for(let i=0;i<80;i++) confetti.push(spawnConfetti());
  /* 吹き出しは両端の2人だけ。全員に出すと文字が重なって読めない */
  staff.forEach((s,i)=>{ s.phase="cheer"; s.t=Math.random()*3;
    if(i===0 || i===staff.length-1) say(s, pick(HAPPY)); });
  /* 動物も一緒に喜ぶ */
  pets.forEach((q,i)=>{ q.phase="cheer"; q.t=Math.random()*3;
    if(i===0){ q.bubble = PETS[q.kind].cheer; q.bubbleT = 4; q.bad = false; } });
}
function partyStep(dt){
  party.t += dt;
  const t = party.t;
  if(party.kind === "show"){
    const T = showTimes(party);
    if(!party.done && t > T.verdict){
      party.done = true;
      if(party.pass){ celebrate(); } else {
        staff.forEach(s=>{ s.phase="idle"; });
      }
    }
    for(const c of confetti){
      c.vy += 90*dt; c.x += c.vx*dt; c.y += c.vy*dt; c.r += c.vr*dt; c.life -= dt;
    }
    confetti = confetti.filter(c=>c.life>0 && c.y<VH+20);
    if(t > T.end){
      party = null; confetti = [];
      for(const s of staff){ s.bubOff=0; s.bubble=null; assign(s); }
      for(const q of pets){ q.phase="rest"; q.rest=0.1; q.bubble=null; }
      renderPane();
    }
    return;
  }
  if(t > P_STAT && party.shown < 5){
    const want = Math.min(5, Math.floor((t-P_STAT)/P_GAP)+1);
    if(want > party.shown){
      party.shown = want;
      if(want === 5){
        celebrate();
        if(party.note) toast(party.note);
      }
    }
  }
  for(const c of confetti){
    c.vy += 90*dt; c.x += c.vx*dt; c.y += c.vy*dt; c.r += c.vr*dt; c.life -= dt;
  }
  confetti = confetti.filter(c=>c.life>0 && c.y<VH+20);
  if(t > P_END){
    party = null; confetti = [];
    for(const s of staff){ s.bubOff=0; s.bubble=null; assign(s); }
    for(const q of pets){ q.phase = "rest"; q.rest = 0.1; q.bubble = null; }
  }
}

/* ---------- 発表会の進行 ---------- */
/* 見出し → 一着ずつランウェイを歩いて並ぶ → 点数 → 合否 → 講評。
   歩く着数で長さが変わるので、区切りの時刻は関数で引く（game/showart.js が同じものを使う） */
const S_TITLE=0.9, S_GOWN=1.5, S_GAP=0.6, S_WALK=1.3;
const SHOW_MAX = 5;                  /* ランウェイに出す最大の着数 */
function showTimes(p){
  const n = p.pool ? p.pool.length : 0;
  const walked = S_GOWN + Math.max(0, n-1)*S_GAP + S_WALK + 0.4;
  return { score: walked, verdict: walked + 1.9, critic: walked + 3.1, end: walked + 6.6 };
}

/* 会場を下見しておくと、その回だけ目標が下がる */
function showNeed(S){ return Math.round(S.need * (1 - showEase)); }
let showWaiting = false;
/* 全員が建物の中にいて、外や階段にいない */
function everyoneIn(){
  if(!staff.length) return true;        /* 誰もいなければ待つ意味がない */
  return staff.every(x => !x.away && !x.arriving && x.gx < GW - 0.2);
}
function runShow(){
  showWaiting = false;
  const S = curShow();                 /* パリのあとは季節の輪（game/economy.js） */
  if(!S) return;
  /* 会場費。払えなければ出られない。ショーは金がかかる、という現実がここに入る */
  if(money < (S.cost||0)){
    fame = Math.max(0, fame-4);
    log("《"+S.name+"》の会場費 "+yen(S.cost)+" が払えず、出られなかった。3週後にもう一度。", true);
    toast("⚠ 会場費が足りない　"+yen(S.cost));
    showDue = dayNo() + 3;
    return;
  }
  money -= (S.cost||0);
  const pool = workList.filter(w => w.week > lastShowWeek);
  pool.sort((a,b)=>b.total-a.total);
  const best = pool[0] || null;
  const score = best ? Math.round(best.total + fame/3) : 0;
  const pass  = !!best && score >= showNeed(S);

  if(pass){
    money += S.prize; fame += 26; fameCap();
    titles.push(S.title);
    const c = mintCard(Object.assign({}, best, { rar:Math.min(5, best.rar+1) }));
    buttons += 5;
    log("《"+S.name+"》に合格。"+yen(S.prize)+"／称号「"+S.title+"」");
    log("楽屋で、記念のボタンを5つ受け取った。");
    if(c) log("記念のカード《"+c.name+"》を手に入れた。");
    showIdx++; lastShowWeek = dayNo();
    if(showIdx < SHOWS.length) showDue = SHOWS[showIdx].w;
    else nextSeasonShow();             /* 終わりではなく、半年ごとの春夏・秋冬へ */
  } else {
    fame = Math.max(0, fame-12);
    for(const s of staff) s.morale = Math.max(0, s.morale-8);
    log(best ? "《"+S.name+"》は届かなかった。"+score+"／"+showNeed(S)
             : "《"+S.name+"》に出す作品がなかった。", true);
    showDue = dayNo() + 5;
  }
  showEase = 0;                 /* 下見の効き目はこの1回だけ */
  if(view !== "room") setView("room");
  /* 今期の作品をランウェイに出す。点の低い順に歩き、いちばんの一着が最後（フィナーレ） */
  const line = pool.slice(0, SHOW_MAX).reverse();
  party = { t:0, kind:"show", show:S, rec:best, pool:line, score, pass, done:false,
            critic: showCritic(S, best, score, pass, line.length) };
  confetti = [];
  gatherEveryone();
}
function spawnConfetti(){
  return { x:VW/2+(Math.random()-.5)*250, y:150+Math.random()*60,
           vx:(Math.random()-.5)*150, vy:-90-Math.random()*130,
           r:Math.random()*6, vr:(Math.random()-.5)*9,
           w:3+Math.random()*4, h:5+Math.random()*5, life:2.6+Math.random()*1.6,
           c:pick(["#ff85ac","#f5b53c","#3fc9ae","#9b86f0","#ffffff","#ff5f8f"]) };
}

/* ==================================================================
   11. 週の処理
   ================================================================== */
/* その人がいま期待する給料。職種の相場 × 職位 × レベル */
function expectedSalary(s){
  return Math.round(ROLES[s.role].sal * gradeOf(s).pay * (1 + (s.lv-1)*SAL_LV));
}
/* 月のなかで3回まわってくる。士気の上下・成長・依頼・相談はここで */
function onTick(){
  fameCap();
  const comfort = furnEff("morale");
  const hard = WORKMODE[workMode].wear;

  for(const s2 of [...staff]){
    /* レベルが上がるほど、本人が期待する給料も上がる。下回ると士気が毎回削れる。
       黙って削れると理由が分からないので、初めて下回ったときに一度だけ口に出す */
    const exp = expectedSalary(s2);
    if(s2.salary < exp*0.85){
      s2.morale -= (2.6+Math.random()*2.0);
      if(s2.askedAt !== s2.lv){
        s2.askedAt = s2.lv;
        say(s2, "…お給料の話、いいですか", true);
        log(s2.name+"が給料の相談をしたそうにしている（Lv."+s2.lv+"の相場は 週"+yen(exp)+"）", true);
      }
    }
    else s2.morale += 0.9;
    if(job && job.kind==="order" && dayNo() > job.due-1) s2.morale -= 1.6*hard;
    s2.morale -= (0.9+Math.random()*1.1) * hard * (1 - Math.min(0.45, careLevel()*0.012));
    s2.morale += comfort*COMFORT_K;
    s2.morale = Math.max(0, Math.min(100, s2.morale));

    if(s2.morale<26 && Math.random()<0.30 && !party) say(s2, pick(TIRED), true);
    if(s2.morale<=5){
      staff = staff.filter(x=>x.id!==s2.id); usedNames.delete(s2.name);
      log(s2.name+"（"+roleTitle(s2)+"）が辞めました。", true);
      toast(s2.name+"が辞めてしまった…");
    } else {
      /* 成長。運まかせにすると同じ職種で3と6に分かれてしまうので、経験を貯めて上げる。
         見回り1回で LV_UP_P × 性格 ぶん貯まり、1になったら1レベル（およそ7週に1つ） */
      s2.xp = (s2.xp||0) + LV_UP_P*temperOf(s2).grow*(0.7+Math.random()*0.6);
      if(s2.xp >= 1 && s2.lv < 9){
        s2.xp -= 1;
        s2.lv = Math.min(9, s2.lv+1); log(s2.name+" が成長（Lv."+s2.lv+"）");
        if(s2.role !== "intern" && s2.grade < 2 && s2.lv >= GRADE[s2.grade].upAt){
          s2.grade++;
          s2.salary = Math.round(s2.salary * 1.32);
          s2.morale = Math.min(100, s2.morale + 14);
          promote(s2);
        }
      }
    }
  }

  /* 人事がいると、手が足りないときに自分で採用する */
  if(hasRole("hr") && auto.hire && staff.length < 7 && money > 140000
     && Math.random() < 0.10){
    const lack = STATS.map(k=>({k, v:teamStat(k)})).sort((a,b)=>a.v-b.v)[0].k;
    const want = { concept:"designer", form:"patterner",
                   material:"textile", tech:"sewer" }[lack];
    if(money >= ROLES[want].hire){
      hire(want);
      log("人事が「"+ROLES[want].short+"が足りていません」と言って採用した。");
    }
  }
  /* 営業がいると、依頼が途切れたときに取ってくる */
  if(hasRole("sales") && auto.order && !offers.length && Math.random() < 0.22){
    const o = newOffer();
    o.reward = Math.round(o.reward * (1 + dealLevel()*0.010));
    offers.push(o);
    log("営業が《"+o.theme+"》の別注を取ってきた（"+o.client+"）");
    toast("💼 営業が仕事を取ってきた");
  }
  /* 営業がいると、受注していないときは自分で受ける */
  if(hasRole("sales") && auto.order && (!job || job.kind === "self") && offers.length){
    const o = offers.slice().sort((a,b)=>b.reward-a.reward)[0];
    accept(o.id);
    log("営業が《"+o.theme+"》を引き受けた。");
  }

  /* 依頼 */
  offers = offers.filter(o => o.quest || dayNo() - o.born <= 4);
  offerT--;
  if(offerT<=0 && offers.length<3){
    const o = newOffer(); offers.push(o);
    offerT = 1+Math.floor(Math.random()*3);
    log("《"+o.theme+"》の別注の相談が来た（"+o.client+"）");
    toast("✉️ "+o.client+" から別注の相談");
  }

  if(ev && staff.indexOf(ev.s) < 0){ ev = null; closeSheet(); }

  /* 来客の出番。就業中に、ひと組ずつ */
  if(storyPend.length && !visitor && !sty && !party && isWorkTime()){
    const sid = storyPend[0];
    if(STORIES[sid]){ storyPend.shift(); spawnVisitor(sid); }
  }
  /* 事件はその場で画面が切りかわる */
  if(storyFlag.fixPend && !sty && !party && !visitor && isWorkTime()){
    storyFlag.fixPend = 0; startFix();
  }
  tryEvent();

}

/* 月が変わったとき。給料はここで払う */
function onMonth(){
  let pay = 0, ot = 0, otWho = [];
  for(const s2 of staff){
    pay += s2.salary;
    const o = overtimePay(s2);
    if(o > 0){ ot += o; otWho.push(s2.name); }
    s2.ot = 0;
  }
  money -= pay + ot;
  log("給料日。"+staff.length+"人に "+yen(pay)+" を払った。");
  if(ot > 0) log("残業代 "+yen(ot)+"（"+otWho.join("・")+"）", true);
  toast("💰 給料日　"+yen(pay + ot));

  /* ラックに掛かった服は、少しずつ売れていく */
  const racks = furniture.filter(o=>o.type==="rack" && o.hung>0);
  if(racks.length && Math.random() < 0.75){
    const r2 = pick(racks);
    const n = Math.min(r2.hung, 1 + (Math.random()<0.3 ? 1 : 0));
    const got = Math.round((8500 + fame*60) * n * (0.85+Math.random()*0.4));
    r2.hung -= n; if(r2.colors) r2.colors.splice(0, n);
    money += got;
    log("ラックから"+n+"着が売れた（"+yen(got)+"）");
  }

  /* 金の糸巻き。持っているぶんだけ、毎週みんなが元気になる */
  { const spool = charms.filter(c=>c.perm==="spool").length;
    if(spool) for(const s2 of staff) s2.morale = Math.min(100, s2.morale + 4*spool); }

  /* ---- 話の予定 ---- */
  if(month === 2 && !storyFlag.gigi1 && storyPend.indexOf("gigi1") < 0)
    storyPend.push("gigi1");
  if(month >= 4 && !storyFlag.rei1 && !quest && storyPend.indexOf("rei1") < 0
     && (!storyFlag.reiAgain || month >= storyFlag.reiAgain))
    storyPend.push("rei1");
  /* ミシン。壊れたままなら部品が届いて直る。直っていれば、たまに壊れる */
  if(machineDown){
    machineDown = false;
    log("部品が届いて、ミシンが直った。");
    toast("🔧 ミシンが直った");
  } else if(month >= 5 && Math.random() < 0.16
     && (!storyFlag.fixAt || month - storyFlag.fixAt >= 8)
     && furniture.some(f=>f.type==="sewing") && staff.some(x=>x.role==="sewer")){
    storyFlag.fixAt = month; storyFlag.fixPend = 1;
  }
  /* 約束の期限 */
  if(quest && !quest.done && dayNo() > quest.due){
    quest = null;
    offers = offers.filter(o=>!o.quest);
    if(job && job.quest) job.quest = null;

  if(curShow() && dayNo() >= showDue && !party){

        (S.cost ? "会場費 "+yen(S.cost)+" が要ります。" : ""), !!(S.cost && money < S.cost));

function stageRush(){

function stageDuty(s){
  if(typeof job === "undefined" || !job || party || s.away || s.onBreak) return null;
  const st = STAGES[stageOf()];
  if(s.role === st.role || s.role === "intern") return st;
  if(MAKERS.indexOf(s.role) < 0 || !stageRush()) return null;
  /* 小さなアトリエで2人も寄ると、現場が人で埋まって何も見えない。
     6人以上いるときだけ2人まで */
  const cap = presentStaff().length >= 6 ? 2 : 1;

  for(const o of staff) if(o !== s && o.helping && !o.away && !o.onBreak) help++;
  return help < cap ? st : null;

const BOUNCE_MSG = [

      /* 選んだ生地・型の相性（designMul）も効く。難しい生地は縫製で戻りやすい */
      const risk = Math.max(0.04, 0.40 - teamStat(st.stat)*designMul(st.stat)*staffMul(st.stat)*0.010) * WORKMODE[workMode].bounce;

      }

/* t は一日のうちの位置（0=0時, 0.25=6時, 0.5=12時, 0.75=18時） */
const DAY = [
  {t:0.00, a:"#3e3760", b:"#251f3c", tint:"42,36,64",    amt:0.00, night:1.00},  //  0時
  {t:0.20, a:"#5b4a70", b:"#3a2f52", tint:"48,40,72",    amt:0.00, night:0.80},  //  5時
  {t:0.27, a:"#ffdcc2", b:"#f6b8a4", tint:"255,178,124", amt:0.18, night:0.20},  //  6.5時
  {t:0.38, a:"#fdf1e4", b:"#f7e3d6", tint:"255,255,255", amt:0.00, night:0.00},  //  9時
  {t:0.62, a:"#fdf1e4", b:"#f7e3d6", tint:"255,255,255", amt:0.00, night:0.00},  // 15時
  {t:0.74, a:"#ffd9bd", b:"#f0ac9c", tint:"255,140,80",  amt:0.22, night:0.18},  // 17.8時
  {t:0.82, a:"#7a5e80", b:"#4a3a5e", tint:"70,54,96",    amt:0.00, night:0.62},  // 19.7時
  {t:0.90, a:"#3e3760", b:"#251f3c", tint:"42,36,64",    amt:0.00, night:1.00},  // 21.6時
  {t:1.00, a:"#3e3760", b:"#251f3c", tint:"42,36,64",    amt:0.00, night:1.00},
];
function dayT_(){ return hourOf()/24; }
function dayMix(){
  const dayT = dayT_();
  let i = 0; while(i+1<DAY.length-1 && dayT>=DAY[i+1].t) i++;
  const a = DAY[i], b = DAY[i+1];
  const k = Math.max(0, Math.min(1, (dayT-a.t)/(b.t-a.t)));
  const lerpC = (p,q)=>{
    const P=parseInt(p.slice(1),16), Q=parseInt(q.slice(1),16);
    const m=j=>Math.round((((P>>j)&255)*(1-k))+(((Q>>j)&255)*k));
    return "rgb("+m(16)+","+m(8)+","+m(0)+")";
  };
  const t1 = a.tint.split(",").map(Number), t2 = b.tint.split(",").map(Number);
  return { a:lerpC(a.a,b.a), b:lerpC(a.b,b.b),
           tint:t1.map((v,j)=>Math.round(v*(1-k)+t2[j]*k)).join(","),
           amt:a.amt*(1-k)+b.amt*k, night:a.night*(1-k)+b.night*k };
}
function nightAmount(){ return dayMix().night; }
const TODICON = () => { const p2 = partOfDay();
  return p2==="朝" ? "🌅" : p2==="昼" ? "☀️" : p2==="夕" ? "🌇" : "🌙"; };

/* ==================================================================
   14.5 出入り口。右手前の辺の真ん中に置く。

   左の壁にあった扉は、画面座標に直すと横位置が約1px ―― キャンバスの
   左端に貼りついていて、部屋を広げるほど見切れていた。
   壁のない右手前の辺なら何にも隠れない、というのが移した理由。

   "gate"   … 【採用】腰高のそで壁＋ガラスの引き戸＋外へ伸びる道。枠なし
   "framed" … それに柱とまぐさを足したもの（必要になったら切り替える）
   "path"   … 壁も扉も置かず、踏み台と道だけ
   "wall"   … 昔の左の壁の扉。見切れない奥へ移してある
   ================================================================== */
let doorStyle = "gate";

const GATE_W = 1.8;                       /* 開口の幅 */
const GATE_H = 46;                        /* そで壁の高さ。腰の高さ */
const WALLDOOR_GY = 1.15;                 /* "wall" のときの扉の位置 */

function gateSpan(){ const c = GD/2; return [c - GATE_W/2, c + GATE_W/2]; }

/* ---- 出入りの経路 ----
   route は [gx, gy, gz] の並び。踏み台と階段の高さをそのままなぞる。
   drawPathOut() の段の高さと合わせてあるので、片方を直したら両方直すこと。 */
const COMMUTE = 1.6;                 /* 通勤中だけ速く歩く。2倍は速すぎた */
function outRoute(){                 /* 中 → 外。下りていく */
  const c = GD/2, X = GW;
  return [ [X-0.42, c, 0], [X+0.36, c, 0], [X+0.95, c, -7],
           [X+1.33, c, -14], [X+1.70, c, -21], [X+2.34, c, -30] ];
}
function inRoute(){                  /* 外 → 中。上がってくる */
  const c = GD/2, X = GW;
  return [ [X+1.70, c, -21], [X+1.33, c, -14], [X+0.95, c, -7],
           [X+0.36, c, 0], [X-0.52, c, 0] ];
}
function nextLeg(s){
  const w = s.route.shift();
  s.g0z = s.gz || 0;
  s.legLen = Math.max(0.02, Math.hypot(w[0]-s.gx, w[1]-s.gy));
  s.tx = w[0]; s.ty = w[1]; s.tz = w[2] || 0;
}
/* 外の階段から上がってきて、持ち場につく */
function arriveThroughDoor(s, greet){
  s.gz = 0; s.tz = null; s.route = null; s.hurry = COMMUTE;
  const d = doorPos();
  if(doorStyle === "wall"){ s.gx = d.gx; s.gy = d.gy; assign(s); }
  else {
    /* 何人も同時に来ると入り口で団子になるので、道の上に並ばせる */
    const q = staff.filter(x => x.arriving).length;
    s.gx = GW + 2.34 + q*0.66; s.gy = GD/2; s.gz = -30 - q*2.5;
    s.route = inRoute(); s.arriving = true; s.phase = "walk";
    nextLeg(s);
  }
  if(greet && Math.random() < 0.75) say(s, pick(greet));
}

/* 人が出入りする地点 */
function doorPos(){
  if(doorStyle === "wall") return { gx:0.28, gy:WALLDOOR_GY };
  return { gx:GW - 0.55, gy:GD/2 };
}
/* ここには什器を置けない */
function atDoorway(x, y, w, d){
  if(doorStyle === "wall")
    return x < 1.05 && y < WALLDOOR_GY + 0.75 && y + d > WALLDOOR_GY - 0.75;
  const [a, b] = gateSpan();
  return x + w > GW - 1.05 && y < b + 0.25 && y + d > a - 0.25;
}

/* ---------- 左の壁の扉（"wall" のとき） ---------- */
function drawWallDoor(){
  const y0 = WALLDOOR_GY - 0.55, y1 = WALLDOOR_GY + 0.55;
  const nt = nightAmount();
  poly([iso(0,y0,66), iso(0,y1,66), iso(0,y1,0), iso(0,y0,0)], "#8a6a4a");
  poly([iso(0,y0+.08,60), iso(0,y1-.08,60), iso(0,y1-.08,0), iso(0,y0+.08,0)], "#4a3a3e");
  poly([iso(0,y0+.14,56), iso(0,y0+.52,56), iso(0,y0+.52,0), iso(0,y0+.14,0)],
       nt>0.4 ? "#2e2634" : "#6f5a52");
  const h2 = iso(0, y1-0.22, 26);
  ctx.fillStyle = "#d9c48a";
  ctx.beginPath(); ctx.arc(h2.x, h2.y, 1.8, 0, 6.2832); ctx.fill();
  poly([iso(0,y0+.12,66), iso(0,y1-.12,66), iso(0,y1-.12,58), iso(0,y0+.12,58)],
       nt>0.4 ? "#5a4a6a" : "#cfe0e8");
}

/* ---------- 右手前の辺の出入り口（"gate" と "path"） ---------- */
function glassPanel(a, b, z0, z1, alpha){
  const X = GW;
  poly([iso(X,a,z1), iso(X,b,z1), iso(X,b,z0), iso(X,a,z0)],
       "rgba(202,226,238,"+alpha+")");
  /* 桟。これがないとガラスに見えない */
  ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1.3;
  const c1 = iso(X,a,z1), c2 = iso(X,b,z1), c3 = iso(X,b,z0), c4 = iso(X,a,z0);
  ctx.beginPath(); ctx.moveTo(c1.x,c1.y); ctx.lineTo(c2.x,c2.y);
  ctx.lineTo(c3.x,c3.y); ctx.lineTo(c4.x,c4.y); ctx.closePath(); ctx.stroke();
  const m = (a+b)/2, mz = (z0+z1)/2;
  const p1 = iso(X,a,mz), p2 = iso(X,b,mz);
  ctx.strokeStyle = "rgba(255,255,255,.34)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  /* 光の反射をひとすじ */
  const g1 = iso(X, a+0.12, z1-6), g2 = iso(X, a+0.5, z0+10);
  ctx.strokeStyle = "rgba(255,255,255,.30)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(g1.x,g1.y); ctx.lineTo(g2.x,g2.y); ctx.stroke();
}

function drawFloor(){
  const T = D();
  for(let gy=0; gy<GD; gy++)
    for(let gx=0; gx<GW; gx++)
      poly([iso(gx,gy),iso(gx+1,gy),iso(gx+1,gy+1),iso(gx,gy+1)],
           (gx+gy)%2 ? T.floor[0] : T.floor[1]);
  poly([iso(2.6,2.2),iso(5.6,2.2),iso(5.6,4.2),iso(2.6,4.2)], T.rug[0]);
  poly([iso(2.9,2.45),iso(5.3,2.45),iso(5.3,3.95),iso(2.9,3.95)], T.rug[1]);
}
const WINDOWS = [[1.3,3.3],[4.6,6.9]];
function drawWalls(){
  const H = WALLH, T = D();
  poly([iso(0,0,H), iso(GW,0,H), iso(GW,0,0), iso(0,0,0)], T.wall);
  poly([iso(0,0,H), iso(0,GD,H), iso(0,GD,0), iso(0,0,0)], T.wall2);
  poly([iso(0,0,10), iso(GW,0,10), iso(GW,0,0), iso(0,0,0)], T.skirt[0]);
  poly([iso(0,0,10), iso(0,GD,10), iso(0,GD,0), iso(0,0,0)], T.skirt[1]);

  const nt = nightAmount();
  const glass = nt>0.5 ? "#2f3a58" : nt>0.2 ? "#e2b48f" : "#b7dcea";
  const sky   = nt>0.5 ? "#3d4a6e" : nt>0.2 ? "#f0c9a2" : "#cbe7f1";
  for(const [x0,x1] of WINDOWS){
    poly([iso(x0,0,H-22), iso(x1,0,H-22), iso(x1,0,44), iso(x0,0,44)], glass);
    poly([iso(x0+.1,0,H-40), iso(x1-.1,0,H-40), iso(x1-.1,0,H-60), iso(x0+.1,0,H-60)], sky);
    poly([iso(x0,0,H-22), iso(x1,0,H-22), iso(x1,0,H-30), iso(x0,0,H-30)], T.wall);
    poly([iso(x0,0,52), iso(x1,0,52), iso(x1,0,44), iso(x0,0,44)], T.wall);
    const mid=(x0+x1)/2;
    poly([iso(mid-.05,0,H-26), iso(mid+.05,0,H-26), iso(mid+.05,0,48), iso(mid-.05,0,48)], T.wall);
  }
  /* 出入り口。左の壁に立てるのは "wall" のときだけ */
  if(doorStyle === "wall") drawWallDoor();

  /* コルクボード。扉を奥へ移した案では、ぶつからないよう手前へずらす */
  { const cb = doorStyle === "wall" ? 2.4 : 1.4;
    poly([iso(0,cb,120), iso(0,cb+2.0,120), iso(0,cb+2.0,70), iso(0,cb,70)], "#d4ab77");
    const notes = ["#ff9fb8","#ffd86b","#8ee0cf","#b9a8f5","#ffb38a"];

      poly([iso(0,y,z), iso(0,y+.42,z), iso(0,y+.42,z-18), iso(0,y,z-18)], notes[i]);
    } }
  /* 壁に貼ったもの */
  /* 壁もの：姿を影の色に染めて右下へ 1.6px ずらして敷いてから、本物を描く（C2） */
  for(const f of furniture) if(FURN[f.type].cat==="wall") drawWallShadowed(() => drawFurniture(f));
}
/* 窓からの光。一枚を濃く敷くと床の市松が白く飛び、そこに立った人の
   シルエットまで背景に溶けた（先生の指摘 2026-09-14「窓からの光も強すぎる
   のかもしれません」。同じ理由で、ミシンの形も読み取れなくなっていた）。
   そこで **面で2段** にする——帯ぜんたいを薄く、窓ぎわ 1.3マスだけもう一段。
   量は半分以下になるが、窓から入って奥へ届く向きは残る。
   グラデーションは使わない（ART.md 4章）。スタンド照明の光だまりと同じ作り。 */
function drawSunlight(){
  const nt = nightAmount();
  if(nt > 0.55) return;
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const a = (0.08*(1-nt));
  for(const [x0,x1] of WINDOWS){
    poly([iso(x0+0.5,0.05), iso(x1+0.5,0.05), iso(x1+2.1,2.6), iso(x0+2.1,2.6)],
         "rgba(255,231,168,"+a+")");
    poly([iso(x0+0.5,0.05), iso(x1+0.5,0.05), iso(x1+1.3,1.3), iso(x0+1.3,1.3)],
         "rgba(255,231,168,"+a+")");
  }

}
/* 什器の接地の影。C2（06 内装、先生の判断 2026-08-17）：
   足もとにぴったり沿う 1 枚だけ、実際に接地している所、落ち影は伸ばさない。中身は room/shadow.js */
function drawDropShadow(f){ drawFootShadow(f); }
/* 床の光だまり。面で2段（外の輪・内の輪）。グラデーションは使わない（ART.md 4章）。
   試作Aと同じく、夜の色にした床の上に screen で置く。値も試作Aと同じ。
   床の形で切り取る（壁の下へはみ出させない） */
function lightPool(gx, gy, r, col, a){
  const ring = rr => { const p=[]; for(let i=0;i<12;i++){ const q=i*Math.PI/6;
    p.push(iso(gx+Math.cos(q)*rr, gy+Math.sin(q)*rr, 0)); } return p; };
  ctx.save();
  ctx.beginPath(); const F=[iso(0,0),iso(GW,0),iso(GW,GD),iso(0,GD)];
  ctx.moveTo(F[0].x,F[0].y); for(let i=1;i<4;i++) ctx.lineTo(F[i].x,F[i].y); ctx.closePath(); ctx.clip();
  ctx.globalCompositeOperation = "screen";
  poly(ring(r),   "rgba("+col+","+a+")");
  poly(ring(r*.52), "rgba("+col+","+a+")");
  ctx.restore();
}
/* 壁ぎわの明かり：壁の面に光を1枚（2段）。wall "left"＝gx=0 の壁、"back"＝gy=0 の壁 */
function wallLight(wall, u, z, half, col, a){
  const P = (uu, zz) => wall === "left" ? iso(0, uu, zz) : iso(uu, 0, zz);
  ctx.save(); ctx.globalCompositeOperation = "screen";
  for(const k of [1, .55]){
    const h = half*k, lo = Math.max(0, u-h), hi = Math.min(wall==="left" ? GD : GW, u+h);
    /* 上がすぼまった台形（かさから下へ広がる光） */
    const mid = (lo+hi)/2, w2 = (hi-lo)/2;
    poly([P(lo, z-18*k), P(hi, z-18*k), P(mid+w2*.45, z+22*k), P(mid-w2*.45, z+22*k)], "rgba("+col+","+a+")");
  }
  ctx.restore();
}
/* 天井のあかり。夜になると点く。stage "floor"＝床の光だまり（什器より先に描く）
   stage "fixture"＝器そのもの（白い台形＋光の色の三角＋吊りの棒。まわりに光の面は置かない：什器にかぶる）
   stage "fixture" は暗さを重ねたあとに呼ぶ（点いている物は暗くしない） */
function drawCeilingLight(stage){
  const nt = nightAmount();
  if(nt < 0.12) return;
  const cx = GW/2, cy = GD/2, r = Math.min(GW,GD)*0.46;
  /* 光だまりは床にだけ。什器・人の上にはかけない（ART.md 4章）。暗さの重ねに負けないよう床の段を強く */
  if(stage === "floor"){ lightPool(cx, cy, r, "255,207,138", (0.14*nt).toFixed(3)); return; }
  /* 器は試作Aと同じ大きさ・位置（天井に付けて小さく、さりげなく）。暗さを重ねたあとに描くので暗くならない */
  const l = iso(cx, cy, WALLH-8);
  poly([{x:l.x-.6,y:l.y-7},{x:l.x+.6,y:l.y-7},{x:l.x+.6,y:l.y-40},{x:l.x-.6,y:l.y-40}], "#3a3340");
  poly([{x:l.x-9,y:l.y},{x:l.x+9,y:l.y},{x:l.x+5,y:l.y-7},{x:l.x-5,y:l.y-7}], "#f4e6c8");
  poly([{x:l.x-9,y:l.y},{x:l.x+9,y:l.y},{x:l.x,y:l.y+2.5}], "#ffcf8a");
}
/* スタンド照明の光だまり（床に、面2段）。ネオンは壁の光を面1枚で */
function drawLampGlow(){
  const nt = nightAmount();
  if(nt < 0.12) return;
  for(const f of furniture){
    if(f.type==="lamp"){
      const lx = f.x+.3, ly = f.y+.3, a = (0.16*nt).toFixed(3);
      lightPool(lx, ly, 1.1, "255,226,150", a);
      /* 壁ぎわなら、壁にも光が当たる */
      if(ly < 0.9) wallLight("back", lx, 44, 0.9, "255,226,150", (0.10*nt).toFixed(3));
      if(lx < 0.9) wallLight("left", ly, 44, 0.9, "255,226,150", (0.10*nt).toFixed(3));
    }
    else if(f.type==="neon"){
      const p = f.wall==="back" ? iso(f.u+.65,0,f.z-13) : iso(0,f.u+.65,f.z-13);
      ctx.save(); ctx.globalCompositeOperation = "screen";
      const pts=[]; for(let i=0;i<8;i++){ const q=i*Math.PI/4; pts.push({x:p.x+Math.cos(q)*30, y:p.y+Math.sin(q)*22}); }
      poly(pts, "rgba(255,120,180,"+(0.14*nt).toFixed(3)+")");
      ctx.restore();
    }
  }
}

/* 人はここでは描かない。絵の中身は src/staff/person.js（pxPerson）にある。

function drawPerson(s){

  const r = ROLES[s.role] || NPCROLE[s.role], a = s.appear;
  const res = pxPerson(ctx, a, {

    phase: s.phase, station: s.station && s.station.type,
    t: s.t, flip: s.flip, mug: s.mug,
  }, p.x, p.y, PXU);

  /* 話しかけられる人の頭の上に出る「！」 */
  if(ev && ev.s === s){

    ctx.fillStyle = "#ff6b8f";

    ctx.fillStyle = "#fff";
    ctx.font = "800 10px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("!", p.x, by+10.5); ctx.textAlign = "start";
  }
  /* アイロンと染めの湯気。これだけは什器の位置から出す */
  if(res.steam && s.station){
    const q = iso(s.station.x+1.05, s.station.y+0.3, 34);
    ctx.fillStyle = "rgba(255,255,255,.42)";
    for(let i=0;i<3;i++){
      const k = (s.t*0.7+i*0.33)%1;
      ctx.beginPath(); ctx.ellipse(q.x+k*5, q.y-k*13, 3.2*(1-k*0.4), 1.9*(1-k*0.4), 0, 0, 6.2832);
      ctx.fill();
    }
  }
}
function petShadow(p, w){
  ctx.fillStyle = "rgba(90,60,80,.16)";
  ctx.beginPath(); ctx.ellipse(p.x, p.y, w, w*0.46, 0, 0, 6.2832); ctx.fill();
}
function eyes(hx, hy, r, sleep, col, gap, hl){
  if(sleep){
    ctx.strokeStyle = col; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.arc(hx-gap, hy+0.4, r*1.4, 0.2, Math.PI-0.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx+gap, hy+0.4, r*1.4, 0.2, Math.PI-0.2); ctx.stroke();
  } else {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(hx-gap, hy, r, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+gap, hy, r, 0, 6.2832); ctx.fill();
    if(hl){
      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.beginPath(); ctx.arc(hx-gap+r*0.34, hy-r*0.36, r*0.36, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(hx+gap+r*0.34, hy-r*0.36, r*0.36, 0, 6.2832); ctx.fill();
    }
  }
}

/* --- 三毛猫。長い尾がゆれ、ひげがある --- */
function drawCat(c){
  const p = iso(c.gx, c.gy, 0), sleep = c.phase==="rest";
  const y = p.y - (c.phase==="walk" ? Math.sin(c.t*11)*0.9 : Math.sin(c.t*1.6)*0.5);
  const fl = c.flip, body = "#f4ecdd", patch = "#d8a86c", dark = "#5a4a44";
  petShadow(p, 11);
  /* 尾。先が細く、ゆれる */
  ctx.strokeStyle = shade(body,.92); ctx.lineWidth = 3.4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(p.x-7*fl, y-6);
  ctx.quadraticCurveTo(p.x-15*fl, y-10+Math.sin(c.t*3)*3, p.x-13*fl, y-19+Math.sin(c.t*3)*2);
  ctx.stroke();
  ctx.strokeStyle = patch; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(p.x-12.4*fl, y-14+Math.sin(c.t*3)*2.6);
  ctx.lineTo(p.x-13*fl, y-19+Math.sin(c.t*3)*2); ctx.stroke();
  /* 胴。上面は明るく、腹へ沈む */
  const bh = sleep ? 4 : 7;
  { const g2 = ctx.createLinearGradient(0, y-bh-7, 0, y-bh+7);
    g2.addColorStop(0, "#fbf6ec"); g2.addColorStop(0.6, body); g2.addColorStop(1, shade(body,.82));
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.ellipse(p.x, y-bh, 9.8, sleep?5:6.4, 0, 0, 6.2832); ctx.fill(); }
  /* ぶち：茶とこげ茶 */
  ctx.fillStyle = patch;
  ctx.beginPath(); ctx.ellipse(p.x-3.4*fl, y-bh-2, 4, 2.8, 0.3*fl, 0, 6.2832); ctx.fill();
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(p.x+1.4*fl, y-bh-3.4, 2.4, 1.6, -0.4*fl, 0, 6.2832); ctx.fill();
  /* 脚（歩くとき） */
  if(!sleep){ ctx.fillStyle = shade(body,.9);
    ctx.fillRect(p.x-5, y-4, 2.8, 4.4); ctx.fillRect(p.x+2.4, y-4, 2.8, 4.4);
    ctx.fillStyle = "rgba(0,0,0,.08)"; ctx.fillRect(p.x-5, y-1, 2.8, 1.2); ctx.fillRect(p.x+2.4, y-1, 2.8, 1.2); }
  /* 頭 */
  const hx = p.x+7.5*fl, hy = y-bh-(sleep?2:6);
  ctx.fillStyle = body;
  /* 耳：外は体色、内側はピンク */
  for(const s of [-1,1]){
    ctx.fillStyle = s*fl<0 ? patch : body;
    ctx.beginPath(); ctx.moveTo(hx+s*4.8,hy-2.2); ctx.lineTo(hx+s*2.4,hy-8.6); ctx.lineTo(hx+s*0.4,hy-3.0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f2b8c4";
    ctx.beginPath(); ctx.moveTo(hx+s*3.8,hy-2.6); ctx.lineTo(hx+s*2.5,hy-6.6); ctx.lineTo(hx+s*1.2,hy-3.2); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(hx, hy, 6.4, 5.8, 0, 0, 6.2832); ctx.fill();
  /* 頭のぶち */
  ctx.fillStyle = patch;
  ctx.beginPath(); ctx.ellipse(hx-2.6*fl, hy-3.2, 3, 2.2, 0.4*fl, 0, 6.2832); ctx.fill();
  /* 目：アーモンド形に縦の瞳 */
  if(sleep){
    ctx.strokeStyle = "#4a3b32"; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.arc(hx-2.4, hy+0.2, 1.6, 0.2, Math.PI-0.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx+2.4, hy+0.2, 1.6, 0.2, Math.PI-0.2); ctx.stroke();
  } else {
    for(const s of [-1,1]){
      ctx.fillStyle = "#9cc48e";
      ctx.beginPath(); ctx.ellipse(hx+s*2.4, hy-0.2, 1.5, 1.2, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "#2c2622";
      ctx.beginPath(); ctx.ellipse(hx+s*2.4, hy-0.2, 0.55, 1.1, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.beginPath(); ctx.arc(hx+s*2.4-0.5, hy-0.7, 0.4, 0, 6.2832); ctx.fill();
    }
  }
  /* 鼻・口・ひげ */
  ctx.fillStyle = "#e58fa4";
  ctx.beginPath(); ctx.moveTo(hx-1.2,hy+2); ctx.lineTo(hx+1.2,hy+2); ctx.lineTo(hx,hy+3.2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(60,45,40,.55)"; ctx.lineWidth = .7;
  ctx.beginPath(); ctx.moveTo(hx,hy+3.2); ctx.lineTo(hx,hy+3.9);
  ctx.moveTo(hx,hy+3.9); ctx.quadraticCurveTo(hx-1.4,hy+4.6,hx-2.2,hy+3.8);
  ctx.moveTo(hx,hy+3.9); ctx.quadraticCurveTo(hx+1.4,hy+4.6,hx+2.2,hy+3.8); ctx.stroke();
  ctx.strokeStyle = "rgba(60,45,40,.4)"; ctx.lineWidth = .6;
  for(const s of [-1,1]) for(let k=0;k<3;k++){
    ctx.beginPath(); ctx.moveTo(hx+s*3, hy+2.2+k*0.9); ctx.lineTo(hx+s*9, hy+1.2+k*1.6); ctx.stroke(); }
}

/* --- 黒パグ。ずんぐりした胴、大きな丸い頭、垂れ耳、平たいマズル、くるんとした尾 --- */
function drawPug(c){
  const p = iso(c.gx, c.gy, 0);
  const rest  = c.phase === "rest";
  const front = rest && c.sitFront;          /* 座ってこちらを見ている */
  const sleep = rest && !c.sitFront;
  const y = p.y - (c.phase==="walk" ? Math.abs(Math.sin(c.t*8))*1.1 : Math.sin(c.t*1.1)*0.4);
  const fl = c.flip;
  /* 黒でも真っ黒にしない。中間の濃さを地にして、耳と口まわりを一段濃く。
     明るい輪郭線は引かない（ヘッドバンドに見える）。濃さの差だけで形を作る */
  const B="#5d5569", LEG="#4b4457", EAR="#2b2434", EARIN="#3b3347",
        MUZ="#2a2333", NOSE="#08060b", TOP="rgba(255,244,236,.26)",
        LINE="rgba(255,240,230,.34)";

  /* ---- 垂れ耳 ----
     三角形であることが命。丸めるのは根もとの立ち上がりだけにして、
     外辺は先端まで直線、先端はとがらせて下へ垂らす */
  const ears = (hx, hy, R)=>{
    for(const t of [-1, 1]){
      const ax = hx+2.2*t,           ay = hy-R*0.94;   /* 根もと。輪郭の少し上 */
      const bx = hx+(R+2.2)*t,       by = hy-R*0.50;   /* 折り目の外はし */
      const cx2 = hx+(R*0.52+1.6)*t, cy2 = hy+R*0.52;  /* 下に垂れた、とがった先端 */
      ctx.fillStyle = EAR;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.quadraticCurveTo(hx+R*0.78*t, hy-R*1.08, bx, by);   /* 上辺。根もとが立つ */
      ctx.lineTo(cx2, cy2);                                   /* 外辺は直線で先端へ */
      ctx.quadraticCurveTo(hx+R*0.42*t, hy-R*0.10, ax, ay);   /* 内辺は頭に沿わせる */
      ctx.closePath(); ctx.fill();
      /* 内側の一段明るい面。三角のまま一回り小さく */
      ctx.fillStyle = EARIN;
      ctx.beginPath();
      ctx.moveTo(hx+3.4*t, hy-R*0.68);
      ctx.lineTo(hx+(R+0.7)*t, hy-R*0.40);
      ctx.lineTo(hx+(R*0.52+0.9)*t, hy+R*0.30);
      ctx.quadraticCurveTo(hx+R*0.44*t, hy-R*0.12, hx+3.4*t, hy-R*0.68);
      ctx.closePath(); ctx.fill();
    }
  };
  /* ---- 巻きじっぽ。渦巻きの面で描く。パグの記号なので隠さない ---- */
  const tailCurl = (tx, ty, r)=>{
    ctx.fillStyle = "#6c637b";
    ctx.beginPath(); ctx.arc(tx, ty, r, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "rgba(255,240,228,.32)"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(tx, ty, r-0.6, Math.PI*1.08, Math.PI*1.92); ctx.stroke();
    ctx.strokeStyle = "#453e51"; ctx.lineWidth = 1.3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(tx, ty, r*0.62, 0.6, 5.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(tx+0.3, ty+0.2, r*0.28, 0.4, 5.2); ctx.stroke();
  };
  const headBase = (hx, hy, R)=>{
    ctx.fillStyle = B;
    ctx.beginPath(); ctx.arc(hx, hy, R, 0, 6.2832); ctx.fill();
    const gd = ctx.createLinearGradient(0, hy-R, 0, hy+R*0.4);
    gd.addColorStop(0, TOP); gd.addColorStop(1, "rgba(255,244,236,0)");
    ctx.fillStyle = gd;
    ctx.beginPath(); ctx.arc(hx, hy, R, 0, 6.2832); ctx.fill();
  };
  /* ---- 顔。横向きでも正面でも同じ ---- */
  const face = (hx, hy)=>{
    /* 口まわりのたるみ。左右のほおを先に、まんなかのマズルをあとに重ねる */
    ctx.fillStyle = MUZ;
    for(const t of [-1, 1]){
      ctx.beginPath(); ctx.ellipse(hx+3.9*t, hy+5.0, 3.1, 3.3, 0, 0, 6.2832); ctx.fill();
    }
    ctx.beginPath(); ctx.ellipse(hx, hy+4.4, 5.3, 3.9, 0, 0, 6.2832); ctx.fill();
    /* 鼻。上が広い */
    ctx.fillStyle = NOSE;
    ctx.beginPath();
    ctx.moveTo(hx-2.5, hy+2.4);
    ctx.quadraticCurveTo(hx, hy+1.5, hx+2.5, hy+2.4);
    ctx.quadraticCurveTo(hx+2.0, hy+4.2, hx, hy+4.2);
    ctx.quadraticCurveTo(hx-2.0, hy+4.2, hx-2.5, hy+2.4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.beginPath(); ctx.arc(hx-0.9, hy+2.5, 0.55, 0, 6.2832); ctx.fill();
    /* たるみの折り目と口。鼻の脇から、ほおの下へ流す */
    ctx.strokeStyle = LINE; ctx.lineWidth = 1.0; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(hx-1.6, hy+4.5); ctx.quadraticCurveTo(hx-3.3, hy+6.3, hx-4.7, hy+6.0);
    ctx.moveTo(hx+1.6, hy+4.5); ctx.quadraticCurveTo(hx+3.3, hy+6.3, hx+4.7, hy+6.0);
    ctx.moveTo(hx, hy+4.3); ctx.lineTo(hx, hy+5.3);
    ctx.stroke();
    if(!sleep){
      ctx.fillStyle = "#e8899e";
      ctx.beginPath(); ctx.roundRect(hx-1.2, hy+5.4, 2.4, 2.8, 1.2); ctx.fill();
    }
    /* 額のしわ */
    ctx.globalAlpha = .6;
    ctx.beginPath(); ctx.arc(hx, hy-1.0, 5.2, Math.PI*1.22, Math.PI*1.78); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx, hy-2.9, 3.8, Math.PI*1.26, Math.PI*1.74); ctx.stroke();
    ctx.globalAlpha = 1;
    /* 目。明るい縁は引かない。濃い楕円と、大きなハイライトだけ */
    for(const t of [-1, 1]){
      const ex = hx+4.2*t, r = 2.8, ry = r*0.88;
      ctx.fillStyle = "rgba(255,240,228,.13)";
      ctx.beginPath(); ctx.ellipse(ex, hy-1.0, r*1.7, ry*1.65, 0, 0, 6.2832); ctx.fill();
      if(sleep){
        ctx.strokeStyle = LINE; ctx.lineWidth = 1.1; ctx.globalAlpha = .75;
        ctx.beginPath(); ctx.arc(ex, hy-0.9, r*0.82, 0.34, Math.PI-0.34); ctx.stroke();
        ctx.globalAlpha = 1; continue;
      }
      ctx.fillStyle = "#100b0d";
      ctx.beginPath(); ctx.ellipse(ex, hy-1.1, r, ry, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.beginPath(); ctx.arc(ex+r*0.32, hy-1.1-ry*0.30, r*0.36, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.34)";
      ctx.beginPath(); ctx.arc(ex-r*0.40, hy-1.1+ry*0.40, r*0.18, 0, 6.2832); ctx.fill();
    }
  };

  if(front){
    /* ---- 座って、こちらを見る ---- */
    petShadow(p, 11);
    ctx.fillStyle = LEG;                                  /* 後ろ足 */
    for(const t of [-1, 1]){
      ctx.beginPath(); ctx.ellipse(p.x+7.2*t, y-2.8, 3.6, 2.8, 0, 0, 6.2832); ctx.fill();
    }
    ctx.fillStyle = B;                                    /* 胴。下が広い */
    ctx.beginPath();
    ctx.moveTo(p.x-5.8, y-16);
    ctx.quadraticCurveTo(p.x-9.8, y-7.5, p.x-8.5, y-2.2);
    ctx.quadraticCurveTo(p.x, y+1.0, p.x+8.5, y-2.2);
    ctx.quadraticCurveTo(p.x+9.8, y-7.5, p.x+5.8, y-16);
    ctx.closePath(); ctx.fill();
    const gb = ctx.createLinearGradient(0, y-18, 0, y-4);
    gb.addColorStop(0, TOP); gb.addColorStop(1, "rgba(255,244,236,0)");
    ctx.fillStyle = gb; ctx.fill();
    ctx.fillStyle = LEG;                                  /* そろえた前足 */
    for(const t of [-1, 1]){
      ctx.beginPath(); ctx.roundRect(p.x+1.9*t-1.9, y-6.2, 3.8, 6.2, 1.8); ctx.fill();
    }
    /* 巻きじっぽ。正面でも腰の横からのぞく */
    tailCurl(p.x+8.6, y-8.2, 3.5);
    const hx = p.x, hy = y-22.5, R = 9.6;
    headBase(hx, hy, R);
    ears(hx, hy, R);
    face(hx, hy+1.0);
    return;
  }

  /* ---- 横向き（歩く／寝る） ---- */
  petShadow(p, 12.5);
  const bw = 10.2, bh = sleep ? 5.6 : 7.0, cy = y - (sleep ? 6.2 : 9.2);
  /* 短い脚 */
  if(!sleep){
    ctx.fillStyle = LEG;
    for(const dx of [-6.8, -2.4, 2.2, 6.2]){
      ctx.beginPath(); ctx.roundRect(p.x+dx-1.7, y-6.2, 3.4, 6.2, 1.6); ctx.fill();
    }
  }
  /* たる型の胴 */
  ctx.fillStyle = B;
  ctx.beginPath(); ctx.ellipse(p.x-1.2*fl, cy, bw, bh, 0, 0, 6.2832); ctx.fill();
  const gd2 = ctx.createLinearGradient(0, cy-bh, 0, cy+bh*0.4);
  gd2.addColorStop(0, TOP); gd2.addColorStop(1, "rgba(255,244,236,0)");
  ctx.fillStyle = gd2;
  ctx.beginPath(); ctx.ellipse(p.x-1.2*fl, cy, bw, bh, 0, 0, 6.2832); ctx.fill();
  /* 巻きじっぽ。背中の上にのせて、隠さない */
  tailCurl(p.x-(bw-1.8)*fl, cy-bh+1.0, 4.1);

  /* 寝ているときは頭を少し起こし、耳もひかえめにする。
     低くすると耳が横に広がって、こうもりに見えてしまう */
  const hx = p.x+9.6*fl, hy = y-(sleep ? 13 : 16.5), R = sleep ? 8.4 : 9.2;
  headBase(hx, hy, R);
  ears(hx, hy, R);
  face(hx, hy+0.6);
  if(sleep && Math.sin(c.t*1.6)>0.6){
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.font = "700 8px sans-serif"; ctx.textAlign="center";
    ctx.fillText("z", hx+9, hy-9-((c.t*4)%6)); ctx.textAlign="start";
  }
}

/* --- 柴犬。まいた尾、胸の白、たぬき顔の眉斑 --- */
function drawShiba(c){
  const p = iso(c.gx, c.gy, 0), sleep = c.phase==="rest";
  const y = p.y - (c.phase==="walk" ? Math.abs(Math.sin(c.t*12))*1.3 : Math.sin(c.t*1.5)*0.4);
  const fl = c.flip, T = "#dda05a", T2 = "#c98a48", W = "#f9f0e2", DK = "#3b2c22";
  petShadow(p, 11);
  /* まいた尾：面で描く。ふさふさの縁 */
  { const tx = p.x-8.6*fl, ty = y-14 + Math.sin(c.t*6)*0.6;
    ctx.fillStyle = T;
    ctx.beginPath(); ctx.arc(tx, ty, 4.8, 0, 6.2832); ctx.fill();
    ctx.fillStyle = W;
    ctx.beginPath(); ctx.arc(tx-1.2*fl, ty+0.6, 2.4, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = shade(T,.8); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(tx, ty, 4.8, 0.7*fl+0.6, 0.7*fl+3.4); ctx.stroke(); }
  if(!sleep){ ctx.fillStyle = W;
    ctx.fillRect(p.x-6, y-5, 3.2, 5.2); ctx.fillRect(p.x+2.6, y-5, 3.2, 5.2);
    ctx.fillStyle = "rgba(0,0,0,.08)"; ctx.fillRect(p.x-6, y-1.2, 3.2, 1.4); ctx.fillRect(p.x+2.6, y-1.2, 3.2, 1.4); }
  /* 胴：背は濃く、腹は白 */
  { const g2 = ctx.createLinearGradient(0, y-15, 0, y-2);
    g2.addColorStop(0, T2); g2.addColorStop(0.45, T); g2.addColorStop(1, W);
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.ellipse(p.x-0.8*fl, y-8.5, 9.8, sleep?5.2:6.6, 0, 0, 6.2832); ctx.fill(); }
  /* 首輪 */
  ctx.strokeStyle = "#c94f79"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.ellipse(p.x+5.6*fl, y-11, 3.6, 2.2, 0.3*fl, 0, 6.2832); ctx.stroke();
  const hx = p.x+8*fl, hy = y-(sleep?10:13.5);
  /* 立ち耳：内側は薄い色 */
  for(const s of [-1,1]){
    ctx.fillStyle = T2;
    ctx.beginPath(); ctx.moveTo(hx+s*5.6,hy-2.4); ctx.lineTo(hx+s*3.8,hy-9.6); ctx.lineTo(hx+s*1.0,hy-4.0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e9c9a8";
    ctx.beginPath(); ctx.moveTo(hx+s*4.6,hy-2.8); ctx.lineTo(hx+s*3.7,hy-7.6); ctx.lineTo(hx+s*2.0,hy-3.8); ctx.closePath(); ctx.fill();
  }
  /* 頭：上は濃く */
  { const g3 = ctx.createLinearGradient(0, hy-6, 0, hy+6);
    g3.addColorStop(0, T2); g3.addColorStop(0.5, T); g3.addColorStop(1, T);
    ctx.fillStyle = g3;
    ctx.beginPath(); ctx.ellipse(hx, hy, 6.6, 6, 0, 0, 6.2832); ctx.fill(); }
  /* 白いマズル・頬・眉斑 */
  ctx.fillStyle = W;
  ctx.beginPath(); ctx.ellipse(hx, hy+2.8, 4.6, 3.4, 0, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hx-4.6, hy+1.4, 2.0, 1.7, 0, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hx+4.6, hy+1.4, 2.0, 1.7, 0, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hx-3, hy-3, 1.2, 0.8, 0, 0, 6.2832); ctx.fill();   /* 眉斑 */
  ctx.beginPath(); ctx.ellipse(hx+3, hy-3, 1.2, 0.8, 0, 0, 6.2832); ctx.fill();
  /* 鼻と口 */
  ctx.fillStyle = DK;
  ctx.beginPath(); ctx.ellipse(hx, hy+1.6, 1.6, 1.2, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(hx-0.5, hy+1.2, 0.5, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = "rgba(60,45,35,.6)"; ctx.lineWidth = .8;
  ctx.beginPath(); ctx.moveTo(hx,hy+2.8); ctx.lineTo(hx,hy+3.6);
  ctx.moveTo(hx,hy+3.6); ctx.quadraticCurveTo(hx-1.6,hy+4.6,hx-2.6,hy+3.6);
  ctx.moveTo(hx,hy+3.6); ctx.quadraticCurveTo(hx+1.6,hy+4.6,hx+2.6,hy+3.6); ctx.stroke();
  /* 舌（歩いているとき） */
  if(!sleep && c.phase==="walk"){ ctx.fillStyle = "#e58fa4";
    ctx.beginPath(); ctx.ellipse(hx+0.6*fl, hy+4.6, 1.2, 1.5, 0, 0, 6.2832); ctx.fill(); }
  eyes(hx, hy-1.2, 1.3, sleep, DK, 3.0, true);
}

/* --- うさぎ。丸い背中、長い耳、ひげ --- */
function drawRabbit(c){
  const p = iso(c.gx, c.gy, 0), sleep = c.phase==="rest";
  const hop = c.phase==="walk" ? Math.abs(Math.sin(c.t*6))*5 : 0;
  const y = p.y - hop, fl = c.flip, W = "#f7f2ea", G = "#d9d2c8", PK = "#f2c3cd";
  petShadow(p, 9.5);
  /* 尾：ふわふわの丸 */
  ctx.fillStyle = W;
  ctx.beginPath(); ctx.arc(p.x-8.5*fl, y-6, 2.8, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.arc(p.x-9*fl, y-7, 1.2, 0, 6.2832); ctx.fill();
  /* うしろ脚（座りの太もも）と前脚 */
  if(!sleep){ ctx.fillStyle = G;
    ctx.beginPath(); ctx.ellipse(p.x-3.4*fl, y-3.4, 3.4, 2.4, 0, 0, 6.2832); ctx.fill();
    ctx.fillRect(p.x+2*fl-1.4, y-3.6, 3, 3.8); }
  /* 胴：背中は丸く、腹は明るい */
  { const g2 = ctx.createRadialGradient(p.x-1, y-9, 1, p.x, y-6, 10);
    g2.addColorStop(0, "#ffffff"); g2.addColorStop(0.7, W); g2.addColorStop(1, G);
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.ellipse(p.x, y-7, 8.6, sleep?5:6.2, 0, 0, 6.2832); ctx.fill(); }
  const hx = p.x+6.4*fl, hy = y-(sleep?9:12.5);
  /* 長い耳。片方少し傾く。内側のピンク */
  for(const s of [-1,1]){
    const tilt = s*0.22 + Math.sin(c.t*2 + s)*0.06;
    ctx.fillStyle = W;
    ctx.beginPath(); ctx.ellipse(hx+s*2.4, hy-8.6, 2.0, 6.4, tilt, 0, 6.2832); ctx.fill();
    ctx.fillStyle = PK;
    ctx.beginPath(); ctx.ellipse(hx+s*2.4, hy-8.4, 1.0, 4.6, tilt, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.08)"; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.ellipse(hx+s*2.4, hy-8.6, 2.0, 6.4, tilt, 0, 6.2832); ctx.stroke();
  }
  ctx.fillStyle = W;
  ctx.beginPath(); ctx.ellipse(hx, hy, 5.6, 5.2, 0, 0, 6.2832); ctx.fill();
  /* ほっぺ */
  ctx.fillStyle = "rgba(240,160,170,.28)";
  ctx.beginPath(); ctx.arc(hx-3.4, hy+1.6, 1.4, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(hx+3.4, hy+1.6, 1.4, 0, 6.2832); ctx.fill();
  eyes(hx, hy-0.4, 1.3, sleep, "#5b4a44", 2.6, true);
  /* 鼻(Y字)とひげ */
  ctx.fillStyle = "#e58fa4";
  ctx.beginPath(); ctx.ellipse(hx, hy+2.0, 1.1, 0.8, 0, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = "rgba(90,70,70,.5)"; ctx.lineWidth = .6;
  ctx.beginPath(); ctx.moveTo(hx,hy+2.8); ctx.lineTo(hx,hy+3.4);
  ctx.moveTo(hx,hy+3.4); ctx.lineTo(hx-1.4,hy+4); ctx.moveTo(hx,hy+3.4); ctx.lineTo(hx+1.4,hy+4); ctx.stroke();
  for(const s of [-1,1]) for(let k=0;k<2;k++){
    ctx.beginPath(); ctx.moveTo(hx+s*2.4, hy+2+k*1); ctx.lineTo(hx+s*7.4, hy+1.4+k*1.6); ctx.stroke(); }
}

/* --- セキセイインコ。顔の模様、羽の縞、長い尾 --- */
function drawBird(c){
  const p = iso(c.gx, c.gy, 0), sleep = c.phase==="rest";
  const y = p.y - (c.phase==="walk" ? Math.abs(Math.sin(c.t*16))*1.2 : 0);
  const fl = c.flip, G = "#8fd05e", G2 = "#6faa48", Y = "#f4e37a";
  petShadow(p, 7);
  /* 脚 */
  ctx.strokeStyle = "#d9a26a"; ctx.lineWidth = 1.2; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(p.x-1.6, y-3.4); ctx.lineTo(p.x-1.6, y);
  ctx.moveTo(p.x+1.6, y-3.4); ctx.lineTo(p.x+1.6, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.x-3,y); ctx.lineTo(p.x-0.2,y); ctx.moveTo(p.x+0.2,y); ctx.lineTo(p.x+3,y); ctx.stroke();
  /* 尾：長くて先が2段 */
  ctx.fillStyle = "#4f86b8";
  ctx.beginPath(); ctx.moveTo(p.x-4*fl, y-6); ctx.lineTo(p.x-14*fl, y-2.6);
  ctx.lineTo(p.x-13*fl, y-5); ctx.lineTo(p.x-4*fl, y-9.4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#3f6f9c";
  ctx.beginPath(); ctx.moveTo(p.x-6*fl, y-6.4); ctx.lineTo(p.x-14*fl, y-2.6); ctx.lineTo(p.x-12*fl, y-6.6); ctx.closePath(); ctx.fill();
  /* 胴：胸は明るい緑、背は濃い */
  { const g2 = ctx.createLinearGradient(p.x-5, 0, p.x+5, 0);
    if(fl<0){ g2.addColorStop(0, G); g2.addColorStop(1, G2); } else { g2.addColorStop(0, G2); g2.addColorStop(1, G); }
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.ellipse(p.x, y-8, 5.8, 6.6, 0, 0, 6.2832); ctx.fill(); }
  /* 翼：黒と黄の縞 */
  ctx.save();
  ctx.beginPath(); ctx.ellipse(p.x-2.2*fl, y-8.6, 3.4, 5.4, 0.25*fl, 0, 6.2832); ctx.clip();
  ctx.fillStyle = "#4a4a3a"; ctx.fillRect(p.x-8, y-16, 16, 12);
  ctx.fillStyle = Y;
  for(let k=0;k<4;k++){ ctx.beginPath(); ctx.ellipse(p.x-2.2*fl, y-13+k*2.6, 3.6, 0.8, 0.25*fl, 0, 6.2832); ctx.fill(); }
  ctx.restore();
  /* 頭：黄色。ほおの青い斑と、のどの黒点 */
  const hb = sleep ? 0 : Math.sin(c.t*5)*1.2;
  const hx = p.x+2.8*fl, hy = y-15.4+hb;
  ctx.fillStyle = Y;
  ctx.beginPath(); ctx.arc(hx, hy, 4.6, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#6f9fd8";
  ctx.beginPath(); ctx.ellipse(hx+2.4*fl, hy+1.8, 1.3, 1.1, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#3a3a2e";
  for(const dx of [-1.6, 0.4]){ ctx.beginPath(); ctx.arc(hx+dx*fl, hy+3.4, 0.55, 0, 6.2832); ctx.fill(); }
  /* くちばし：上が大きく、ろう膜 */
  ctx.fillStyle = "#e9c95a";
  ctx.beginPath(); ctx.moveTo(hx+3.4*fl, hy-0.6); ctx.quadraticCurveTo(hx+7.2*fl, hy+0.4, hx+5.4*fl, hy+3);
  ctx.lineTo(hx+3.2*fl, hy+2.6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c9a8b8"; ctx.beginPath(); ctx.ellipse(hx+3.6*fl, hy-0.9, 1.1, 0.7, 0, 0, 6.2832); ctx.fill();
  eyes(hx, hy-0.6, 1.05, sleep, "#2c2622", 2.2, true);
  /* 頭頂の縞 */
  ctx.strokeStyle = "rgba(60,60,40,.35)"; ctx.lineWidth = .6;
  for(let k=0;k<3;k++){ ctx.beginPath(); ctx.arc(hx-1*fl, hy-1, 4.2-k*0.9, Math.PI*1.15, Math.PI*1.75); ctx.stroke(); }
}

/* --- リクガメ。甲板の模様、しわのある首、うろこの脚 --- */
function drawTurtle(c){
  const p = iso(c.gx, c.gy, 0), sleep = c.phase==="rest";
  const y = p.y, fl = c.flip, SH = "#8f7040", SH2 = "#c8a865", SH3 = "#6b5230", SK = "#c7bb92";
  petShadow(p, 10);
  /* 脚：太くて短い。うろこ */
  if(!sleep){
    for(const [x0] of [[p.x-7.4],[p.x+3.6]]){
      ctx.fillStyle = SK; ctx.beginPath(); ctx.roundRect(x0, y-3.8, 3.8, 4, 1.4); ctx.fill();
      ctx.fillStyle = "rgba(90,70,40,.3)";
      for(let k=0;k<3;k++) ctx.fillRect(x0+0.6+k*1.1, y-2.6, 0.7, 0.7);
      ctx.fillStyle = "#8a7a5a"; ctx.fillRect(x0+0.4, y-0.6, 3, 0.7);
    }
  }
  /* 甲羅：ドーム。上面が明るい */
  { const g2 = ctx.createRadialGradient(p.x-2, y-10, 1, p.x, y-7, 11);
    g2.addColorStop(0, SH2); g2.addColorStop(0.55, SH); g2.addColorStop(1, SH3);
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.ellipse(p.x, y-6, 9.6, 6.4, 0, Math.PI, 0); ctx.fill(); }
  ctx.fillStyle = SH3; ctx.fillRect(p.x-9.6, y-6, 19.2, 2.6);
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(p.x-9.6, y-6, 19.2, 0.8);
  /* 甲板：六角の縁取り */
  ctx.strokeStyle = "rgba(60,44,20,.55)"; ctx.lineWidth = .8;
  for(let i=-1;i<=1;i++){
    const cx0 = p.x+i*5.4, cy0 = y-8.6+Math.abs(i)*1.6, r = i===0 ? 2.8 : 2.3;
    ctx.beginPath();
    for(let k=0;k<6;k++){ const a=k/6*6.2832+0.5; const px=cx0+Math.cos(a)*r, py=cy0+Math.sin(a)*r*0.8;
      k?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = "rgba(255,230,160,.18)"; ctx.fill();
  }
  ctx.beginPath(); ctx.ellipse(p.x, y-11.2, 2.4, 1.6, 0, 0, 6.2832); ctx.stroke();
  /* 首：しわ。頭 */
  const hx = p.x+(sleep?7:10.6)*fl, hy = y-5.2;
  ctx.fillStyle = SK;
  ctx.beginPath(); ctx.moveTo(p.x+6*fl, y-8); ctx.quadraticCurveTo(hx-2*fl, y-9, hx-1*fl, hy-2);
  ctx.lineTo(hx-1*fl, hy+2.4); ctx.quadraticCurveTo(hx-3*fl, y-2, p.x+6*fl, y-3.4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(90,70,40,.35)"; ctx.lineWidth = .6;
  for(let k=0;k<3;k++){ ctx.beginPath(); ctx.moveTo(p.x+(7+k*1.2)*fl, y-7.4); ctx.lineTo(p.x+(7.4+k*1.2)*fl, y-4); ctx.stroke(); }
  ctx.fillStyle = SK;
  ctx.beginPath(); ctx.ellipse(hx, hy, 4, 3.4, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.08)"; ctx.beginPath(); ctx.ellipse(hx, hy+1.6, 3.2, 1.4, 0, 0, 6.2832); ctx.fill();
  /* 口の線と鼻孔 */
  ctx.strokeStyle = "rgba(80,60,40,.5)"; ctx.lineWidth = .7;
  ctx.beginPath(); ctx.moveTo(hx+0.4*fl, hy+1.2); ctx.quadraticCurveTo(hx+2.4*fl, hy+1.6, hx+3.6*fl, hy+0.6); ctx.stroke();
  ctx.fillStyle = "rgba(80,60,40,.5)"; ctx.beginPath(); ctx.arc(hx+3.2*fl, hy-0.6, 0.4, 0, 6.2832); ctx.fill();
  eyes(hx, hy-0.6, 0.95, sleep, "#3a2e26", 1.8, true);
}

function drawBubble(s, bodyH){
  if(!s.bubble) return;
  const p = iso(s.gx, s.gy, s.gz || 0);
  /* 部屋を縮めているときは、逆に拡大して文字の大きさを保つ */
  const iz = (view === "room") ? 1/roomZoom() : 1;
  ctx.font = "600 "+(10*iz).toFixed(1)+"px 'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif";
  const w = ctx.measureText(s.bubble).width + 13*iz;
  const bx = Math.max(4, Math.min(VW/ (view==="room"?roomZoom():1) - w - 4, p.x-w/2));
  const by = p.y - bodyH - 40*iz - (s.bubOff||0);
  ctx.fillStyle = s.bad ? "#ef6d8c" : "#ffffff";
  ctx.shadowColor = "rgba(90,50,80,.22)"; ctx.shadowBlur = 5; ctx.shadowOffsetY = 1.5;
  ctx.beginPath(); ctx.roundRect(bx, by, w, 17*iz, 8*iz); ctx.fill();
  ctx.beginPath(); ctx.moveTo(p.x-3.5*iz, by+16.5*iz); ctx.lineTo(p.x+3.5*iz, by+16.5*iz);
  ctx.lineTo(p.x, by+22*iz); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.fillStyle = s.bad ? "#fff" : "#3f2c3d";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(s.bubble, bx+w/2, by+9*iz);
  ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
}

/* ── 生地がシルエットを変える ── */
function gFabricFx(form,fab){
  const o={}; for(const k of GKEYS) o[k]=form[k];
  const p=fab.drape-0.45;
  o.hw*=1-p*0.46; o.kw*=1-p*0.28; o.sv*=1-p*0.70; o.slO*=1-p*0.55;
  o.sweep=Math.max(0,Math.min(1,o.sweep*(1-p*0.34)));
  o.hemC*=1+p*0.8; o.soft=fab.drape;
  return o;
}
/* ── 21の数字から輪郭を引く。袖・脚・肩の張りは、数字が0なら自然に消える ── */
function shapePath(g,cx,cy,w,h,f){
  const X=v=>cx+v*w, Y=v=>cy+v*h;
  const t=f.top;
  const sh = f.sh*t + f.ww*(1-t);
  const slL= f.slL*t, bw = f.bw*t + f.ww*(1-t), ap = f.ap*t + 0.03*(1-t);
  const hwL=f.hw, hwR=f.hw*(1+f.asym);
  const hyL=Math.min(1.03,f.hy), hyR=Math.min(1.05,Math.max(0.22,f.hy+f.asymY));
  const bend=0.26+(f.soft==null?0.4:f.soft)*0.40;
  g.moveTo(X(-sh),Y(0.015));
  if(f.sv>0.04&&t>0.4){ g.lineTo(X(-f.sv),Y(0.055)); g.lineTo(X(-f.sv*0.82),Y(0.10)); }
  if(slL>0.05){
    g.lineTo(X(-(bw+f.slO)),Y(slL));
    g.lineTo(X(-(bw+f.slO-f.slC)),Y(slL));
  }
  g.lineTo(X(-bw),Y(ap));
  g.lineTo(X(-f.ww),Y(f.wy));
  g.bezierCurveTo(X(-(f.ww+(f.kw-f.ww)*0.30)),Y(f.wy+(f.ky-f.wy)*bend),
                  X(-f.kw),Y(f.ky-(f.ky-f.wy)*0.22),X(-f.kw),Y(f.ky));
  g.bezierCurveTo(X(-f.kw),Y(f.ky+(hyL-f.ky)*0.22),
                  X(-(f.kw+(hwL-f.kw)*f.sweep*1.7)),Y(f.ky+(hyL-f.ky)*0.72),X(-hwL),Y(hyL));
  if(f.leg>0.03){                                  /* 脚が分かれる。0なら分かれない */
    const cr=f.wy+(Math.max(hyL,hyR)-f.wy)*0.42;
    const inX=Math.min(hwL,hwR)*0.24+0.015;
    const nyL=hyL+(cr-hyL)*f.leg, nyR=hyR+(cr-hyR)*f.leg;
    g.lineTo(X(-inX),Y(hyL)); g.lineTo(X(-inX*0.32),Y(nyL));
    g.lineTo(X(0),Y(Math.min(nyL,nyR)-0.015));
    g.lineTo(X(inX*0.32),Y(nyR)); g.lineTo(X(inX),Y(hyR)); g.lineTo(X(hwR),Y(hyR));
  } else {
    g.quadraticCurveTo(cx,Y(Math.max(hyL,hyR)+f.hemC),X(hwR),Y(hyR));
  }
  g.bezierCurveTo(X(f.kw+(hwR-f.kw)*f.sweep*1.7),Y(f.ky+(hyR-f.ky)*0.72),
                  X(f.kw),Y(f.ky+(hyR-f.ky)*0.22),X(f.kw),Y(f.ky));
  g.bezierCurveTo(X(f.kw),Y(f.ky-(f.ky-f.wy)*0.22),
                  X(f.ww+(f.kw-f.ww)*0.30),Y(f.wy+(f.ky-f.wy)*bend),X(f.ww),Y(f.wy));
  g.lineTo(X(bw),Y(ap));
  if(slL>0.05){ g.lineTo(X(bw+f.slO-f.slC),Y(slL)); g.lineTo(X(bw+f.slO),Y(slL)); }
  if(f.sv>0.04&&t>0.4){ g.lineTo(X(f.sv*0.82),Y(0.10)); g.lineTo(X(f.sv),Y(0.055)); }
  g.lineTo(X(sh),Y(0.015));
  g.bezierCurveTo(X(sh*0.4),Y(-0.03),X(-sh*0.4),Y(-0.03),X(-sh),Y(0.015));
}
/* ── 生地の表面 ── */
function gSurface(g,fab,cx,cy,w,h){
  const s=fab.s;
  if(s==="knit"||s==="cable"){ g.strokeStyle=gK(s==="cable"?.14:.09); g.lineWidth=s==="cable"?1.6:1;
    for(let r=0;r<13;r++){const y=cy+h*(0.03+r*0.08); g.beginPath();
      for(let k=0;k<=26;k++) g.lineTo(cx-w*1.3+k*(w*2.6/26),y+Math.sin(k*(s==="cable"?.9:1.5))*(s==="cable"?3:1.5));
      g.stroke();} }
  else if(s==="twill"){ g.strokeStyle=gK(.11); g.lineWidth=1;
    for(let i=-26;i<26;i++){g.beginPath();g.moveTo(cx+i*w*.10,cy);g.lineTo(cx+i*w*.10+w*.5,cy+h);g.stroke();} }
  else if(s==="ridge"){ for(let i=-15;i<=15;i++){g.strokeStyle=i%2?gW(.16):gK(.13);g.lineWidth=2.2;
    g.beginPath();g.moveTo(cx+i*w*.075,cy);g.lineTo(cx+i*w*.075,cy+h);g.stroke();} }
  else if(s==="mesh"){ g.strokeStyle=gW(.22); g.lineWidth=.7;
    for(let i=-18;i<=18;i++){g.beginPath();g.moveTo(cx+i*w*.07,cy);g.lineTo(cx+i*w*.07+w*.3,cy+h);g.stroke();
      g.beginPath();g.moveTo(cx+i*w*.07,cy);g.lineTo(cx+i*w*.07-w*.3,cy+h);g.stroke();} }
  else if(s==="check"){ for(let i=-10;i<=10;i++){g.fillStyle=gK(.10);g.fillRect(cx+i*w*.14,cy,w*.07,h);}
    for(let j=0;j<15;j++){g.fillStyle=gK(.10);g.fillRect(cx-w*1.3,cy+j*h*.078,w*2.6,h*.038);} }
  else if(s==="fleck"){ for(let i=0;i<240;i++){const a=(i*127)%1000/1000,b=(i*311)%1000/1000;
    g.fillStyle=i%3?gK(.13):gW(.20); g.fillRect(cx-w*1.2+a*w*2.4,cy+b*h,1.8,1.8);} }
  else if(s==="slub"){ g.strokeStyle=gK(.09); g.lineWidth=1;
    for(let j=0;j<28;j++){const y=cy+j*h*.037;g.beginPath();g.moveTo(cx-w*1.2,y);g.lineTo(cx+w*1.2,y);g.stroke();}
    for(let i=0;i<80;i++){const a=(i*173)%1000/1000,b=(i*419)%1000/1000;
      g.fillStyle=gW(.16);g.fillRect(cx-w*1.2+a*w*2.4,cy+b*h,5,1.4);} }
  else if(s==="ripstop"){ g.strokeStyle=gW(.13); g.lineWidth=.8;
    for(let i=-13;i<=13;i++){g.beginPath();g.moveTo(cx+i*w*.10,cy);g.lineTo(cx+i*w*.10,cy+h);g.stroke();}
    for(let j=0;j<21;j++){const y=cy+j*h*.05;g.beginPath();g.moveTo(cx-w*1.3,y);g.lineTo(cx+w*1.3,y);g.stroke();} }
  else if(s==="nap"){ const gr=g.createLinearGradient(cx-w,cy,cx+w,cy+h);
    gr.addColorStop(0,gW(.16));gr.addColorStop(.5,gK(.10));gr.addColorStop(1,gW(.12));
    g.fillStyle=gr;g.fillRect(cx-w*1.3,cy,w*2.6,h); }
  else if(s==="spark"){ for(let i=0;i<150;i++){const a=(i*197)%1000/1000,b=(i*541)%1000/1000;
    g.fillStyle=gW(.10+((i*7)%10)/16); g.fillRect(cx-w*1.2+a*w*2.4,cy+b*h,2.2,2.2);} }
  else if(s==="felt"){ for(let i=0;i<170;i++){const a=(i*151)%1000/1000,b=(i*367)%1000/1000;
    g.fillStyle=gK(.05); g.fillRect(cx-w*1.2+a*w*2.4,cy+b*h,3,3);} }
  else if(s==="crisp"){ g.strokeStyle=gW(.24); g.lineWidth=1.4;
    for(let i=-6;i<=6;i++){if(!i)continue;g.beginPath();
      g.moveTo(cx+i*w*.06,cy+h*.36);g.lineTo(cx+i*w*.18,cy+h);g.stroke();} }
}
