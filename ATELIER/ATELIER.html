      title: t ? "課題「"+t.n+"」" + (t.grad ? "（自主制作 "+(g.grad?g.grad.hands:0)+"／"+SN["卒制:夜"]+"夜）" : "") : (g.d===1 && g.y===1 ? "入学式のあと" : "授業"),
      who: "朝　" + cl.map(k=>SC_JP[k]).join("・") + " が少し上がる",
      text: t ? "工程 " + ["企画・デザイン","生地えらび","パターン","トワル確認","縫製・仕上げ"][Math.min(4, Math.floor(taskProg(g)*5))] + " まで進んだ。\n同期が机と製図台とミシンで作業している。"
              : "教室。同期が作業しているのが見える。",
      note: mini ? "授業の中でミニゲーム（糸通し）。やれば 技術 +0.5" : "",
      opts: mini ? [ {label:"やる", fx:"技術+0.5", run(){ scGain(g,"tech",0.5); }}, {label:"見ているだけ", run(){}} ] : [ {label:"昼へ", run(){} } ] };
    g.phase = "noon"; return;
  }
  if(g.phase === "noon"){
    const e = noonEvent(g);
    g.phase = "evening";
    if(e){ e.kind = "event"; e.scene = e.scene || "class"; g.pending = e; g.seen++; }
    return;
  }
  if(g.phase === "evening"){
    const forcedRest = g.collapsedToday;
    const forcedWork = !forcedRest && g.debtDays >= SN["赤字で固定される日数"];
    if(forcedWork) slog(g, "お金がマイナスの日が続き、夜がバイトに固定された");
    const fx = k => {
      const m = {
        make:"技術+"+SN["制作:技術"]+" 発想+"+SN["制作:発想"]+" 体力"+SN["制作:体力"]+" "+yen(SN["制作:お金"]),
        work:"コミュ+"+SN["バイト:コミュ"]+" 体力"+SN["バイト:体力"]+" +"+yen(SN["バイト:お金"]),
        rest:"体力+"+SN["休む:体力"], friend:"コミュ+"+SN["友達:コミュ"]+" センス+"+SN["友達:センス"]+" 距離+1",
        town:"センス+"+SN["街へ:センス"]+" "+yen(SN["街へ:お金"])+" 出会い" }; return m[k]; };
    const opts = [
      { key:"make", label:"自主制作（自宅）", fx:fx("make"), dis:forcedRest||forcedWork },
      { key:"work", label:"アルバイト", fx:fx("work"), dis:forcedRest },
      { key:"rest", label:"休む", fx:fx("rest"), dis:forcedWork },
      { key:"friend", label:"友達と", fx:fx("friend"), dis:forcedRest||forcedWork },
      { key:"town", label:"街へ", fx:fx("town"), dis:forcedRest||forcedWork },
    ].map(o => Object.assign(o, { run(){ g.choice = o.key; } }));
    /* 締切前夜だけ「徹夜」 */
    if(t && g.d === t.to && !forcedRest) opts.push({ key:"allnight", label:"徹夜で仕上げる", fx:"体力"+SN["徹夜の体力"]+"・手数+2", run(){ g.choice = "allnight"; } });
    g.pending = { kind:"evening", badge:"放課後", title:"今夜、どうする？", scene:"class",
      who: forcedRest ? "倒れた日は休むしかない" : forcedWork ? "お金がマイナスの日が続いた。今夜はバイトに行くしかない" : (t ? "課題「"+t.n+"」の期間。自主制作は手数になる" : ""),
      text:"", opts };
    g.phase = "night"; return;
  }
  if(g.phase === "night"){
    const c = g.choice;
    if(c === "town" && !g.townPlace){
      const open = ["cafe","shop","fabric"].concat(g.y>=2?["factory","venue"]:[]).concat(g.y>=3?["press","atelier"]:[]);
      const tbl = meetTable(g.y, g.d);
      const cand = open.slice();
      g.pending = { kind:"choose", badge:"街へ", title:"どこへ行く？", scene:"town", who:"上の街の建物をタップしても行けます。今日、誰がいるかは行ってみないと分からない",
        opts: cand.map(k => ({ label:SC_PLACES[k], fx:(tbl[k] && (scRnd()<0.5 || g.from==="city") ? "誰かいそう" : ""), run(){ g.townPlace = k; } })) };
      return;
    }
    doNight(g);
    g.phase = "night2"; return;
  }
  if(g.phase === "night2"){
    /* 夜に行った先で、その場所のできごと（09 の目録「拠点」「夜」）が起きることがある */
    g.phase = "sleep";
    const q = scPlaceEvent(g);
    if(q){ g.pending = q; }
    return;
  }
  if(g.phase === "sleep"){
    const line = todayLine(g);
    g.daylog.push({ y:g.y, d:g.d, line, money:g.money, stam:Math.round(g.stam), s:Object.assign({},g.s) });
    g.pending = { kind:"info", badge:"寝る", title:"今日のあなた", scene:"home", text:line, opts:[{label:"翌朝へ", run(){}}] };
    g.phase = "endday"; return;
  }
  if(g.phase === "endday"){
    /* 課題の締切・学期末・年末 */
    if(t && g.d === t.to && !t.grad){ const r = closeTask(g, t); showBoard(g, t, r); g.phase = "afterclose"; return; }
    if(t && t.grad && g.d === t.to){ gradResult(g); g.phase = "afterclose"; return; }
    g.phase = "afterclose"; return;
  }
  if(g.phase === "afterclose"){
    /* 挑戦の判定（学園祭・コンペ） */
    if(g.y===1 && g.d===7 && !g.flags.festDone){ g.flags.festDone = 1; festResult(g); g.phase = "afterfest"; return; }
    if(g.y===2 && g.d===9 && g.compe && !g.compe.done){ g.compe.done = 1; compeResult(g); g.phase = "afterfest"; return; }
    g.phase = "afterfest"; return;
  }
  if(g.phase === "afterfest"){
    if(g.d === 4){ g.pending = { kind:"info", badge:"8月", title:"夏休み", scene:"home", text: pick(["蝉。ミシンの音がしない一ヶ月。","実家に帰った。母が「その服、自分で？」と言った。","バイト先の冷房が壊れた。"]) + "\n（休みの一枚。体力 +10）", opts:[{label:"9月へ", run(){ scGain(g,"stam",10); }}] }; g.phase = "nextday"; return; }
    if(g.d === 10){
      if(g.y === 3){ scInvites(g); g.phase = "nextday"; return; }
      if(g.y === 4){ decideCareer(g); g.phase = "graduate"; return; }
      g.pending = { kind:"info", badge:"2月〜3月", title:g.y+"年が終わる", scene:"home",
        text:"春休み。ラックに "+g.rack+" 着。\n" + yearSummary(g), opts:[{label:(g.y+1)+"年へ", run(){}}] };
      g.phase = "nextday"; return;
    }
    g.phase = "nextday"; return;
  }
  if(g.phase === "nextday"){
    g.d++; if(g.d > SN["1年の日数"]){ g.d = 1; g.y++; g.team = null; }
    /* 毎朝：仕送りと生活費、赤字の日数、同期の伸び */
    g.money += (SC_FROM[g.from].allow - 20000) + SN["仕送り"] - (g.from==="abroad" ? SN["外国の生活費"] : SN["生活費"]);
    g.debtDays = g.money < 0 ? g.debtDays+1 : 0;
    for(const p of g.peers) for(const k of SC_STATS) p[k] = Math.min(100, p[k] + SN["同期の伸び/日"]);
    g.townPlace = null; g.choice = null;
    g.phase = "morning"; return;
  }
  /* 卒業。ここで学校の4年は終わり、本体（アトリエ＝卒業後）へ渡す。
     10年後の同窓会（scReunion）は卒業後のできごととして、あとで呼ぶ */
  if(g.phase === "graduate"){
    g.end = true;
    if(typeof openCeremony === "function") openCeremony("grad", { look:scLook });   /* 卒業ショー（09）。終わると下の札 */
    g.pending = { kind:"info", badge:"3月", title:"卒業", who:"講堂（全体）", scene:"hall",
      text:"4年が終わった。ラックに "+g.rack+" 着。\n進路："+SC_CAREERS[g.career].n+"。\n\n"+yearSummary(g),
      opts:[{label:"卒業後へ", run(){}}] };
    return;
  }
  if(g.phase === "reunion"){ scReunion(g); g.phase = "done"; return; }
  if(g.phase === "done"){ g.end = true; g.pending = g.pending || { kind:"info", title:"終", opts:[{label:"もう一度", run(){}}] }; return; }
}

function doNight(g){
  const c = g.choice, t = taskNow(g);
  let title = "", text = "", scene = "home", fxs = [];
  const addHand = (n) => { g.hands += n; if(t){ g.handsIn[t.n] = (g.handsIn[t.n]||0)+n; }
    if(g.y===1 && g.d>=5 && g.d<=7){ g.fest = g.fest||{hands:0}; g.fest.hands += n; }
    if(g.compe && g.y===2 && g.d>=2 && g.d<=8) g.compe.hands += n;
    if(g.rei && g.d>=g.rei.from && g.d<=g.rei.to) g.rei.hands += n;
    if(g.grad && g.y===4) g.grad.hands += n; };
  if(c === "make" || c === "allnight"){
    scene = "home"; title = c==="allnight" ? "徹夜" : "自宅で自主制作";
    scGain(g,"tech",SN["制作:技術"]); scGain(g,"idea",SN["制作:発想"]); scGain(g,"stam", c==="allnight" ? SN["徹夜の体力"] : SN["制作:体力"]); scGain(g,"money",SN["制作:お金"]);
    addHand(c==="allnight" ? 3 : 1); scPer(g,"make",1); scPer(g,"people",-1);
    text = pick(["机の上に布。窓の外は暗い。","縫い目を一度ほどいた。二度目はまっすぐ。","ラックの服が、少し増えた気がする。"]);
    if(c==="allnight"){ text = "朝日がきれい。手が止まらなかった。"; scPer(g,"chal",1); }
  } else if(c === "work"){
    const spots = ["cafe","shop"].concat(g.y>=2?["fabric","factory"]:[]).concat(g.y>=3?["atelier"]:[]);
    let best = spots[0]; for(const k of spots) if((g.work[k]||0) > (g.work[best]||0)) best = k;
    if(g.auto ? scRnd()<0.3 : scRnd()<0.35) best = pick(spots);
    const promo = (g.work[best]||0) >= SN["昇格の回数"];
    g.work[best] = (g.work[best]||0)+1;
    scene = "place"; title = "アルバイト：" + SC_PLACES[best] + (promo ? "（昇格ずみ）" : "");
    scGain(g,"comm",SN["バイト:コミュ"]); scGain(g,"stam",SN["バイト:体力"]); scGain(g,"money", promo ? SN["昇格後のお金"] : SN["バイト:お金"]);
    g.en[best] = (g.en[best]||0) + 1; scPer(g,"people",1);
    if(g.work[best] === SN["昇格の回数"]){ g.en[best] += 2; g.work.promo[best] = 1; text = "「来月から時給、上げとくよ」\n（昇格。縁 +2、次から "+yen(SN["昇格後のお金"])+"）"; slog(g, SC_PLACES[best]+"のバイトで昇格"); }
    else text = { cafe:"マスター「そこの学生さん、コーヒー冷めてるよ」", shop:"店長「お客さんの一言、メモした？」", fabric:"オオタケ「反物は寝かせて置きなさい」", factory:"クドウ「左右差2mm。やり直し」", atelier:"カナメ「納期って概念、ある？」" }[best];
    g.nightPlace = best;
  } else if(c === "rest"){
    scene = "home"; title = "休む";
    scGain(g,"stam",SN["休む:体力"]);
    if(scRnd() < 0.3){ scGain(g,"idea",SN["休む:発想(30%)"]); text = "夢を見た。袖が2本ある理由が分かった気がして、起きたら忘れていた。"; }
    else text = pick(["早く寝た。","実家から手紙。「元気か」とだけ。","洗濯をして、干して、寝た。"]);
    scPer(g,"chal",-1);
  } else if(c === "friend"){
    scene = "place"; const who = pick(g.peers.slice().sort((a,b)=>g.dist[b.id]-g.dist[a.id]).slice(0,2));
    title = "友達と："+who.n; g.dist[who.id]++;
    scGain(g,"comm",SN["友達:コミュ"]); scGain(g,"sense",SN["友達:センス"]); scGain(g,"stam",SN["友達:体力"]); scGain(g,"money",SN["友達:お金"]);
    const d = g.dist[who.id];
    text = d<=1 ? who.n+"「……おつかれ」" : d<=2 ? who.n+"「あの課題、ほんと無理」" : d<=3 ? who.n+"「実はさ、家がね」（本音）" : who.n+"「一緒にやらない？」";
    scPer(g,"people",1);
  } else if(c === "town"){
    const k = g.townPlace; scene = "place"; title = "街へ："+SC_PLACES[k];
    scGain(g,"sense",SN["街へ:センス"]); scGain(g,"idea",SN["街へ:発想"]); scGain(g,"stam",SN["街へ:体力"]); scGain(g,"money",SN["街へ:お金"]);
    const tbl = meetTable(g.y, g.d); let who = tbl[k] ? pick(tbl[k]) : null;
    if(!who && g.from==="city" && scRnd()<0.3) who = pick(Object.keys(SC_PLACE_OF).filter(p=>SC_PLACE_OF[p]===k)) || null;
    if(who){ g.en[k] = (g.en[k]||0)+1; text = SC_PEOPLE[who]+"がいた。顔を覚えられた。（"+SC_PLACES[k]+"の縁 "+g.en[k]+"）"; slog(g, SC_PLACES[k]+"で"+SC_PEOPLE[who]+"に会った"); }
    else text = "誰もいなかった。でも、見た数は貯まる。";
    scPer(g,"make",-1); g.nightPlace = k;
  }
  g.pending = { kind:"info", badge:"夜", title, text, scene, opts:[{label:"寝る", run(){}}] };
}
function todayLine(g){
  const t = g.today; let best = null, bv = 0;
  for(const k of ["sense","tech","idea","comm"]) if((t[k]||0) >= 1.5 && (t[k]||0) > bv){ best = k; bv = t[k]; }
  if(best) return SC_JP[best]+"が少し。";
  if((t.stam||0) <= -6) return g.stam < SN["倒れる体力"] ? "体力が減った。明日は起きられないかもしれない。" : "体力が減った。";
  if((t.money||0) <= -5000) return "財布が軽い。";
  if(g.money < 0) return "お金がマイナスだ。";
  return "何もない日だった。";
}
function showBoard(g, t, r){
  const rows = r.rows.map(x => "<tr class='"+(x.me?"me":"")+"'><td>"+x.n+"</td><td>"+x.v+"</td><td class='grade "+scGrade(x.v)+"'>"+scGrade(x.v)+"</td></tr>").join("");
  g.pending = { kind:"board", badge:"講評", title:"「"+t.n+"」の講評", who:"モリ先生（教室・全員の前）", scene:"class",
    text: r.gr==="S" ? "「形も縫いも、追いついている。見せてよかったね」" : r.gr==="A" ? "「いい。形はいい、縫いがもう少しだね」" : r.gr==="B" ? "「途中まで、だね。手を動かした夜が足りない」" : "「見えていないね。まず、見なさい」",
    html:"<table class='board'><tr><th>名前</th><th>出来</th><th>評価</th></tr>"+rows+"</table><div class='line'>手数（自主制作の夜）"+r.hands+"回。あなたは "+r.rank+" 位。</div>",
    opts:[{label:"つぎへ", run(){}}] };
}
function festResult(g){
  const h = (g.fest && g.fest.hands) || 0;
  const done = h >= SN["学園祭:夜"];
  const v = done ? outcomeSimple(g, ["sense","tech"], h) : 0;
  const ok = done && v >= SN["学園祭:出来"];
  if(ok){ scGain(g,"sense",3); for(const k in g.dist) g.dist[k]++; g.flags.fest = "ok"; slog(g,"学園祭：一着を出した（出来 "+v+"）"); }
  else { g.flags.fest = done ? "weak" : "none"; slog(g, done ? "学園祭：出したが弱かった" : "学園祭：完成せず、出せなかった"); }
  g.pending = { kind:"info", badge:"学園祭", title:"学園祭", who:"講堂（全体）", scene:"hall",
    text: ok ? "自分の一着が、初めて人の前に立った。同期が手を叩いている。\n（センス +3、同期との距離 +1）"
        : done ? "出せた。でも、遠目で分かる形にはなっていなかった。トワルに見えたかもしれない。"
        : "完成しなかった。トワルは出せない（モリ先生）。\n出せなかったことは、覚えている。（同窓会で出る）",
    opts:[{label:"つぎへ", run(){}}] };
}
function compeResult(g){
  const v = g.compe.hands >= SN["コンペ:夜"] ? outcomeSimple(g, ["idea","sense"], g.compe.hands) : outcomeSimple(g,["idea","sense"],g.compe.hands) - 20;
  const ok = v >= SN["コンペ:出来"];
  const nat = 40 + g.peers[0].idea*0.6 + (scRnd()-0.5)*10;
  if(ok){ scGain(g,"idea",5); g.en.press = (g.en.press||0)+1; g.flags.compe="ok"; slog(g,"コンペ入選（出来 "+v+"）"); }
  else { scGain(g,"idea",1); g.flags.compe="ng"; slog(g,"コンペ落選（出来 "+v+"）"); }
  g.pending = { kind:"info", badge:"コンペ", title: ok ? "入選" : "落選", who:"掲示板（全体）", scene:"hall",
    text:(ok ? "名前が貼り出された。（発想力 +5、編集部の縁 +1）" : "名前は無かった。（発想力 +1。やった記憶は残る）") + "\nナツメは " + (nat >= SN["コンペ:出来"] ? "入選していた。" : "落ちていた。") + "（"+Math.round(nat)+"）",
    opts:[{label:"つぎへ", run(){}}] };
}
function gradResult(g){
  const v = outcomeSimple(g, ["idea","tech"], g.grad.hands) + (g.grad.hands >= SN["卒制:夜"] ? 0 : -15);
  g.grad.v = v; g.rack++;
  slog(g,"卒業制作 出来 "+v+"（手数 "+g.grad.hands+"）");
  g.pending = { kind:"info", badge:"1月", title:"卒業制作を提出した", who:"", scene:"class",
    text:"テーマ「"+g.grad.theme+"」。手を動かした夜 "+g.grad.hands+"回。出来 "+v+"。\n"+(v >= SN["卒制:出来"] ? "モリ先生「最後まで、行ったね」" : "モリ先生「途中で、止まっているね」"),
    opts:[{label:"つぎへ", run(){}}] };
}
function scInvites(g){
  const inv = Object.keys(g.en).filter(k => g.en[k] >= SN["誘いの縁"] && (g.s[{factory:"tech",press:"comm",fabric:"sense",atelier:"idea",cafe:"comm",shop:"comm",venue:"sense"}[k]]||0) >= SN["誘いの能力"]);
  g.invites = inv;
  slog(g, inv.length ? "誘いが来た："+inv.map(k=>SC_PLACES[k]).join("・") : "誘いは来なかった");
  g.pending = { kind:"info", badge:"3月", title: inv.length ? "「来ないか」と言われた" : "誰にも言われなかった", who:"3年の終わり", scene:"place",
    text: inv.length ? inv.map(k=>SC_PLACES[k]).join("・")+" から。\n（縁 "+SN["誘いの縁"]+" 以上で、その場所の能力が "+SN["誘いの能力"]+" 以上の人だけ）" : "言われる人と、言われない人がいる。今年は、言われなかった。",
    opts:[{label:"4年へ", run(){}}] };
}
/* 進路。基本は「作る側」＝アトリエ。規模と気分が違う4つ＋独立。
   出版社・問屋・工場は、そこに通い続けた人だけに開く「別の道」（先生：工場は主役ではない） */
const SC_CAREERS = {
  big:    { n:"大きなアトリエ", sub:"アパレル会社に近い。分業。ここでしか見られない数と速さ", mood:"白と灰。整った什器が並ぶ" },
  mode:   { n:"モードの小さなアトリエ", sub:"黒を基調にしたシックな部屋。ハイファッション。門は狭い", mood:"黒・炭・鈍色。ボディが多い" },
  casual: { n:"カジュアルの小さなアトリエ", sub:"明るい色。少人数で全部やる。ここが「ふつうの夢」", mood:"生成り・水色・からし色" },
  unique: { n:"個性的なアトリエ", sub:"誰も見たことがない服。挑んできた人が呼ばれる", mood:"部屋ごとに違う。染色台と変な機械" },
  indep:  { n:"独立（ナツメと）", sub:"最初から代表。全部が自分に返ってくる", mood:"最初は空っぽの部屋" },
  press:  { n:"出版社（別の道）", sub:"言葉にする側", mood:"" },
  fabric: { n:"生地問屋・産地（別の道）", sub:"生地と作り手のあいだ", mood:"" },
  factory:{ n:"工場（別の道）", sub:"数を作る現場。通い続けた人だけ", mood:"" },
  none:   { n:"町の仕立て屋で見習い", sub:"どの門も開かなかった。それでも作る側の入口", mood:"" },
};
function careerCheck(g){
  const s = g.s, gradeB = g.grades.filter(x=>x.g!=="C").length;
  const chal = (g.compe?1:0) + (g.rei?1:0) + (g.flags.fest==="ok"?1:0);
  const c = {};
  c.big    = [["技術",s.tech,SN["進路:大きなアトリエ 技術"]],["コミュ",s.comm,SN["進路:大きなアトリエ コミュ"]],["B以上の回数",gradeB,SN["進路:大きなアトリエ 評価B以上"]]];
  c.mode   = [["センス",s.sense,SN["進路:モードのアトリエ センス"]],["発想",s.idea,SN["進路:モードのアトリエ 発想"]],["卒制",g.grad.v||0,SN["進路:モードのアトリエ 卒制"]],["アトリエの縁",g.en.atelier,SN["進路:モードのアトリエ 縁"]]];
  c.casual = [["センス",s.sense,SN["進路:カジュアルのアトリエ センス"]],["コミュ",s.comm,SN["進路:カジュアルのアトリエ コミュ"]]];
  c.unique = [["発想",s.idea,SN["進路:個性的なアトリエ 発想"]],["挑戦した数",chal,SN["進路:個性的なアトリエ 挑戦の数"]]];

/* ==================================================================
   自動モードの選びかた（GAME.md I-7）
   ================================================================== */
function autoPick(g){
  const p = g.pending; if(!p) return 0;
  const live = p.opts.map((o,i)=>i).filter(i=>!p.opts[i].dis);
  if(p.kind === "evening"){
    const w = {};
    for(const i of live){
      const k = p.opts[i].key; let v = SN["自動:基本%"];
      const al = { make:[["make",1],["people",-1]], work:[["people",1]], rest:[["chal",-1]], friend:[["people",1]], town:[["make",-1]], allnight:[["chal",1]] }[k] || [];
      for(const [ax, sgn] of al){ const t = g.per[ax]*sgn; v += t > 0 ? t*SN["自動:傾きに合う+%"] : t*SN["自動:合わない-%"]; }
      if(k==="rest" && g.stam < 30) v += SN["自動:体力30未満で休む+%"];
      if(k==="work" && g.money < 0) v += SN["自動:赤字でバイト+%"];
      if(k==="make" && taskNow(g)) v += 8;
      if(k==="allnight") v = g.stam > 45 ? 10 : 0;
      w[i] = Math.max(0.5, v);
    }
    let tot = 0; for(const i in w) tot += w[i]; let r = scRnd()*tot;
    for(const i in w){ r -= w[i]; if(r <= 0) return +i; }
    return live[0];
  }
  if(p.kind === "event" || p.kind === "choose"){
    /* 挑む↔見送る の傾きで、1番目（前向き）を選びやすく */
    if(live.length <= 1) return live[0] ?? 0;
    const first = live[0];
    const pr = scClamp(0.55 + g.per.chal*0.04, 0.2, 0.9);
    return scRnd() < pr ? first : pick(live.slice(1));
  }
  return live[0] ?? 0;
}
function randomPerson(){
  return { name:pick(SC_NAMES), from:pick(Object.keys(SC_FROM)), why:pick(Object.keys(SC_WHY)), auto:true };
}
function runAuto(g){
  let guard = 0;
  while(!g.end && guard++ < 5000){ if(!g.pending) scNext(g); if(g.pending && !g.end) scAdvance(g, autoPick(g)); }
  return g;
}

   ------------------------------------------------------------------
   ・title.js の扉が閉じたら scSchoolStart()。人物をつくる → 入学式 → 4年 → 卒業 → 本体（卒業後）へ

   ・札（いま選ぶこと）は下の pane に出す。読むだけの札は何もしなくても数秒で次へ進む。
     選ぶ札は待つ。自動モードなら性格の傾きから自動で選ぶ（GAME.md I-7）

function scApplyEffect(g, ef, full, placeId){
  const m = full ? 1 : 0.4;
  for(const k in ef.s) scGain(g, k, ef.s[k]*m);
  if(ef.stam) scGain(g, "stam", full ? ef.stam : Math.min(0, ef.stam)*0.5);
  if(ef.money && full) scGain(g, "money", ef.money);
  if(ef.en && full && placeId && g.en[placeId] != null) g.en[placeId]++;
  if(ef.dist && full){ const pr = pick(g.peers); g.dist[pr.id]++; }
  if(ef.chal) scPer(g, "chal", full ? 1 : -1);
}
function scMemo(g, c){
  if(!c.know || g.memos.some(m => m.title === c.title)) return;
  g.memos.push({ title:c.title, know:c.know, g:c.g, where:c.where });
  toast("メモが増えた："+c.know);
}
function scCatToPending(g, c, scene, placeId){
  const ef = cEffect(c.move);
  const labels = c.opts && c.opts.length ? c.opts : ["そうする"];
  const opts = labels.map((label, k) => ({ label,
    fx: k === 0 && c.move && c.move !== "—" ? c.move : "",
    run(){ scApplyEffect(g, ef, k === 0, placeId); scMemo(g, c);   /* 知ったことは、どう選んでも残る */
           slog(g, "《"+c.title+"》"+label); } }));
  return { kind:"event", badge:c.where, title:c.title,
           who:(SC_KIND_JP[c.kind]||"") + (c.g.slice(0,2)==="知：" ? "　／　"+c.g : c.g==="笑い" ? "　／　小さな話" : ""),
           text:c.lead, note:c.teach ? "── "+c.teach : "", opts, scene, room:CAT_WHERE_ROOM[c.where] || null, placeId:placeId||null };
}
/* 昼：年と月で引く。無ければ笑い／知（学校の中の場所のもの）を時々 */
function scPoolEvent(g){
  const mo = SC_MONTHS[g.d-1]+"月", yr = g.y+"年";
  const pool = (CAT_SCHOOL[yr]||[]).filter(c => c.when === mo && !g.seenEv[c.title]);
  let c = (pool.length && scRnd() < 0.85) ? pick(pool) : null;
  if(!c && scRnd() < 0.55){
    const okW = x => !g.seenEv[x.title] && (CAT_WHERE_ROOM[x.where] || x.where === "自宅" || x.where === "街");
    const know = CAT_KNOW.filter(okW), laugh = CAT_LAUGH.filter(okW);
    const alt = (know.length && scRnd() < 0.6) ? know : (laugh.length ? laugh : know);
    if(alt.length) c = pick(alt);
  }
  if(!c) return null;
  g.seenEv[c.title] = 1;
  const pid = CAT_WHERE_PLACE[c.where] || null;
  const scene = c.where === "自宅" ? "home" : c.where === "街" ? "town" : pid ? "place" : "class";
  return scCatToPending(g, c, scene, pid);
}

  const know = CAT_KNOW.filter(x => !g.seenEv[x.title] && (CAT_WHERE_ROOM[x.where] || x.where === "自宅" || x.where === "街"));
  if(!know.length) return null;
  const c = pick(know); g.seenEv[c.title] = 1;
  const pid = CAT_WHERE_PLACE[c.where] || null;
  return scCatToPending(g, c, c.where === "自宅" ? "home" : c.where === "街" ? "town" : "class", pid);

function scPlaceEvent(g){

  if(c0 === "work" || c0 === "town"){ pid = g.nightPlace; where = Object.keys(CAT_WHERE_PLACE).find(k => CAT_WHERE_PLACE[k] === pid) || null; }
  else if(c0 === "make" || c0 === "allnight" || c0 === "rest") where = "自宅";
  if(!where) return null;
  const pool = CAT_PLACE.concat(CAT_NIGHT).concat(CAT_KNOW).filter(c => c.where === where && !g.seenEv[c.title]);
  if(!pool.length || scRnd() > 0.45) return null;
  const c = pick(pool); g.seenEv[c.title] = 1;

/* 床の光だまり（自宅用。room/draw.js の lightPool は部屋の GW/GD で切るので、ここでは切らない） */
function lightPoolAt(gx, gy, r, col, a){
  const ring = rr => { const p=[]; for(let i=0;i<12;i++){ const q=i*Math.PI/6;

function scTap(x, y){
  if(!SCH || !SG || !SCH.town) return false;
  let hit = null, best = -1e9;
  for(const p of PLACES)
    for(const lv of [0, 0.4, 0.8]){
      const q = unIso(x, y + p.h*lv*ZS);
      if(q.gx>=p.x && q.gx<=p.x+p.w && q.gy>=p.y && q.gy<=p.y+p.d){
        const scv = p.x+p.y+p.h*0.002; if(scv > best){ best = scv; hit = p; } break; }
    }
  if(!hit) return true;
  const g = SG, pd = g.pending;
  const open = scOpenIds(g).filter(k => k !== "school");
  if(pd && pd.kind === "evening"){
    const i = pd.opts.findIndex(o => o.key === "town");
    if(i >= 0 && !pd.opts[i].dis){
      if(!open.includes(hit.id)){ toast(hit.name+"は、まだ夜に行けない（"+(hit.id==="school"?"学校":"上の学年から")+"）"); return true; }
      g.townPlace = hit.id; scChoose(i); return true;
    }
  }
  if(pd && pd.kind === "choose" && pd.badge === "街へ"){
    const i = pd.opts.findIndex(o => o.label === SC_PLACES[hit.id]);
    if(i >= 0){ scChoose(i); return true; }
  }
  toast(hit.name + (g.en[hit.id] ? "　縁 "+g.en[hit.id] : "") + "　── 夕方に「街へ」を選ぶと行ける");
  return true;
}

  const rnd = () => { s = (s*1664525 + 1013904223) >>> 0; return s/4294967296; };
  const list = [];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const p = seatPos(c, r);
    list.push({ c, r, gx:p.gx, gy:p.gy, look:pxLook(rnd),
                col: FRESH[Math.floor(rnd()*FRESH.length)],
                off:rnd()*8, gest:null, who:null });
  }
  return list;
}

    const C = CAST[k];
    const p = crowd.find(x => x.c === C.c && x.r === C.r);

    p.who = k; p.col = C.col; p.gest = C.gest;
    C.p = p;

}

const C_FLOORA = "#d7ac7e", C_FLOORB = "#cba172", C_EDGE = "#a87f56";
const C_WALL = "#fbf3e6", C_WALL2 = "#ece2d3", C_SKIRT = "#e6d8c4";
const C_WOOD = "#c9a982", C_PLUM = "#7c5a70", C_GLASS = "#b9c9d2";

function drawFloor(){
  const H = HALL;
  for(let x = Math.floor(H.floorX0); x < H.floorX1; x++)
    for(let y = Math.floor(H.floorY0); y < H.floorY1; y++){
      const x0 = Math.max(x, H.floorX0), x1 = Math.min(x+1, H.floorX1);
      const y0 = Math.max(y, H.floorY0), y1 = Math.min(y+1, H.floorY1);
      if(x1 <= x0 || y1 <= y0) continue;
      poly([iso(x0,y0), iso(x1,y0), iso(x1,y1), iso(x0,y1)],
           ((x+y) & 1) ? C_FLOORB : C_FLOORA);
    }
  /* 床の断面 */
  poly([iso(H.floorX0,H.floorY1), iso(H.floorX1,H.floorY1),
        iso(H.floorX1,H.floorY1,-14), iso(H.floorX0,H.floorY1,-14)], shade(C_EDGE,.70));
  poly([iso(H.floorX1,H.floorY0), iso(H.floorX1,H.floorY1),
        iso(H.floorX1,H.floorY1,-14), iso(H.floorX1,H.floorY0,-14)], shade(C_EDGE,.54));
}

function drawWalls(){
  const H = HALL, WH = H.wallH;
  /* 奥の壁（壇の背。y=floorY0 の面） */
  poly([iso(H.floorX0,H.floorY0,WH), iso(H.floorX1,H.floorY0,WH),
        iso(H.floorX1,H.floorY0), iso(H.floorX0,H.floorY0)], C_WALL);
  /* 左の壁（x=floorX0 の面）。ここに高い窓 */
  poly([iso(H.floorX0,H.floorY0,WH), iso(H.floorX0,H.floorY1,WH),
        iso(H.floorX0,H.floorY1), iso(H.floorX0,H.floorY0)], C_WALL2);
  /* 幅木 */
  poly([iso(H.floorX0,H.floorY0,12), iso(H.floorX1,H.floorY0,12),
        iso(H.floorX1,H.floorY0), iso(H.floorX0,H.floorY0)], C_SKIRT);
  poly([iso(H.floorX0,H.floorY0,12), iso(H.floorX0,H.floorY1,12),
        iso(H.floorX0,H.floorY1), iso(H.floorX0,H.floorY0)], shade(C_SKIRT,.92));

  /* 高い窓。四角のまま（丸くしない）。中は不透明なガラス色 */
  for(const [y0, y1] of WINDOWS){
    poly([iso(H.floorX0,y0,WH-52), iso(H.floorX0,y1,WH-52),
          iso(H.floorX0,y1,104),   iso(H.floorX0,y0,104)], shade(C_GLASS,1.14));
    /* 桟は「線でできている物」なので1本だけ */
    poly([iso(H.floorX0,(y0+y1)/2-0.045,WH-52), iso(H.floorX0,(y0+y1)/2+0.045,WH-52),
          iso(H.floorX0,(y0+y1)/2+0.045,104),   iso(H.floorX0,(y0+y1)/2-0.045,104)], shade(C_WALL2,.80));
  }
}
/* 窓の位置。光は左上から入る（ART.md 4章） */
const WINDOWS = (function(){
  const a = [];
  for(let i=0;i<6;i++){ const y0 = -2.0 + i*3.1, y1 = y0 + 2.0;
    if(y1 > HALL.floorY1 - 3.0) break; a.push([y0, y1]); }
  return a;
})();

/* 窓の光。床の上に平行四辺形を2段（ART.md 4章）。人や什器の上には掛けない */
function drawWindowLight(){
  g.globalCompositeOperation = "screen";
  for(const [y0, y1] of WINDOWS){
    for(let k=0;k<2;k++){
      const s = 3.4 + k*2.6, o = 0.55 + k*0.5;
      poly([iso(HALL.floorX0,y0+o), iso(HALL.floorX0+s,y0+o+s*0.30),
            iso(HALL.floorX0+s,y1+o+s*0.30), iso(HALL.floorX0,y1+o)],
           "rgba(255,246,220,.22)");
    }
  }
  g.globalCompositeOperation = "source-over";
}

function drawStage(){
  const H = HALL, w = H.stgX1 - H.stgX0;
  /* 垂れ幕（奥の壁に貼る面）。看板は英字（ART.md 6章） */
  poly([iso(H.stgX0+1.0,H.floorY0,262), iso(H.stgX1-1.0,H.floorY0,262),
        iso(H.stgX1-1.0,H.floorY0,58),  iso(H.stgX0+1.0,H.floorY0,58)], C_PLUM);
  poly([iso(H.stgX0+1.0,H.floorY0,262), iso(H.stgX1-1.0,H.floorY0,262),
        iso(H.stgX1-1.0,H.floorY0,248), iso(H.stgX0+1.0,H.floorY0,248)], shade(C_PLUM,1.28));
  { const a = iso(STAGE_CX, H.floorY0, 175);
    g.save(); g.fillStyle = "rgba(246,241,234,.94)";
    g.font = "900 15px ui-sans-serif,system-ui,sans-serif";
    g.textAlign = "center"; g.letterSpacing = "6px";
    g.fillText("CULTURA", a.x, a.y);
    g.font = "800 8.5px ui-sans-serif,system-ui,sans-serif"; g.letterSpacing = "3px";
    g.fillStyle = "rgba(246,241,234,.62)";
    g.fillText("COLLEGE OF FASHION", a.x, a.y + 15); g.restore(); }
  /* 壇 */
  box(H.stgX0, H.stageY0, w, H.stageY1-H.stageY0, H.stageH, C_WOOD);
  drop(H.stgX0, H.stageY0, w, H.stageY1-H.stageY0, H.stageH);
  /* 壇の上のあかり。面を1枚だけ（ぼかさない・放射グラデーションは使わない） */
  { const cx = STAGE_CX - 1.5, cy = H.stageY1 - 1.55;
    g.globalCompositeOperation = "screen";
    poly([iso(cx,cy,H.stageH), iso(cx+2.0,cy,H.stageH),
          iso(cx+2.0,cy+1.45,H.stageH), iso(cx,cy+1.45,H.stageH)], "rgba(255,240,205,.13)");
    g.globalCompositeOperation = "source-over"; }
  /* 演台。箱ひとつ＋記号（マイクの棒）ひとつ */
  const px = STAGE_CX - 2.35, py = H.stageY1 - 1.15;
  box(px, py, 0.98, 0.64, 32, shade(C_WOOD,.88), H.stageH);
  poly([iso(px+0.44,py+0.30,H.stageH+32), iso(px+0.52,py+0.32,H.stageH+32),
        iso(px+0.52,py+0.32,H.stageH+50), iso(px+0.44,py+0.30,H.stageH+50)], "#5c6470");
}
const STAGE_CX = (HALL.stgX0 + HALL.stgX1)/2;

/* 長椅子の背。列ごとに1本（人が2ブロックに分かれるので2本）。
   人の脚と接地の影は、この背に隠れて見えなくなる＝座って見える */
function drawBench(r){
  const gy = r*RDY + 1.20;

    box(x0, gy, x1-x0, 0.26, 15, shade(C_WOOD,.80));
  }
}

/* 引きの構図。客席の横はばで倍率を決め、壇と客席の中ほどに寄せる。
   床の端まで入れようとすると講堂が小さくなるので、左右は切れてよい */
const P_STAGE = (function(){
  const a = iso((HALL.floorX0+HALL.floorX1)/2 - 0.55, HALL.stageY1-0.62, HALL.stageH+26);
  return { x:a.x, y:a.y };
})();
/* 縦で合わせ、横は切る。左右の端まで入れようとすると講堂が小さくなり、
   「その中の一人」に見えなくなる。床と壁が画面いっぱいに切れているほうが、広く見える。
   アイソメでは壇が客席の右上に来るので、横は壇と客席のあいだに置く */
const P_HALL = (function(){
  const seat = iso(colX(COLS-1)/2 + 0.3, (ROWS-1)*RDY/2 + 0.75);
  const topY = iso(HALL.floorX0, HALL.floorY0, HALL.wallH).y;
  const botY = iso(colX(COLS-1)+0.3, (ROWS-1)*RDY+0.75).y + 40;
  const z = Math.min(1.02, (VH - 210) / (botY - topY + 40));
  return { x: P_STAGE.x*0.55 + seat.x*0.45, y:(topY + botY)/2 + 34, z };
})();
const P_ME = (function(){ const p = CAST.me.p; const a = iso(p.gx, p.gy, 0); return { x:a.x, y:a.y }; })();

  if(litTarget) { for(const k in CAST) if(k === "me" && CAST[k].p) CAST[k].p.gest = "lookup"; }

  /* 刺さる一行では顔を大きく出す（B と 本命M） */
  bustT = ((plan === "B" || plan === "M") && litTarget) ? 0.001 : 0;
  /* カメラの行き先 */
  if(plan === "B"){
    if(node.spk) camTo(P_STAGE.x, P_STAGE.y + 34, P_HALL.z*1.72);
    else camTo(P_HALL.x, P_HALL.y, P_HALL.z);

/* なぞって見わたす。

    userX = Math.max(-175, Math.min(95, userX - (e.clientX - dragX)*0.95));

function peek(px, py){
  const wx = (px - VW/2)/cam.z + cam.x, wy = (py - VH/2)/cam.z + cam.y;
  let hit = null, bd = 26/cam.z;
  for(const k in CAST){
    const C = CAST[k]; if(!C.p) continue;
    const a = iso(C.p.gx, C.p.gy, 0);
    const d = Math.hypot(a.x - wx, (a.y - 16*PU) - wy);
    if(d < bd){ bd = d; hit = C; }
  }
  if(!hit) return false;
  noteEl.textContent = hit.note;
  const a = iso(hit.p.gx, hit.p.gy, 0);
  const sy = (a.y - cam.y)*cam.z + VH/2;
  noteEl.style.top = Math.max(80, Math.min(VH-220, sy - 96)) + "px";
  noteEl.classList.add("on"); noteT = 3.4;
  return true;
}

function tick(dt){
  auto = !!(typeof SG !== "undefined" && SG && SG.auto);
  T += dt; spkT += dt;
  if(clapT > 0) clapT -= dt;
  if(noteT > 0){ noteT -= dt; if(noteT <= 0) noteEl.classList.remove("on"); }
  litT += ((litTarget ? 1 : 0) - litT) * Math.min(1, dt*5.5);
  if(bustT > 0) bustT = Math.min(1, bustT + dt*3.2);
  panX += (panTarget - panX) * Math.min(1, dt*6);

  /* 自分でずらしたぶんは、指を離して1秒たつと、ゆっくり 0 に戻る（本命のみ）。
     戻るからこそ、決めてある構図がまた効く */
  userIdle += dt;
  if(plan === "M" && userIdle > 1.0){
    const k = Math.min(1, dt*1.5);
    userX += (0 - userX)*k; userY += (0 - userY)*k;
  }

  /* カメラ。C案は自分の席のうしろ。前の列の頭ごしに、遠くの壇が見える高さに置く */
  if(plan === "C"){
    cam.x = P_ME.x + (P_STAGE.x - P_ME.x)*0.35 + userX;
    cam.y = P_ME.y - 122 + userY;
    cam.z = P_HALL.z * 1.55;
  } else {
    /* 決めてある構図（camBase）へなめらかに寄り、そこへ自分でずらしたぶんを足す。
       足す先を camBase と分けておかないと、ずらしたぶんが毎フレーム積み上がる */
    if(camGoal){
      const k = Math.min(1, dt*1.7);
      camBase.x += (camGoal.x - camBase.x)*k;
      camBase.y += (camGoal.y - camBase.y)*k;
      camBase.z += (camGoal.z - camBase.z)*k;
    }
    /* 見わたしているあいだは、少しだけ引く（覗きこむのではなく、見まわす感じに） */
    const out = 1 - Math.min(0.13, (Math.abs(userX) + Math.abs(userY))/1500);
    cam.x = camBase.x + userX;
    cam.y = camBase.y + userY;
    cam.z = camBase.z * out;
  }

  /* 文字送り */
  if(node && node.text != null){
    if(chars < node.text.length){
      chars = Math.min(node.text.length, chars + dt*38);
      txtEl.textContent = node.text.slice(0, Math.floor(chars));
    } else {
      txtEl.textContent = node.text;
      if(!waiting){
        waiting = true;
        if(node.choice){
          optsEl.innerHTML = node.opts.map((o,i)=>'<button data-o="'+i+'">'+o.t+'</button>').join("");
          optsEl.classList.add("on");
          optsEl.querySelectorAll("[data-o]").forEach(b=>b.onclick=ev=>{
            ev.stopPropagation(); pick(+b.dataset.o); });
          if(auto) held = -1.8;
        } else nextEl.style.display = auto ? "none" : "";
      }
      held += dt;
      const need = (node.hold || 2.2) + (litTarget ? 1.9 : 0);
      if(auto && held > need){
        if(node.choice){
          /* 自動モード：性格の傾きで重みが変わる（GAME.md I-7）。いまは五分五分から */
          const w = node.opts.map(o => 1 + (tilt[o.tilt]||0)*0.4);
          let s = w.reduce((a,b)=>a+b,0), r = Math.random()*s, n = 0;
          while(n < w.length-1 && (r -= w[n]) > 0) n++;
          pick(n);
        } else advance();
      }
    }
  }

  draw();
}

            iso(me.gx+0.55,me.gy+0.75), iso(me.gx-0.55,me.gy+0.75)],
           "rgba(255,225,150,"+(0.34*litT).toFixed(3)+")");
      g.globalCompositeOperation = "source-over";

      pxPerson(g, me.look, { col:me.col, phase:personGest(me), t:T + me.off, flip:1 },
               a.x, a.y + 10*PU, PU);
      /* 長椅子は自分の前のぶんだけ。列ぜんぶを明るくすると、暗い講堂に光の梁が走って見える */

     pxBust は上半身を切り抜くので、切り口が宙に浮いて見える。
     ここでは同じ pxPerson を、足もとが画面の下に外れる位置に置いて出す */
  if(bustT > 0){

    const S = stagePerson(speaker) || DEAN;

    g.globalAlpha = bustT;
    /* 拡大のときは、腕を大きく開く動きだけ内側へ寄せる（画面からはみ出して読めなくなる） */
    let gest = (curScript()[idx] && curScript()[idx].gest) || "idle";
    if(gest === "open" || gest === "wave") gest = "present";
    pxPerson(g, S.look, { col:S.col, phase:gest, t:T, flip:1, bust:true,
                          mood: speaker === "senp" ? "smile" : "idle" },
             VW/2, 336 + 61*U, U);

function fitOrigin(){
  OX = VW/2 - (GW-GD)*(TW/2)/2;
  /* 入り口は右手前の辺にある。部屋を広げると道が画面からはみ出すので、
     はみ出したぶんだけ全体を左へ寄せる。ここをやらないと出入口が切れる。
     ただし広い部屋は roomZoom() で縮めて描いているので、縮めたあとの
     画面の座標で測ること。縮める前の座標で測ると、必要のない寄せが起きて
     左の壁ぎわ（什器がいちばん並ぶところ）が切れてしまう */
  if(typeof doorStyle !== "undefined" && doorStyle !== "wall"){
    const z = (typeof roomZoom === "function" && TW === R_TW) ? roomZoom() : 1;
    const tip = (GW + 2.15 - GD/2) * (TW/2);
    const lim = ((VW - 5) - VW*(1-z)/2) / z;    /* 画面の右端を、縮める前の座標に直す */
    const over = OX + tip - lim;
    if(over > 0) OX -= over;
  }
  OY = Math.round((VH - (WALLH*ZS + (GW+GD)*TH/2 + SLAB*ZS))/2) + WALLH*ZS;
}
let DPR = 1;
/* 既定の広さ（8×6）を 1 として、広げたぶんだけ縮める。
   部屋が広いほど小さくなるので、いつでも全体が入る */
function roomZoom(){
  const base = (8 + 6) * R_TW/2;
  const wide = (GW + GD) * R_TW/2;
  return Math.min(1, base / wide);
}
/* 縮小しているときに、画面の座標を部屋の座標へ戻す */
function unZoom(x, y){
  const z = roomZoom();
  return { x:(x - VW*(1-z)/2) / z - panX, y:(y - VH*(1-z)/2) / z };
}
/* 横へなぞって見える範囲を動かす。部屋の端で止まる */
let panX = 0;
function panLimit(){
  const z = roomZoom();
  const half = (GW + GD) * (R_TW/2) / 2;      /* 部屋の横はば の半分 */
  const room = half - (VW/z)/2 + 16;          /* 画面からはみ出しているぶん */
  return Math.max(0, room);
}
function clampPan(){
  const L = panLimit();
  panX = Math.max(-L, Math.min(L, panX));
}

      const c2 = document.createElement("canvas");
      c2.width = x1-x0+1; c2.height = y1-y0+1;
      c2.getContext("2d").drawImage(cv, x0,y0,c2.width,c2.height, 0,0,c2.width,c2.height);
      return { url:c2.toDataURL("image/png"), w:Math.round(c2.width/dpr), h:Math.round(c2.height/dpr) };
    },
    floorTile(gx,gy,col){ poly([iso(gx,gy),iso(gx+1,gy),iso(gx+1,gy+1),iso(gx,gy+1)],col); },
    drawFurn(type, x, y, extra){
      const f = Object.assign({type, x, y, hung:0, u:x, z:y, v:0, wall:"back"}, extra||{});
      drawFurniture(f);
    },
    drawPet(kind, gx, gy, phase){
      PETDRAW[kind]({kind, gx, gy, t:1.1, phase:phase||"walk", flip:1,
                     rest:9, bubble:null, bubbleT:0, appear:{tall:1}});
    },
    drawStaff(role, gx, gy, appear, phase, station){
      drawPerson({role, gx, gy, t:1.35, phase:phase||"work", flip:1,
                  appear, station, bubble:null, bubbleT:0, bubOff:0});
    },
    drawGarment(kind, cx, cy, h){ garment(ctx, kind, cx, cy, h); },
    dataURL(){ return cv.toDataURL("image/png"); },

    /* ---- 街と拠点 ---- */
    PLACES, INSIDE, NPCROLE,
    setTownScale(){ TW = T_TW; TH = T_TH; ZS = T_ZS; },
    setRoomScale(){ TW = R_TW; TH = R_TH; ZS = TH/42; },
    /* 建物を1軒だけ描く */
    shotBuilding(id, ox, oy){
      const p = PLACES.find(q => q.id === id);
      TW = T_TW; TH = T_TH; ZS = T_ZS; OX = ox; OY = oy;
      drawBuilding(p, true);
    },
    /* 拠点の中を、空をのぞいて丸ごと描く */
    shotInside(id){
      const p = PLACES.find(q => q.id === id), I = INSIDE[id];
      if(!I || !I.fx) return false;
      placeIn = p; pnpc = makeNPCs(I);
      usePlaceScale();
      drawPlaceScene(I);
      for(const n of pnpc) n.bubble = null;
      placeIn = null; pnpc = [];
      return true;
    },
    /* 確認スクリプト用。ふだんの遊びには関わらない */
    dev:{
      enter(id){ enterPlace(PLACES.find(p=>p.id===id)); },
      view(v){ setView(v); },
      set fame(v){ fame = v; }, get fame(){ return fame; },
      set chapter(i){ showIdx = i; },
      get biz(){ return biz; },
      stock(n){ biz.one += n; for(let i=0;i<n;i++) biz.oneCol.push("#d8899f"); },
      rack(n){ const r = furniture.find(o=>o.type==="rack");
               if(r){ r.colors = r.colors||[]; for(let i=0;i<n;i++){ r.colors.push("#8f79ea"); r.hung++; } } },
      week(){ onMonth(); },
      giveCard(theme, stat, rar){
        const key = theme+"|"+stat;
        const v = {}; for(const k of STATS) v[k] = 30 + Math.round(Math.random()*20);
        v[stat] += 22;
        cards[key] = { key, theme, top:stat, rar:rar||4, v,
                       total:STATS.reduce((a,k)=>a+v[k],0), week:1,
                       client:"コレクション", name:theme+pick(CARDSUFFIX[stat]) };
        renderPane(); return key;
      },
      pickCross(a, b){ crossSel = [a, b]; renderPane(); },
      cross(){ doCross(); return job && job.kind === "cross" ? job.theme : null; },
      crossInfo(){ return job && job.cross ? JSON.stringify(job.cross) : null; },
      code(key){ return cardCode(cardOf(key)); },
      take(txt){ takeCode(txt); return Object.keys(traded).length; },
      counts(){ return JSON.stringify({ dex:Object.keys(cards).length,
                 cross:Object.keys(crossCards).length, traded:Object.keys(traded).length }); },
      finish(){ prog = 100; },
      story(id){ storyStart(id); },
      visit(id){ spawnVisitor(id); },
      stTap(){ storyTap(); },
      stFull(){ if(sty && sty.node && sty.node.text) sty.chars = sty.node.text.length; },
      stPick(i){ const b = stOptsEl.querySelectorAll("button")[i]; if(b) b.click(); },
      stState(){ return sty ? JSON.stringify({ i:sty.i, name:stNameEl.textContent,
        txt:stTextEl.textContent,
        opts:[...stOptsEl.querySelectorAll("button")].map(b=>b.textContent) }) : "closed"; },
      vState(){ return visitor ? JSON.stringify({ who:visitor.who, ph:visitor.phase,
        gx:+visitor.gx.toFixed(2), gy:+visitor.gy.toFixed(2) }) : "none"; },
      qState(){ return JSON.stringify({ quest:!!quest, done:!!(quest && quest.done),
        pend:storyPend, btn:buttons, down:machineDown }); },
      setButtons(n){ buttons = n; },
      acceptQuest(){ const o = offers.find(x=>x.quest); if(o) accept(o.id); return !!o; },
      completeNow(){ if(job){ prog = 100; complete(); return true; } return false; },
      breakMachine(){ startFix(); },
      mini(name){ miniStart(name); },
      miniState(){ return mini ? JSON.stringify({ name:mini.name, ph:mini.ph||"",
        r:mini.r, hits:mini.hits, done:!!mini.done,
        t:+(mini.t||0).toFixed(2) }) : "none"; },
      miniTap(){ if(mini){ const M = MINIS[mini.name]; if(M.tap) M.tap(mini); } },
      miniPress(v){ if(mini) mini.press = !!v; },
      miniQuit(){ if(mini) miniEnd(0); },
      gacha(){ openGachaOv(); },
      pull(r){ return doPull(r); },
      gcState(){ return gc ? JSON.stringify({ ph:gc.ph,
        prize:gc.prize && gc.prize.def.n, rar:gc.prize && gc.prize.rar }) : "closed"; },
      gcSkip(){ if(!gc) return;
        if(gc.ph === "crank") gc.t = 9;
        else if(gc.ph === "drop"){ gc.capY = 205; gc.capV = 0; gc.t = 9; }
        else if(gc.ph === "burst") gc.t = 9; },
      charms(){ return JSON.stringify(charms.slice(0,10)); },
      isOpen(p){ return placeOpen(p); },
      door(v){ doorStyle = v; useRoomScale(); reset(); },
      entrance(){ return JSON.stringify({ style:doorStyle, pos:doorPos(), gw:GW, gd:GD,
        canPlaceAtDoor: fits(GW-1.0, GD/2-0.5, {w:1.0, d:1.0}),
        canPlaceElsewhere: fits(1.2, 1.2, {w:1.0, d:1.0}) }); },
      expand(){ expandRoom(); },
      goHome(){ for(const s2 of staff) sendHome(s2); },
      staffPos(){ return JSON.stringify(staff.map(x=>({n:x.name,
        gx:+x.gx.toFixed(2), gy:+x.gy.toFixed(2), gz:+((x.gz||0).toFixed(1)),
        away:!!x.away, arr:!!x.arriving, ph:x.phase, st:!!x.station}))); },
      doorState(){ return JSON.stringify({ nt:+nightAmount().toFixed(2),
        leaving:someoneLeaving(), arriving:someoneArriving(),
        shut: nightAmount()>0.45 && !someoneLeaving() && !someoneArriving() }); },
      mp(){ return +mp.toFixed(3); },
      temper(){ return JSON.stringify(staff.map(x=>({ n:x.name, t:temperOf(x).name,
        inAt:+comeAt(x).toFixed(3), outAt:+leaveAt(x).toFixed(3),
        ot:+((x.ot||0)*100).toFixed(1), brk:!!x.onBreak, away:!!x.away,
        otPay:overtimePay(x) }))); },
      showWaiting(){ return showWaiting; },
      forceShow(){ showDue = dayNo(); },
      spd(){ const b=document.getElementById("spdBtn");
        return JSON.stringify({ text:b.textContent, 三角:(b.innerHTML.match(/<path/g)||[]).length,
          幅:Math.round(b.getBoundingClientRect().width) }); },
      mode(){ return JSON.stringify({ i:workMode, text:otBtn.textContent,
        wear:WORKMODE[workMode].wear, bounce:WORKMODE[workMode].bounce }); },
      setMode(v){ setWorkMode(v); },
      tapMode(){ otBtn.click(); return otBtn.textContent; },
      zoom(){ return +roomZoom().toFixed(3); },
      pan(v){ panX = v; clampPan(); return +panX.toFixed(1); },
      panLimit(){ return +panLimit().toFixed(1); },
      furn(){ return JSON.stringify(furniture.filter(f=>FURN[f.type].cat!=="wall")
        .map(f=>({t:f.type, x:f.x, y:f.y, rot:f.rot||0, w:fw(f), d:fd(f)}))); },
      rot(type){ const f = furniture.find(x=>x.type===type); if(!f) return "ない";
        moving = f; f.gx0 = f.x; f.gy0 = f.y; f.rot0 = f.rot||0;
        document.getElementById("movRot").click();
        if(!fits(f.x, f.y, {w:fw(f), d:fd(f)}, f)){
          f.rot = f.rot0; endMove(); return "その場には置けない";
        }
        endMove(); reassignAll();
        return JSON.stringify({t:f.type, rot:f.rot||0, w:fw(f), d:fd(f)}); },
      stands(){ return JSON.stringify(staff.filter(x=>x.station).map(x=>{
        const f = x.station, W = fw(f), D = fd(f);
        const dx = x.tx - (f.x+W/2), dy = x.ty - (f.y+D/2);
        const side = Math.abs(dx) > Math.abs(dy) ? (dx>0?"右":"左") : (dy>0?"手前":"奥");
        return { 人:x.name, 持ち場:f.type, 回転:f.rot?"たて":"よこ", 立つ面:side };
      })); },
      addFurn(type){ money += 999999; buy(type);
        const f = furniture.filter(x=>x.type===type).pop();
        return f ? JSON.stringify({x:f.x, y:f.y}) : "置けなかった"; },
      draftInk(){ const f = furniture.find(x=>x.type==="draft");
        if(!f) return "製図台がない";
        const who = staff.filter(x=>x.station===f).map(x=>x.name+"/"+x.phase+
          (x.away?"/帰宅":"")+(x.onBreak?"/休憩":""));
        return JSON.stringify({ ink:+((f.ink||0).toFixed(2)), busy:busy(f),
          そこにいる人:who, 全員の持ち場:staff.map(x=>x.name+":"+(x.station?x.station.type:"なし")) }); },
      btnBox(){ const a=otBtn.getBoundingClientRect(),
                      b=document.getElementById("spdBtn").getBoundingClientRect(),
                      c=document.getElementById("viewBtn").getBoundingClientRect();
        return JSON.stringify({ w:Math.round(a.width),
          rightGap:Math.round(b.left-a.right), leftGap:Math.round(a.left-c.right) }); },
      setSpd(v){ speed = v; paintSpd(); },
      hire(k){ hire(k); },
      night(v){ mp = v; },
      get visits(){ return visits; },
      state(){ return JSON.stringify({money, fame, staff:staff.length,
                 boost, flags:Object.keys(placeFlag), showEase, facCut:biz.facCut}); },
      pane(t){ tab = t; renderPane(); },
      log(){ return [...document.querySelectorAll(".logline")].map(x=>x.textContent); },
    },
  };
}
})();
</script>
